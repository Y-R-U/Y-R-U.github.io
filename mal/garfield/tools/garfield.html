<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garfield turntable</title>
<style>
  :root { --bg: #f3e6d2; --panel: rgba(255,250,242,.92); --ink: #3b2414; --accent: #e8841f; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: fixed; left: 8px; top: 8px; bottom: 8px; width: 230px; overflow: auto; background: var(--panel); border-radius: 12px; padding: 10px; box-shadow: 0 4px 18px rgba(80,40,10,.15); }
  #ui.hide { display: none; }
  h1 { font-size: 15px; margin: 0 0 6px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 10px 0 4px; opacity: .7; }
  .btns { display: flex; flex-wrap: wrap; gap: 4px; }
  button { border: 0; border-radius: 8px; padding: 5px 8px; background: #f6d9b4; color: var(--ink); cursor: pointer; font: inherit; }
  button.on { background: var(--accent); color: #fff; }
  label { display: block; margin: 4px 0; }
  input[type=range] { width: 100%; }
  #info { position: fixed; right: 10px; bottom: 8px; opacity: .6; font-size: 11px; }
</style>
</head>
<body>
<div id="ui">
  <h1>Garfield</h1>
  <h2>Clips</h2><div class="btns" id="clips"></div>
  <label><input type="checkbox" id="once"> play once</label>
  <h2>Expression</h2><div class="btns" id="exprs"></div>
  <h2>Body</h2>
  <label>Belly <input type="range" id="belly" min="0" max="1" step="0.01" value="0.2"></label>
  <label>Move speed <span id="spv">0</span> m/s <input type="range" id="speed" min="0" max="3.6" step="0.05" value="0"></label>
  <label><input type="checkbox" id="claw"> claws</label>
  <label><input type="checkbox" id="look"> look at orbiting target</label>
  <label><input type="checkbox" id="spin" checked> turntable spin</label>
  <label><input type="checkbox" id="walkcircle"> walk in a circle (uses speed)</label>
  <label><input type="checkbox" id="hop"> hop every 2 s</label>
  <h2>Quality</h2><div class="btns" id="qual"></div>
  <h2>View</h2><div class="btns" id="views"></div>
</div>
<div id="info"></div>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import { RoomEnvironment } from '../vendor/three/addons/environments/RoomEnvironment.js';
import { createGarfield } from '../js/actors/garfield.js';

const Q = new URLSearchParams(location.search);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf1e2cc);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
const key = new THREE.DirectionalLight(0xfff0dc, 2.4);
key.position.set(1.2, 2.2, 1.6); key.castShadow = true;
key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = key.shadow.camera.bottom = -1.2; key.shadow.camera.right = key.shadow.camera.top = 1.2;
key.shadow.bias = -0.0005; key.shadow.normalBias = 0.01;
scene.add(key);
const rim = new THREE.DirectionalLight(0xffd7a8, 1.4); rim.position.set(-1.5, 1.2, -1.8); scene.add(rim);
scene.add(new THREE.HemisphereLight(0xfff4e6, 0x8a6a4a, 0.5));
const floor = new THREE.Mesh(new THREE.CircleGeometry(3, 64), new THREE.MeshStandardMaterial({ color: 0xe8d3b5, roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);

const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.02, 20);
const view = { yaw: +(Q.get('yaw') ?? 0.6), pitch: +(Q.get('pitch') ?? 0.18), dist: +(Q.get('dist') ?? 1.9), ty: +(Q.get('ty') ?? 0.28) };
function placeCam() {
  camera.position.set(Math.sin(view.yaw) * Math.cos(view.pitch) * view.dist, view.ty + Math.sin(view.pitch) * view.dist, Math.cos(view.yaw) * Math.cos(view.pitch) * view.dist);
  camera.lookAt(0, view.ty, 0);
}
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => { if (!drag) return; view.yaw -= (e.clientX - drag.x) * 0.01; view.pitch = Math.max(-0.3, Math.min(1.4, view.pitch + (e.clientY - drag.y) * 0.01)); drag = { x: e.clientX, y: e.clientY }; spin.checked = false; });
addEventListener('wheel', (e) => { view.dist = Math.max(0.4, Math.min(5, view.dist * (1 + e.deltaY * 0.001))); });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const $ = (id) => document.getElementById(id);
const spin = $('spin');
let g = null, quality = Q.get('q') || 'high';
async function load() {
  if (g) g.dispose();
  const t0 = performance.now();
  g = await createGarfield({ quality });
  scene.add(g.root);
  g.setBelly(+$('belly').value);
  $('info').textContent = `${quality}: ${(g.mesh.geometry.index.count / 3) | 0} tris, built in ${(performance.now() - t0).toFixed(0)} ms`;
  buildButtons();
  window.__g = g;
}
let curClip = 'idle';
function buildButtons() {
  const c = $('clips'); c.innerHTML = '';
  for (const n of g.anims) {
    const b = document.createElement('button'); b.textContent = n; b.className = n === curClip ? 'on' : '';
    b.onclick = () => { curClip = n; g.play(n, { once: $('once').checked }); [...c.children].forEach((x) => x.className = x === b ? 'on' : ''); };
    c.appendChild(b);
  }
  const e = $('exprs'); e.innerHTML = '';
  for (const n of ['smug', 'happy', 'disgust', 'shock', 'sleepy', 'chew']) {
    const b = document.createElement('button'); b.textContent = n; b.className = n === g.expression ? 'on' : '';
    b.onclick = () => { g.setExpression(n); [...e.children].forEach((x) => x.className = x === b ? 'on' : ''); };
    e.appendChild(b);
  }
  const q = $('qual'); q.innerHTML = '';
  for (const n of ['high', 'medium', 'low']) {
    const b = document.createElement('button'); b.textContent = n; b.className = n === quality ? 'on' : '';
    b.onclick = () => { quality = n; load(); };
    q.appendChild(b);
  }
  const v = $('views'); v.innerHTML = '';
  for (const [n, y, p, d, ty] of [['front', 0, 0.12, 1.5, 0.3], ['3/4', 0.7, 0.2, 1.7, 0.28], ['side', 1.5708, 0.1, 1.9, 0.26], ['back', 3.14, 0.35, 1.9, 0.28], ['face', 0.25, 0.1, 0.75, 0.4], ['game', 3.14, 0.55, 2.6, 0.3]]) {
    const b = document.createElement('button'); b.textContent = n;
    b.onclick = () => { Object.assign(view, { yaw: y, pitch: p, dist: d, ty }); spin.checked = false; };
    v.appendChild(b);
  }
}
$('belly').oninput = (e) => g.setBelly(+e.target.value);
$('claw').onchange = (e) => g.claw(e.target.checked);
$('speed').oninput = (e) => { $('spv').textContent = (+e.target.value).toFixed(2); };

await load();
if (Q.get('belly')) { $('belly').value = Q.get('belly'); g.setBelly(+Q.get('belly')); }
if (Q.get('expr')) g.setExpression(Q.get('expr'));
if (Q.get('clip')) { curClip = Q.get('clip'); g.play(curClip, { fade: 0 }); }
if (Q.get('speed')) { $('speed').value = Q.get('speed'); }
if (Q.get('claw')) { g.claw(true); $('claw').checked = true; }
if (Q.has('look')) $('look').checked = true;
if (Q.has('nospin') || Q.has('t')) spin.checked = false;
if (Q.has('hideui')) $('ui').classList.add('hide');

const target = new THREE.Vector3();
const lookBall = new THREE.Mesh(new THREE.SphereGeometry(0.03), new THREE.MeshBasicMaterial({ color: 0x3399ff }));
scene.add(lookBall);
let ang = 0, hopT = 0;
function step(dt) {
  ang += dt;
  if (spin.checked) view.yaw += dt * 0.35;
  const sp = +$('speed').value;
  if ($('walkcircle').checked) {
    const R = 0.9, w = sp / R;
    g.root.userData.a = (g.root.userData.a || 0) + w * dt;
    const a = g.root.userData.a;
    g.root.position.set(Math.cos(a) * R - R, g.root.position.y, Math.sin(a) * R);
    g.root.rotation.y = -a;
  }
  if (sp > 0 || $('walkcircle').checked) g.setMove(sp);
  if ($('hop').checked) {
    hopT += dt;
    const T = hopT % 2;
    const air = T > 1 && T < 1.55;
    const u = (T - 1) / 0.55;
    g.root.position.y = air ? 4 * 0.5 * u * (1 - u) : 0;
    if (Math.abs(T - 1) < dt) g.play('jump_up', { once: true, fade: 0.06 });
    if (Math.abs(T - 1.55) < dt) g.play('land', { once: true, fade: 0.05 });
  }
  lookBall.visible = $('look').checked;
  if ($('look').checked) { target.set(Math.sin(ang * 0.7) * 1.2, 0.3 + Math.sin(ang * 1.3) * 0.3, 1.0); lookBall.position.copy(target); g.lookAt(target); } else g.lookAt(null);
  g.update(dt);
}
placeCam();
// deterministic stills: ?t=seconds advances the sim then freezes
if (Q.has('t')) {
  const T = +Q.get('t');
  for (let t = 0; t < T; t += 1 / 60) step(1 / 60);
  placeCam(); renderer.render(scene, camera);
  window.__ready = true;
} else {
  let last = performance.now();
  renderer.setAnimationLoop((now) => {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    step(dt); placeCam(); renderer.render(scene, camera);
  });
  window.__ready = true;
}
window.__step = (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++) step(dt); placeCam(); renderer.render(scene, camera); };
window.__view = view;
</script>
</body>
</html>
