<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Props Gallery — Hungry Heist</title>
<style>
  html, body { margin: 0; height: 100%; background: #2b1d14; color: #fbefd9; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #panel { position: fixed; left: 8px; top: 8px; bottom: 8px; width: 230px; overflow-y: auto; background: rgba(40,24,14,.82); border-radius: 12px; padding: 8px; }
  #panel h3 { margin: 8px 4px 4px; font-size: 13px; color: #ffb347; text-transform: capitalize; cursor: pointer; }
  #panel button { margin: 2px; padding: 4px 8px; border: 0; border-radius: 8px; background: #f08a24; color: #2b1d14; font-weight: 600; cursor: pointer; }
  #panel button.f { background: #fbefd9; }
  #panel button:hover { filter: brightness(1.1); }
  #info { position: fixed; right: 8px; top: 8px; background: rgba(40,24,14,.82); border-radius: 10px; padding: 6px 10px; white-space: pre; font: 11px monospace; }
  body.shot #panel, body.shot #info { display: none; }
</style>
</head>
<body>
<div id="panel"></div>
<div id="info"></div>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import { RoomEnvironment } from '../vendor/three/addons/environments/RoomEnvironment.js';
import { createProps, updateProps, resetProps } from '../js/world/props/index.js';

const qs = new URLSearchParams(location.search);
if (qs.has('shot')) document.body.classList.add('shot');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x3a2a20);
const pm = new THREE.PMREMGenerator(renderer);
scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x6b4a33, 0.9));
const sun = new THREE.DirectionalLight(0xffe0b0, 2.4);
sun.position.set(8, 9, 4); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 30 }); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
sun.target.position.set(4.5, 0, 6);
scene.add(sun, sun.target);

// stand-in room using the house agent's coordinates
const floorM = new THREE.MeshStandardMaterial({ color: 0xc89a6a, roughness: 0.8 });
const wallM = new THREE.MeshStandardMaterial({ color: 0xf2dcb8, roughness: 0.9, side: THREE.DoubleSide });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(9.2, 11), floorM); floor.rotation.x = -Math.PI / 2; floor.position.set(4.6, 0, 5.5); floor.receiveShadow = true; scene.add(floor);
const up = new THREE.Mesh(new THREE.BoxGeometry(9.2, 0.1, 6), floorM); up.position.set(4.6, 2.95, 3); up.receiveShadow = true; if (!qs.has('noup')) scene.add(up);
const wall = new THREE.Mesh(new THREE.PlaneGeometry(9.2, 2.8), wallM); wall.position.set(4.6, 1.4, -0.01); wall.receiveShadow = true; scene.add(wall);
const sill = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.06, 0.48), new THREE.MeshStandardMaterial({ color: 0xf6efe2, roughness: 0.5 })); sill.position.set(3.0, 0.87, 0.24); sill.receiveShadow = sill.castShadow = true; scene.add(sill);
const stand = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.8), new THREE.MeshStandardMaterial({ color: 0x8a5a36 })); stand.position.set(0.4, 0.275, 2.75); scene.add(stand);
const back = new THREE.Mesh(new THREE.PlaneGeometry(9.2, 2.8), wallM); back.position.set(4.6, 1.4, 11.01); scene.add(back);

const V = (x, y, z) => new THREE.Vector3(x, y, z);
const anchors = new Map(Object.entries({
  tableTop: { pos: V(4.4, 0.76, 8.8), rotY: 0 }, kitchenBench: { pos: V(4.4, 0, 9.62), rotY: 0 },
  jonChair: { pos: V(4.4, 0, 7.98), rotY: 0 }, plateSpot: { pos: V(4.4, 0.76, 8.58), rotY: 0 }, panSpot: { pos: V(4.0, 0.76, 8.95), rotY: 0 },
  fridgeFront: { pos: V(5.675, 0, 10.3), rotY: Math.PI }, fridgeTop: { pos: V(5.675, 1.85, 10.65) }, catBowl: { pos: V(6.7, 0, 9.7), rotY: 0 },
  window: { pos: V(3.0, 1.5, 0), rotY: 0, w: 1.2, h: 1.2 }, windowsill: { pos: V(3.0, 0.9, 0.24) }, vase: { pos: V(2.55, 0.9, 0.22), rotY: 0 },
  curtains: { pos: V(3.0, 2.3, 0.12), rotY: 0, w: 2.0, h: 2.3 }, frontDoor: { pos: V(7.1, 0, 0), rotY: 0 }, tv: { pos: V(0.4, 0.55, 2.75), rotY: Math.PI / 2 },
  bedroomDoor: { pos: V(6.4, 3.0, 5.7), rotY: -Math.PI / 2 }, jonBed: { pos: V(1.05, 3.0, 3.2), rotY: Math.PI / 2 }, garfieldBed: { pos: V(4.6, 3.0, 1.3), rotY: 0 },
}));

const sfxLog = [];
const props = await createProps({ scene, quality: qs.get('q') || 'high', anchors, sfx: (n) => { sfxLog.push(n); if (sfxLog.length > 6) sfxLog.shift(); } });

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.02, 60);
const orbit = { target: V(4.4, 0.8, 8.6), dist: 1.6, yaw: 0.6, pitch: 0.45 };
const views = {
  food: [V(4.4, 0.8, 8.6), 0.55, 0.5, 0.6], pan: [V(4.0, 0.82, 8.95), 0.7, 0.4, 0.65], table: [V(4.6, 0.4, 8.2), 3.2, -2.5, 0.45], chair: [V(4.4, 0.5, 8.0), 2.0, -2.4, 0.3],
  catBowl: [V(6.7, 0.05, 9.7), 0.6, 0.4, 0.6], vase: [V(2.6, 0.9, 0.5), 2.2, 0.4, 0.2], curtains: [V(3.0, 1.3, 0.2), 4.2, 0.0, 0.1], window: [V(3.0, 1.3, 0.4), 2.6, 0.5, 0.15],
  fridge: [V(5.6, 1.0, 10.2), 3.2, 2.6, 0.2], vine: [V(5.0, 1.6, 9.6), 4.0, 2.0, 0.25], frontDoor: [V(7.1, 1.0, 0.2), 3.6, 0.3, 0.1], tv: [V(0.4, 0.8, 2.75), 1.6, 1.4, 0.2],
  bedroomDoor: [V(6.4, 4.0, 5.7), 3.5, -1.2, 0.15], jonBed: [V(1.05, 3.4, 3.2), 3.6, 1.0, 0.5], garfieldBed: [V(4.6, 3.15, 1.3), 1.4, 0.4, 0.6], newspaper: [V(4.8, 0.6, 8.3), 3.6, -2.2, 0.35],
  room: [V(4.4, 1, 5.5), 10, 0.8, 0.6],
};
const view = k => { const [t, d, y, p] = views[k]; orbit.target.copy(t); orbit.dist = d; orbit.yaw = y; orbit.pitch = p; };
view(qs.get('view') || 'food');

let drag = null;
renderer.domElement.addEventListener('pointerdown', e => drag = { x: e.clientX, y: e.clientY, b: e.button });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y; drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 2 || e.shiftKey) {
    const r = V(Math.cos(orbit.yaw), 0, -Math.sin(orbit.yaw));
    orbit.target.addScaledVector(r, -dx * orbit.dist * 0.002); orbit.target.y += dy * orbit.dist * 0.002;
  } else { orbit.yaw -= dx * 0.008; orbit.pitch = Math.max(-0.3, Math.min(1.45, orbit.pitch + dy * 0.006)); }
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
addEventListener('wheel', e => orbit.dist = Math.max(0.2, Math.min(20, orbit.dist * (1 + e.deltaY * 0.001))));
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const P = id => props.get(id);
let vineT = 0;
const actions = {
  food: { steak: () => P('plate').setFood('steak'), lasagna: () => P('plate').setFood('lasagna'), meatloaf: () => P('plate').setFood('meatloaf'),
    'eat 25%': () => P('plate').eaten(P('plate').state.eaten + 0.25), fling: () => P('plate').fling(V(5.6, 0, 7.4)) },
  pan: { serveScoop: () => P('pan').serveScoop(), 'eat 20%': () => P('pan').eaten(P('pan').state.eaten + 0.2), toFridge: async () => { await P('fridge').open(); await P('pan').toFridge(); }, swingCatch: () => P('pan').swingCatch() },
  table: { bump: () => P('table').bump(1), 'bump big': () => P('table').bump(1.5) },
  chair: { breakLeg: () => P('chair').breakLeg(), fallBack: () => P('chair').fallBack(), bounce: () => P('chair').bounce() },
  catBowl: { spitBits: () => P('catBowl').spitBits() },
  vase: { knock: () => P('vase').knock() },
  curtains: { 'shred 1': () => P('curtains').shred(1), 'shred 2': () => P('curtains').shred(2), 'shred 3': () => P('curtains').shred(3), 'wave on': () => P('curtains').wave(true), 'wave off': () => P('curtains').wave(false) },
  window: { open: () => P('window').open(), close: () => P('window').close() },
  fridge: { open: () => P('fridge').open(), close: () => P('fridge').close() },
  vine: { grab: () => P('vine').grab(), release: () => P('vine').release() },
  frontDoor: { rattle: () => P('frontDoor').rattle(), open: () => P('frontDoor').open() },
  bedroomDoor: { close: () => P('bedroomDoor').close(), open: () => P('bedroomDoor').open(), rattle: () => P('bedroomDoor').rattle() },
  jonBed: { 'shred 1': () => P('jonBed').shred(1), 'shred 2': () => P('jonBed').shred(2), 'shred 3': () => P('jonBed').shred(3) },
  garfieldBed: {}, tv: { cartoon: () => P('tv').setMode('cartoon'), static: () => P('tv').setMode('static'), off: () => P('tv').setMode('off') },
  newspaper: { throw: () => P('newspaper').throwAt(V(4.4, 1.4, 7.0), V(5.5, 0.3, 9.6)) },
  room: { 'reset all': () => resetProps(props) },
};
const panel = document.getElementById('panel');
for (const [k, acts] of Object.entries(actions)) {
  const h = document.createElement('h3'); h.textContent = k; h.onclick = () => view(k); panel.appendChild(h);
  const f = document.createElement('button'); f.className = 'f'; f.textContent = 'view'; f.onclick = () => view(k); panel.appendChild(f);
  if (P(k)) { const r = document.createElement('button'); r.className = 'f'; r.textContent = 'reset'; r.onclick = () => P(k).reset(); panel.appendChild(r); }
  for (const [n, fn] of Object.entries(acts)) { const b = document.createElement('button'); b.textContent = n; b.onclick = fn; panel.appendChild(b); }
}

const info = document.getElementById('info');
const clock = new THREE.Clock();
let frames = 0, fpsT = 0, fps = 0;
window.__props = { props, scene, camera, renderer, view, actions, anchors, orbit, step: dt => { updateProps(props, dt); } };
function loop() {
  const dt = Math.min(0.05, clock.getDelta());
  updateProps(props, dt);
  const cp = Math.cos(orbit.pitch);
  camera.position.set(orbit.target.x + Math.sin(orbit.yaw) * cp * orbit.dist, orbit.target.y + Math.sin(orbit.pitch) * orbit.dist, orbit.target.z + Math.cos(orbit.yaw) * cp * orbit.dist);
  camera.lookAt(orbit.target);
  renderer.render(scene, camera);
  frames++; fpsT += dt; if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0; }
  info.textContent = `fps ${fps.toFixed(0)}  calls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles / 1000).toFixed(0)}k\nsfx: ${sfxLog.join(' ')}`;
  requestAnimationFrame(loop);
}
loop();
window.__ready = true;
</script>
</body>
</html>
