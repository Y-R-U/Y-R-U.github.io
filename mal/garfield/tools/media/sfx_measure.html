<!doctype html>
<meta charset="utf-8">
<title>SFX measure</title>
<pre id="o">rendering…</pre>
<script type="module">
// Renders every procedural SFX offline (with its LEVEL trim) and reports peak + active RMS in dBFS → window.__res.
import { SFX, LEVEL } from '../../js/audio/sfx.js';
const sr = 44100, res = {};
for (const [name, fn] of Object.entries(SFX)) {
  const ctx = new OfflineAudioContext(1, sr * 4, sr);
  const out = ctx.createGain(); out.gain.value = LEVEL[name] || 1; out.connect(ctx.destination);
  const len = fn(ctx, out, 0.01, 1) || 1;
  const d = (await ctx.startRendering()).getChannelData(0);
  let peak = 0, s = 0, n = 0;
  for (let i = 0; i < d.length; i++) { const a = Math.abs(d[i]); if (a > peak) peak = a; }
  for (let i = 0; i < d.length; i++) if (Math.abs(d[i]) > peak * 0.05) { s += d[i] * d[i]; n++; }
  res[name] = { len: +len.toFixed(2), peak: +(20 * Math.log10(peak + 1e-9)).toFixed(1), rms: +(10 * Math.log10(s / Math.max(1, n) + 1e-12)).toFixed(1) };
}
window.__res = res;
document.getElementById('o').textContent = JSON.stringify(res, null, 1);
</script>
