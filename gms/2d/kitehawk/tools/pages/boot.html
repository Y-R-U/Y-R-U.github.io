<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>kitehawk gfx — boot</title>
<style>
  html,body{margin:0;background:#111;color:#cfc;font:12px ui-monospace,monospace}
  #gl{display:block;margin:0 auto}
  #hud{position:fixed;top:0;left:0;padding:6px 8px;background:rgba(0,0,0,.6);white-space:pre}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<script type="module">
import { mount, qp, flatGrade, readback, pixelAt, overlay } from './harness.js';
import { createParticles } from '../../js/gfx/particles.js';
import { LAYER } from '../../js/gfx/renderer.js';
import { makePaper, makeRamp } from '../../js/gfx/texture.js';

const { R } = await mount({ w: 390, h: 844, dpr: 1, worldH: 1000 });
const P = createParticles(R);

const N = qp('n', 5000);
const NL = qp('layers', 8);
const MODE = qp('mode', 'sprites');
const NTEX = qp('ntex', 4);
// how many of the populated layers also carry an additive stream
const NADD = qp('add', 1);

R.setGrain(makePaper(R.gl), 1 / 256, 0.15);

// 8 populated layers, back to front, 1..4 textures each — the interleaving is
// the point: a chunk holds up to 8 textures and mixing them freely must NOT
// split it.
const LAYERS = [LAYER.CLOUD_FAR, LAYER.CLOUD_MID, LAYER.HORIZON, LAYER.GROUND_FAR,
                LAYER.GROUND_MID, LAYER.GROUND, LAYER.ACTORS, LAYER.FX,
                LAYER.ACTORS_BACK, LAYER.TRAILS, LAYER.CLOUD_NEAR, LAYER.FG_OCCLUDE]
                .slice(0, NL);
const TEX = [R.white, R.blob, R.disc, R.streak].slice(0, NTEX);

// deterministic layout so a re-run is comparable
let seed = 12345;
const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);

const items = [];
const ADD_LAYERS = new Set(NADD > 0 ? LAYERS.slice(-NADD) : []);
for (let i = 0; i < N; i++) {
  const layer = LAYERS[i % LAYERS.length];
  items.push({
    x: (rnd() * 2 - 1) * 205,
    y: (rnd() * 2 - 1) * 470,
    w: 8 + rnd() * 40,
    h: 8 + rnd() * 40,
    rot: rnd() * 6.28,
    spin: (rnd() * 2 - 1) * 0.6,
    r: 0.4 + rnd() * 0.6, g: 0.4 + rnd() * 0.6, b: 0.4 + rnd() * 0.6,
    a: 0.5 + rnd() * 0.5,
    layer,
    tex: TEX[i % TEX.length],
    add: ADD_LAYERS.has(layer) && (i % 5) === 0,
  });
}

// the ramp-order probe: one flat sprite under one additive light. The gate
// flips rampAmt 0 -> 1 and the light's contribution must not move.
const rampTex = makeRamp(R.gl, [[0, 0.28, 0.24, 0.34], [0.5, 0.62, 0.52, 0.42], [1, 0.96, 0.90, 0.74]]);
R.setRamp(rampTex);
// the probe divides lit by unlit, so the unlit reference must sit well off the
// 8-bit floor or one LSB of quantisation swamps the measurement
if (MODE === 'ramp') R.setAmbient(0.60, 0.60, 0.60);

const cam = { x: 0, y: 0, zoom: 1 };
let frames = 0, t0 = performance.now(), last = t0;
const times = [];

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  R.tick(dt);
  R.begin(cam);
  if (MODE === 'ramp') {
    R.setLayer(LAYER.ACTORS, { rampAmt: window.__rampAmt || 0, grainAmt: 0 });
    R.quad({ x: 0, y: 0, w: 600, h: 600, r: 0.5, g: 0.5, b: 0.5, a: 1, layer: LAYER.ACTORS });
    if (window.__light !== false) {
      R.light({ x: 120, y: 0, radius: 260, r: 1.0, g: 0.62, b: 0.34, intensity: 1.0 });
    }
  } else {
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      it.rot += it.spin * dt;
      R.spriteRaw(it.tex, 0, 0, 1, 1, it.x, it.y, it.w, it.h, it.rot,
        it.r, it.g, it.b, it.a, it.layer, it.add, 1, 1);
    }
    P.render();
  }
  R.end();
  frames++;
  times.push(now);
  while (times.length > 240) times.shift();
  if ((frames & 15) === 0) {
    overlay([
      `mode ${MODE}  ${R.pixelW}x${R.pixelH} dpr ${R.dpr}  worldH ${R.worldHBase}`,
      `sprites ${R.stats.sprites}  tris ${R.stats.tris}  lights ${R.stats.lights}`,
      `drawCalls ${R.stats.drawCalls}  streams ${R.stats.streams}`,
      `fps ${fps().toFixed(1)}  frame ${frames}`,
    ]);
  }
  requestAnimationFrame(frame);
}

function fps() {
  if (times.length < 8) return 0;
  return (times.length - 1) * 1000 / (times[times.length - 1] - times[0]);
}

flatGrade(R);

window.__boot = {
  R, P, LAYER,
  get stats() { return { ...R.stats }; },
  get frames() { return frames; },
  fps,
  reset() { frames = 0; times.length = 0; t0 = performance.now(); },
  setRamp(a) { window.__rampAmt = a; },
  setLight(on) { window.__light = on; },
  /** One synchronous frame plus a readback, for the gate. */
  probe(px, py) {
    R.tick(1 / 60);
    R.begin(cam);
    if (MODE === 'ramp') {
      R.setLayer(LAYER.ACTORS, { rampAmt: window.__rampAmt || 0, grainAmt: 0 });
      R.quad({ x: 0, y: 0, w: 600, h: 600, r: 0.5, g: 0.5, b: 0.5, a: 1, layer: LAYER.ACTORS });
      if (window.__light !== false) {
        R.light({ x: 120, y: 0, radius: 260, r: 1.0, g: 0.62, b: 0.34, intensity: 1.0 });
      }
    }
    R.end();
    const img = readback(R);
    return pixelAt(img, px, py);
  },
};

requestAnimationFrame(frame);
</script>
</body>
</html>
