<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>kitehawk core — camera</title>
<style>
  html,body{margin:0;background:#0b0d12;color:#cfc;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}
  #wrap{display:flex;gap:10px;align-items:flex-start;padding:8px}
  #gl{display:block;border:1px solid #2a3040}
  #side{white-space:pre;line-height:1.5}
  button{margin:1px;padding:5px 8px;background:#171b25;color:#cfc;border:1px solid #39405a;border-radius:2px;font:inherit;cursor:pointer}
  button:hover{border-color:#e0b96a}
  .on{border-color:#e0b96a;color:#e0b96a}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="gl"></canvas>
  <div id="side">
    <div id="ctl"></div>
    <div id="hud"></div>
  </div>
</div>
<script type="module">
/* The camera and zoom solver, drawn. This page exists so a human can WATCH the
   controller; the numbers that matter are measured by tools/camtrace.mjs against
   the same module, headlessly and deterministically.

   The four falsification switches are here as buttons: ?slew=symmetric,
   ?margin=strict, ?track=sticky, ?enforce=0. Flip "symmetric slew" on and the
   frame visibly hunts — that is the hysteresis, seen rather than asserted. */

import { createRenderer, LAYER } from '../../js/gfx/renderer.js';
import { createCamera } from '../../js/core/camera.js';
import { createBus } from '../../js/core/events.js';
import { createViewport } from '../../js/core/viewport.js';
import { createRNG } from '../../js/core/rng.js';
import { BANDS, bandIdAt, altitudeFeet } from '../../js/core/bands.js';
import { DT } from '../../js/core/loop.js';

const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 390), H = +(q.get('h') || 844);
const canvas = document.getElementById('gl');
canvas.style.width = W + 'px'; canvas.style.height = H + 'px';

const bus = createBus();
const R = await createRenderer(canvas, { preserveDrawingBuffer: true });
// the page pins the canvas size, so tell the viewport to measure that rather
// than the flex container it happens to sit in
const view = createViewport(canvas, bus, { measure: () => ({ width: W, height: H }) });
const opts = {
  bias: q.get('bias') || 'normal',
  slew: q.get('slew') || undefined,
  margin: q.get('margin') || undefined,
  track: q.get('track') || undefined,
  enforce: q.get('enforce') !== '0',
};
let cam = createCamera(view, opts);
view.setCamera(cam);
R.resize(view.w, view.h, view.dpr, view.worldH);
// Flat, unlit, unhazed: this page is about GEOMETRY, and the default layer table
// is most of the art direction (SKY alone is 70% haze). A diagnostic that shows
// you the grade instead of the framing box is not a diagnostic.
R.fx.bloom = 0; R.fx.vignetteAmt = 0; R.fx.grain = 0;
R.fx.exposure = 1; R.fx.saturation = 1; R.fx.contrast = 1;
R.setAmbient(1, 1, 1);
for (let l = 0; l < 14; l++) R.setLayer(l, { shade: 1, response: 0, haze: 0, grainAmt: 0 });

const rng = createRNG('camera-page');
const player = { x: 0, y: -3000, vx: 320, vy: 0, hull: 64 };
const foes = [];
for (let i = 0; i < 16; i++) foes.push({
  id: 'f' + i, phase: rng.range(0, 6.28), r0: rng.range(250, 2400), rAmp: rng.range(180, 1100),
  w: rng.range(0.05, 0.42), ang: rng.range(0, 6.28), spin: rng.range(-0.55, 0.55),
  hull: rng.range(60, 70), live: false, d: 0,
});

let t = 0, count = 1, paused = false, showBox = true, useRule = true;
const trace = [];

function rebuild() {
  cam = createCamera(view, opts);
  view.setCamera(cam);
  cam.reset(player.x, player.y, 1);
  trace.length = 0;
  draw();
}

/* --- controls ---------------------------------------------------------- */
const ctl = document.getElementById('ctl');
const mk = (label, fn, isOn) => {
  const b = document.createElement('button');
  b.textContent = label; b.onclick = () => { fn(); paint(); };
  b.dataset.on = isOn;
  ctl.appendChild(b); return b;
};
const buttons = [];
function paint() { for (const [b, on] of buttons) b.className = on() ? 'on' : ''; }
const add = (label, fn, on) => buttons.push([mk(label, fn), on]);

add('pause', () => { paused = !paused; }, () => paused);
add('box', () => { showBox = !showBox; }, () => showBox);
add('§4.3.1 rule', () => { useRule = !useRule; }, () => useRule);
ctl.appendChild(document.createElement('br'));
for (const n of [1, 3, 8, 14]) add(n + ' foe' + (n > 1 ? 's' : ''), () => { count = n; }, () => count === n);
ctl.appendChild(document.createElement('br'));
for (const b of ['tight', 'normal', 'wide']) add(b, () => { cam.setBias(b); }, () => cam.bias === b);
ctl.appendChild(document.createElement('br'));
add('symmetric slew', () => { opts.slew = opts.slew === 'symmetric' ? undefined : 'symmetric'; rebuild(); }, () => opts.slew === 'symmetric');
add('strict margin', () => { opts.margin = opts.margin === 'strict' ? undefined : 'strict'; rebuild(); }, () => opts.margin === 'strict');
add('sticky members', () => { opts.track = opts.track === 'sticky' ? undefined : 'sticky'; rebuild(); }, () => opts.track === 'sticky');
add('no enforcement', () => { opts.enforce = !opts.enforce; rebuild(); }, () => !opts.enforce);
ctl.appendChild(document.createElement('br'));
add('cinematic framing', () => {
  if (cam.framingTags().includes('cine')) cam.releaseFraming('cine');
  else cam.requestFraming('cine', { zoom: view.profile.zoomEstablish, priority: 'cinematic', allowOutsideClamp: true, ease: 0.4 });
}, () => cam.framingTags().includes('cine'));
add('player control', () => { cam.setPlayerControl(!cam.playerControl); }, () => cam.playerControl);
add('punch', () => cam.punch(0.05), () => false);
paint();

/* --- sim + draw -------------------------------------------------------- */

function step() {
  t += DT;
  player.vx = 320 + Math.sin(t * 0.21) * 90;
  player.vy = Math.sin(t * 0.33) * 260;
  player.x += player.vx * DT; player.y += player.vy * DT;
  if (player.y > -400) player.y = -400;
  if (player.y < -9600) player.y = -9600;

  for (let k = 0; k < foes.length; k++) foes[k].live = k < count;
  const P = view.profile;
  for (const f of foes) {
    if (!f.live) continue;
    f.ang += f.spin * DT;
    const r = f.r0 + Math.sin(t * f.w + f.phase) * f.rAmp;
    f.x = player.x + Math.cos(f.ang) * r;
    f.y = player.y + Math.sin(f.ang) * r * 0.6;
    const d = Math.hypot(f.x - player.x, f.y - player.y);
    const closing = (d - f.d) / -DT; f.d = d;
    f.inBox = !useRule || (d <= P.zoomLockRange && (d < 700 || closing > 120));
    if (f.inBox) cam.track(f.id, f.x, f.y, f.hull, f.hull * 0.53, 1);
  }
  cam.update(player, DT);
  trace.push(cam.zoom);
  if (trace.length > 900) trace.shift();
}

function box(x, y, w, h, col, layer) {
  const th = 2 / (view.scale * cam.zoom);
  R.line(x - w / 2, y - h / 2, x + w / 2, y - h / 2, th, col, layer);
  R.line(x + w / 2, y - h / 2, x + w / 2, y + h / 2, th, col, layer);
  R.line(x + w / 2, y + h / 2, x - w / 2, y + h / 2, th, col, layer);
  R.line(x - w / 2, y + h / 2, x - w / 2, y - h / 2, th, col, layer);
}

function draw() {
  R.begin(cam);
  // band edges — the ladder, so the vertical framing has a reference
  for (let i = 0; i < BANDS.length; i++) {
    const b = BANDS[i];
    // y1 first: +Y is DOWN, so the HIGH-altitude edge is the smaller number and
    // R.gradient wants top-then-bottom. Passing (y0, y1) draws it inside out.
    const hi = 0.10 + i * 0.055, lo = 0.10 + Math.max(0, i - 1) * 0.055;
    R.gradient(b.y1, b.y0, [hi * 0.7, hi * 0.85, hi * 1.5, 1], [lo * 0.7, lo * 0.85, lo * 1.5, 1], LAYER.SKY);
    R.line(cam.x - 6000, b.y1, cam.x + 6000, b.y1, 3 / (view.scale * cam.zoom), [0.30, 0.36, 0.48, 1], LAYER.GROUND_FAR);
  }
  R.line(cam.x - 6000, 0, cam.x + 6000, 0, 6 / (view.scale * cam.zoom), [0.3, 0.25, 0.18, 1], LAYER.GROUND);

  if (showBox) box(cam.box.x, cam.box.y, cam.box.w, cam.box.h, [0.9, 0.75, 0.3, 0.9], LAYER.UI_WORLD);
  // the lock range, so it is obvious which foes the box may take
  const P = view.profile;
  box(player.x, player.y, P.zoomLockRange * 2, P.zoomLockRange * 2, [0.3, 0.45, 0.7, 0.5], LAYER.UI_WORLD);

  R.sprite({ tex: R.disc, x: player.x, y: player.y, w: player.hull * 1.6, h: player.hull * 0.9, r: 1.0, g: 0.96, b: 0.8, layer: LAYER.ACTORS });
  for (const f of foes) {
    if (!f.live) continue;
    // R.sprite takes r/g/b/a, NOT a `col` array — only R.line and R.poly take one.
    // A `col:` here is silently ignored and every aeroplane comes out white.
    const c = f.inBox ? [1.0, 0.26, 0.18] : [0.34, 0.24, 0.28];
    R.sprite({ tex: R.disc, x: f.x, y: f.y, w: f.hull * 1.5, h: f.hull * 0.85, r: c[0], g: c[1], b: c[2], a: f.inBox ? 1 : 0.8, layer: LAYER.ACTORS });
  }
  R.end();
}

function hudText() {
  const P = view.profile;
  let rev = 0;
  for (let i = 2; i < trace.length; i++) {
    const a = trace[i] - trace[i - 1], b = trace[i - 1] - trace[i - 2];
    if (a * b < 0) rev++;
  }
  document.getElementById('hud').textContent =
    `\nview      ${view.mode} ${view.w}x${view.h} dpr ${view.dpr}\n` +
    `worldW    ${view.worldW.toFixed(2)} wu   worldH ${view.worldH} wu\n` +
    `zoom      ${cam.zoom.toFixed(4)}  <- target ${cam.zoomTarget.toFixed(4)}\n` +
    `reason    ${cam.zoomReason}\n` +
    `clamp     [${P.zoomWide}, ${P.zoomIntimate}]  fill ${P.zoomFill}  bias ${cam.bias}\n` +
    `box       ${cam.box.w.toFixed(0)} x ${cam.box.h.toFixed(0)} wu, ${cam.memberCount} member(s)\n` +
    `visible   ${(view.worldW / cam.zoom).toFixed(0)} x ${(view.worldH / cam.zoom).toFixed(0)} wu\n` +
    `hull px   ${(60 * view.scale * cam.zoom).toFixed(1)} css px at a 60 wu enemy\n` +
    `dwell     ${cam.dwell.toFixed(2)} / ${P.zoomInDwell}  granted ${cam.granted}\n` +
    `nearest   ${Number.isFinite(cam.nearestHostile) ? cam.nearestHostile.toFixed(0) + ' wu' : '-'}  (lock ${P.zoomLockRange})\n` +
    `cam       ${cam.x.toFixed(0)}, ${cam.y.toFixed(0)}   band ${bandIdAt(player.y)} ${altitudeFeet(player.y).toFixed(0)} ft\n` +
    `reversals ${rev} in the last ${(trace.length * DT).toFixed(0)} s of trace\n` +
    `t         ${t.toFixed(1)} s`;
}

let last = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let real = (now - last) / 1000; last = now;
  if (real > 0.25) real = 0.25;
  if (!paused) { acc += real; let n = 0; while (acc >= DT && n < 5) { step(); acc -= DT; n++; } }
  R.tick(real);
  draw();
  hudText();
}
requestAnimationFrame(frame);

window.__cam = {
  get cam() { return cam; }, view, player, foes, trace,
  set count(n) { count = n; }, step, rebuild,
  setOpts(o) { Object.assign(opts, o); rebuild(); },
};
</script>
</body>
</html>
