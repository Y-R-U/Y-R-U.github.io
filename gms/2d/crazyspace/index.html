<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05060f" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="Crazy Space — a single-player Subspace-style arena shooter. Capture the flag, deathmatch and more vs AI." />
<title>Crazy Space</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <canvas id="game"></canvas>
  <div id="ui"></div>
  <script>
  // Inline on purpose: if a module fails to load or parse (often a half-cached module
  // set after a deploy), nothing inside it can report that. Reload busts the cache.
  (function () {
    var shown = false;
    function fail(what) {
      if (shown || window.__csBooted) return;
      shown = true;
      var box = document.createElement('div');
      box.id = 'bootfail';
      var msg = document.createElement('span');
      msg.textContent = 'Crazy Space did not load (' + String(what || 'unknown error').slice(0, 140) + ').';
      var btn = document.createElement('button');
      btn.textContent = 'Reload';
      btn.onclick = function () { location.href = location.pathname + '?v=' + Date.now(); };
      box.appendChild(msg); box.appendChild(btn);
      document.body.appendChild(box);
    }
    window.addEventListener('error', function (e) {
      fail(e.message || (e.target && e.target.src ? 'failed to load ' + e.target.src : 'load error'));
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      fail((e.reason && (e.reason.message || e.reason)) || 'promise rejected');
    });
    setTimeout(function () { fail('timed out'); }, 12000);
  })();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
