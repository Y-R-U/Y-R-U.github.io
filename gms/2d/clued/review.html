<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Clued picture review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800;900&display=swap">
<link rel="stylesheet" href="css/base.css?v=202610131128">
<style>
  body { overflow: auto; }
  .rv { max-width: 1280px; margin: 0 auto; padding: 16px 16px 60px; display: flex; flex-direction: column; gap: 14px; }
  .rv h1 { font-size: 30px; }
  .rv-sum { display: flex; flex-wrap: wrap; gap: 8px 18px; font-weight: 800; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .rv-sum b { color: var(--ink); }
  .rv-bar { position: sticky; top: var(--sat); z-index: 5; background: var(--paper); padding: 8px 0; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; border-bottom: 3px dashed rgba(31, 26, 77, .15); }
  .rv-bar select { font: 800 15px var(--font); padding: 8px 10px; border: 3px solid var(--ink); border-radius: 12px; background: var(--card); color: var(--ink); max-width: 100%; }
  .rv-seg { display: inline-flex; border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; }
  .rv-seg button { font: 800 14px var(--font); padding: 8px 12px; border: 0; background: var(--card); color: var(--ink); cursor: pointer; }
  .rv-seg button + button { border-left: 3px solid var(--ink); }
  .rv-seg button.on { background: var(--ink); color: #fff; }
  .rv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
  .rv-card { background: var(--card); border: 3px solid var(--ink); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .rv-card.ok { border-color: var(--good); }
  .rv-card.bad { border-color: var(--bad); box-shadow: 0 0 0 3px rgba(240, 72, 72, .25); }
  .rv-pic { display: block; aspect-ratio: 4 / 3; background: repeating-conic-gradient(#f1ecf9 0 25%, #fff 0 50%) 0 0 / 16px 16px; position: relative; }
  .rv-pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; }
  .rv-pic .ai { position: absolute; z-index: 1; top: 6px; left: 6px; background: var(--grape); color: #fff; font-weight: 900; font-size: 11px; letter-spacing: .5px; padding: 2px 7px; border-radius: 8px; }
  .rv-pic .rv-alt { position: absolute; z-index: 2; top: 6px; right: 6px; min-width: 56px; min-height: 36px; padding: 4px 10px; border: 0; border-radius: 18px; background: rgba(30, 20, 50, .78); color: #fff; font: 900 14px/1 Nunito, sans-serif; cursor: pointer; }
  .rv-pic.broken::after { content: 'Won’t load'; position: absolute; inset: 0; display: grid; place-items: center; font-weight: 900; color: var(--bad); }
  .rv-meta { padding: 8px 10px 0; min-width: 0; }
  .rv-meta b { display: block; overflow-wrap: anywhere; }
  .rv-meta small { color: var(--ink-3); font-weight: 700; overflow-wrap: anywhere; }
  .rv-acts { display: flex; gap: 8px; padding: 8px 10px 10px; }
  .rv-acts button { flex: 1; font: 900 15px var(--font); padding: 8px; border-radius: 10px; border: 3px solid var(--ink); background: var(--card); color: var(--ink); cursor: pointer; }
  .rv-acts .y.on { background: var(--good); color: #fff; }
  .rv-acts .n.on { background: var(--bad); color: #fff; }
  .rv-why { padding: 0 10px 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .rv-why button { font: 800 12px var(--font); padding: 4px 9px; border-radius: 99px; border: 2px solid var(--ink-3); background: var(--card); color: var(--ink-2); cursor: pointer; }
  .rv-why button.on { border-color: var(--bad); background: var(--bad); color: #fff; }
  .rv-why input { width: 100%; font: 700 13px var(--font); padding: 6px 8px; border: 2px solid var(--ink-3); border-radius: 8px; color: var(--ink); background: var(--card); }
  .rv-card.marked .rv-pic { box-shadow: inset 0 0 0 3px #ffe14d; }
  .rv-card.drawing { grid-column: 1 / -1; }
  .rv-card.drawing .rv-pic { aspect-ratio: auto; height: min(70vh, 640px); cursor: crosshair; touch-action: none; }
  .rv-ring { position: absolute; z-index: 1; box-sizing: border-box; border: 4px solid #ffe14d; border-radius: 50%; pointer-events: none;
    box-shadow: 0 0 0 2px rgba(20, 16, 50, .85), inset 0 0 0 2px rgba(20, 16, 50, .85); }
  .rv-circ { padding-top: 0; }
  .rv-circ button { font-size: 13px; padding: 6px; }
  .rv-circ button.on { background: #ffe14d; }
  .rv-lay { font: 800 14px var(--font); padding: 8px 12px; border: 3px solid var(--ink); border-radius: 12px; background: var(--card); color: var(--ink); cursor: pointer; }
  .rv-grid.compact { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .rv-grid.compact .rv-card { border-radius: 12px; }
  .rv-grid.compact .rv-meta { padding: 6px 8px 0; font-size: 14px; line-height: 1.25; }
  .rv-grid.compact .rv-meta small { font-size: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .rv-grid.compact .rv-acts { gap: 6px; padding: 6px 8px 8px; flex-wrap: wrap; }
  .rv-grid.compact .rv-acts button { min-height: 44px; min-width: 0; padding: 6px 4px; font-size: 15px; }
  .rv-grid.compact .rv-circ { padding-top: 0; }
  .rv-grid.compact .rv-circ button { font-size: 12px; }
  .rv-grid.compact .rv-why { padding: 0 8px 8px; }
  .rv-grid.compact .rv-why button { min-height: 36px; font-size: 12px; padding: 4px 8px; }
  .rv-grid.compact .rv-card.drawing .rv-meta { font-size: inherit; }
  .rv-fails { flex-basis: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .rv-fails:empty { display: none; }
  .rv-err { color: var(--bad); font-weight: 800; text-align: center; overflow-wrap: anywhere; margin: 0; }
  .rv-rest { min-height: 48px; }
  .rv-more { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .muted { color: var(--ink-2); }
  :focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
</style>
</head>
<body>
<main class="rv" id="rv">
  <h1>Picture review</h1>
  <p class="muted">Mark each picture OK or Bad. Bad ones get swapped for another photo, or regenerated if they’re AI pictures. Tap a picture to open it full size.</p>
  <div class="panel" id="gate"><p class="muted">Checking your sign-in…</p></div>
</main>
<div id="popups"></div>
<script type="module" src="js/net/review.js?v=202610170738"></script>
</body>
</html>
