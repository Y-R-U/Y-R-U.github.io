<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#123524">
<title>Racketeer 🎾</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎾</text></svg>">
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <!-- In-match HUD -->
  <div id="hud" class="hidden">
    <div id="scorebar">
      <div class="sb-row"><span id="sbYouName" class="sb-name you"></span><span id="sbYouGames" class="sb-games"></span><span id="sbYouPts" class="sb-pts"></span></div>
      <div class="sb-row"><span id="sbOppName" class="sb-name"></span><span id="sbOppGames" class="sb-games"></span><span id="sbOppPts" class="sb-pts"></span></div>
    </div>
    <div id="meters">
      <div class="meter"><span class="m-ico">⚡</span><div class="m-bar"><div id="mStam" class="m-fill stam"></div></div></div>
      <div class="meter"><span class="m-ico">🧘</span><div class="m-bar"><div id="mComp" class="m-fill comp"></div></div></div>
      <div class="meter"><span class="m-ico">🔥</span><div class="m-bar"><div id="mHype" class="m-fill hype"></div></div></div>
    </div>
    <div id="skillDock"></div>
    <div id="arguePrompt"></div>
    <div id="coach"></div>
    <div id="ticker"></div>
    <button id="pauseBtn" aria-label="Pause">II</button>
  </div>

  <!-- Menu screens (content built by ui.js) -->
  <section id="scr-menu" class="screen hidden"></section>
  <section id="scr-career" class="screen hidden"></section>
  <section id="scr-story" class="screen hidden"></section>
  <section id="scr-tourn" class="screen hidden"></section>
  <section id="scr-shop" class="screen hidden"></section>
  <section id="scr-loadout" class="screen hidden"></section>

  <div id="modal-root"></div>
</div>
<script>
/* Boot watchdog: a failed or stale cached module leaves a dead canvas with no error,
   so offer a cache-busting reload instead of hanging. main.js sets __booted. */
(function () {
  var shown = false;
  function show(why) {
    if (window.__booted || shown) return;
    shown = true;
    console.warn("[racketeer] boot problem:", why);
    var d = document.createElement("div");
    d.id = "bootFail";
    d.style.cssText = "position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);transform:translateX(-50%);z-index:99;" +
      "background:#16371f;color:#eef7ee;border:1px solid #ffd34a;border-radius:14px;padding:10px 12px;font:600 13px/1.4 sans-serif;" +
      "display:flex;gap:10px;align-items:center;max-width:92vw;box-shadow:0 6px 20px rgba(0,0,0,.5)";
    d.innerHTML = "<span>🎾 Racketeer didn't load properly.</span>";
    var b = document.createElement("button");
    b.textContent = "Reload";
    b.style.cssText = "flex:none;border:0;border-radius:10px;padding:8px 14px;font:800 13px sans-serif;background:#ffd34a;color:#08150c";
    b.onclick = function () {
      b.disabled = true; b.textContent = "…";
      var urls = performance.getEntriesByType("resource").map(function (e) { return e.name; })
        .filter(function (u) { return u.indexOf(location.origin) === 0 && /\.(js|css)(\?|$)/.test(u); });
      urls.push(new URL("js/main.js", location.href).href);
      Promise.all(urls.map(function (u) { return fetch(u, { cache: "reload" }).catch(function () {}); }))
        .then(function () {
          var q = new URLSearchParams(location.search); q.set("cb", Date.now());
          location.replace(location.pathname + "?" + q.toString() + location.hash);
        });
    };
    d.appendChild(b);
    (document.body || document.documentElement).appendChild(d);
  }
  window.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t !== window && (t.src || t.href)) show("failed to load " + (t.src || t.href));
    else show(e.message || "error");
  }, true);
  window.addEventListener("unhandledrejection", function (e) { show(e.reason && (e.reason.message || e.reason)); });
  setTimeout(function () { show("timeout"); }, 12000);
})();
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
