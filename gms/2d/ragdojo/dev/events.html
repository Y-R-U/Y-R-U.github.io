<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RAGDOJO events preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --ink: #20242c; --paper: #f7f2e3; --blue: #2d5fb5; --red: #c8463f; --green: #3d6b3a; --font: "Patrick Hand", "Bradley Hand", cursive; }
  html, body { margin: 0; height: 100%; background: #3b3428; overflow: hidden; font-family: var(--font); color: var(--ink);
    -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #panel { position: fixed; top: 0; bottom: 0; right: 0; display: flex; flex-direction: column; gap: 6px;
    padding: 10px 14px 10px 6px; box-sizing: border-box; overflow-y: auto; }
  .tabs { display: flex; gap: 6px; }
  .btn { font-family: var(--font); font-size: 18px; line-height: 1; color: var(--ink); background: rgba(255,253,244,.85);
    border: 2.5px solid var(--ink); border-radius: 14px 9px 15px 8px; padding: 7px 12px; cursor: pointer; }
  .btn:active { transform: translateY(1px) rotate(-.6deg); }
  .btn.on { background: var(--ink); color: var(--paper); }
  .btn.big { font-size: 26px; padding: 9px 20px; border-color: var(--blue); color: var(--blue); }
  .btn.big:disabled, .btn:disabled { opacity: .38; }
  .btn.win { border-color: var(--green); color: var(--green); }
  .btn.loss { border-color: var(--red); color: var(--red); }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  h1 { font-family: "Caveat", cursive; font-size: 30px; margin: 0; line-height: .95; }
  .sub { font-size: 15px; opacity: .75; }
  .tag { font-size: 13px; border: 1.5px solid currentColor; border-radius: 8px 5px 9px 4px; padding: 1px 6px; }
  .tag.free { color: var(--green); } .tag.pass { color: #8c50c6; } .tag.any { color: var(--blue); }
  .stat { font-size: 19px; }
  .stat b { font-size: 24px; }
  #rivals { font-size: 15px; line-height: 1.22; columns: 2; column-gap: 14px; }
  #rivals .f { color: var(--blue); }
  #rivals span.sq { opacity: .7; }
  #note { min-height: 20px; font-size: 16px; color: var(--blue); }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .choices .btn { font-size: 15px; padding: 6px 6px; }
  .hide { display: none !important; }
  .small { font-size: 14px; }
  @media (max-height: 430px) {
    #panel { gap: 4px; padding-top: 6px; }
    .btn { font-size: 15px; padding: 5px 9px; }
    .btn.big { font-size: 20px; padding: 6px 16px; }
    h1 { font-size: 23px; } .sub { font-size: 13px; } .tag { font-size: 11px; }
    .stat { font-size: 15px; } .stat b { font-size: 19px; }
    #rivals { font-size: 13px; } #note { font-size: 14px; min-height: 16px; } .small { font-size: 12px; }
    .choices .btn { font-size: 13px; padding: 5px; }
  }
  @media (orientation: portrait) { #panel { top: auto; left: 0; height: 52vh; } }
</style>
</head><body>
<canvas id="c"></canvas>
<div id="panel">
  <div class="tabs"><button class="btn on" data-tab="vines">VINES &amp; LADDERS</button><button class="btn" data-tab="reveal">PICTURE REVEAL</button></div>
  <div><h1 id="title"></h1><div class="sub" id="window"></div><div class="row" id="tags"></div></div>
  <div class="row small">a finished battle in the <button class="btn small" id="src">ARENA</button></div>
  <div class="row">
    <button class="btn win" data-res="win">WIN +3</button>
    <button class="btn loss" data-res="close">CLOSE LOSS +2</button>
    <button class="btn loss" data-res="loss">LOSS +1</button>
  </div>
  <div id="note"></div>
  <section id="vinesP">
    <div class="row"><span class="stat">rolls <b id="rolls">0</b></span><span class="stat">turn <b id="turn">0</b></span>
      <button class="btn big" id="roll">ROLL</button></div>
    <div class="row small"><button class="btn small" id="others">OTHERS PLAY MORE</button>
      <button class="btn small" id="reset">RESET</button><span id="shown"></span></div>
    <div id="rivals"></div>
  </section>
  <section id="revealP" class="hide">
    <div class="row"><span class="stat">points left <b id="pleft">0</b></span><span class="stat small" id="cost"></span></div>
    <div class="small">tap a square to uncover it · guess early for a bonus (<span id="gleft"></span>)</div>
    <div class="choices" id="choices"></div>
    <div class="small" id="rewards"></div>
  </section>
</div>
<script type="module">
import { makeSheet, drawDesk } from '../js/paper.js';
import { stroke, line, circle, rect, hatch, splat, rnd, INK } from '../js/ink.js';
import { Ragdoll } from '../js/ragdoll.js';
import { POSE, fk, sample } from '../js/poses.js';
import { drawFighter, drawShadow } from '../js/draw.js';
import { RANKS } from '../js/config.js';
import { activeEvents, defById, windowOf, eventIdOf, die } from '../js/events/index.js';
import * as V from '../js/events/vines.js';
import * as R from '../js/events/reveal.js';
import * as S from '../js/events/state.js';

const KEY = 'ragdojo.eventsPreview.v1';
const UID = 'preview-me';
const q = new URLSearchParams(location.search);
const NOW = q.get('now') ? Date.parse(q.get('now')) : Date.now();
const vdef = defById('vines-day'), rdef = defById('reveal-week');
const vwin = windowOf(vdef, NOW), rwin = windowOf(rdef, NOW);
const VEV = eventIdOf(vdef, vwin), REV = eventIdOf(rdef, rwin);
const board = V.makeBoard(VEV);
const PIC = q.get('img') ? (q.get('pic') || R.pictureOf(rdef, REV)) : 'heroic';
const CHOICES = R.choicesFor(REV, PIC);
const PEEK = q.get('peek') === '1';

const NAMES = ['INKY', 'NIB', 'SMUDGE', 'BIRO', 'DOODLE', 'ERASER', 'SCRAWL', 'QUILL', 'GRAPHITE', 'MARGIN',
  'STAPLE', 'CRAYON', 'TIPPEX', 'RULER'];
const FRIENDS = new Set(['f-NIB', 'f-QUILL', 'f-STAPLE']);
const freshRivals = () => NAMES.map((n, i) => ({ uid: 'f-' + n, name: n, turns: 1 + Math.floor(rnd(i * 31 + 5) * 6) }));

let saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch {}
let st = S.load(saved?.st);
let rivals = saved?.rivals || freshRivals();
let tab = 'vines', src = 'arena', note = '';
const persist = () => { try { localStorage.setItem(KEY, JSON.stringify({ st, rivals })); } catch {} };

const $ = (id) => document.getElementById(id);
const cv = $('c'), g = cv.getContext('2d');
let W = 0, H = 0, dpr = 1, sheet = null, boardImg = null;
const L = {};

function layout() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  const portrait = H > W;
  const area = portrait ? { w: W, h: H * 0.48 } : { w: W * 0.54, h: H };
  const cs = Math.floor(Math.min((area.w - 70) / 10.6, (area.h - 26) / 10));
  L.cs = cs; L.bx = Math.round((area.w - cs * 10) / 2 + cs * 0.3); L.by = Math.round((area.h - cs * 10) / 2);
  $('panel').style.left = portrait ? '0' : `${area.w}px`;
  sheet = makeSheet(W, H, 11, { rule: Math.max(18, Math.round(H / 18)), ruleTop: Math.round(H / 10), margin: Math.round(W * 0.035) });
  boardImg = bakeBoard();
}

const centre = (s) => {
  if (s <= 0) return [L.bx - L.cs * 0.62, L.by + L.cs * 9.5];
  const r = Math.floor((s - 1) / 10); let c = (s - 1) % 10; if (r % 2) c = 9 - c;
  return [L.bx + c * L.cs + L.cs / 2, L.by + (9 - r) * L.cs + L.cs / 2];
};

function vinePts(a, b, seed) {
  const [x0, y0] = centre(a), [x1, y1] = centre(b);
  const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy), nx = -dy / len, ny = dx / len;
  const waves = Math.max(1.5, len / (L.cs * 1.3)), amp = L.cs * 0.28;
  return Array.from({ length: 41 }, (_, i) => {
    const t = i / 40, o = Math.sin(t * Math.PI * 2 * waves + seed) * amp * Math.sin(t * Math.PI);
    return [x0 + dx * t + nx * o, y0 + dy * t + ny * o];
  });
}

function bakeBoard() {
  const c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr;
  const b = c.getContext('2d'); b.scale(dpr, dpr);
  const { bx, by, cs } = L;
  b.save(); b.globalCompositeOperation = 'multiply';
  for (let s = 1; s <= 100; s++) {
    const [x, y] = centre(s);
    if (s % 2 === 0) { b.fillStyle = 'rgba(160,150,120,0.10)'; b.fillRect(x - cs / 2, y - cs / 2, cs, cs); }
  }
  for (let i = 0; i <= 10; i++) {
    line(b, bx + i * cs, by - 2, bx + i * cs, by + cs * 10 + 2, { w: i % 10 ? 1.2 : 2.4, passes: 1, wob: 0.6, seed: 40 + i, a: i % 10 ? 0.45 : 0.9 });
    line(b, bx - 2, by + i * cs, bx + cs * 10 + 2, by + i * cs, { w: i % 10 ? 1.2 : 2.4, passes: 1, wob: 0.6, seed: 90 + i, a: i % 10 ? 0.45 : 0.9 });
  }
  b.font = `${Math.round(cs * 0.27)}px "Patrick Hand", cursive`; b.fillStyle = 'rgba(32,36,44,0.55)';
  for (let s = 1; s <= 100; s++) { const [x, y] = centre(s); b.fillText(String(s), x - cs * 0.44, y - cs * 0.2); }
  for (const [i, [a, z]] of board.ladders.entries()) {
    const [x0, y0] = centre(a), [x1, y1] = centre(z);
    const dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy), nx = -dy / len * cs * 0.13, ny = dx / len * cs * 0.13;
    const col = '#6b4a2b';
    line(b, x0 + nx, y0 + ny, x1 + nx, y1 + ny, { w: 2.2, col, seed: 300 + i, wob: 0.7 });
    line(b, x0 - nx, y0 - ny, x1 - nx, y1 - ny, { w: 2.2, col, seed: 400 + i, wob: 0.7 });
    const n = Math.max(2, Math.round(len / (cs * 0.32)));
    for (let k = 1; k < n; k++) { const t = k / n; line(b, x0 + dx * t + nx, y0 + dy * t + ny, x0 + dx * t - nx, y0 + dy * t - ny, { w: 1.6, col, passes: 1, seed: 500 + i * 30 + k }); }
  }
  for (const [i, [a, z]] of board.vines.entries()) {
    const pts = vinePts(a, z, i * 1.7);
    stroke(b, pts, { w: 3.2, col: '#3d6b3a', seed: 600 + i, wob: 0.8, step: 6 });
    for (let k = 4; k < pts.length - 2; k += 6) {
      const [x, y] = pts[k];
      b.fillStyle = 'rgba(61,107,58,0.55)'; b.beginPath();
      b.ellipse(x + (k % 12 ? 4 : -4), y, cs * 0.11, cs * 0.05, k, 0, 6.283); b.fill();
    }
    const [hx, hy] = pts[0]; b.fillStyle = '#3d6b3a'; b.beginPath(); b.ellipse(hx, hy, cs * 0.12, cs * 0.09, 0, 0, 6.283); b.fill();
  }
  const [fx, fy] = centre(100);
  stroke(b, [[fx - cs * 0.15, fy + cs * 0.3], [fx - cs * 0.15, fy - cs * 0.32]], { w: 2, seed: 9 });
  stroke(b, [[fx - cs * 0.15, fy - cs * 0.32], [fx + cs * 0.3, fy - cs * 0.2], [fx - cs * 0.15, fy - cs * 0.08]], { w: 2, col: '#c8463f', seed: 10 });
  b.restore();
  return c;
}

// ---- the walker ----
const me = { rag: new Ragdoll(1), scale: 1, facing: 1, rank: RANKS[4], seed: 3, armed: false, hp: 100, maxHp: 100,
  hitFlash: 0, isPlayer: true, dead: false, tailPhase: 1 };
let anim = [];                      // queued segments for the walker
let rivalAnim = [];                 // concurrent rival hops after my turn
let walkerPos = null, walkT = 0, lastDie = null, dieSpin = 0;

const myTurns = () => S.evState(st, VEV).turns;
const myPts = (id) => S.pointsOf(S.evState(st, id));
const myPos = () => V.positionAt(board, UID, VEV, myTurns()).pos;

function queueMove(m) {
  let prev = m.from;
  for (const s of m.path) { anim.push({ kind: 'walk', a: centre(prev), b: centre(s), dur: 0.26 }); prev = s; }
  if (m.link) anim.push(m.link.kind === 'ladder'
    ? { kind: 'climb', a: centre(m.link.from), b: centre(m.link.to), dur: 0.55 + Math.abs(m.link.to - m.link.from) * 0.012 }
    : { kind: 'slide', pts: vinePts(m.link.from, m.link.to, board.vines.findIndex((v) => v[0] === m.link.from) * 1.7), dur: 0.9 });
}

function roll() {
  if (anim.length) return;
  const turns = myTurns(), banked = V.rollsBanked(vdef, myPts(VEV));
  const before = V.selectRivals(board, VEV, rivals, { uid: UID, turns }, { friends: FRIENDS });
  const r = V.takeTurn(board, UID, VEV, turns, banked);
  if (!r.move) { say(myPos() === 100 ? 'you are home — square 100!' : 'no rolls banked — fight a battle'); return; }
  st = S.setEv(st, VEV, { ...S.evState(st, VEV), turns: r.turns });
  lastDie = r.move.roll; dieSpin = 0.45;
  queueMove(r.move);
  rivalAnim = [];
  for (const rv of before) {
    if (rv.turns > turns) {
      const from = V.positionAt(board, rv.uid, VEV, turns).pos;
      const m = V.move(board, from, die(rv.uid, VEV, turns));
      rivalAnim.push({ uid: rv.uid, a: centre(from), b: centre(m.to), t: -anim.reduce((s, x) => s + x.dur, 0) - 0.1 });
    }
  }
  say(`rolled a ${r.move.roll}${r.move.link ? (r.move.link.kind === 'ladder' ? ' — up a ladder!' : ' — down a vine') : ''}${r.move.bounced ? ' (bounced off 100)' : ''}`);
  persist(); refresh();
}

function battle(res) {
  const b = { id: `preview:${Date.now()}:${Math.random()}`, at: NOW, src, won: res === 'win', oppDmg: res === 'close' ? 0.7 : res === 'win' ? 1 : 0.3 };
  st = S.recordBattle(st, b, { pass: false });
  say(`${res === 'win' ? 'WIN' : 'loss'} banked in ${Object.keys(st.ev).filter((k) => st.ev[k].b.some((x) => x[0] === b.id)).length} event(s)`);
  persist(); refresh();
}

function say(s) { note = s; $('note').textContent = s; }

function refresh() {
  const ev = tab === 'vines' ? vdef : rdef, win = tab === 'vines' ? vwin : rwin;
  $('title').textContent = ev.title;
  const left = Math.max(0, win.end - NOW), h = Math.floor(left / 3600e3), m = Math.floor(left / 60e3) % 60;
  $('window').textContent = `${win.key} UTC · ends in ${h >= 48 ? Math.floor(h / 24) + 'd ' + (h % 24) + 'h' : h + 'h ' + m + 'm'}`;
  $('tags').innerHTML = `<span class="tag ${ev.pass ? 'pass' : 'free'}">${ev.pass ? 'PASS' : 'FREE'}</span>`
    + `<span class="tag any">${ev.anyBattle ? 'ANY BATTLE' : 'ARENA ONLY'}</span><span class="tag">${ev.cadence.toUpperCase()}</span>`;
  $('vinesP').classList.toggle('hide', tab !== 'vines');
  $('revealP').classList.toggle('hide', tab !== 'reveal');
  document.querySelectorAll('[data-tab]').forEach((b) => b.classList.toggle('on', b.dataset.tab === tab));
  $('src').textContent = src === 'arena' ? 'ARENA' : 'CAMPAIGN';
  const turns = myTurns(), banked = V.rollsBanked(vdef, myPts(VEV));
  $('rolls').textContent = Math.max(0, banked - turns);
  $('turn').textContent = turns;
  $('roll').disabled = banked <= turns || myPos() === 100;
  $('shown').textContent = `others shown up to turn ${turns}`;
  const sel = V.selectRivals(board, VEV, rivals, { uid: UID, turns }, { friends: FRIENDS });
  $('rivals').innerHTML = sel.map((r) => `<div class="${r.friend ? 'f' : ''}">${r.friend ? '★ ' : ''}${r.name} <span class="sq">sq ${r.pos} · t${r.shownTurns}/${r.turns}</span></div>`).join('');
  const rs = S.evState(st, REV), pts = myPts(REV);
  $('pleft').textContent = R.left(rdef, rs, pts);
  $('cost').textContent = `${rdef.cost} point a square · ${rs.open.length}/25 open`;
  $('gleft').textContent = `${R.guessesLeft(rs)} guess${R.guessesLeft(rs) === 1 ? '' : 'es'} left`;
  $('choices').innerHTML = CHOICES.map((c, i) => `<button class="btn" data-choice="${i}" ${R.guessesLeft(rs) <= 0 || rs.guesses.includes(c) ? 'disabled' : ''}>${c}</button>`).join('');
  const owed = R.rewardsOwed(rdef, rs, PIC);
  $('rewards').textContent = rs.solved ? `solved! bonus ${rs.bonus} ink · picture unlocked as an arena background`
    : R.complete(rs) ? 'picture complete — unlocked as an arena background' : owed.length ? '' : '';
}

// ---- picture ----
let picImg = null;
if (q.get('img')) { const im = new Image(); im.onload = () => { picImg = im; }; im.src = q.get('img'); }
const picMe = { ...me, rag: new Ragdoll(1.6), scale: 1.6, seed: 77 };
const picFoe = { ...me, rag: new Ragdoll(1.4), scale: 1.4, seed: 91, isPlayer: false, facing: -1, rank: RANKS[7] };
function picRect() {
  const { cs, bx, by } = L, w = cs * 10, h = Math.round(w * 0.625);
  return { x: bx, y: by + (cs * 10 - h) / 2, w, h };
}
function drawPicture(t) {
  const p = picRect();
  g.save(); g.beginPath(); g.rect(p.x, p.y, p.w, p.h); g.clip();
  if (picImg) g.drawImage(picImg, p.x, p.y, p.w, p.h);
  else {
    g.fillStyle = 'rgba(255,252,240,0.6)'; g.fillRect(p.x, p.y, p.w, p.h);
    g.save(); g.translate(p.x, p.y); const k = p.w / 640; g.scale(k, k);
    circle(g, 520, 90, 46, { w: 3, seed: 5, col: '#c8463f' });
    stroke(g, [[20, 330], [620, 330]], { w: 3, seed: 6 });
    picMe.rag.place(250, 205, fk(POSE.kickHit || POSE.guard, 1, 1.6));
    picFoe.rag.place(420, 230, fk(POSE.hurt || POSE.guard, -1, 1.4));
    drawShadow(g, picFoe, 330); drawFighter(g, picFoe, 0); drawFighter(g, picMe, 0);
    for (let i = 0; i < 5; i++) line(g, 80, 150 + i * 22, 170, 160 + i * 20, { w: 2, seed: 70 + i, a: 0.6 });
    splat(g, 380, 190, 9, 4, '#c8463f', 0.7);
    g.restore();
  }
  g.restore();
  rect(g, p.x - 3, p.y - 3, p.w + 6, p.h + 6, { w: 2.6, seed: 12 });
  const rs = S.evState(st, REV);
  const cw = p.w / 5, ch = p.h / 5;
  for (let i = 0; i < 25; i++) {
    if (PEEK || R.complete(rs) || rs.open.includes(i)) continue;
    const x = p.x + (i % 5) * cw, y = p.y + Math.floor(i / 5) * ch;
    g.fillStyle = '#efe8d4'; g.fillRect(x, y, cw + 0.5, ch + 0.5);
    hatch(g, x + 3, y + 3, cw - 6, ch - 6, { gap: 9, seed: i * 7, a: 0.22, w: 1.4 });
    rect(g, x + 1, y + 1, cw - 2, ch - 2, { w: 1.4, passes: 1, seed: i * 3, a: 0.6 });
    g.font = `${Math.round(ch * 0.36)}px "Patrick Hand", cursive`; g.fillStyle = 'rgba(32,36,44,0.6)';
    g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', x + cw / 2, y + ch / 2);
  }
  g.textAlign = 'start'; g.textBaseline = 'alphabetic';
}

// ---- render ----
function drawDie(x, y, s, n, seed) {
  g.save(); g.fillStyle = 'rgba(255,253,244,0.9)'; g.fillRect(x, y, s, s); g.restore();
  rect(g, x, y, s, s, { w: 2.4, seed });
  const P = { 1: [[.5, .5]], 2: [[.25, .25], [.75, .75]], 3: [[.25, .25], [.5, .5], [.75, .75]], 4: [[.25, .25], [.75, .25], [.25, .75], [.75, .75]],
    5: [[.25, .25], [.75, .25], [.5, .5], [.25, .75], [.75, .75]], 6: [[.25, .25], [.75, .25], [.25, .5], [.75, .5], [.25, .75], [.75, .75]] }[n];
  g.fillStyle = INK; for (const [u, v] of P) { g.beginPath(); g.arc(x + u * s, y + v * s, s * 0.08, 0, 6.283); g.fill(); }
}

const RIVAL_COL = ['#2d5fb5', '#c8463f', '#3d6b3a', '#8c50c6', '#d08a1e', '#8a5a33', '#1d8a8a'];
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  drawDesk(g, W, H, sheet); g.drawImage(sheet, 0, 0);
  if (tab === 'vines') {
    g.drawImage(boardImg, 0, 0, W, H);
    const turns = myTurns();
    const sel = V.selectRivals(board, VEV, rivals, { uid: UID, turns }, { friends: FRIENDS });
    const ra = new Map(rivalAnim.map((r) => [r.uid, r]));
    sel.forEach((r, i) => {
      let [x, y] = centre(r.pos);
      const a = ra.get(r.uid);
      if (a) { const t = Math.max(0, Math.min(1, a.t / 0.5)); x = a.a[0] + (a.b[0] - a.a[0]) * t; y = a.a[1] + (a.b[1] - a.a[1]) * t - Math.sin(t * Math.PI) * L.cs * 0.3; }
      const ang = i * 2.399, off = L.cs * 0.26;
      x += Math.cos(ang) * off; y += Math.sin(ang) * off * 0.7;
      const col = RIVAL_COL[i % RIVAL_COL.length];
      g.save(); g.globalAlpha = 0.85; g.fillStyle = 'rgba(255,253,244,0.9)'; g.beginPath(); g.arc(x, y, L.cs * 0.2, 0, 6.283); g.fill(); g.restore();
      circle(g, x, y, L.cs * 0.2, { w: r.friend ? 2.4 : 1.6, col, seed: i * 13, passes: 1 });
      g.font = `${Math.round(L.cs * 0.3)}px "Patrick Hand", cursive`; g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(r.name[0], x, y + 1); g.textAlign = 'start'; g.textBaseline = 'alphabetic';
    });
    for (const a of rivalAnim) a.t += dt;
    rivalAnim = rivalAnim.filter((a) => a.t < 0.5);

    walkT += dt;
    let x, y, pose = 'guard', poseT = 0;
    if (anim.length) {
      const s = anim[0]; s.t = (s.t || 0) + dt; const u = Math.min(1, s.t / s.dur);
      if (s.kind === 'walk') { x = s.a[0] + (s.b[0] - s.a[0]) * u; y = s.a[1] + (s.b[1] - s.a[1]) * u - Math.sin(u * Math.PI) * L.cs * 0.12; pose = 'walk'; poseT = walkT; me.facing = s.b[0] >= s.a[0] ? 1 : -1; }
      else if (s.kind === 'climb') { x = s.a[0] + (s.b[0] - s.a[0]) * u; y = s.a[1] + (s.b[1] - s.a[1]) * u; pose = 'walk'; poseT = walkT * 1.6; }
      else { const k = Math.min(s.pts.length - 1, Math.floor(u * (s.pts.length - 1))); [x, y] = s.pts[k]; pose = 'hurt'; }
      if (u >= 1) anim.shift();
      walkerPos = [x, y];
    } else { [x, y] = centre(myPos()); walkerPos = [x, y]; }
    const k = L.cs / 115;
    const p = pose === 'walk' ? sample('walk', poseT) : (POSE[pose] || POSE.guard);
    me.rag.place(0, 0, fk(p, me.facing, 1));
    g.save(); g.translate(x, y + L.cs * 0.02); g.scale(k, k);
    drawFighter(g, me, now / 1000);
    g.restore();
    if (lastDie) {
      dieSpin = Math.max(0, dieSpin - dt);
      const s = L.cs * 0.8, dx = L.bx - L.cs * 0.95, dy = L.by + L.cs * 0.2;
      drawDie(dx, dy, s, dieSpin > 0 ? 1 + Math.floor(now / 70) % 6 : lastDie, dieSpin > 0 ? Math.floor(now / 70) : 4);
    }
  } else drawPicture(now / 1000);
  requestAnimationFrame(frame);
}

// ---- input ----
document.querySelectorAll('[data-tab]').forEach((b) => b.onclick = () => { tab = b.dataset.tab; refresh(); });
document.querySelectorAll('[data-res]').forEach((b) => b.onclick = () => battle(b.dataset.res));
$('src').onclick = () => { src = src === 'arena' ? 'campaign' : 'arena'; refresh(); };
$('roll').onclick = roll;
$('others').onclick = () => {
  rivals = rivals.map((r, i) => ({ ...r, turns: r.turns + 2 + (i % 4) }));
  say(`others played on — still shown no further than your turn ${myTurns()}`);
  persist(); refresh();
};
$('reset').onclick = () => { st = S.fresh(); rivals = freshRivals(); anim = []; lastDie = null; say('reset'); persist(); refresh(); };
$('choices').onclick = (e) => {
  const b = e.target.closest('[data-choice]'); if (!b) return;
  const c = CHOICES[+b.dataset.choice];
  const r = R.guess(rdef, S.evState(st, REV), c, c === R.PICTURES[PIC].answer);
  if (!r.ok) return;
  st = S.setEv(st, REV, r.st);
  say(r.right ? `yes — ${c}!` : `not ${c.toLowerCase()}`);
  persist(); refresh();
};
cv.addEventListener('pointerdown', (e) => {
  if (tab !== 'reveal') return;
  const p = picRect(), x = e.clientX - p.x, y = e.clientY - p.y;
  if (x < 0 || y < 0 || x >= p.w || y >= p.h) return;
  const cell = Math.floor(y / (p.h / 5)) * 5 + Math.floor(x / (p.w / 5));
  const r = R.uncover(rdef, S.evState(st, REV), myPts(REV), cell);
  if (!r.ok) { say(r.why === 'points' ? 'not enough points — fight a battle' : ''); return; }
  st = S.setEv(st, REV, r.st); persist(); refresh();
});
addEventListener('resize', () => { layout(); });
if (q.get('tab')) tab = q.get('tab');
window.__ev = { get st() { return st; }, roll, battle, get rivals() { return rivals; }, VEV, REV, picRect };

await document.fonts.ready.catch(() => {});
layout(); refresh(); say(note || 'fight battles to bank rolls');
requestAnimationFrame(frame);
</script>
</body></html>
