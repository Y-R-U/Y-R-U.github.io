<!doctype html>
<html><head><meta charset="utf-8"><title>IW2 cast lab</title>
<style>html,body{margin:0;background:#222;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/gms/lib/three/0.160.0/three.module.js", "three/addons/": "/gms/lib/three/0.160.0/addons/" } }</script>
</head><body>
<script type="module">
// Lane A lineup/pose lab: ?chars=mabel,wendell,...&clip=idle|walk|...&clips=a,b,c (one per char)&tod=17&cam=front|three&hats=1
// Renders the named cast (kit.CHARACTERS) on the real lighting, plus a row of loose hats when hats=1.
import * as THREE from 'three';
import { createKit } from '../js/render/kit/index.js?v=20261004a';
import { createLighting, lerpLight } from '../js/render/kit/lighting.js?v=20261004a';
import { LIGHTS, PALETTE } from '../js/data/palette.js?v=20261004a';
import { createPost } from '../js/render/post.js?v=20261004a';
const q = new URLSearchParams(location.search);
const W = innerWidth, H = innerHeight;
const kit = createKit();
const scene = new THREE.Scene();
const rig = createLighting(scene, null);
const L = LIGHTS[q.get('light') || 'golden'];
rig.apply(L); kit.setNight(L.night || 0); kit.setLight(L);
const names = (q.get('chars') || 'wendell,mabel,lulu,mortimer,pickles,pomfrey,stranger,fingers,bart,nubbin,mulligan1,mulligan2,mulligan3').split(',');
const clips = (q.get('clips') || '').split(',').filter(Boolean);
const crowd = kit.crowd({ count: names.length, radius: 100, rig: q.get('rig') || 'full', pool: false });
const gap = +(q.get('gap') || 1.25);
names.forEach((n, i) => {
  crowd.dress(i, n);
  const clip = kit.CLIP[clips[i] || q.get('clip') || 'idle'] ?? 0;
  crowd.set(i, (i - (names.length - 1) / 2) * gap, 0, 0, +(q.get('h') || 0), clip, 0.5 + i, 3.6);
});
crowd.commit();
scene.add(crowd.mesh);
const b = kit.builder(PALETTE);
b.slab('road', 0, -0.12, 0, 60, 0.13, 30, { round: 0.02, taper: 0, noAo: true });
if (q.get('hats') === '1') {
  kit.hats.TYPES.forEach((t, i) => {
    const m = new THREE.Mesh(kit.hats.geometry(i), kit.materials.lambertVCInst);
    m.material = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, color: new THREE.Color(Object.values(kit.hats.COLORS)[i % 12]) });
    m.position.set((i - 5.5) * 1.1, 0.02, 2.4);
    m.scale.setScalar(1.25);
    scene.add(m);
  });
}
const ground = b.finish({ cast: false });
scene.add(ground);
kit.materials.splitUber(scene);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = L.exposure ?? 1;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const cam = new THREE.PerspectiveCamera(+(q.get('fov') || 26), W / H, 0.1, 400);
const span = names.length * gap;
const camK = q.get('cam') === 'three' ? [span * 0.35, span * 0.45, span * 1.1] : [0, span * 0.16 + 1.2, span * 1.45 + 2];
cam.position.set(...camK);
cam.lookAt(0, 1.0, 0);
rig.place(new THREE.Vector3(0, 0, 0), span);
scene.fog.near = 200; scene.fog.far = 600;
const post = createPost();
let f = 0;
function frame() {
  kit.setTime(f / 30);
  f++;
  post.render(renderer, scene, cam, { vx: 0, vy: 0, pw: W, ph: H }, { bloom: { strength: 0.2, threshold: 2.4, knee: 1 }, tilt: { focus: 0.5, band: 0.5, feather: 0.3, strength: 0.0 }, samples: 4, div: 2 });
  if (f < +(q.get('frames') || 20)) requestAnimationFrame(frame);
  else window.__lab = { ready: true, calls: renderer.info.render.calls, tris: renderer.info.render.triangles };
}
frame();
</script></body></html>
