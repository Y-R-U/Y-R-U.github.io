<!doctype html><meta charset="utf-8"><title>skin bench</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- The dummy on its own, with the importmap and no game. tools/skin/render.mjs drives this page
     over CDP; ?skin=, ?shape= and ?view= are its handles. -->
<script type="importmap">
{ "imports": {
  "three": "/lib/three/0.160.0/three.module.js",
  "three/addons/": "/lib/three/0.160.0/addons/"
} }
</script>
<style>
  html,body{margin:0;height:100%;background:#121820;color:#8aa;font:13px system-ui}
  canvas{display:block;width:100vw;height:100vh}
  #hud{position:fixed;left:10px;top:8px;font:12px ui-monospace,Menlo,monospace;pointer-events:none}
</style>
<canvas id="c"></canvas>
<div id="hud">…</div>
<script type="module">
// DEV_CONTRACT §1 — a dev page, so the same gate as the DEV button. The preview is imported
// dynamically because a static import is hoisted above the check.
import { isLocal } from '../gate.js';

if (!isLocal()) {
  document.body.innerHTML = '<p style="margin:16px;max-width:44em">Developer tools are local-only — DEV_CONTRACT §1. Open this from localhost, a .local host or a private LAN address.</p>';
  window.__wfSkinBench = { refused: true };
} else {
  const { SkinPreview } = await import('./preview.js');
  const q = new URLSearchParams(location.search);
  const p = new SkinPreview(document.getElementById('c'));
  await p.start();
  p.setShape(q.get('shape') || 'm');
  if (q.get('view')) p.view(q.get('view'));
  if (q.get('spin')) { p.auto = false; p.spin = +q.get('spin'); }
  let note = 'no skin';
  if (q.get('skin')) {
    try { await p.setSkin(q.get('skin')); note = q.get('skin'); }
    catch (e) { note = `FAILED ${e.message}`; }
  }
  document.getElementById('hud').textContent = `${p.shape} · ${note}`;
  window.__wfSkinBench = { preview: p, ready: true, note, refused: false };
}
</script>
