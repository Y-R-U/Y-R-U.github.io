<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#243028" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>PolyPerfect Field Test</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="app">
    <canvas id="scene" aria-label="PolyPerfect field test scene"></canvas>

    <header id="hud">
      <div>
        <p id="kicker">PolyPerfect</p>
        <h1>Field Test</h1>
      </div>
      <div id="stats">
        <span id="load-state">Loading</span>
        <span id="score">0/0</span>
      </div>
    </header>

    <section id="switcher" aria-label="People"></section>

    <section id="controls" aria-label="Controls">
      <div id="stick" aria-hidden="true">
        <div id="stick-knob"></div>
      </div>
      <div id="buttons">
        <button id="palette-btn" type="button">Warm</button>
        <button id="collider-btn" type="button">COL</button>
      </div>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "../../lib/three/0.160.0/three.module.js",
      "three/addons/": "../../lib/three/0.160.0/addons/"
    }
  }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
