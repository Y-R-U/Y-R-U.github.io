/* ═══════════════════════════════════════════════════════════════════════════
   2. WATER
   The nitrogen cycle, honestly modelled: fish and rotting food make ammonia,
   one bacterial colony turns ammonia into nitrite, a second turns nitrite
   into nitrate, plants and water changes are the only things that remove
   nitrate. Both colonies have to GROW, which is why a new tank poisons its
   first fish and a mature one shrugs off a mistake.
   ═══════════════════════════════════════════════════════════════════════════ */

const DAY_SECONDS = 90;            // one in-game day at 1× speed
/* One portion is 26 crumbs. A 3 cm tetra clears a day's worth in four of
   them, a 15 cm angelfish in two; a lionfish barely needs one. Anything
   still in the water after a few hours becomes detritus, and then ammonia. */
const FOOD_PER_PORTION = 26, FOOD_MASS = 0.011;
const foodValue = (p, f) => (0.17 + f.len * 0.014) * (p.mass / FOOD_MASS);
const SRC = { fw:{ ph:7.4, kh:0.55 }, sw:{ ph:8.25, kh:1.0 } };

function makeTank(tankId, water, opts = {}) {
  const t = TK[tankId];
  const T = {
    tankId, water, name: opts.name || t.name,
    litres: t.litres, gal: t.gal, dims: t.dims.slice(),
    temp: water === 'sw' ? 25 : 25, target: water === 'sw' ? 25 : 25,
    ph: SRC[water].ph, kh: SRC[water].kh,
    o2: 0.95,                       // fraction of saturation
    nh3: 0, no2: 0, no3: 2,         // mg/L
    bactA: opts.cycled ? 1 : 0.02,  // colony maturity, 0..1
    bactN: opts.cycled ? 1 : 0.01,
    organics: 0.05, detritus: 0, algae: 0.02,
    fish: [], plants: [], decor: [], upgrades: new Set(['filter1','light1']),
    food: [], flowUser: 0.35,
    day: 1, hour: 8, ageDays: 0,
    history: [], lastWaterChange: 0, processed: opts.cycled ? 12 : 0,
    heaterBroken: false, powerOut: 0, filterOff: 0,
    nextFishId: 1,
  };
  if (opts.upgrades) opts.upgrades.forEach(u => T.upgrades.add(u));
  if (opts.temp) { T.temp = T.target = opts.temp; }
  return T;
}

const has = (T, id) => T.upgrades.has(id);

function filterBact(T) {
  let b = 1;
  if (has(T, 'filter3')) b = UP.filter3.bact; else if (has(T, 'filter2')) b = UP.filter2.bact;
  if (T.filterOff > 0) b *= 0.25;            // media starves without flow
  return b;
}
function lightFixture(T) {
  if (has(T, 'light3')) return UP.light3.light;
  if (has(T, 'light2')) return UP.light2.light;
  return UP.light1.light;
}
function flowOf(T) {
  let f = T.flowUser;
  if (has(T, 'filter3')) f += 0.3; else if (has(T, 'filter2')) f += 0.18;
  if (has(T, 'wave')) f += UP.wave.flow;
  if (T.decor.some(d => d.id === 'bubbler')) f += 0.1;
  if (T.powerOut > 0) f = 0.02;
  return clamp(f, 0, 1.6);
}
/** Daylight 0..1 — the gallery lamp ramps up at 07:00 and down at 19:00. */
function daylight(T) {
  const h = T.hour;
  if (T.powerOut > 0) return 0;
  const up = smooth(6.2, 8.0, h), down = 1 - smooth(18.5, 20.5, h);
  return clamp(Math.min(up, down), 0, 1);
}
function lightLevel(T) { return lightFixture(T) * daylight(T); }

function bioloadTotal(T) {
  let b = 0;
  for (const f of T.fish) if (f.alive) b += f.sp.bioload * (0.35 + 0.65 * (f.len / f.sp.size));
  return b;
}
function bioCapacity(T) {
  return (T.litres / 14) * (0.5 + 0.5 * filterBact(T) / 2.2);
}
function metabolism(T) { return clamp(1 + 0.055 * (T.temp - 24), 0.45, 2.1); }

/** O2 saturation falls as water warms — the reason a heatwave kills a tank. */
function o2Sat(T) { return clamp(1.25 - 0.0165 * T.temp, 0.55, 1.05); }

function plantMass(T) {
  let up = 0, o2 = 0, appeal = 0, hides = 0;
  const L = lightLevel(T), co2 = has(T, 'co2') ? 1 + UP.co2.plant : 1;
  for (const p of T.plants) {
    const d = PL[p.id];
    const lit = clamp(L / Math.max(0.12, d.light), 0, 1.25);
    const vig = p.health * lit * co2;
    up += d.uptake * vig; o2 += d.o2 * vig * Math.max(0.06, L);
    appeal += d.appeal * p.health; hides += d.hides * p.health;
  }
  return { up, o2, appeal, hides };
}
function decorStats(T) {
  let appeal = 0, hides = 0, o2 = 0, ph = 0, host = false;
  for (const d of T.decor) {
    const def = DEC[d.id];
    appeal += def.appeal * (d.health ?? 1);
    hides += def.hides || 0; o2 += def.o2 || 0; ph += def.ph || 0;
    if (def.host && (d.health ?? 1) > 0.4) host = true;
  }
  return { appeal, hides, o2, ph, host };
}

/* ── one step of chemistry.  dt is in DAYS. ─────────────────────────────── */
function stepChem(T, dt) {
  const meta = metabolism(T);
  const L = lightLevel(T);
  const flow = flowOf(T);
  const plants = plantMass(T);
  const dec = decorStats(T);

  /* temperature ─ the heater pulls toward target, the room pulls toward 21 */
  const roomT = 21 + 1.6 * Math.sin((T.hour / 24) * TAU - 1.2);
  let heatRate = has(T, 'heater') ? 9 : 4.5;
  if (T.heaterBroken || T.powerOut > 0) heatRate = 0;
  const canCool = has(T, 'chiller') && T.powerOut <= 0;
  let drive = 0;
  if (T.temp < T.target) drive = heatRate * (T.target - T.temp);
  else if (T.temp > T.target && canCool) drive = -8 * (T.temp - T.target);
  T.temp += (drive + (roomT - T.temp) * 2.2) * dt;
  T.temp = clamp(T.temp, 4, 40);

  /* waste in ─────────────────────────────────────────────────────────────
     Every gram of protein a fish eats leaves as ammonia, and every flake it
     misses does the same a little later. This is the whole engine. */
  let nh3In = 0;
  for (const f of T.fish) {
    if (!f.alive) { nh3In += Math.min(1.5, 0.55 * f.sp.bioload); continue; }   // a corpse is a bomb
    nh3In += f.sp.bioload * (0.3 + 0.7 * f.len / f.sp.size) * meta * 0.26 * (0.35 + 0.65 * (1 - f.hunger));
  }
  T.detritus = Math.max(0, T.detritus);
  const detDecay = T.detritus * 0.55 * meta * dt;
  T.detritus -= detDecay;
  nh3In = nh3In * dt + detDecay * 0.8;
  nh3In += T.organics * 0.12 * dt;

  /* skimmer and water volume */
  if (has(T, 'skimmer') && T.water === 'sw' && T.powerOut <= 0) nh3In *= (1 - UP.skimmer.organics);
  const perL = 1000 / T.litres * 0.075;   // scale so a 20 gal reacts like a 20 gal
  T.nh3 += nh3In * perL;

  /* bacteria ─────────────────────────────────────────────────────────────
     Two colonies, each a maturity from 0 to 1 rather than a concentration.
     They grow whenever there is something to eat — which is why a fish-in
     cycle works at all — and fade slowly when there is not, which is why a
     tank left empty for a fortnight has to cycle again. Processing is a
     flat rate, so a mature filter really does hold both toxins at zero
     and an overstocked one really cannot, however long you wait. */
  const tRate = clamp(0.55 + 0.06 * (T.temp - 22), 0.2, 1.4);
  const cap = filterBact(T) * (1 + 0.12 * T.plants.length)
            * (0.62 / Math.max(0.5, Math.pow(T.litres / 220, 0.55)));
  const capA = cap * 3.4 * tRate, capN = cap * 2.4 * tRate;

  const dA = Math.min(T.nh3, capA * T.bactA * dt);
  T.nh3 -= dA; T.no2 += dA * 0.92;
  T.processed = (T.processed || 0) + dA;
  T.ageDays += dt;
  const dN = Math.min(T.no2, capN * T.bactN * dt);
  T.no2 -= dN; T.no3 += dN * 0.95;

  const grow = (b, food, rate) => {
    let d = food > 0.015 ? rate * (1.02 - b) : -0.055 * b;
    if (T.powerOut > 6 / 24) d -= 0.30;   // media goes anoxic without flow
    if (T.ph < 6.0) d -= 0.45;            // a crashed pH stalls the cycle
    return clamp(b + d * tRate * dt, 0.004, 1);
  };
  const invDt = 1 / Math.max(dt, 1e-9);
  T.bactA = grow(T.bactA, dA * invDt + T.nh3 * 12, 0.30);
  T.bactN = grow(T.bactN, dN * invDt + T.no2 * 12, 0.17);

  /* plants and algae both eat nitrogen; algae also eats your appeal */
  const uptake = plants.up * 0.30 * dt * (220 / Math.max(60, T.litres));
  const fromNh3 = Math.min(T.nh3, uptake * 0.35);
  T.nh3 -= fromNh3;
  T.no3 = Math.max(0, T.no3 - (uptake - fromNh3) * 1.5);

  let algaeGrow = L * (0.09 + 0.055 * clamp(T.no3 / 30, 0, 2)) * (1 + T.organics);
  algaeGrow *= (1 - 0.55 * clamp(plants.up / 3, 0, 1));      // plants outcompete algae
  if (has(T, 'uv') && T.powerOut <= 0) algaeGrow *= (1 - UP.uv.algae);
  let graze = 0;
  for (const f of T.fish) if (f.alive && f.sp.cleanup?.algae) graze += f.sp.cleanup.algae * (0.4 + 0.6 * f.len / f.sp.size);
  T.algae = clamp(T.algae + (algaeGrow - 0.55 * graze - 0.05) * dt, 0, 1);
  T.no3 = Math.max(0, T.no3 - T.algae * 0.8 * L * dt);

  /* oxygen ───────────────────────────────────────────────────────────────── */
  const sat = o2Sat(T);
  let o2In = (sat - T.o2) * (1.4 + flow * 2.6 + dec.o2) * dt;
  o2In += plants.o2 * 0.06 * dt;
  const perVol = 220 / Math.max(60, T.litres);
  let o2Out = (bioloadTotal(T) * 0.020 * meta * perVol + T.detritus * 0.02 + T.algae * 0.05 * (1 - L) + 0.02) * dt;
  o2Out += (T.bactA + T.bactN) * 0.012 * dt;
  T.o2 = clamp(T.o2 + o2In - o2Out, 0, 1.1);

  /* pH ───────────────────────────────────────────────────────────────────── */
  const src = SRC[T.water];
  const acid = (T.no3 * 0.0032 + T.organics * 0.4 + (has(T, 'co2') ? 0.22 : 0)) * (1 - L * 0.25);
  const buffer = src.kh * (T.water === 'sw' ? 2.4 : 1.0) + (T.decor.some(d => d.id === 'rockpile') ? 0.2 : 0);
  T.ph += (((src.ph + dec.ph - acid / Math.max(0.25, buffer)) - T.ph) * 1.1) * dt;
  T.ph = clamp(T.ph, 4.5, 9.2);

  T.organics = clamp(T.organics + (bioloadTotal(T) * 0.004 * dt) - T.organics * (has(T, 'skimmer') ? 1.4 : 0.5) * dt, 0, 2);

  /* plants take damage from the same things fish do */
  for (const p of T.plants) {
    const d = PL[p.id];
    const lit = clamp(L / Math.max(0.12, d.light), 0, 1.3);
    let dh = (lit - 0.55) * 0.5;
    if (T.no3 > 60) dh -= 0.25;
    if (T.algae > 0.55) dh -= 0.4 * (T.algae - 0.55);
    p.health = clamp(p.health + dh * dt, 0, 1);
  }
  for (const d of T.decor) {
    if (!DEC[d.id].living) continue;
    const need = DEC[d.id].light || 0.6;
    let dh = (clamp(L / need, 0, 1.2) - 0.6) * 0.45;
    if (T.nh3 > 0.25 || T.no2 > 0.25) dh -= 0.6;
    if (T.no3 > 35) dh -= 0.2;
    if (T.water === 'sw' && Math.abs(T.temp - 25.5) > 3) dh -= 0.3;
    d.health = clamp((d.health ?? 1) + dh * dt, 0, 1);
  }
}

/** A tank is cycled when its bacteria have processed a meaningful amount of
    ammonia AND both toxins now read zero. A brand-new tank can read zero
    simply because nothing has happened in it yet; this cannot. */
function isCycled(T) {
  return (T.processed || 0) > 4.5 && T.nh3 < 0.05 && T.no2 < 0.05;
}

/* ── how bad is the water, per fish ──────────────────────────────────────── */
function stressOf(T, f) {
  const sp = f.sp;
  let s = 0;
  const tol = 0.25 + sp.hardy * 0.9;
  s += clamp((T.nh3 - 0.03) * 3.0, 0, 2.6) / tol;
  s += clamp((T.no2 - 0.03) * 2.6, 0, 2.4) / tol;
  s += clamp((T.no3 - 30) / 60, 0, 1.6) / tol;
  s += clamp((0.72 - T.o2) * 4.0, 0, 2.6) / tol;
  const tLo = sp.temp[0], tHi = sp.temp[1];
  if (T.temp < tLo) s += (tLo - T.temp) * 0.34 / tol;
  if (T.temp > tHi) s += (T.temp - tHi) * 0.42 / tol;
  const pLo = sp.ph[0], pHi = sp.ph[1];
  if (T.ph < pLo) s += (pLo - T.ph) * 0.85 / tol;
  if (T.ph > pHi) s += (T.ph - pHi) * 0.7 / tol;
  if (f.hunger > 0.72) s += (f.hunger - 0.72) * 3.4;
  if (f.finDamage > 0.2) s += f.finDamage * 0.8;
  if (f.sick > 0) s += f.sick * 1.4;
  /* company: a schooling fish alone is a stressed fish */
  if (sp.school > 1) {
    const n = T.fish.filter(x => x.alive && x.sp.id === sp.id).length;
    if (n < sp.school) s += (sp.school - n) / sp.school * 1.3;
  }
  /* overcrowding */
  const load = bioloadTotal(T) / bioCapacity(T);
  if (load > 1) s += clamp((load - 1) * 0.85, 0, 2.2);
  /* flow */
  const fl = flowOf(T);
  const want = sp.flow === 'low' ? 0.35 : sp.flow === 'med' ? 0.7 : 1.1;
  s += Math.max(0, fl - want - 0.3) * (sp.fragile ? 4.5 : 1.1);
  if (T.algae > 0.7) s += (T.algae - 0.7) * 1.2;
  return s;
}

/* ── one step of biology.  dt is in DAYS. ────────────────────────────────── */
function stepBiology(T, dt, G) {
  const meta = metabolism(T);
  const shrimpCare = T.fish.filter(f => f.alive && f.sp.medic).length;
  const diseaseGuard = (1 / (1 + shrimpCare * 0.85)) * (has(T, 'uv') && T.powerOut <= 0 ? 1 - UP.uv.disease : 1);
  let died = [], born = [];

  for (const f of T.fish) {
    if (!f.alive) { f.corpse += dt; continue; }
    const sp = f.sp;

    /* hunger climbs with metabolism; a fat predator can coast for days */
    const burn = (sp.diet === 'meaty' ? 0.42 : 0.85) * meta * (0.6 + 0.4 * sp.activity);
    f.hunger = clamp(f.hunger + burn * dt, 0, 1.4);

    /* grazers feed themselves off the tank */
    if (sp.cleanup) {
      const graze = Math.min(1, T.detritus * 0.6 + T.algae * (sp.cleanup.algae || 0));
      f.hunger = clamp(f.hunger - graze * 0.8 * dt, 0, 1.4);
      T.detritus = Math.max(0, T.detritus - (sp.cleanup.detritus || 0) * 0.55 * dt);
    }

    const s = stressOf(T, f);
    f.stress = lerp(f.stress, clamp(s / 4, 0, 1.6), clamp(dt * 3, 0, 1));

    /* disease — stress is the door, the pathogen is always at it */
    if (f.sick <= 0) {
      const p = (0.004 + f.stress * 0.10) * diseaseGuard * dt;
      if (rnd() < p && !(has(T, 'quar') && f.ageDays < 3)) {
        f.sick = 0.18;
        G.alert('bad', 'Disease', `<b>${sp.name}</b> is showing white spots. Ich spreads fast in a stressed tank.`);
        G.discover('ich');
      }
    } else {
      /* a fish in good water throws it off; a stressed one does not */
      const trend = f.medicated > 0 ? -1.6 : (0.75 * f.stress - 0.30);
      f.sick = clamp(f.sick + trend * dt, 0, 1.5);
      if (rnd() < 0.22 * diseaseGuard * dt && f.sick > 0.25) {
        const other = T.fish.filter(x => x.alive && x.sick <= 0 && x !== f);
        if (other.length) other[Math.floor(rnd() * other.length)].sick = 0.12;
      }
    }
    if (f.medicated > 0) f.medicated -= dt;

    /* health */
    let dh = 0;
    if (s < 1.4) dh += (1.30 - s) * 0.45;
    dh -= Math.min(0.85, Math.max(0, s - 1.2) * 0.20);
    if (f.hunger > 0.95) dh -= (f.hunger - 0.95) * 2.6;
    dh -= f.sick * 0.30;
    if (T.nh3 > 1.5) dh -= (T.nh3 - 1.5) * 0.5;
    if (T.o2 < 0.40) dh -= (0.40 - T.o2) * 2.4;
    f.health = clamp(f.health + dh * dt, 0, 1);

    /* fins heal slowly in clean water */
    if (f.finDamage > 0) f.finDamage = clamp(f.finDamage - (s < 0.5 ? 0.22 : 0.04) * dt, 0, 1);

    /* growth */
    if (f.len < sp.size) {
      f.len = Math.min(sp.size, f.len + sp.growth * dt * (0.35 + 0.65 * f.health) * (f.hunger < 0.85 ? 1 : 0.2));
    }
    f.ageDays += dt;
    if (f.ageDays > sp.lifespan * 0.8) f.health -= (f.ageDays - sp.lifespan * 0.8) / (sp.lifespan * 0.2) * 0.18 * dt;

    if (f.health <= 0) { f.alive = false; f.corpse = 0; died.push(f); continue; }

    /* breeding — only in genuinely good conditions, which is the point of
       Conservation mode and a nice surprise everywhere else */
    if (sp.school > 1 && f.len > sp.size * 0.8 && f.health > 0.88 && s < 0.35 && f.hunger < 0.5) {
      const mates = T.fish.filter(x => x.alive && x.sp.id === sp.id && x.len > sp.size * 0.75).length;
      const crowd = bioloadTotal(T) / bioCapacity(T);
      if (mates >= 2 && crowd < 0.8 && rnd() < 0.055 * dt * (sp.endangered ? 0.55 : 1)) born.push(sp);
    }
  }

  for (const f of died) {
    G.alert('bad', 'Loss', `<b>${f.sp.name}</b> has died. ${deathReason(T, f)}`);
    G.onDeath(f, T);
  }
  for (const sp of born) {
    if (T.fish.filter(x => x.alive).length < 90) {
      const baby = addFishRaw(T, sp.id, { len: sp.size * 0.28, fry: true });
      G.alert('good', 'Fry', `Your <b>${sp.name}</b> have bred. A fry is hiding in the planting.`);
      G.onBirth(sp, T);
      G.discover('breeding');
    }
  }

  /* corpses: they rot, and rotting is how one death becomes five */
  for (let i = T.fish.length - 1; i >= 0; i--) {
    const f = T.fish[i];
    if (!f.alive && f.corpse > 0.9) { T.detritus += f.sp.bioload * 0.5; T.fish.splice(i, 1); }
  }

  /* uneaten food turns into the problem */
  for (let i = T.food.length - 1; i >= 0; i--) {
    const p = T.food[i];
    p.age += dt;
    if (p.age > 0.45) { T.detritus += p.mass * FD[p.type].waste; T.food.splice(i, 1); }
  }
}

function deathReason(T, f) {
  if (f.killedBy) return f.killedBy;
  if (f.hunger > 0.95) return 'It starved.';
  if (T.nh3 > 0.5) return 'Ammonia burns.';
  if (T.no2 > 0.5) return 'Nitrite poisoning.';
  if (T.o2 < 0.5) return 'Suffocation — the oxygen was gone.';
  if (f.sick > 0.5) return 'The disease took it.';
  const sp = f.sp;
  if (T.temp < sp.temp[0] - 1) return 'The water was too cold for it.';
  if (T.temp > sp.temp[1] + 1) return 'The water was too warm for it.';
  if (T.ph < sp.ph[0] - 0.4 || T.ph > sp.ph[1] + 0.4) return 'The pH was wrong for it.';
  if (f.ageDays > sp.lifespan * 0.8) return 'Old age. It had a good run.';
  return 'Chronic stress.';
}

function addFishRaw(T, spId, opts = {}) {
  const sp = SP[spId];
  const f = {
    id: T.nextFishId++, sp, len: opts.len ?? sp.size * (0.42 + rnd() * 0.2),
    age: 0, ageDays: opts.fry ? 0 : rr(10, 60), health: 1, hunger: rr(0.25, 0.5), stress: 0,
    sick: 0, medicated: 0, finDamage: 0, alive: true, corpse: 0, fry: !!opts.fry,
    tint: 0.82 + rnd() * 0.36, phase: rnd() * TAU, hostDecor: null, killedBy: null,
    zoneBias: rr(-0.22, 0.22),
    /* motion state, filled by the renderer */
    pos: new THREE.Vector3(), vel: new THREE.Vector3(), up: new THREE.Vector3(0, 1, 0),
    target: new THREE.Vector3(), mood: 'cruise', moodT: 0, chase: null, homeSet: false,
    home: new THREE.Vector3(), speedMul: 0.85 + rnd() * 0.3, bank: 0, flash: 0, eaten: 0,
  };
  T.fish.push(f);
  return f;
}

/* ── the two headline numbers ────────────────────────────────────────────── */
function ecosystemHealth(T) {
  let score = 100;
  score -= clamp(T.nh3 * 42, 0, 40);
  score -= clamp(T.no2 * 38, 0, 32);
  score -= clamp((T.no3 - 25) * 0.55, 0, 22);
  score -= clamp((0.8 - T.o2) * 110, 0, 34);
  score -= clamp((T.algae - 0.25) * 48, 0, 18);
  const live = T.fish.filter(f => f.alive);
  if (live.length) {
    let hSum = 0, sSum = 0, sick = 0;
    for (const f of live) { hSum += f.health; sSum += f.stress; if (f.sick > 0) sick++; }
    score -= (1 - hSum / live.length) * 42;
    score -= clamp(sSum / live.length, 0, 1.4) * 22;
    score -= sick / live.length * 20;
  }
  const load = bioloadTotal(T) / bioCapacity(T);
  if (load > 1) score -= (load - 1) * 28;
  score -= T.fish.filter(f => !f.alive).length * 7;
  score -= clamp(T.detritus * 6, 0, 14);
  return clamp(score, 0, 100);
}

function crowdAppeal(T, night) {
  const live = T.fish.filter(f => f.alive);
  let base = 0, drama = 0, rarest = 0;
  const counts = {};
  for (const f of live) counts[f.sp.id] = (counts[f.sp.id] || 0) + 1;
  for (const f of live) {
    const sp = f.sp;
    const grown = 0.45 + 0.55 * clamp(f.len / sp.size, 0, 1);
    const cond = 0.25 + 0.75 * f.health * (1 - f.finDamage * 0.55) * (f.sick > 0 ? 0.55 : 1);
    let a = sp.appeal * grown * cond * (0.6 + 0.4 * sp.activity);
    if (sp.school > 1 && counts[sp.id] >= sp.school) a *= 1.28;           // a school reads as one animal
    if (sp.glow > 0.3) a *= night ? 2.1 : 0.78;                            // the bioluminescence bargain
    if (sp.id === 'clown' && decorStats(T).host) a *= 1.45;
    if (f.hostDecor) a *= 1.1;
    base += a;
    drama += sp.drama * cond;
    rarest = Math.max(rarest, sp.rarity);
  }
  const speciesCount = Object.keys(counts).length;
  const variety = 1 + clamp(speciesCount - 1, 0, 9) * 0.045;
  const pm = plantMass(T), dm = decorStats(T);
  let scape = pm.appeal * 1.15 + dm.appeal * 1.25;
  let lightBonus = has(T, 'light3') ? UP.light3.appeal : has(T, 'light2') ? UP.light2.appeal : 0;
  /* a predator with something to hunt is the best show in the building */
  const hasPred = live.some(f => f.sp.behaviour === 'predator');
  const hasPrey = live.some(f => f.len < 12 && f.sp.behaviour !== 'predator');
  const tension = hasPred && hasPrey ? 1.14 : 1;
  const clean = clamp(1 - (T.algae - 0.3) * 0.9, 0.45, 1) * clamp(1 - T.detritus * 0.12, 0.5, 1);
  const dead = T.fish.filter(f => !f.alive).length;
  const total = (base + drama * 1.6 + scape + lightBonus + rarest * 3) * variety * tension * clean;
  return Math.max(0, total - dead * 12);
}

/* ── compatibility preview ───────────────────────────────────────────────
   One colour and one line. The line is always the *worst* thing true about
   the placement, because that is the thing that will actually happen. */
function evaluatePlacement(T, spId, count = 1) {
  const sp = SP[spId];
  const live = T.fish.filter(f => f.alive);
  const out = [];
  const add = (lvl, why, rel) => out.push({ lvl, why, rel });

  if (sp.water !== T.water)
    add(3, `${sp.name} is ${sp.water === 'sw' ? 'a marine' : 'a freshwater'} fish and this is ${T.water === 'sw' ? 'saltwater' : 'freshwater'}.`);

  /* room to swim */
  const lenCm = T.dims[0] * 10;
  if (sp.size * 4.5 > lenCm) add(3, `${sp.name} reaches ${sp.size} cm — this tank is too short for it to turn around.`);
  else if (sp.size * 7 > lenCm) add(2, `${sp.name} will outgrow the swimming room here.`);

  /* bioload */
  const capLeft = bioCapacity(T) - bioloadTotal(T);
  const adding = sp.bioload * count;
  if (adding > capLeft + 0.05) add(3, `This would overload the filter — ${sp.name} needs more biological capacity than you have left.`);
  else if (adding > capLeft * 0.72) add(2, `This takes the tank close to its filtration limit.`);

  /* school size */
  const already = live.filter(f => f.sp.id === spId).length;
  if (sp.school > 1 && already + count < sp.school)
    add(2, `${sp.name} needs a group of at least ${sp.school} — ${already + count} will be a nervous, dull fish.`);

  /* temperature and pH against everything already living here */
  for (const f of live) {
    const o = f.sp;
    if (o.id === spId) continue;
    const loT = Math.max(sp.temp[0], o.temp[0]), hiT = Math.min(sp.temp[1], o.temp[1]);
    if (loT > hiT) add(3, `${sp.name} wants ${sp.temp[0]}–${sp.temp[1]} °C and your ${o.name} wants ${o.temp[0]}–${o.temp[1]} °C. One of them will be wrong.`);
    else if (hiT - loT < 1.5) add(2, `${sp.name} and your ${o.name} only overlap over about a degree of temperature.`);
    const loP = Math.max(sp.ph[0], o.ph[0]), hiP = Math.min(sp.ph[1], o.ph[1]);
    if (loP > hiP) add(2, `${sp.name} and your ${o.name} want different water chemistry.`);
  }
  if (T.temp < sp.temp[0] - 0.5) add(2, `The tank is running at ${T.temp.toFixed(1)} °C; ${sp.name} wants at least ${sp.temp[0]} °C.`);
  if (T.temp > sp.temp[1] + 0.5) add(2, `The tank is running at ${T.temp.toFixed(1)} °C; ${sp.name} tops out at ${sp.temp[1]} °C.`);

  /* cycling — the mistake every real keeper makes once */
  if (T.bactA < 0.4 && live.length > 0) add(2, 'This tank has not finished cycling. Anything you add now is breathing its own ammonia.');
  else if (T.bactA < 0.25 && live.length === 0) add(1, 'A brand-new tank. Start with one hardy species and let the bacteria catch up.');
  if (T.nh3 > 0.25 || T.no2 > 0.25) add(3, `There is ${T.nh3 > T.no2 ? 'ammonia' : 'nitrite'} in this water right now. Nothing new should go in until it reads zero.`);

  /* predation, both directions */
  for (const f of live) {
    if (f.sp.id === 'lion' && sp.size < 12) add(3, `Your lionfish will eat ${sp.name}. Not "might".`, 'lion-small');
    if (spId === 'lion' && f.len < 12) add(3, `A lionfish will work through your ${f.sp.name} within a week.`, 'lion-small');
    if (f.sp.id === 'angel' && spId === 'neon') add(f.len >= 9 ? 3 : 2, f.len >= 9
      ? 'Your angelfish is big enough to eat neon tetras.'
      : 'Your angelfish is still small — but it will be eating neons within a month.', 'angel-neon');
    if (spId === 'angel' && f.sp.id === 'neon') add(2, 'Angelfish start harmless and end up eating neon tetras. Decide now which fish this tank is for.', 'angel-neon');
    if (f.sp.id === 'puffer' && (spId === 'snail' || spId === 'shrimp')) add(3, `Your pea puffer eats ${sp.name.toLowerCase()}s. That is what the beak is for.`, 'puffer-snail');
    if (spId === 'puffer' && (f.sp.id === 'snail' || f.sp.id === 'shrimp')) add(3, `A pea puffer will hunt your ${f.sp.name.toLowerCase()}.`, 'puffer-snail');
    if (f.sp.id === 'betta' && sp.body.veil >= 0.55) add(3, `Your betta will shred ${sp.name}'s fins.`, 'betta-veil');
    if (spId === 'betta' && f.sp.body.veil >= 0.55) add(3, `A betta will shred your ${f.sp.name}'s fins.`, 'betta-veil');
    if (f.sp.id === 'betta' && spId === 'betta') add(3, 'Two bettas in one tank is one betta, eventually.', 'betta-betta');
    if (f.sp.id === 'barb' && sp.body.veil >= 0.55 && live.filter(x => x.sp.id === 'barb').length < 6)
      add(2, `Tiger barbs under a school of six nip long fins, and ${sp.name} has them.`, 'barb-veil');
    if (spId === 'barb' && f.sp.body.veil >= 0.55 && count + live.filter(x => x.sp.id === 'barb').length < 6)
      add(2, `Fewer than six tiger barbs will turn on your ${f.sp.name}'s fins.`, 'barb-veil');
  }

  /* the specialists */
  if (spId === 'seahorse') {
    const fast = live.filter(f => f.sp.activity > 0.55).length;
    if (fast >= 2) add(3, `Seahorses feed slowly. Your ${fast} quick fish will clear every meal before it starts.`, 'seahorse-comp');
    else if (fast >= 1) add(2, 'Seahorses feed slowly and are easily outcompeted at dinner.', 'seahorse-comp');
    if (flowOf(T) > 0.55) add(2, 'Seahorses need calm water — this tank has too much flow.');
  }
  if (live.some(f => f.sp.id === 'seahorse') && sp.activity > 0.55)
    add(2, `${sp.name} feeds fast enough to starve your seahorses.`, 'seahorse-comp');
  if (spId === 'jelly') {
    if (flowOf(T) > 0.45) add(3, 'Moon jellies are torn apart by this much flow. Lose the wavemaker first.', 'jelly-flow');
    if (live.some(f => f.sp.temper !== 'peaceful')) add(3, 'Anything with a mouth will damage a moon jelly.');
    if (T.no3 > 12) add(2, 'Jellies want water cleaner than this.');
  }
  if (spId === 'discus') {
    if (T.no3 > 20) add(2, 'Discus want nitrate under 20 mg/L. Yours is higher.');
    if (live.some(f => f.sp.temper === 'semi' || f.sp.temper === 'aggressive')) add(2, 'Discus are shy and will not feed properly with pushy tankmates.', 'discus-temp');
  }
  if (spId === 'goldfish' || live.some(f => f.sp.id === 'goldfish')) {
    if (spId !== 'goldfish' && sp.temp[0] > 23) add(2, 'Goldfish want cool water; your tropical fish do not.', 'goldfish-dirty');
    if (spId === 'goldfish' && T.plants.length) add(1, 'Goldfish will uproot and eat your planting.', 'goldfish-plants');
  }
  if (spId === 'clown' && decorStats(T).host) add(0, 'Your anemone is waiting. A hosted clownfish is worth half again as much appeal.', 'clown-anem');
  if (spId === 'shrimp') add(0, 'A cleaner shrimp runs a clinic — it will hold disease down across the whole tank.', 'shrimp-clinic');
  if (spId === 'flashlight' && !live.some(f => f.sp.id === 'flashlight')) add(0, 'Flashlight fish earn their keep after dark. Under a bright lamp you cannot see the lamp.', 'flashlight-dark');

  /* aggression on arrival */
  if (sp.temper === 'aggressive' && live.some(f => f.sp.temper === 'peaceful' && f.sp.size < sp.size * 1.4))
    add(2, `${sp.name} is aggressive and most of this tank is smaller than it.`);
  if (sp.behaviour === 'territorial' && live.filter(f => f.sp.behaviour === 'territorial').length >= 1 && T.decor.length < 2)
    add(2, 'Two territorial fish and nothing to break the sight lines between them.');

  out.sort((a, b) => b.lvl - a.lvl);
  const worst = out[0];
  if (!worst) return { lvl: 0, level: 'g', why: `${sp.name} is a clean fit for this tank.`, all: out };
  return {
    lvl: worst.lvl,
    level: worst.lvl >= 3 ? 'r' : worst.lvl === 2 ? 'a' : 'g',
    why: worst.why, rel: worst.rel, all: out,
  };
}

/* ═══════════════════════════════════════════════════════════════════════════
   3. BUILDING A FISH OUT OF NOTHING
   No models, no textures. Each species is a silhouette function plus a
   pattern function. Geometry is built once per species with extra vertex
   attributes the shader uses to swim it:
     aSeg   0 at the snout, 1 at the tail tip  → body wave amplitude
     aFin   which moving part this vertex is   → per-fin animation
     aPivot the hinge that part rotates about
     aGlow  bioluminescence, added to emissive at night
   ═══════════════════════════════════════════════════════════════════════════ */

const FIN = { BODY:0, PECT_L:1, PECT_R:2, CAUDAL:3, DORSAL:4, RIGID:5, TENT:6 };

function hash2(x, y) {
  let n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453;
  return n - Math.floor(n);
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}

/** Silhouette: half-height and half-width at body fraction t (0 snout → 1 tail). */
function profile(prof, t) {
  t = clamp(t, 0, 1);
  let y, z;
  switch (prof) {
    case 'disc': {
      const c = clamp((t - 0.40) / 0.52, -1.6, 1.6);
      y = Math.sqrt(Math.max(0, 1 - c * c)) * 1.0;
      y = Math.max(y, 0.06);
      const ped = 1 - smooth(0.72, 1.0, t) * 0.88;
      y *= ped; z = (0.45 + 0.55 * y) * ped;
      break;
    }
    case 'round': {
      const c = clamp((t - 0.42) / 0.5, -1.6, 1.6);
      y = Math.pow(Math.max(0, 1 - c * c), 0.42);
      const ped = 1 - smooth(0.70, 1.0, t) * 0.8;
      y *= ped; z = Math.pow(y, 0.85);
      break;
    }
    case 'boxy': {
      y = Math.pow(Math.sin(Math.PI * Math.pow(t, 0.7)), 0.42);
      const ped = 1 - smooth(0.68, 1.0, t) * 0.76;
      y *= ped; z = Math.pow(y, 0.6);
      break;
    }
    case 'eel': {
      y = Math.pow(Math.sin(Math.PI * Math.pow(clamp(t * 0.92 + 0.04, 0, 1), 0.5)), 0.3);
      z = y; break;
    }
    default: { // torpedo
      y = Math.pow(Math.sin(Math.PI * Math.pow(t, 0.84)), 0.58);
      const ped = 1 - smooth(0.74, 1.0, t) * 0.82;
      y *= ped; z = Math.pow(y, 0.92);
    }
  }
  return [Math.max(y, 0.012), Math.max(z, 0.010)];
}

/** Belly line — where the body centre sits at t, so a fish is not a tube. */
function bellyOffset(prof, t) {
  if (prof === 'boxy') return -0.10 * Math.pow(Math.sin(Math.PI * t), 0.6);
  if (prof === 'round') return -0.06 * Math.sin(Math.PI * t);
  return -0.03 * Math.sin(Math.PI * t);
}

/* ── colour patterns ─────────────────────────────────────────────────────── */
const _c = new THREE.Color(), _c2 = new THREE.Color();
function patternAt(sp, t, ny, nz, isFin) {
  const p = sp.pal;
  const body = _c.setHex(p.body), belly = _c2.setHex(p.belly);
  let r = body.r, g = body.g, b = body.b, glow = 0;
  const blend = (hex, k) => { const q = _c2.setHex(hex); r = lerp(r, q.r, k); g = lerp(g, q.g, k); b = lerp(b, q.b, k); };

  /* countershading — dark back, pale belly. Every fish gets this. */
  const bk = clamp((0.55 - ny) * 1.1, 0, 1);
  r = lerp(r, belly.r, bk * 0.85); g = lerp(g, belly.g, bk * 0.85); b = lerp(b, belly.b, bk * 0.85);
  const top = clamp((ny - 0.35) * 1.3, 0, 1);
  r *= (1 - top * 0.34); g *= (1 - top * 0.32); b *= (1 - top * 0.26);
  if (isFin) blend(p.fin, 0.72);

  switch (p.pattern) {
    case 'neonstripe': {
      if (!isFin) {
        const band = Math.exp(-Math.pow((ny - 0.60) / 0.14, 2));
        blend(p.accent, band * 0.96 * smooth(0.02, 0.22, t));
        glow += band * 0.55 * smooth(0.02, 0.2, t);
        const red = Math.exp(-Math.pow((ny - 0.34) / 0.16, 2)) * smooth(0.40, 0.60, t) * (1 - smooth(0.92, 1.0, t));
        blend(p.accent2, red * 0.95);
        glow += red * 0.25;
      }
      break;
    }
    case 'bars': {
      const n = sp.id === 'barb' ? 4 : 5;
      let bar = 0;
      for (let i = 0; i < n; i++) {
        const c = 0.10 + i * (0.78 / (n - 1));
        bar = Math.max(bar, Math.exp(-Math.pow((t - c) / 0.055, 2)));
      }
      blend(p.accent, bar * (isFin ? 0.55 : 0.9));
      if (sp.id === 'barb' && !isFin) blend(p.accent2, clamp((ny - 0.6) * 1.6, 0, 1) * 0.4);
      break;
    }
    case 'clown': {
      let band = 0;
      band = Math.max(band, Math.exp(-Math.pow((t - 0.17) / 0.055, 2)));
      band = Math.max(band, Math.exp(-Math.pow((t - 0.46) / 0.075, 2)));
      band = Math.max(band, Math.exp(-Math.pow((t - 0.80) / 0.05, 2)));
      const edge = clamp((band - 0.25) * 3.4, 0, 1);
      blend(p.accent2, clamp((band - 0.05) * 1.6, 0, 1) * 0.85);   // black outline
      blend(p.accent, edge * 0.98);                                 // white band
      if (isFin) blend(p.accent2, clamp((Math.abs(nz) - 0.55) * 2.4, 0, 1) * 0.7);
      break;
    }
    case 'lionbars': {
      let bar = 0;
      for (let i = 0; i < 9; i++) bar = Math.max(bar, Math.exp(-Math.pow((t - (0.05 + i * 0.10)) / 0.030, 2)));
      blend(p.accent, bar * 0.92);
      if (isFin) {
        const strip = Math.abs(Math.sin((t * 5.5 + ny * 7.5) * 3.1));
        blend(p.accent, clamp(strip - 0.28, 0, 1) * 1.5);
        blend(p.accent2, clamp(0.25 - strip, 0, 1) * 1.2);
      }
      break;
    }
    case 'speckle': {
      const s = vnoise(t * 26, ny * 22 + nz * 9);
      blend(p.accent, clamp((s - 0.62) * 3.2, 0, 1) * 0.85);
      blend(p.accent2, clamp((0.3 - s) * 2.0, 0, 1) * 0.3);
      break;
    }
    case 'mottle': {
      const s = vnoise(t * 7 + 3, ny * 6);
      blend(p.accent, clamp((s - 0.5) * 2.4, 0, 1) * 0.8);
      blend(p.accent2, clamp((0.46 - s) * 2.6, 0, 1) * 0.7);
      if (isFin) blend(p.accent, clamp((vnoise(t * 9, ny * 9) - 0.4) * 2, 0, 1) * 0.6);
      break;
    }
    case 'gradient': {
      blend(p.accent, clamp((t - 0.35) * 1.5, 0, 1) * 0.75);
      blend(p.accent2, clamp((0.4 - t) * 1.4, 0, 1) * 0.45);
      break;
    }
    case 'discus': {
      let bar = 0;
      for (let i = 0; i < 8; i++) bar = Math.max(bar, Math.exp(-Math.pow((t - (0.06 + i * 0.115)) / 0.028, 2)));
      blend(p.accent2, bar * 0.55);
      const wave = Math.sin(ny * 22 + t * 9) * 0.5 + 0.5;
      blend(p.accent, clamp(wave - 0.55, 0, 1) * (isFin ? 1.5 : 0.75));
      blend(p.belly, clamp((0.34 - ny) * 2.0, 0, 1) * 0.5);
      break;
    }
    case 'rings': {
      const ring = Math.abs(Math.sin(t * 30)) ;
      blend(p.accent, clamp(ring - 0.62, 0, 1) * 1.8);
      blend(p.accent2, clamp((vnoise(t * 14, ny * 10) - 0.55) * 3, 0, 1) * 0.5);
      break;
    }
    case 'lamp': {
      blend(p.accent2, 0.45);
      const lampT = Math.exp(-Math.pow((t - 0.135) / 0.085, 2)) * Math.exp(-Math.pow((ny - 0.56) / 0.17, 2));
      blend(p.accent, Math.min(1, lampT * 1.4));
      glow += lampT * 3.2;
      const line = Math.exp(-Math.pow((ny - 0.5) / 0.05, 2)) * smooth(0.2, 0.5, t);
      blend(p.accent, line * 0.3); glow += line * 0.35;
      break;
    }
    case 'spiral': {
      const s = Math.sin(t * 26 + ny * 4);
      blend(p.accent, clamp(s - 0.3, 0, 1) * 1.1);
      blend(p.accent2, clamp(-s - 0.5, 0, 1) * 0.6);
      break;
    }
    case 'stripe': {
      const line = Math.exp(-Math.pow((ny - 0.86) / 0.10, 2));
      blend(p.accent, line * 0.95);
      const side = Math.exp(-Math.pow((ny - 0.2) / 0.12, 2));
      blend(p.accent2, side * 0.5);
      break;
    }
    case 'jelly': {
      blend(p.accent, clamp((0.5 - ny) * 1.2, 0, 1) * 0.7);
      glow += 0.55 + 0.5 * clamp(1 - ny, 0, 1);
      blend(p.accent2, clamp(vnoise(t * 8, ny * 8) - 0.45, 0, 1) * 0.9);
      break;
    }
  }
  glow += sp.glow * 0.22;
  return [r, g, b, glow];
}

/* ── geometry assembly ───────────────────────────────────────────────────── */
class GeoBuf {
  constructor() { this.p = []; this.c = []; this.s = []; this.f = []; this.pv = []; this.gl = []; this.i = []; }
  vert(x, y, z, col, seg, fin, pv) {
    this.p.push(x, y, z); this.c.push(col[0], col[1], col[2]);
    this.s.push(seg); this.f.push(fin); this.gl.push(col[3]);
    this.pv.push(pv[0], pv[1], pv[2]);
    return this.p.length / 3 - 1;
  }
  quad(a, b, c, d) { this.i.push(a, b, c, a, c, d); }
  tri(a, b, c) { this.i.push(a, b, c); }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('color',    new THREE.Float32BufferAttribute(this.c, 3));
    g.setAttribute('aSeg',     new THREE.Float32BufferAttribute(this.s, 1));
    g.setAttribute('aFin',     new THREE.Float32BufferAttribute(this.f, 1));
    g.setAttribute('aGlow',    new THREE.Float32BufferAttribute(this.gl, 1));
    g.setAttribute('aPivot',   new THREE.Float32BufferAttribute(this.pv, 3));
    g.setIndex(this.i);
    g.computeVertexNormals();
    g.computeBoundingSphere();
    return g;
  }
}
const Z3 = [0, 0, 0];

function buildFishGeometry(sp) {
  if (sp.shape === 'jelly')    return buildJelly(sp);
  if (sp.shape === 'snail')    return buildSnail(sp);
  if (sp.shape === 'shrimp')   return buildShrimp(sp);
  if (sp.shape === 'seahorse') return buildSeahorse(sp);

  const B = sp.body, G = new GeoBuf();
  const RINGS = 26, SEGS = 14;
  const hh = B.h * 0.5, hw = B.w * 0.5;

  /* ── body ─────────────────────────────────────────────────────────────── */
  const ringIdx = [];
  for (let i = 0; i < RINGS; i++) {
    const t = i / (RINGS - 1);
    const [py, pz] = profile(B.prof, t);
    const ry = py * hh, rz = pz * hw, cy = bellyOffset(B.prof, t) * B.h;
    const x = 0.5 - t;
    const row = [];
    for (let j = 0; j < SEGS; j++) {
      const a = (j / SEGS) * TAU;
      let sy = Math.sin(a), sz = Math.cos(a);
      /* slight keel: fish are not ellipses, the belly is fuller than the back */
      const keel = 1 + 0.14 * Math.max(0, -sy);
      const y = cy + sy * ry * keel, z = sz * rz;
      const ny = clamp((y - (cy - ry)) / Math.max(1e-4, 2 * ry), 0, 1);
      const col = patternAt(sp, t, ny, sz, false);
      row.push(G.vert(x, y, z, col, t, FIN.BODY, Z3));
    }
    ringIdx.push(row);
  }
  for (let i = 0; i < RINGS - 1; i++)
    for (let j = 0; j < SEGS; j++) {
      const j2 = (j + 1) % SEGS;
      G.quad(ringIdx[i][j], ringIdx[i][j2], ringIdx[i + 1][j2], ringIdx[i + 1][j]);
    }
  /* cap the snout so it is not an open pipe */
  const snout = G.vert(0.52, bellyOffset(B.prof, 0) * B.h, 0, patternAt(sp, 0, 0.5, 0, false), 0, FIN.BODY, Z3);
  for (let j = 0; j < SEGS; j++) G.tri(snout, ringIdx[0][(j + 1) % SEGS], ringIdx[0][j]);

  /* ── a flat ribbon of fin, given a point function ─────────────────────── */
  function ribbon(nu, nv, fn, finId, pivot, segFn) {
    const grid = [];
    for (let iu = 0; iu <= nu; iu++) {
      const u = iu / nu, row = [];
      for (let iv = 0; iv <= nv; iv++) {
        const v = iv / nv;
        const q = fn(u, v);
        const col = patternAt(sp, q.t ?? 0.8, q.ny ?? 0.7, q.nz ?? 0, true);
        row.push(G.vert(q.x, q.y, q.z, col, segFn ? segFn(u, v) : (q.t ?? 0.8), finId, pivot));
      }
      grid.push(row);
    }
    for (let iu = 0; iu < nu; iu++)
      for (let iv = 0; iv < nv; iv++)
        G.quad(grid[iu][iv], grid[iu][iv + 1], grid[iu + 1][iv + 1], grid[iu + 1][iv]);
  }

  const veil = B.veil || 0;
  const bodyYat = t => bellyOffset(B.prof, t) * B.h + profile(B.prof, t)[0] * hh;
  const bodyYbt = t => bellyOffset(B.prof, t) * B.h - profile(B.prof, t)[0] * hh;

  /* ── caudal fin ───────────────────────────────────────────────────────── */
  if (B.tailH > 0.02) {
    const forked = veil < 0.4 && B.prof !== 'round';
    const tl = B.tailL * (1 + veil * 0.7), th = B.tailH * 0.5 * (1 + veil * 0.25);
    ribbon(7, 9, (u, v) => {
      const vv = v * 2 - 1;
      const spread = th * (0.30 + 0.70 * Math.pow(u, 0.72));
      const cut = forked ? (0.46 + 0.54 * Math.abs(vv)) : (1 - 0.12 * (1 - Math.abs(vv)));
      const wob = veil > 0.5 ? Math.sin(vv * 5.2 + u * 3.4) * 0.035 * u * veil : 0;
      return { x: -0.5 - u * tl * cut, y: vv * spread + wob + bellyOffset(B.prof, 1) * B.h,
               z: vv * 0.012, t: 0.94, ny: vv * 0.5 + 0.5, nz: 0 };
    }, FIN.CAUDAL, Z3, (u) => 1.0 + u * 0.35);
  }

  /* ── dorsal ───────────────────────────────────────────────────────────── */
  if (B.dorsalH > 0.02) {
    const t0 = sp.spines ? 0.16 : 0.26, t1 = Math.min(0.93, t0 + B.dorsalL);
    const dh = B.dorsalH * (1 + veil * 0.4);
    if (sp.spines) {
      /* lionfish: separate banner spines rather than one sail */
      const N = 11;
      for (let s = 0; s < N; s++) {
        const t = t0 + (s / (N - 1)) * (t1 - t0);
        const h = dh * (0.55 + 0.45 * Math.sin(Math.PI * (0.2 + 0.8 * (s / (N - 1)))));
        ribbon(5, 2, (u, v) => {
          const vv = (v - 0.5) * 2;
          const w = 0.030 * (1 - u * 0.75);
          return { x: 0.5 - t - u * 0.16 + vv * 0.004, y: bodyYat(t) + u * h,
                   z: vv * w, t, ny: 0.8, nz: vv };
        }, FIN.DORSAL, Z3, () => t);
      }
    } else {
      ribbon(9, 3, (u, v) => {
        const t = t0 + u * (t1 - t0);
        const shape = Math.pow(Math.sin(Math.PI * clamp(u * 0.92 + 0.06, 0, 1)), 0.55);
        return { x: 0.5 - t, y: bodyYat(t) + v * dh * shape, z: (v - 0.5) * 0.010,
                 t, ny: 0.9, nz: 0 };
      }, FIN.DORSAL, Z3, (u) => t0 + u * (t1 - t0));
    }
  }

  /* ── anal fin ─────────────────────────────────────────────────────────── */
  if (B.analH > 0.02) {
    const t0 = 0.52, t1 = Math.min(0.94, t0 + Math.max(0.16, B.dorsalL * 0.7));
    const ah = B.analH * (1 + veil * 0.5);
    ribbon(7, 3, (u, v) => {
      const t = t0 + u * (t1 - t0);
      const shape = Math.pow(Math.sin(Math.PI * clamp(u * 0.9 + 0.08, 0, 1)), 0.5);
      return { x: 0.5 - t, y: bodyYbt(t) - v * ah * shape, z: (v - 0.5) * 0.010, t, ny: 0.12, nz: 0 };
    }, FIN.DORSAL, Z3, (u) => t0 + u * (t1 - t0));
  }

  /* ── pectorals ────────────────────────────────────────────────────────── */
  if (B.pectL > 0.02) {
    const tp = 0.26, xr = 0.5 - tp;
    const [ , pz ] = profile(B.prof, tp);
    const zr = pz * hw * 0.85, yr = bellyOffset(B.prof, tp) * B.h - hh * 0.1;
    const pl = B.pectL;
    for (const side of [1, -1]) {
      const pivot = [xr, yr, zr * side];
      ribbon(6, 4, (u, v) => {
        const vv = v * 2 - 1;
        const spread = pl * 0.42 * Math.pow(Math.sin(Math.PI * clamp(0.12 + u * 0.88, 0, 1)), 0.6);
        const droop = sp.spines ? -u * pl * 0.18 : -u * pl * 0.10;
        return { x: xr - u * pl * 0.62 + vv * spread * 0.55,
                 y: yr + droop + vv * spread * 0.7,
                 z: (zr + u * pl * (sp.spines ? 0.62 : 0.42)) * side,
                 t: tp + u * 0.62, ny: 0.5 + vv * 0.45, nz: side };
      }, side > 0 ? FIN.PECT_L : FIN.PECT_R, pivot, () => tp);
    }
  }

  /* ── eyes ─────────────────────────────────────────────────────────────── */
  const te = 0.115, [ey, ez] = profile(B.prof, te);
  const eyeY = bellyOffset(B.prof, te) * B.h + ey * hh * 0.42;
  const eyeZ = ez * hw * 0.80, eyeR = Math.max(0.018, Math.min(0.052, hh * 0.30));
  for (const side of [1, -1]) addBall(G, 0.5 - te, eyeY, eyeZ * side, eyeR, [0.03, 0.03, 0.045, 0], te, FIN.RIGID);
  for (const side of [1, -1]) addBall(G, 0.5 - te + 0.012, eyeY + eyeR * 0.25, eyeZ * side * 1.16, eyeR * 0.42, [0.95, 0.98, 1.0, 0.6], te, FIN.RIGID);

  const g = G.build();
  g.userData.wave = B.wave;
  return g;
}

function addBall(G, cx, cy, cz, r, col, seg, fin, rings = 6, segs = 8) {
  const idx = [];
  for (let i = 0; i <= rings; i++) {
    const a = (i / rings) * Math.PI, row = [];
    for (let j = 0; j < segs; j++) {
      const b = (j / segs) * TAU;
      row.push(G.vert(cx + r * Math.sin(a) * Math.cos(b), cy + r * Math.cos(a), cz + r * Math.sin(a) * Math.sin(b), col, seg, fin, Z3));
    }
    idx.push(row);
  }
  for (let i = 0; i < rings; i++)
    for (let j = 0; j < segs; j++) {
      const j2 = (j + 1) % segs;
      G.quad(idx[i][j], idx[i][j2], idx[i + 1][j2], idx[i + 1][j]);
    }
}

/* ── moon jelly: a pulsing bell that leads with its dome ─────────────────── */
function buildJelly(sp) {
  const G = new GeoBuf(), RINGS = 12, SEGS = 18;
  const grid = [];
  for (let i = 0; i <= RINGS; i++) {
    const a = (i / RINGS) * (Math.PI * 0.56), row = [];
    for (let j = 0; j < SEGS; j++) {
      const b = (j / SEGS) * TAU;
      const r = Math.sin(a) * 0.46, x = 0.44 - (1 - Math.cos(a)) * 0.52;
      const col = patternAt(sp, i / RINGS, 1 - i / RINGS, 0, false);
      row.push(G.vert(x, r * Math.sin(b), r * Math.cos(b), col, i / RINGS, FIN.BODY, Z3));
    }
    grid.push(row);
  }
  for (let i = 0; i < RINGS; i++)
    for (let j = 0; j < SEGS; j++) { const j2 = (j + 1) % SEGS; G.quad(grid[i][j], grid[i][j2], grid[i + 1][j2], grid[i + 1][j]); }
  /* the four horseshoe gonads that make a moon jelly recognisable */
  for (let k = 0; k < 4; k++) {
    const b = (k / 4) * TAU + 0.4;
    const col = [0.78, 0.62, 1.0, 1.5];
    const cx = 0.30, cr = 0.19;
    const ring = [];
    for (let j = 0; j <= 10; j++) {
      const a2 = (j / 10) * Math.PI * 1.5 - 0.75;
      const rr2 = cr * 0.5;
      ring.push(G.vert(cx - 0.02, (Math.cos(b) * cr + Math.cos(a2) * rr2 * Math.cos(b) - Math.sin(a2) * rr2 * Math.sin(b)) * 1.0,
                       (Math.sin(b) * cr + Math.cos(a2) * rr2 * Math.sin(b) + Math.sin(a2) * rr2 * Math.cos(b)) * 1.0,
                       col, 0.6, FIN.BODY, Z3));
    }
    for (let j = 0; j < 10; j++) G.tri(ring[j], ring[j + 1], ring[0]);
  }
  /* oral arms + tentacle fringe */
  for (let k = 0; k < 4; k++) {
    const b = (k / 4) * TAU + 0.78;
    const col = [0.86, 0.95, 1.0, 0.9];
    const rowA = [], rowB = [];
    for (let s = 0; s <= 8; s++) {
      const u = s / 8, w = 0.07 * (1 - u * 0.8);
      const x = -0.02 - u * 0.72, rr2 = 0.10 * (1 - u * 0.55);
      rowA.push(G.vert(x, Math.sin(b) * rr2 + w, Math.cos(b) * rr2, col, 0.7 + u * 0.5, FIN.TENT, Z3));
      rowB.push(G.vert(x, Math.sin(b) * rr2 - w, Math.cos(b) * rr2, col, 0.7 + u * 0.5, FIN.TENT, Z3));
    }
    for (let s = 0; s < 8; s++) G.quad(rowA[s], rowB[s], rowB[s + 1], rowA[s + 1]);
  }
  for (let k = 0; k < 18; k++) {
    const b = (k / 18) * TAU, col = [0.72, 0.92, 1.0, 0.55];
    const rowA = [], rowB = [];
    const len = 0.34 + (k % 3) * 0.16;
    for (let s = 0; s <= 5; s++) {
      const u = s / 5, x = -0.06 - u * len;
      const rr2 = 0.44 * (1 - u * 0.25);
      rowA.push(G.vert(x, Math.sin(b) * rr2, Math.cos(b) * rr2 + 0.008, col, 0.8 + u * 0.6, FIN.TENT, Z3));
      rowB.push(G.vert(x, Math.sin(b) * rr2, Math.cos(b) * rr2 - 0.008, col, 0.8 + u * 0.6, FIN.TENT, Z3));
    }
    for (let s = 0; s < 5; s++) G.quad(rowA[s], rowB[s], rowB[s + 1], rowA[s + 1]);
  }
  const g = G.build(); g.userData.wave = 0; g.userData.jelly = true;
  return g;
}

/* ── mystery snail ───────────────────────────────────────────────────────── */
function buildSnail(sp) {
  const G = new GeoBuf();
  /* shell: a coil swept as a tube */
  const TURNS = 2.4, STEPS = 46, SEGS = 10, prev = [];
  let rows = [];
  for (let s = 0; s <= STEPS; s++) {
    const u = s / STEPS, a = u * TAU * TURNS;
    const coil = 0.42 * Math.pow(u, 0.85);
    const cx = -0.02 + Math.cos(a) * coil * 0.9;
    const cy = 0.16 + Math.sin(a) * coil;
    const cz = (u - 0.5) * 0.16;
    const tube = 0.055 + 0.19 * Math.pow(u, 1.15);
    const row = [];
    for (let j = 0; j < SEGS; j++) {
      const b = (j / SEGS) * TAU;
      const col = patternAt(sp, u, 0.55 + Math.sin(b) * 0.4, 0, false);
      row.push(G.vert(cx + Math.cos(b) * tube * 0.7, cy + Math.sin(b) * tube, cz + Math.cos(b) * tube * 0.9, col, u, FIN.RIGID, Z3));
    }
    rows.push(row);
  }
  for (let s = 0; s < STEPS; s++) for (let j = 0; j < SEGS; j++) { const j2 = (j + 1) % SEGS; G.quad(rows[s][j], rows[s][j2], rows[s + 1][j2], rows[s + 1][j]); }
  /* foot */
  const fcol = [0.95, 0.88, 0.72, 0];
  const fr = [];
  for (let s = 0; s <= 8; s++) {
    const u = s / 8, row = [];
    for (let j = 0; j <= 5; j++) {
      const v = j / 5 - 0.5;
      row.push(G.vert(0.34 - u * 0.7, -0.16 + Math.sin(Math.PI * u) * 0.05, v * 0.20 * Math.sin(Math.PI * clamp(u * 0.9 + 0.08, 0, 1)), fcol, u, FIN.BODY, Z3));
    }
    fr.push(row);
  }
  for (let s = 0; s < 8; s++) for (let j = 0; j < 5; j++) G.quad(fr[s][j], fr[s][j + 1], fr[s + 1][j + 1], fr[s + 1][j]);
  for (const side of [1, -1]) {
    const rowA = [], rowB = [];
    for (let s = 0; s <= 4; s++) {
      const u = s / 4;
      rowA.push(G.vert(0.34 + u * 0.16, -0.10 + u * 0.16, side * 0.055 + 0.008, fcol, u, FIN.TENT, Z3));
      rowB.push(G.vert(0.34 + u * 0.16, -0.10 + u * 0.16, side * 0.055 - 0.008, fcol, u, FIN.TENT, Z3));
    }
    for (let s = 0; s < 4; s++) G.quad(rowA[s], rowB[s], rowB[s + 1], rowA[s + 1]);
  }
  const g = G.build(); g.userData.wave = 0; g.userData.upright = true;
  return g;
}

/* ── cleaner shrimp ──────────────────────────────────────────────────────── */
function buildShrimp(sp) {
  const G = new GeoBuf(), STEPS = 14, SEGS = 9;
  const rows = [];
  for (let s = 0; s <= STEPS; s++) {
    const u = s / STEPS;
    const bend = Math.pow(u, 1.7) * 0.26;
    const cx = 0.46 - u * 0.92, cy = -0.02 + bend;
    const r = 0.115 * Math.pow(Math.sin(Math.PI * clamp(u * 0.86 + 0.09, 0, 1)), 0.42) * (1 - u * 0.25);
    const row = [];
    for (let j = 0; j < SEGS; j++) {
      const b = (j / SEGS) * TAU;
      const seg = Math.abs(Math.sin(u * 22)) > 0.75 ? 1 : 0;
      const col = patternAt(sp, u, 0.5 + Math.sin(b) * 0.45, 0, false);
      if (seg) { col[0] *= 0.85; col[1] *= 0.85; }
      row.push(G.vert(cx + Math.cos(b) * r * 0.25, cy + Math.sin(b) * r, Math.cos(b) * r * 0.9, col, u, FIN.BODY, Z3));
    }
    rows.push(row);
  }
  for (let s = 0; s < STEPS; s++) for (let j = 0; j < SEGS; j++) { const j2 = (j + 1) % SEGS; G.quad(rows[s][j], rows[s][j2], rows[s + 1][j2], rows[s + 1][j]); }
  /* tail fan */
  const tc = [0.98, 0.55, 0.30, 0];
  for (const side of [-1, 0, 1]) {
    const rowA = [], rowB = [];
    for (let s = 0; s <= 4; s++) {
      const u = s / 4;
      rowA.push(G.vert(-0.46 - u * 0.22, 0.24 + u * 0.06, side * u * 0.11 + 0.01, tc, 1 + u * 0.3, FIN.CAUDAL, Z3));
      rowB.push(G.vert(-0.46 - u * 0.22, 0.24 + u * 0.06, side * u * 0.11 - 0.01, tc, 1 + u * 0.3, FIN.CAUDAL, Z3));
    }
    for (let s = 0; s < 4; s++) G.quad(rowA[s], rowB[s], rowB[s + 1], rowA[s + 1]);
  }
  /* long white antennae — the thing that reads as "cleaner" from across a room */
  const ac = [1, 1, 1, 0.35];
  for (const side of [1, -1]) for (const k of [0, 1]) {
    const rowA = [], rowB = [];
    for (let s = 0; s <= 7; s++) {
      const u = s / 7;
      const x = 0.5 + u * 0.62, y = 0.02 + Math.sin(u * 2.1 + k) * 0.10 * u, z = side * (0.04 + u * 0.16 * (k ? 1.5 : 0.6));
      rowA.push(G.vert(x, y + 0.006, z, ac, 0.2 + u, FIN.TENT, Z3));
      rowB.push(G.vert(x, y - 0.006, z, ac, 0.2 + u, FIN.TENT, Z3));
    }
    for (let s = 0; s < 7; s++) G.quad(rowA[s], rowB[s], rowB[s + 1], rowA[s + 1]);
  }
  /* legs */
  for (let i = 0; i < 5; i++) for (const side of [1, -1]) {
    const u0 = 0.18 + i * 0.11, rowA = [], rowB = [];
    for (let s = 0; s <= 3; s++) {
      const u = s / 3;
      rowA.push(G.vert(0.46 - u0 * 0.92 - u * 0.04, -0.10 - u * 0.14, side * (0.06 + u * 0.09) + 0.006, [0.95, 0.6, 0.4, 0], u0, FIN.TENT, Z3));
      rowB.push(G.vert(0.46 - u0 * 0.92 - u * 0.04, -0.10 - u * 0.14, side * (0.06 + u * 0.09) - 0.006, [0.95, 0.6, 0.4, 0], u0, FIN.TENT, Z3));
    }
    for (let s = 0; s < 3; s++) G.quad(rowA[s], rowB[s], rowB[s + 1], rowA[s + 1]);
  }
  for (const side of [1, -1]) addBall(G, 0.44, 0.05, side * 0.075, 0.030, [0.05, 0.03, 0.03, 0], 0.05, FIN.RIGID, 5, 6);
  const g = G.build(); g.userData.wave = 0.18;
  return g;
}

/* ── lined seahorse: built upright, because that is the whole point ──────── */
function buildSeahorse(sp) {
  const G = new GeoBuf(), STEPS = 30, SEGS = 9;
  /* spine runs up +Y with the head leaning to +X, then the tail curls */
  const spine = [];
  for (let s = 0; s <= STEPS; s++) {
    const u = s / STEPS;                 // 0 = crown, 1 = tail tip
    let x, y, r;
    if (u < 0.16) { const k = u / 0.16; x = 0.08 + k * 0.10; y = 0.52 - k * 0.12; r = 0.055 + k * 0.035; }
    else if (u < 0.30) { const k = (u - 0.16) / 0.14; x = 0.18 - k * 0.16; y = 0.40 - k * 0.10; r = 0.09 + k * 0.03; }
    else if (u < 0.62) { const k = (u - 0.30) / 0.32; x = 0.02 + Math.sin(k * 2.1) * 0.07; y = 0.30 - k * 0.34; r = 0.12 - k * 0.02; }
    else { const k = (u - 0.62) / 0.38; const a = k * 4.2;
           x = 0.06 - Math.sin(a) * 0.16 * k - 0.02; y = -0.04 - k * 0.18 + (1 - Math.cos(a)) * 0.10 * k; r = 0.10 * (1 - k * 0.85); }
    spine.push([x, y, r, u]);
  }
  const rows = [];
  for (let s = 0; s < spine.length; s++) {
    const [cx, cy, r, u] = spine[s], row = [];
    for (let j = 0; j < SEGS; j++) {
      const b = (j / SEGS) * TAU;
      const ridge = 1 + 0.16 * Math.abs(Math.sin(b * 3.5)) * Math.abs(Math.sin(u * 24));
      const col = patternAt(sp, u, 0.5 + Math.sin(b) * 0.45, 0, false);
      row.push(G.vert(cx + Math.cos(b) * r * ridge, cy + Math.sin(b) * r * 0.5 * ridge, Math.cos(b + 1.57) * r * ridge, col, u, u > 0.6 ? FIN.TENT : FIN.BODY, Z3));
    }
    rows.push(row);
  }
  for (let s = 0; s < rows.length - 1; s++) for (let j = 0; j < SEGS; j++) { const j2 = (j + 1) % SEGS; G.quad(rows[s][j], rows[s][j2], rows[s + 1][j2], rows[s + 1][j]); }
  /* snout */
  const sc = patternAt(sp, 0.05, 0.6, 0, false);
  const sr = [];
  for (let s = 0; s <= 5; s++) {
    const u = s / 5, row = [];
    for (let j = 0; j < 7; j++) {
      const b = (j / 7) * TAU, r = 0.045 * (1 - u * 0.45);
      row.push(G.vert(0.17 + u * 0.22, 0.40 - u * 0.03 + Math.sin(b) * r, Math.cos(b) * r, sc, 0.04, FIN.RIGID, Z3));
    }
    sr.push(row);
  }
  for (let s = 0; s < 5; s++) for (let j = 0; j < 7; j++) { const j2 = (j + 1) % 7; G.quad(sr[s][j], sr[s][j2], sr[s + 1][j2], sr[s + 1][j]); }
  /* coronet + dorsal fin, which flutters far faster than the body moves */
  for (let k = 0; k < 3; k++) addBall(G, 0.07 + k * 0.015, 0.56 + k * 0.012, (k - 1) * 0.03, 0.028, sc, 0.02, FIN.RIGID, 4, 6);
  const dc = patternAt(sp, 0.5, 0.5, 0, true);
  const da = [], db = [];
  for (let s = 0; s <= 7; s++) {
    const u = s / 7;
    const y = 0.22 - u * 0.26, h = 0.11 * Math.pow(Math.sin(Math.PI * clamp(u * 0.9 + 0.06, 0, 1)), 0.5);
    da.push(G.vert(-0.055 - h, y, 0.012, dc, 0.45, FIN.DORSAL, Z3));
    db.push(G.vert(-0.055 - h, y, -0.012, dc, 0.45, FIN.DORSAL, Z3));
  }
  for (let s = 0; s < 7; s++) G.quad(da[s], db[s], db[s + 1], da[s + 1]);
  for (const side of [1, -1]) addBall(G, 0.12, 0.44, side * 0.062, 0.032, [0.04, 0.03, 0.02, 0], 0.05, FIN.RIGID, 5, 7);
  const g = G.build(); g.userData.wave = 0; g.userData.upright = true; g.userData.seahorse = true;
  return g;
}

/* ═══════════════════════════════════════════════════════════════════════════
   4. MAKING THEM SWIM
   One InstancedMesh per species. The body wave, the fin beat and the jelly
   pulse all happen on the GPU from per-instance attributes, so a school of
   forty tetras is one draw call and still every fish is out of phase with
   its neighbours.
   ═══════════════════════════════════════════════════════════════════════════ */

const FISH_UNIFORMS = { uTime: { value: 0 }, uNight: { value: 0 } };

function fishMaterial(geo, sp) {
  const m = new THREE.MeshStandardMaterial({
    vertexColors: true, roughness: 0.42, metalness: 0.08,
    side: THREE.DoubleSide, emissive: new THREE.Color(0x000000),
  });
  if (sp.shape === 'jelly') {
    m.transparent = true; m.opacity = 0.52; m.depthWrite = false;
    m.roughness = 0.15; m.side = THREE.DoubleSide;
  }
  m.defines = m.defines || {};
  if (geo.userData.jelly)    m.defines.TK_JELLY = 1;
  if (geo.userData.seahorse) m.defines.TK_SEAHORSE = 1;

  m.onBeforeCompile = (sh) => {
    sh.uniforms.uTime  = FISH_UNIFORMS.uTime;
    sh.uniforms.uNight = FISH_UNIFORMS.uNight;
    sh.uniforms.uWave  = { value: geo.userData.wave ?? 1 };

    sh.vertexShader = `
      attribute float aSeg;  attribute float aFin;  attribute float aGlow;  attribute vec3 aPivot;
      attribute vec4  aAnim;   /* phase, tailBeat, waveAmp, finBeat */
      attribute vec4  aState;  /* glowMul, finDamage, sick, flash */
      uniform float uTime; uniform float uNight; uniform float uWave;
      varying float vGlow; varying float vFlash; varying float vSick;

      vec3 tkRotY(vec3 p, vec3 pivot, float a){
        vec3 d = p - pivot; float s = sin(a), c = cos(a);
        return pivot + vec3(d.x*c - d.z*s, d.y, d.x*s + d.z*c);
      }
      float tkBody(float seg){
        float env = smoothstep(0.10, 1.05, seg);
        return sin(seg * 5.6 - uTime * aAnim.y) * aAnim.z * uWave * env;
      }
    ` + sh.vertexShader;

    sh.vertexShader = sh.vertexShader.replace('#include <beginnormal_vertex>', `
      #include <beginnormal_vertex>
      {
        float d = (tkBody(aSeg + 0.06) - tkBody(aSeg - 0.06)) / 0.12;
        float a = atan(d);
        float s = sin(a), c = cos(a);
        objectNormal = vec3(objectNormal.x*c - objectNormal.z*s, objectNormal.y, objectNormal.x*s + objectNormal.z*c);
      }
    `);

    sh.vertexShader = sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      vGlow  = aGlow * aState.x;
      vFlash = aState.w;
      vSick  = aState.z;
      #ifdef TK_JELLY
        float pulse = sin(uTime * aAnim.y * 0.55 + aAnim.x);
        float k = 0.17 * pulse * smoothstep(0.05, 1.0, min(aSeg, 1.0));
        transformed.yz *= (1.0 - k);
        transformed.x  -= k * 0.30;
        if (aFin > 5.5) {
          float lag = sin(uTime * aAnim.y * 0.55 + aAnim.x - (aSeg - 0.7) * 2.4);
          transformed.yz *= (1.0 - 0.10 * lag);
          transformed.z  += lag * 0.035 * (aSeg - 0.7);
          transformed.y  += cos(uTime * 0.6 + aAnim.x + aSeg * 3.0) * 0.020 * (aSeg - 0.7);
        }
      #else
        if (aFin < 4.5 || aFin > 5.5) {
          transformed.z += tkBody(aSeg);
        }
        if (aFin > 0.5 && aFin < 2.5) {
          float side = (aFin < 1.5) ? 1.0 : -1.0;
          float a = sin(uTime * aAnim.w + aAnim.x) * 0.42 * side;
          transformed = tkRotY(transformed, aPivot, a);
          transformed.y += sin(uTime * aAnim.w + aAnim.x + 1.6) * 0.02;
        }
        if (aFin > 3.5 && aFin < 4.5) {
          transformed.z += sin(uTime * aAnim.w * 0.75 + aSeg * 9.0 + aAnim.x) * 0.016 * (1.0 + aState.y);
        }
        if (aFin > 5.5) {
          float lag = sin(uTime * aAnim.y * 0.8 + aAnim.x - aSeg * 3.2);
          transformed.z += lag * 0.045 * (aSeg - 0.2);
          transformed.y += cos(uTime * 0.9 + aAnim.x + aSeg * 2.0) * 0.018;
        }
        #ifdef TK_SEAHORSE
          transformed = tkRotY(transformed, vec3(0.0), sin(uTime * 0.35 + aAnim.x) * 0.06);
        #endif
        /* ragged fins: a nipped fish visibly loses the tips of its finnage */
        if (aState.y > 0.02 && aFin > 2.5 && aFin < 5.5) {
          float ragged = fract(sin(aSeg * 91.7 + transformed.y * 57.3) * 43758.5453);
          float bite = step(1.0 - aState.y * 0.9, ragged);
          transformed.xyz = mix(transformed.xyz, aPivot + (transformed.xyz - aPivot) * 0.55, bite);
        }
      #endif
    `);

    sh.fragmentShader = `
      uniform float uNight; varying float vGlow; varying float vFlash; varying float vSick;
    ` + sh.fragmentShader;
    sh.fragmentShader = sh.fragmentShader.replace('#include <dithering_fragment>', `
      #include <dithering_fragment>
      float g = vGlow * (0.12 + 1.75 * uNight);
      gl_FragColor.rgb += diffuseColor.rgb * g;
      gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(1.0), vFlash * 0.8);
      gl_FragColor.rgb = mix(gl_FragColor.rgb, vec3(0.93,0.95,0.97), vSick * 0.30);
    `);
  };
  return m;
}

const CAUSTIC_GLSL = `
float tkCaustic(vec2 uv, float t){
  vec2 p = mod(uv * 6.28318, 6.28318) - 250.0;
  vec2 i = p; float c = 1.0; const float inten = 0.0045;
  for (int n = 0; n < 4; n++){
    float tt = t * (1.0 - (3.2 / float(n + 1)));
    i = p + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(p.x / (sin(i.x + tt) / inten), p.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0; c = 1.16 - pow(c, 1.4);
  return clamp(pow(abs(c), 7.0), 0.0, 2.2);
}`;

const WORLD_UNIFORMS = {
  uTime:     { value: 0 },
  uNight:    { value: 0 },
  uCaustic:  { value: 1.0 },
  uWaterCol: { value: new THREE.Color(0x1d6f8e) },
  uSurfaceY: { value: 3.0 },
  uAlgae:    { value: 0.0 },
  uMurk:     { value: 0.0 },
};

class World {
  constructor(renderer, scene) {
    this.renderer = renderer; this.scene = scene;
    this.root = new THREE.Group(); scene.add(this.root);
    this.tankGroup = new THREE.Group(); this.root.add(this.tankGroup);
    this.batches = new Map();
    this.plantMeshes = new Map();
    this.decorMeshes = [];
    this.dims = [6, 3, 3];
    this.buildLights();
    this.buildRoom();
    this.buildParticles();
    this.buildBubbles();
    this.buildShadows();
    this.buildVisitors();
  }

  /* ── lighting ─────────────────────────────────────────────────────────── */
  buildLights() {
    this.sun = new THREE.DirectionalLight(0xffffff, 1.25);
    this.sun.position.set(2.4, 9, 3.4);
    this.scene.add(this.sun);
    this.fill = new THREE.DirectionalLight(0xbfe4f5, 0.32);
    this.fill.position.set(-4, 2, -5);
    this.fillFollowsCamera = true;
    this.scene.add(this.fill);
    this.hemi = new THREE.HemisphereLight(0x9fe0ff, 0x08202c, 0.30);
    this.scene.add(this.hemi);
    this.lamp = new THREE.PointLight(0xbfe9ff, 3.2, 30, 1.15);
    this.lamp.position.set(0, 4.2, 0);
    this.scene.add(this.lamp);
    this.moon = new THREE.DirectionalLight(0x8ac6ff, 0);
    this.moon.position.set(-2, 7, 2);
    this.scene.add(this.moon);
  }

  /* ── the gallery the tank stands in ───────────────────────────────────── */
  buildRoom() {
    const floor = new THREE.Mesh(
      new THREE.PlaneGeometry(150, 150),
      new THREE.MeshStandardMaterial({ color: 0x0a1218, roughness: 0.82, metalness: 0.05 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -7;
    this.root.add(floor); this.floor = floor;

    const back = new THREE.Mesh(
      new THREE.PlaneGeometry(150, 90),
      new THREE.MeshStandardMaterial({ color: 0x0b141b, roughness: 0.95 }));
    back.position.set(0, 22, -34);
    this.root.add(back);

    this.cabinet = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1),
      new THREE.MeshStandardMaterial({ color: 0x111a20, roughness: 0.7, metalness: 0.2 }));
    this.root.add(this.cabinet);
  }

  /* ── drifting marine snow ─────────────────────────────────────────────── */
  buildParticles() {
    const N = LITE ? 260 : 900;
    const pos = new Float32Array(N * 3), seed = new Float32Array(N);
    for (let i = 0; i < N; i++) { pos[i * 3] = rr(-1, 1); pos[i * 3 + 1] = rr(0, 1); pos[i * 3 + 2] = rr(-1, 1); seed[i] = rnd(); }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
    g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
    const m = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.NormalBlending,
      uniforms: { uTime: WORLD_UNIFORMS.uTime, uBox: { value: new THREE.Vector3(6, 3, 3) },
                  uNight: WORLD_UNIFORMS.uNight, uMurk: WORLD_UNIFORMS.uMurk, uPix: { value: 1 } },
      vertexShader: `
        attribute float aSeed; uniform float uTime; uniform vec3 uBox; uniform float uPix;
        varying float vA;
        void main(){
          vec3 p = position * uBox * 0.5;
          float t = uTime * (0.02 + aSeed * 0.035);
          p.y = mod(p.y - t * 0.9 + uBox.y * 0.5, uBox.y) - uBox.y * 0.5 + uBox.y * 0.5;
          p.x += sin(uTime * 0.25 + aSeed * 40.0) * 0.10;
          p.z += cos(uTime * 0.19 + aSeed * 27.0) * 0.10;
          vec4 mv = modelViewMatrix * vec4(p, 1.0);
          float d = -mv.z;
          vA = (0.12 + aSeed * 0.30) * smoothstep(0.4, 1.6, d) * (1.0 - smoothstep(9.0, 22.0, d));
          gl_PointSize = (1.6 + aSeed * 3.2) * uPix * (7.0 / max(1.0, d));
          gl_Position = projectionMatrix * mv;
        }`,
      fragmentShader: `
        varying float vA; uniform float uNight; uniform float uMurk;
        void main(){
          vec2 c = gl_PointCoord - 0.5;
          float r = 1.0 - smoothstep(0.18, 0.5, length(c));
          vec3 col = mix(vec3(0.82,0.93,1.0), vec3(0.55,0.85,0.75), uMurk);
          gl_FragColor = vec4(col, r * vA * (1.0 - uNight * 0.45));
          if (gl_FragColor.a < 0.004) discard;
        }`,
    });
    this.snow = new THREE.Points(g, m);
    this.snow.frustumCulled = false;
    this.tankGroup.add(this.snow);
  }

  /* ── bubbles ──────────────────────────────────────────────────────────── */
  buildBubbles() {
    const N = LITE ? 90 : 220;
    this.bubbleCap = N;
    const g = new THREE.SphereGeometry(1, 7, 5);
    const m = new THREE.MeshStandardMaterial({
      color: 0xdff6ff, roughness: 0.05, metalness: 0.0, transparent: true, opacity: 0.36,
      emissive: 0x2a5f78, emissiveIntensity: 0.25, depthWrite: false,
    });
    this.bubbles = new THREE.InstancedMesh(g, m, N);
    this.bubbles.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.bubbles.frustumCulled = false;
    this.bubbles.count = 0;
    this.tankGroup.add(this.bubbles);
    this.bubbleList = [];
  }

  /* ── soft contact shadows on the sand, which is most of the depth cue ─── */
  buildShadows() {
    const g = new THREE.PlaneGeometry(1, 1);
    const m = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.NormalBlending,
      uniforms: { uNight: WORLD_UNIFORMS.uNight },
      vertexShader: `varying vec2 vU; void main(){ vU = uv;
        gl_Position = projectionMatrix * modelViewMatrix * instanceMatrix * vec4(position,1.0); }`,
      fragmentShader: `varying vec2 vU; uniform float uNight;
        void main(){ float d = length(vU - 0.5) * 2.0;
          gl_FragColor = vec4(0.0,0.02,0.04, (1.0 - smoothstep(0.15,1.0,d)) * 0.36 * (1.0 - uNight*0.5)); }`,
    });
    this.shadows = new THREE.InstancedMesh(g, m, 120);
    this.shadows.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.shadows.frustumCulled = false; this.shadows.count = 0;
    this.shadows.rotation.x = -Math.PI / 2;
    this.tankGroup.add(this.shadows);
  }

  /* ── the crowd: dark silhouettes in front of the glass ────────────────── */
  buildVisitors() {
    const shape = new THREE.CapsuleGeometry(2.4, 9.0, 3, 8);
    const head = new THREE.SphereGeometry(1.9, 8, 6);
    head.translate(0, 7.2, 0);
    const geo = mergeGeos([shape, head]);
    const m = new THREE.MeshBasicMaterial({ color: 0x020a10, transparent: true, opacity: 0.88 });
    this.visitors = new THREE.InstancedMesh(geo, m, 24);
    this.visitors.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    this.visitors.frustumCulled = false; this.visitors.count = 0;
    this.root.add(this.visitors);
    this.visitorList = [];
  }
}

/** Tiny geometry merge — three's BufferGeometryUtils addon is not vendored. */
function mergeGeos(list) {
  let vc = 0, ic = 0;
  for (const g of list) { vc += g.attributes.position.count; ic += g.index ? g.index.count : 0; }
  const pos = new Float32Array(vc * 3), nor = new Float32Array(vc * 3), idx = new Uint16Array(ic);
  let vo = 0, io = 0;
  for (const g of list) {
    const p = g.attributes.position.array, n = g.attributes.normal.array;
    pos.set(p, vo * 3); nor.set(n, vo * 3);
    const gi = g.index.array;
    for (let i = 0; i < gi.length; i++) idx[io + i] = gi[i] + vo;
    vo += g.attributes.position.count; io += gi.length;
  }
  const out = new THREE.BufferGeometry();
  out.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  out.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  out.setIndex(new THREE.BufferAttribute(idx, 1));
  return out;
}

Object.assign(World.prototype, {

  /* ── (re)build the glass box, the sand and the light in it ────────────── */
  buildTank(dims, water) {
    this.dims = dims.slice(); this.water = water;
    const [W, H, D] = dims;
    if (this.tankParts) for (const o of this.tankParts) { this.tankGroup.remove(o); disposeDeep(o); }
    this.tankParts = [];
    const add = o => { this.tankGroup.add(o); this.tankParts.push(o); return o; };

    WORLD_UNIFORMS.uSurfaceY.value = H;
    this.snow.material.uniforms.uBox.value.set(W - 0.2, H - 0.2, D - 0.2);

    /* ── substrate ──────────────────────────────────────────────────────── */
    const sg = new THREE.PlaneGeometry(W, D, 44, 26);
    const sp = sg.attributes.position;
    for (let i = 0; i < sp.count; i++) {
      const x = sp.getX(i), y = sp.getY(i);

              + (vnoise(x * 2.6, y * 2.6) - 0.5) * 0.05;

    sandMat.onBeforeCompile = sh => {
      sh.uniforms.uTime = WORLD_UNIFORMS.uTime; sh.uniforms.uNight = WORLD_UNIFORMS.uNight;

    wallMat.onBeforeCompile = sh => {
      sh.uniforms.uTime = WORLD_UNIFORMS.uTime; sh.uniforms.uNight = WORLD_UNIFORMS.uNight;
      sh.uniforms.uCaustic = WORLD_UNIFORMS.uCaustic;

        '#include <begin_vertex>\n vWP = (modelMatrix * vec4(transformed,1.0)).xyz;');
      sh.fragmentShader = `varying vec3 vWP; uniform float uTime, uNight, uCaustic;\n${CAUSTIC_GLSL}\n` + sh.fragmentShader;

        #include <dithering_fragment>

      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,

      uniforms: { uTime: WORLD_UNIFORMS.uTime, uNight: WORLD_UNIFORMS.uNight, uCaustic: WORLD_UNIFORMS.uCaustic },
      vertexShader: `varying vec3 vN; varying vec3 vV; varying vec3 vWP;
        void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vWP = wp.xyz;
