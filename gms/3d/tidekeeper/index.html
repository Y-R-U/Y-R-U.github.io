<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04141c">
<title>Tidekeeper</title>
<meta name="description" content="An aquarium management game about the fight between a tank that survives and a tank that dazzles.">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   TIDEKEEPER — everything lives in this one file on purpose. The only
   external thing is three.js, and that is VENDORED in the repo rather than
   pulled from a CDN: a bare `import "three"` aimed at a CDN takes the whole
   module graph hostage to one network fetch, and when that fetch stalls the
   page shows a loading screen forever with no error in the console. That
   bug has cost this repo real days. See the importmap at the bottom.
   ───────────────────────────────────────────────────────────────────────── */

:root{
  --ink:#03121a;
  --deep:#062b3c;
  --glass:rgba(9,32,44,.52);
  --glass-hi:rgba(255,255,255,.10);
  --line:rgba(150,225,255,.16);
  --line-2:rgba(150,225,255,.30);
  --text:#e8f7fd;
  --dim:#9dc1d1;
  --dimmer:#6f93a3;
  --good:#54e0a6;
  --warn:#ffc65c;
  --bad:#ff6b6b;
  --gold:#ffd98a;
  --cyan:#6fe3ff;
  --shadow:0 10px 40px rgba(0,0,0,.45);
  --r:14px;
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#03121a}
body{
  font:14px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
  user-select:none;-webkit-user-select:none;
  touch-action:none;
  overscroll-behavior:none;
}
#gl{display:block;position:fixed;inset:0;width:100%;height:100%}

/* ── shared glass surface ─────────────────────────────────────────────── */
.glass{
  background:var(--glass);
  backdrop-filter:blur(16px) saturate(1.25);
  -webkit-backdrop-filter:blur(16px) saturate(1.25);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow), inset 0 1px 0 var(--glass-hi);
}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}

button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:9px 14px;border-radius:11px;
  background:rgba(255,255,255,.055);
  border:1px solid var(--line);
  color:var(--text);font-weight:600;font-size:13px;letter-spacing:.01em;
  transition:background .16s,border-color .16s,transform .1s,opacity .16s;
  white-space:nowrap;
}
.btn:hover{background:rgba(255,255,255,.11);border-color:var(--line-2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:linear-gradient(180deg,#1d9fd0,#137aa6);border-color:#4fc8f0;color:#fff;box-shadow:0 4px 18px rgba(20,150,200,.34)}
.btn.primary:hover{background:linear-gradient(180deg,#28b0e2,#1888b8)}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(255,107,107,.45);color:#ffb3b3}
.btn[disabled]{opacity:.36;pointer-events:none}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}

/* ── top-left headline meters ─────────────────────────────────────────── */
#hud-top{
  position:fixed;z-index:20;
  top:calc(10px + var(--safe-t));left:calc(10px + var(--safe-l));
  display:flex;gap:9px;align-items:flex-start;
  pointer-events:none;
}
#meters{padding:11px 13px 12px;min-width:216px;pointer-events:auto}
.meter+.meter{margin-top:10px}
.meter-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.meter-name{font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700}
.meter-val{font-size:14px;font-weight:700}
.bar{height:6px;border-radius:99px;background:rgba(255,255,255,.09);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;transition:width .45s cubic-bezier(.22,1,.36,1),background .5s}
.bar > s{position:absolute;top:-3px;width:2px;height:12px;background:rgba(255,255,255,.5);border-radius:2px;transform:translateX(-1px)}
#health-fill{background:linear-gradient(90deg,#3fd6a0,#7ff0c8)}
#appeal-fill{background:linear-gradient(90deg,#ffb44d,#ffe08a)}

/* ── top-right wallet ─────────────────────────────────────────────────── */
#wallet{
  position:fixed;z-index:20;
  top:calc(10px + var(--safe-t));right:calc(10px + var(--safe-r));
  padding:10px 13px;display:flex;flex-direction:column;gap:7px;align-items:flex-end;min-width:150px;
}
.wal-row{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.wal-big{font-size:19px;font-weight:800;letter-spacing:-.02em;color:var(--gold)}
.wal-sub{font-size:11.5px;color:var(--dim)}
.wal-sub b{color:var(--text);font-weight:700}
#obj-line{font-size:11.5px;color:var(--cyan);max-width:230px;text-align:right;line-height:1.3}

/* ── bottom dock ──────────────────────────────────────────────────────── */
#dock{
  position:fixed;z-index:20;left:50%;transform:translateX(-50%);
  bottom:calc(10px + var(--safe-b));
  display:flex;gap:6px;padding:7px;align-items:center;
}
.dock-b{
  width:50px;height:46px;border-radius:11px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;
  background:rgba(255,255,255,.05);border:1px solid transparent;
  transition:background .15s,border-color .15s;position:relative;
}
.dock-b:hover{background:rgba(255,255,255,.12)}
.dock-b.on{background:rgba(90,200,255,.18);border-color:rgba(110,220,255,.45)}
.dock-b svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.dock-b span{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);font-weight:700}
.dock-b.on span{color:var(--text)}
.dock-sep{width:1px;height:30px;background:var(--line);margin:0 3px}
.dock-b .pip{position:absolute;top:5px;right:7px;width:6px;height:6px;border-radius:99px;background:var(--warn);box-shadow:0 0 8px var(--warn)}

/* speed control */
#speed{display:flex;gap:3px;padding:3px;border-radius:10px;background:rgba(0,0,0,.25)}
.sp{width:32px;height:30px;border-radius:8px;font-size:11.5px;font-weight:800;color:var(--dimmer);display:flex;align-items:center;justify-content:center}
.sp.on{background:rgba(110,220,255,.22);color:#fff}
.sp svg{width:13px;height:13px;stroke:currentColor;fill:currentColor;stroke-width:0}

/* ── alert stream ─────────────────────────────────────────────────────── */
#alerts{
  position:fixed;z-index:21;right:calc(10px + var(--safe-r));
  top:calc(96px + var(--safe-t));
  width:260px;display:flex;flex-direction:column;gap:7px;align-items:flex-end;
  pointer-events:none;
}
.alert{
  pointer-events:auto;padding:9px 11px;border-radius:11px;font-size:12.5px;line-height:1.35;
  background:rgba(7,28,39,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-left-width:3px;
  box-shadow:0 8px 26px rgba(0,0,0,.38);
  animation:alertIn .42s cubic-bezier(.16,1,.3,1);
  max-width:100%;
}
.alert.info{border-left-color:var(--cyan)}
.alert.good{border-left-color:var(--good)}
.alert.warn{border-left-color:var(--warn)}
.alert.bad{border-left-color:var(--bad)}
.alert.disc{border-left-color:#c79bff;background:rgba(34,18,52,.74)}
.alert b{font-weight:700}
.alert .a-k{font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer);display:block;margin-bottom:2px;font-weight:700}
.alert.fade{animation:alertOut .4s ease forwards}
@keyframes alertIn{from{opacity:0;transform:translateX(26px) scale(.96)}to{opacity:1;transform:none}}
@keyframes compatIn{from{opacity:0;transform:translate(-50%,10px) scale(.97)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes alertOut{to{opacity:0;transform:translateX(26px) scale(.97);margin-bottom:-34px}}

/* ── left chemistry rail ──────────────────────────────────────────────── */
#chem{
  position:fixed;z-index:20;left:calc(10px + var(--safe-l));
  top:calc(128px + var(--safe-t));width:216px;padding:10px 12px 11px;
  display:none;
}
#chem.show{display:block}
.chem-h{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dimmer);font-weight:700;margin:0 0 8px}
.ch{margin-bottom:8px}
.ch:last-child{margin-bottom:0}
.ch-row{display:flex;justify-content:space-between;align-items:baseline;font-size:11.5px;margin-bottom:3px}
.ch-row span{color:var(--dim)}
.ch-row b{font-weight:700;font-size:12px}
.ch-bar{height:4px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.ch-bar i{display:block;height:100%;border-radius:99px;transition:width .5s,background .5s}
.ch-bar u{position:absolute;top:-2px;height:8px;width:2px;background:rgba(255,255,255,.42);border-radius:2px}

/* ── panel (shop / pedia / etc) ───────────────────────────────────────── */
#panel{
  position:fixed;z-index:30;right:calc(10px + var(--safe-r));
  top:calc(96px + var(--safe-t));bottom:calc(70px + var(--safe-b));
  width:390px;max-width:calc(100vw - 20px);
  display:none;flex-direction:column;overflow:hidden;
}
#panel.show{display:flex;animation:panelIn .34s cubic-bezier(.16,1,.3,1)}
@keyframes panelIn{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
.p-head{display:flex;align-items:center;gap:10px;padding:12px 14px 10px;border-bottom:1px solid var(--line);flex:0 0 auto}
.p-title{font-size:14px;font-weight:700;letter-spacing:.01em;flex:1}
.p-x{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:17px;line-height:1}
.p-x:hover{background:rgba(255,255,255,.1);color:#fff}
.p-tabs{display:flex;gap:4px;padding:9px 10px;border-bottom:1px solid var(--line);flex:0 0 auto;overflow-x:auto;scrollbar-width:none}
.p-tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 10px;border-radius:8px;font-size:11.5px;font-weight:700;color:var(--dim);white-space:nowrap;letter-spacing:.02em}
.tab.on{background:rgba(110,220,255,.18);color:#fff}
.p-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:10px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent}
.p-body::-webkit-scrollbar{width:7px}
.p-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:9px}
.p-foot{flex:0 0 auto;padding:10px;border-top:1px solid var(--line);display:flex;gap:8px}

/* shop card */
.card{
  display:flex;gap:10px;padding:9px;border-radius:12px;margin-bottom:7px;
  background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);
  transition:background .15s,border-color .15s,transform .12s;cursor:pointer;align-items:flex-start;
}
.card:hover{background:rgba(255,255,255,.08);border-color:var(--line)}
.card.sel{background:rgba(90,200,255,.16);border-color:rgba(110,220,255,.5)}
.card.locked{opacity:.42;cursor:default}
.card.locked:hover{background:rgba(255,255,255,.035);border-color:rgba(255,255,255,.06)}
.card canvas,.card .swatch{
  width:52px;height:40px;border-radius:9px;flex:0 0 auto;
  background:radial-gradient(120% 120% at 30% 20%,#0b3a4e,#04202c);
  border:1px solid rgba(255,255,255,.07);
}
.c-main{flex:1;min-width:0}
.c-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;margin-bottom:2px}
.c-sci{font-size:10px;color:var(--dimmer);font-style:italic}
.c-desc{font-size:11.5px;color:var(--dim);line-height:1.35;margin-top:3px}
.c-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.pill{font-size:9.5px;padding:2px 6px;border-radius:6px;background:rgba(255,255,255,.08);color:var(--dim);font-weight:700;letter-spacing:.03em;white-space:nowrap}
.pill.fw{background:rgba(90,200,120,.18);color:#a7eec0}
.pill.sw{background:rgba(80,160,255,.2);color:#a9d0ff}
.pill.glow{background:rgba(190,120,255,.2);color:#dcb6ff}
.pill.pred{background:rgba(255,90,90,.2);color:#ffb0b0}
.pill.rare{background:rgba(255,210,110,.18);color:var(--gold)}
.c-price{font-size:13px;font-weight:800;color:var(--gold);flex:0 0 auto;text-align:right}
.c-price small{display:block;font-size:9.5px;color:var(--dimmer);font-weight:600}

/* compatibility preview */
#compat{
  position:fixed;z-index:31;left:50%;transform:translateX(-50%);
  bottom:calc(68px + var(--safe-b));
  padding:9px 14px;border-radius:12px;font-size:12.5px;font-weight:600;
  display:none;align-items:center;gap:9px;max-width:min(560px,calc(100vw - 24px));
  background:rgba(6,24,34,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);box-shadow:var(--shadow);
}
#compat.show{display:flex;animation:compatIn .3s cubic-bezier(.16,1,.3,1) both}
#compat .dot{width:9px;height:9px;border-radius:99px;flex:0 0 auto;box-shadow:0 0 10px currentColor}
#compat.g{border-color:rgba(84,224,166,.5)} #compat.g .dot{background:var(--good);color:var(--good)}
#compat.a{border-color:rgba(255,198,92,.5)} #compat.a .dot{background:var(--warn);color:var(--warn)}
#compat.r{border-color:rgba(255,107,107,.55)} #compat.r .dot{background:var(--bad);color:var(--bad)}
#compat .txt{flex:1;min-width:0;line-height:1.35}
#compat .txt b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);margin-bottom:1px}

/* ── inspector (clicked fish) ─────────────────────────────────────────── */
#inspect{
  position:fixed;z-index:22;left:calc(10px + var(--safe-l));
  bottom:calc(70px + var(--safe-b));width:244px;padding:11px 13px;display:none;
}
#inspect.show{display:block;animation:panelIn .3s cubic-bezier(.16,1,.3,1)}
.i-name{font-size:14px;font-weight:700;margin-bottom:1px}
.i-sci{font-size:10px;font-style:italic;color:var(--dimmer);margin-bottom:8px}
.i-stat{display:flex;justify-content:space-between;font-size:11.5px;margin-bottom:4px;color:var(--dim)}
.i-stat b{color:var(--text);font-weight:700}
.i-note{font-size:11.5px;color:var(--warn);margin-top:7px;line-height:1.35}
.i-acts{display:flex;gap:6px;margin-top:9px}

/* ── modal ────────────────────────────────────────────────────────────── */
#modal{
  position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;padding:18px;
  background:rgba(2,10,15,.62);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
#modal.show{display:flex;animation:fadeIn .26s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.m-box{
  width:min(660px,100%);max-height:min(88vh,760px);display:flex;flex-direction:column;overflow:hidden;
  animation:mIn .4s cubic-bezier(.16,1,.3,1);
}
@keyframes mIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.m-head{padding:16px 18px 12px;border-bottom:1px solid var(--line);flex:0 0 auto}
.m-kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:5px}
.m-title{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
.m-sub{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.45}
.m-body{padding:14px 18px;overflow-y:auto;flex:1;scrollbar-width:thin}
.m-body::-webkit-scrollbar{width:7px}
.m-body::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:9px}
.m-foot{padding:12px 18px 15px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex:0 0 auto;flex-wrap:wrap}
.m-body p{margin:0 0 10px;color:var(--dim);font-size:13px;line-height:1.55}
.m-body p b,.m-body b{color:var(--text)}
.m-body h4{margin:14px 0 7px;font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer)}

/* mode grid */
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:9px}
.mode{
  padding:12px;border-radius:13px;text-align:left;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);
  transition:background .16s,border-color .16s,transform .14s;
  position:relative;overflow:hidden;
}
.mode:hover{background:rgba(255,255,255,.09);border-color:var(--line-2);transform:translateY(-2px)}
.mode.locked{opacity:.4;pointer-events:none}
.mode i{display:block;font-size:19px;font-style:normal;margin-bottom:6px}
.mode b{display:block;font-size:13.5px;font-weight:700;margin-bottom:3px}
.mode span{font-size:11.5px;color:var(--dim);line-height:1.38;display:block}
.mode em{display:block;margin-top:7px;font-size:10px;font-style:normal;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700}

/* score table */
.score{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:4px}
.score td{padding:6px 4px;border-bottom:1px solid rgba(255,255,255,.07);color:var(--dim)}
.score td:last-child{text-align:right;color:var(--text);font-weight:700;font-variant-numeric:tabular-nums}
.score tr.tot td{border-bottom:0;border-top:1px solid var(--line-2);padding-top:9px;font-size:15px;color:var(--gold)}
.stars{font-size:22px;letter-spacing:5px;color:var(--gold);text-shadow:0 0 18px rgba(255,200,90,.45)}
.stars u{color:rgba(255,255,255,.14);text-decoration:none}

/* pedia entry */
.pedia{padding:10px 11px;border-radius:11px;margin-bottom:7px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.pedia.hidden-e{border-style:dashed;opacity:.55}
.pedia b{font-size:12.5px;display:block;margin-bottom:3px}
.pedia span{font-size:11.5px;color:var(--dim);line-height:1.4}

/* objectives */
.obj{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;padding:6px 0;color:var(--dim)}
.obj .box{width:15px;height:15px;border-radius:5px;border:1.5px solid var(--line-2);flex:0 0 auto;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:10px}
.obj.done{color:var(--good)}
.obj.done .box{background:var(--good);border-color:var(--good);color:#03121a;font-weight:900}

/* draft pick */
.picks{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:560px){.picks{grid-template-columns:1fr}}
.pick{padding:12px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);cursor:pointer;text-align:center;transition:all .16s}
.pick:hover{background:rgba(90,200,255,.14);border-color:var(--line-2);transform:translateY(-3px)}
.pick canvas{width:100%;height:66px;border-radius:9px;background:radial-gradient(120% 120% at 40% 25%,#0c4257,#04202c);margin-bottom:7px}
.pick b{display:block;font-size:13px;margin-bottom:3px}
.pick span{font-size:11px;color:var(--dim);display:block;line-height:1.35}

/* photo mode */
#photo{
  position:fixed;z-index:40;left:50%;transform:translateX(-50%);bottom:calc(14px + var(--safe-b));
  padding:10px 12px;display:none;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;
  max-width:calc(100vw - 20px);
}
#photo.show{display:flex}
.pc{display:flex;flex-direction:column;gap:4px;min-width:104px}
.pc label{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);font-weight:700}
.pc input[type=range]{width:100%;accent-color:#4fc8f0;height:16px}
.filters{display:flex;gap:4px}
.filters .fbt{padding:5px 9px;border-radius:8px;font-size:11px;font-weight:700;color:var(--dim);background:rgba(255,255,255,.05)}
.filters .fbt.on{background:rgba(110,220,255,.22);color:#fff}

/* toast + tutorial spotlight */
#toast{
  position:fixed;z-index:50;left:50%;top:calc(72px + var(--safe-t));transform:translateX(-50%);
  padding:11px 18px;border-radius:13px;font-size:14px;font-weight:700;display:none;
  background:rgba(6,24,34,.88);backdrop-filter:blur(16px);border:1px solid var(--line-2);
  box-shadow:var(--shadow);text-align:center;max-width:calc(100vw - 28px);
}
#toast.show{display:block;animation:toastIn .5s cubic-bezier(.16,1,.3,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px) scale(.94)}to{opacity:1;transform:translate(-50%,0)}}

#coach{

/* loading */
#load{
  position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(130% 110% at 50% 35%,#0a4460,#03121a 72%);
  transition:opacity .8s ease;
}
#load.gone{opacity:0;pointer-events:none}
#load h1{
  margin:0;font-size:clamp(34px,9vw,58px);font-weight:200;letter-spacing:.30em;
  text-indent:.30em;color:#cdf2ff;text-shadow:0 0 44px rgba(90,210,255,.5);
}
#load .tag{font-size:12px;letter-spacing:.26em;text-transform:uppercase;color:#63a6bf;text-indent:.26em}
#load .prog{width:180px;height:2px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}
#load .prog i{display:block;height:100%;width:20%;background:#6fe3ff;border-radius:9px;animation:sweep 1.5s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-120%)}100%{transform:translateX(560%)}}
#load .err{
  display:none;max-width:min(560px,90vw);padding:13px 15px;border-radius:12px;
  background:rgba(60,12,12,.7);border:1px solid rgba(255,120,120,.4);
  font-size:12.5px;line-height:1.5;color:#ffd6d6;text-align:left;
}
#load .err.show{display:block}
#load .err code{display:block;margin-top:7px;font-family:ui-monospace,Menlo,monospace;font-size:11px;color:#ffb0b0;word-break:break-word;max-height:130px;overflow:auto}

/* fish-follow banner */
#follow{
  position:fixed;z-index:22;left:50%;transform:translateX(-50%);
  top:calc(12px + var(--safe-t));padding:7px 14px;border-radius:11px;
  font-size:12px;font-weight:700;letter-spacing:.03em;display:none;align-items:center;gap:9px;
  background:rgba(6,24,34,.7);backdrop-filter:blur(14px);border:1px solid var(--line);
}
#follow.show{display:flex}
#follow .x{color:var(--dim);font-size:15px;line-height:1}

/* mobile */
@media (max-width:760px){
  #panel{width:calc(100vw - 20px);top:auto;bottom:calc(66px + var(--safe-b));height:min(55vh,440px)}

<!-- ── boot gate ───────────────────────────────────────────────────────────
     This MUST be an inline classic script. A module that fails to parse or
     fails to resolve an import cannot report itself: nothing in it runs, so
     the loading screen sits there forever and it looks exactly like a hang.
     The handler below catches resource-load failures (capture phase) and
     unhandled rejections and prints them on the loading screen, and the
     reload it offers busts the cache — a plain reload just re-serves the
     same broken pair of files.
     ─────────────────────────────────────────────────────────────────── -->
<script>
(function(){
  var errBox = document.getElementById('load-err');
  var reported = false;
  function report(what, detail){
    if (reported) return; reported = true;
    if (!errBox) return;
    errBox.className = 'err show';
    errBox.innerHTML = '<b>Tidekeeper could not start.</b><br>' + what +
      '<code>' + String(detail || '').replace(/[<>&]/g, function(c){
        return ({'<':'&lt;','>':'&gt;','&':'&amp;'})[c]; }) + '</code>' +
      '<div style="margin-top:10px"><button id="boot-reload" style="font:inherit;padding:7px 13px;' +
      'border-radius:9px;border:1px solid rgba(255,160,160,.45);background:rgba(255,120,120,.16);' +
      'color:#fff;cursor:pointer">Reload (clear cache)</button></div>';
    var b = document.getElementById('boot-reload');
    if (b) b.onclick = function(){ location.replace(location.pathname + '?v=' + Date.now()); };
  }
  window.addEventListener('error', function(e){
    if (e.target && e.target !== window && (e.target.src || e.target.href)) {
      report('A file failed to load. Usually a stale cache after a deploy.', e.target.src || e.target.href);
    } else {
      report('A script error stopped the boot.', (e.message || e.error) + ' @ ' + (e.filename||'') + ':' + (e.lineno||''));
    }
  }, true);
  window.addEventListener('unhandledrejection', function(e){
    report('A promise rejected during boot.', (e.reason && (e.reason.stack || e.reason.message)) || e.reason);
  });
  // Backstop: nothing threw, but the game never announced itself.
  setTimeout(function(){
    if (!window.__TIDEKEEPER_BOOTED__) {
      report('The game did not finish starting within 14 seconds. ' +
             'If this machine has no WebGL2 the renderer cannot come up.', 'boot timeout');
    }
  }, 14000);
})();
</script>
