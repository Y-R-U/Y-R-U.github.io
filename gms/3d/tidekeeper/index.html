        void main(){
          float f = pow(1.0 - abs(dot(normalize(vN), normalize(vV))), 3.0);
          float c = tkCaustic(vec2(vWP.x + vWP.z, vWP.y * 1.5) * 0.09, uTime * 0.3) * uCaustic * (1.0 - uNight*0.85);
          float a = f * 0.30 + c * 0.09 * smoothstep(0.0, 1.2, vWP.y);
          gl_FragColor = vec4(vec3(0.58,0.84,0.96), a * 0.9);
        }`,
    });
    const panes = add(new THREE.Mesh(new THREE.BoxGeometry(W + 0.06, H + 0.08, D + 0.06), glass));
    panes.position.y = (H + 0.08) / 2 - 0.04;

    const sil = new THREE.MeshStandardMaterial({ color: 0x05090c, roughness: 0.5, metalness: 0.35 });
    const t = 0.055;
    const edge = (w, h, d, x, y, z) => { const b = add(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), sil)); b.position.set(x, y, z); };
    const W2 = W + 0.09, D2 = D + 0.09, H2 = H + 0.02;
    for (const yy of [0.0, H2]) { edge(W2 + t, t, t, 0, yy, D2 / 2); edge(W2 + t, t, t, 0, yy, -D2 / 2);
                                  edge(t, t, D2, W2 / 2, yy, 0); edge(t, t, D2, -W2 / 2, yy, 0); }
    for (const sx of [1, -1]) for (const sz of [1, -1]) edge(t, H2, t, sx * W2 / 2, H2 / 2, sz * D2 / 2);

    /* cabinet + floor sit relative to the tank */
    this.cabinet.scale.set(W + 0.35, 7, D + 0.3);
    this.cabinet.position.set(0, -3.5, 0);
    this.floor.position.y = -7;

    this.lamp.position.set(0, H + 1.1, 0);
    this.lamp.distance = Math.max(W, D) * 3.2;
    return this;
  },
});

/* ── planting ────────────────────────────────────────────────────────────── */
function bladeCluster(o) {
  const G = new GeoBuf();
  const { blades, segs, len, wide, lean, curl, col0, col1, taper, ripple } = o;
  for (let b = 0; b < blades; b++) {
    const yaw = (b / blades) * TAU + rr(-0.3, 0.3);
    const outLean = lean * (0.4 + rnd() * 0.8);
    const L = len * (0.55 + rnd() * 0.62);
    const w = wide * (0.7 + rnd() * 0.6);
    const twist = rr(-1, 1) * curl;
    const rowA = [], rowB = [];
    for (let s = 0; s <= segs; s++) {
      const u = s / segs;
      const bend = Math.pow(u, 1.7) * outLean;
      const y = u * L * (1 - bend * 0.22);
      const rad = bend * L;
      const x = Math.cos(yaw) * rad, z = Math.sin(yaw) * rad;
      const hw = w * Math.pow(1 - u, taper) * (1 + Math.sin(u * 5 + b) * ripple);
      const nx = -Math.sin(yaw + twist * u), nz = Math.cos(yaw + twist * u);
      const k = u;
      const c = [lerp(col0[0], col1[0], k), lerp(col0[1], col1[1], k), lerp(col0[2], col1[2], k), 0];
      rowA.push(G.vert(x + nx * hw, y, z + nz * hw, c, u, FIN.BODY, Z3));
      rowB.push(G.vert(x - nx * hw, y, z - nz * hw, c, u, FIN.BODY, Z3));
    }
    for (let s = 0; s < segs; s++) G.quad(rowA[s], rowB[s], rowB[s + 1], rowA[s + 1]);
  }
  return G;
}

function buildPlantGeo(kind) {
  let G;
  switch (kind) {
    case 'ribbon':
      G = bladeCluster({ blades: 11, segs: 9, len: 1.0, wide: 0.055, lean: 0.42, curl: 1.5,
        col0: [0.10, 0.34, 0.14], col1: [0.36, 0.72, 0.28], taper: 0.55, ripple: 0.16 }); break;
    case 'broad':
      G = bladeCluster({ blades: 9, segs: 7, len: 0.62, wide: 0.13, lean: 0.62, curl: 0.5,
        col0: [0.07, 0.28, 0.12], col1: [0.34, 0.66, 0.24], taper: 0.9, ripple: 0.05 }); break;
    case 'fern':
      G = bladeCluster({ blades: 10, segs: 6, len: 0.5, wide: 0.075, lean: 0.75, curl: 0.9,
        col0: [0.06, 0.22, 0.11], col1: [0.20, 0.46, 0.19], taper: 0.7, ripple: 0.28 }); break;
    case 'carpet':
      G = bladeCluster({ blades: 34, segs: 3, len: 0.2, wide: 0.016, lean: 0.35, curl: 0.4,
        col0: [0.12, 0.38, 0.14], col1: [0.42, 0.80, 0.30], taper: 0.4, ripple: 0 }); break;
    case 'grape': {
      G = bladeCluster({ blades: 7, segs: 5, len: 0.5, wide: 0.02, lean: 0.55, curl: 0.7,
        col0: [0.10, 0.30, 0.14], col1: [0.30, 0.58, 0.22], taper: 0.3, ripple: 0 });
      for (let i = 0; i < 26; i++) {
        const a = rnd() * TAU, r = rr(0.05, 0.34), y = rr(0.12, 0.52);
        addBall(G, Math.cos(a) * r, y, Math.sin(a) * r, rr(0.035, 0.06),
                [0.24, 0.56, 0.22, 0], y / 0.6, FIN.BODY, 4, 6);
      }
      break;
    }
    default: G = bladeCluster({ blades: 9, segs: 7, len: 0.7, wide: 0.07, lean: 0.5, curl: 0.8,
      col0: [0.08, 0.3, 0.13], col1: [0.32, 0.66, 0.24], taper: 0.7, ripple: 0.1 });
  }
  return G.build();
}

function plantMaterial() {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.78, metalness: 0.0, side: THREE.DoubleSide });
  m.onBeforeCompile = sh => {
    sh.uniforms.uTime = WORLD_UNIFORMS.uTime;
    sh.uniforms.uFlow = { value: 0.4 };
    m.userData.sh = sh;
    sh.vertexShader = `
      attribute float aSeg; attribute vec3 aPhase; uniform float uTime; uniform float uFlow;
    ` + sh.vertexShader.replace('#include <begin_vertex>', `
      #include <begin_vertex>
      float h = aSeg * aSeg;
      float ph = aPhase.x;
      float sway = sin(uTime * (0.55 + aPhase.y * 0.4) + ph) * (0.09 + uFlow * 0.22);
      float sway2 = sin(uTime * 0.31 + ph * 1.7) * 0.05;
      transformed.x += (sway + sway2) * h;
      transformed.z += cos(uTime * (0.42 + aPhase.z * 0.3) + ph * 1.3) * (0.06 + uFlow * 0.16) * h;
      transformed.y -= h * (abs(sway) * 0.22);
    `);
  };
  return m;
}

/* ── decor ───────────────────────────────────────────────────────────────── */
function buildDecorMesh(id) {
  const g = new THREE.Group();
  const rock = (c = 0x4b4e48) => new THREE.MeshStandardMaterial({ color: c, roughness: 0.92, metalness: 0.04, flatShading: true });
  switch (id) {
    case 'cave': {
      const m = rock(0x3f4642);
      for (let i = 0; i < 7; i++) {
        const s = rr(0.22, 0.5);
        const b = new THREE.Mesh(new THREE.DodecahedronGeometry(s, 0), m);
        const a = (i / 7) * Math.PI + 0.15;
        b.position.set(Math.cos(a) * 0.52, 0.1 + Math.sin(a) * 0.42, rr(-0.12, 0.12));
        b.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
        g.add(b);
      }
      break;
    }
    case 'rock': case 'rockpile': {
      const m = rock(0x474a52);
      for (let i = 0; i < 9; i++) {
        const b = new THREE.Mesh(new THREE.BoxGeometry(rr(0.3, 0.72), rr(0.07, 0.16), rr(0.28, 0.6)), m);
        b.position.set(rr(-0.2, 0.2), 0.05 + i * 0.11, rr(-0.15, 0.15));
        b.rotation.y = rnd() * 3;
        b.rotation.z = rr(-0.12, 0.12);
        g.add(b);
      }
      break;
    }
    case 'wood': case 'driftwood': {
      const m = new THREE.MeshStandardMaterial({ color: 0x5a3f2a, roughness: 0.95, flatShading: true });
      const branch = (x, y, z, len, rad, ax, az, depth) => {
        const b = new THREE.Mesh(new THREE.CylinderGeometry(rad * 0.65, rad, len, 6), m);
        b.position.set(x, y + len / 2, z); b.rotation.set(ax, rnd() * 3, az);
        g.add(b);
        if (depth > 0) for (let i = 0; i < 2; i++)
          branch(x + Math.sin(az) * len * 0.4 + rr(-0.1, 0.1), y + len * 0.75, z + rr(-0.1, 0.1),
                 len * 0.62, rad * 0.6, ax + rr(-0.5, 0.5), az + rr(-0.7, 0.7), depth - 1);
      };
      branch(0, 0, 0, 0.7, 0.11, 0, 0.25, 2);
      break;
    }
    case 'anemone': {
      const base = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.30, 0.24, 10),
        new THREE.MeshStandardMaterial({ color: 0x8c4a5e, roughness: 0.8 }));
      base.position.y = 0.12; g.add(base);
      const tm = new THREE.MeshStandardMaterial({ color: 0xd9707e, roughness: 0.45,
        emissive: 0x5a1030, emissiveIntensity: 0.5, flatShading: true });
      const T = new GeoBuf();
      for (let i = 0; i < 46; i++) {
        const a = rnd() * TAU, r = Math.sqrt(rnd()) * 0.27;
        const len = rr(0.16, 0.34), lean = rr(0.2, 0.7);
        const rowA = [], rowB = [];
        for (let s = 0; s <= 4; s++) {
          const u = s / 4, w = 0.030 * (1 - u * 0.4) * (1 + Math.sin(u * 6) * 0.35);
          const x = Math.cos(a) * (r + u * len * lean), z = Math.sin(a) * (r + u * len * lean);
          const y = 0.22 + u * len;
          const c = [lerp(0.90, 0.55, u), lerp(0.40, 0.30, u), lerp(0.50, 0.72, u), u * 0.8];
          rowA.push(T.vert(x + w, y, z, c, u, FIN.TENT, Z3));
          rowB.push(T.vert(x - w, y, z + w * 0.6, c, u, FIN.TENT, Z3));
        }
        for (let s = 0; s < 4; s++) T.quad(rowA[s], rowB[s], rowB[s + 1], rowA[s + 1]);
      }
      const tg = T.build();
      const tmesh = new THREE.Mesh(tg, anemoneMaterial());
      g.add(tmesh);
      break;
    }
    case 'coral': {
      const m = new THREE.MeshStandardMaterial({ color: 0xd98a5a, roughness: 0.72,
        emissive: 0x50201a, emissiveIntensity: 0.35, flatShading: true });
      const arm = (x, y, z, len, rad, tilt, depth) => {
        const b = new THREE.Mesh(new THREE.CylinderGeometry(rad * 0.55, rad, len, 5), m);
        b.position.set(x, y + len / 2, z);
        b.rotation.set(tilt * rr(0.6, 1.2), rnd() * 3, tilt * rr(-1, 1));
        g.add(b);
        if (depth > 0) for (let i = 0; i < 3; i++)
          arm(x + rr(-0.13, 0.13), y + len * 0.7, z + rr(-0.13, 0.13), len * 0.6, rad * 0.62, tilt * 1.3, depth - 1);
      };
      arm(0, 0, 0, 0.42, 0.075, 0.16, 2);
      break;
    }
    case 'bubbler': {
      const bar = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.07, 0.09),
        new THREE.MeshStandardMaterial({ color: 0x1d2a30, roughness: 0.6 }));
      bar.position.y = 0.05; g.add(bar);
      g.userData.bubbleBar = 1.1;
      break;
    }
    case 'wreck': {
      const hull = new THREE.MeshStandardMaterial({ color: 0x4a4438, roughness: 0.95, flatShading: true });
      const body = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.30, 1.9, 7, 1, false, 0, Math.PI), hull);
      body.rotation.z = Math.PI / 2; body.rotation.x = 0.5; body.position.y = 0.32;
      g.add(body);
      const cab = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.34, 0.42), hull);
      cab.position.set(-0.22, 0.56, 0.05); cab.rotation.x = 0.5; g.add(cab);
      const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.045, 1.0, 5), hull);
      mast.position.set(0.35, 0.7, 0); mast.rotation.z = -0.5; g.add(mast);
      break;
    }
  }
  g.traverse(o => { if (o.isMesh) o.castShadow = false; });
  return g;
}

function anemoneMaterial() {
  const m = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.4, metalness: 0,
    side: THREE.DoubleSide, emissive: 0x2a0714, emissiveIntensity: 0.7 });
  m.onBeforeCompile = sh => {
    sh.uniforms.uTime = WORLD_UNIFORMS.uTime;
    sh.vertexShader = 'attribute float aSeg; attribute float aGlow; uniform float uTime; varying float vG;\n' +
      sh.vertexShader.replace('#include <begin_vertex>', `
        #include <begin_vertex>
        vG = aGlow;
        float h = aSeg * aSeg;
        transformed.x += sin(uTime * 1.15 + transformed.z * 7.0 + transformed.y * 3.0) * 0.045 * h;
        transformed.z += cos(uTime * 0.95 + transformed.x * 7.0) * 0.045 * h;`);
    sh.fragmentShader = 'varying float vG;\n' + sh.fragmentShader.replace('#include <dithering_fragment>',
      '#include <dithering_fragment>\n gl_FragColor.rgb += vec3(0.55,0.12,0.30) * vG * 0.5;');
  };
  return m;
}

function disposeDeep(o) {
  o.traverse?.(c => { if (c.geometry) c.geometry.dispose(); });
}

Object.assign(World.prototype, {

  /* ── place the hardscape. Deterministic, so a tank looks the same on reload. ── */
  layout(T) {
    const [W, H, D] = this.dims;
    const R = rngFrom(1337 + T.plants.length * 31 + T.decor.length * 17 + T.tankId.length);
    T.decor.forEach((d, i) => {
      const n = T.decor.length;
      d.x = (n === 1 ? 0 : -W * 0.32 + (i / (n - 1)) * W * 0.64) + (R() - 0.5) * W * 0.08;
      d.z = -D * 0.14 + (R() - 0.5) * D * 0.34;
      d.rot = R() * TAU;
      d.scale = 0.8 + R() * 0.35;
    });
    T.plants.forEach((p, i) => {
      const n = T.plants.length;
      const band = i % 3;
      p.x = (n === 1 ? -W * 0.2 : -W * 0.42 + (i / Math.max(1, n - 1)) * W * 0.84) + (R() - 0.5) * 0.5;
      p.z = -D * 0.32 + band * D * 0.20 + (R() - 0.5) * 0.22;
      p.rot = R() * TAU;
      p.scale = 0.75 + R() * 0.5;
    });
  },

  syncContents(T) {
    this.layout(T);
    /* plants: one instanced mesh per kind */
    const byKind = new Map();
    for (const p of T.plants) {
      const k = PL[p.id].kind;
      if (!byKind.has(k)) byKind.set(k, []);
      byKind.get(k).push(p);
    }
    for (const [k, mesh] of this.plantMeshes) if (!byKind.has(k)) { this.tankGroup.remove(mesh); mesh.geometry.dispose(); this.plantMeshes.delete(k); }
    for (const [k, list] of byKind) {
      let mesh = this.plantMeshes.get(k);
      if (!mesh || mesh.count < list.length || mesh.instanceMatrix.count < list.length) {
        if (mesh) { this.tankGroup.remove(mesh); mesh.geometry.dispose(); }
        const geo = buildPlantGeo(k);
        const cap = Math.max(8, list.length + 6);
        const ph = new THREE.InstancedBufferAttribute(new Float32Array(cap * 3), 3);
        for (let i = 0; i < cap; i++) { ph.setXYZ(i, rnd() * TAU, rnd(), rnd()); }
        geo.setAttribute('aPhase', ph);
        mesh = new THREE.InstancedMesh(geo, plantMaterial(), cap);
        mesh.frustumCulled = false;
        this.plantMeshes.set(k, mesh);
        this.tankGroup.add(mesh);
      }
      mesh.count = list.length;
      list.forEach((p, i) => {
        const s = (PL[p.id].height) * 2.6 * p.scale * (0.45 + 0.55 * p.health) * (this.dims[1] / 3);
        _m4.compose(_v3.set(p.x, 0.04, p.z), _q.setFromEuler(_e.set(0, p.rot, 0)), _v3b.set(s, s, s));
        mesh.setMatrixAt(i, _m4);
      });
      mesh.instanceMatrix.needsUpdate = true;
    }
    /* decor: real groups, they are few and each is distinctive */
    for (const m of this.decorMeshes) { this.tankGroup.remove(m); disposeDeep(m); }
    this.decorMeshes = [];
    this.bubbleBars = [];
    for (const d of T.decor) {
      const g = buildDecorMesh(DEC[d.id].kind);
      const s = d.scale * (this.dims[1] / 3) * 1.02;
      g.position.set(d.x, 0.03, d.z); g.rotation.y = d.rot; g.scale.setScalar(s);
      g.userData.item = d;
      this.tankGroup.add(g);
      this.decorMeshes.push(g);
      if (DEC[d.id].kind === 'bubbler') this.bubbleBars.push({ x: d.x, z: d.z, w: 1.1 * s });
      if (DEC[d.id].host) d.worldPos = new THREE.Vector3(d.x, 0.45 * s, d.z);
      d.worldPos = d.worldPos || new THREE.Vector3(d.x, 0.4 * s, d.z);
    }
    /* fish batches */
    const need = new Set(T.fish.map(f => f.sp.id));
    for (const [id, b] of this.batches) if (!need.has(id)) { this.tankGroup.remove(b.mesh); b.dispose(); this.batches.delete(id); }
    for (const id of need) if (!this.batches.has(id)) {
      const b = new SpeciesBatch(SP[id], 70);
      this.batches.set(id, b);
      this.tankGroup.add(b.mesh);
    }
  },

  /* ── per-frame: push every fish into its instance slot ────────────────── */
  updateFish(T, camera) {
    for (const b of this.batches.values()) { b.mesh.count = 0; b.fishAt.length = 0; }
    let shadowN = 0;
    const sm = this.shadows;
    for (const f of T.fish) {
      const b = this.batches.get(f.sp.id);
      if (!b || b.mesh.count >= b.cap) continue;
      const i = b.mesh.count++;
      b.fishAt[i] = f;
      const scale = (f.len / 10) * (f.alive ? 1 : 1);
      const dir = _v3.copy(f.vel);
      if (dir.lengthSq() < 1e-6) dir.set(1, 0, 0); else dir.normalize();

      if (f.sp.shape === 'seahorse' || f.sp.shape === 'snail') {
        const yaw = Math.atan2(dir.z, dir.x);
        _q.setFromEuler(_e.set(0, -yaw, f.alive ? 0 : 1.7, 'YXZ'));
      } else if (!f.alive) {
        _q.setFromEuler(_e.set(Math.PI, Math.atan2(dir.z, dir.x) * -1, 0, 'YXZ'));  // belly up
      } else {
        const X = _v3, Z = _v3b.copy(UPV).cross(X);
        if (Z.lengthSq() < 1e-5) Z.set(0, 0, 1);
        Z.normalize().multiplyScalar(-1);
        const Y = _v3c.copy(Z).cross(X).normalize();
        _m4.makeBasis(X, Y, Z);
        _q.setFromRotationMatrix(_m4);
        if (f.bank) _q.multiply(_qb.setFromAxisAngle(FWD, f.bank));
      }
      _m4.compose(f.pos, _q, _v3c.set(scale, scale, scale));
      b.mesh.setMatrixAt(i, _m4);

      /* per-instance animation + condition */
      const speed = f.vel.length();
      const beat = clamp(2.2 + speed * 9 * f.sp.activity, 1.4, 17) * (f.alive ? 1 : 0.06);
      const amp = (0.055 + clamp(speed * 0.55, 0, 0.075)) * (f.alive ? 1 : 0.12);
      b.anim.setXYZW(i, f.phase, beat, amp, beat * 1.45);
      b.state.setXYZW(i, f.alive ? 1 : 0.25, f.finDamage, f.sick, f.flash);
      const cond = f.alive ? (0.55 + 0.45 * f.health) : 0.35;
      const t = f.tint * cond;
      _col.setRGB(t, t * (f.sick > 0.3 ? 0.96 : 1), t * (f.sick > 0.3 ? 0.98 : 1));
      b.mesh.setColorAt(i, _col);

      /* contact shadow */
      if (f.alive && shadowN < sm.count + 118 && f.pos.y < this.dims[1] * 0.8) {
        const h = clamp(f.pos.y / (this.dims[1] * 0.8), 0, 1);
        const s = scale * (2.1 + h * 2.6);
        _m4.compose(_v3.set(f.pos.x, f.pos.z, -0.055 - h * 0.02), _q.set(0, 0, 0, 1), _v3b.set(s, s * 0.6, 1));
        sm.setMatrixAt(shadowN++, _m4);
      }
    }
    sm.count = shadowN; sm.instanceMatrix.needsUpdate = true;
    for (const b of this.batches.values()) {
      b.mesh.instanceMatrix.needsUpdate = true;
      b.anim.needsUpdate = true; b.state.needsUpdate = true;
      if (b.mesh.instanceColor) b.mesh.instanceColor.needsUpdate = true;
    }
  },

  /* ── bubbles ──────────────────────────────────────────────────────────── */
  spawnBubble(x, y, z, r) {
    if (this.bubbleList.length >= this.bubbleCap) return;
    this.bubbleList.push({ x, y, z, r, vy: rr(0.55, 1.0), ph: rnd() * TAU, life: 0 });
  },
  updateBubbles(dt, T) {
    const H = this.dims[1];
    if (this.bubbleBars) for (const bar of this.bubbleBars)
      if (rnd() < dt * 26) this.spawnBubble(bar.x + rr(-bar.w / 2, bar.w / 2), 0.08, bar.z, rr(0.012, 0.032));
    if (T && T.powerOut <= 0 && rnd() < dt * (2 + flowOf(T) * 5))
      this.spawnBubble(rr(-this.dims[0] * 0.45, this.dims[0] * 0.45), 0.1, -this.dims[2] * 0.35, rr(0.008, 0.02));
    let n = 0;
    for (let i = this.bubbleList.length - 1; i >= 0; i--) {
      const b = this.bubbleList[i];
      b.life += dt;
      b.y += b.vy * dt * (0.7 + b.r * 8);
      b.x += Math.sin(b.life * 5.5 + b.ph) * dt * 0.14;
      b.z += Math.cos(b.life * 4.1 + b.ph) * dt * 0.11;
      if (b.y > H - 0.03) { this.bubbleList.splice(i, 1); continue; }
      if (n < this.bubbleCap) {
        _m4.compose(_v3.set(b.x, b.y, b.z), _q.set(0, 0, 0, 1), _v3b.set(b.r, b.r, b.r));
        this.bubbles.setMatrixAt(n++, _m4);
      }
    }
    this.bubbles.count = n; this.bubbles.instanceMatrix.needsUpdate = true;

    const m = 0.30 + f.len / 30;
    if (f.pos.x >  hx - m) acc.x -= (f.pos.x - (hx - m)) * 9;
    if (f.pos.x < -hx + m) acc.x += ((-hx + m) - f.pos.x) * 9;
    if (f.pos.z >  hz - m) acc.z -= (f.pos.z - (hz - m)) * 9;
    if (f.pos.z < -hz + m) acc.z += ((-hz + m) - f.pos.z) * 9;
    const yLo = 0.09 + f.len / 90, yHi = H - 0.12 - f.len / 90;
    if (f.pos.y < yLo) acc.y += (yLo - f.pos.y) * 11;
    if (f.pos.y > yHi) acc.y -= (f.pos.y - yHi) * 11;
    /* the zone each species actually lives in */
    const zy = zoneY(sp, H, f);
    acc.y += (zy - f.pos.y) * (sp.zone === 'any' ? 0.25 : 0.9) * (f.mood === 'feed' || f.mood === 'flee' ? 0.25 : 1);
    /* current */
    acc.x += Math.sin(performance.now() * 0.00021 + f.pos.z) * flow * 0.28;

    /* ── integrate ──────────────────────────────────────────────────────── */
    const sick = 1 - clamp(f.sick, 0, 1) * 0.55;
    const stressed = 1 - clamp(f.stress - 0.6, 0, 1) * 0.3;
    const maxSpd = speed * (f.mood === 'strike' ? 4.5 : f.mood === 'flee' ? 3.0
                          : f.mood === 'chase' ? 2.4 : f.mood === 'stalk' ? 1.1 : 1.35) * sick * stressed;
    f.vel.addScaledVector(acc, dt * 2.2);
    if (f.vel.length() > maxSpd) f.vel.setLength(maxSpd);
    if (f.vel.lengthSq() < 1e-6) f.vel.set(rr(-0.1, 0.1), 0, rr(-0.1, 0.1));
    f.pos.addScaledVector(f.vel, dt);
    f.pos.x = clamp(f.pos.x, -hx, hx); f.pos.z = clamp(f.pos.z, -hz, hz);
    f.pos.y = clamp(f.pos.y, 0.06, H - 0.06);
    /* bank into the turn — cheap, and it is most of what makes them look alive */
    const turn = _s2.copy(f.vel).normalize().cross(_s3.copy(f.lastDir || FWD)).y;
    f.bank = lerp(f.bank || 0, clamp(turn * 6, -0.65, 0.65), clamp(dt * 4, 0, 1));
    f.lastDir = (f.lastDir || new THREE.Vector3()).copy(f.vel).normalize();
    f.phase += dt * 0.1;
  }

  /* ── nipping ───────────────────────────────────────────────────────────
     The species that shred fins go and find them rather than waiting for a
     guppy to blunder past. This is the single most-reported "why did that
     happen" in the game, so it has to happen reliably enough to learn. */
  const barbs = live.filter(x => x.sp.id === 'barb').length;
  for (const f of live) {
    const nips = f.sp.id === 'betta' || f.sp.id === 'puffer' || (f.sp.id === 'barb' && barbs < 6);
    if (!nips || f.len < f.sp.size * 0.55) continue;
    let vic = null, bd = 1e9;
    for (const o of live) {
      if (o === f) continue;
      const veil = o.sp.body.veil || 0;
      if (!(veil >= 0.5 || (f.sp.id === 'betta' && o.sp.id === 'betta'))) continue;
      const d = o.pos.distanceTo(f.pos);
      if (d < bd) { bd = d; vic = o; }
    }
    if (!vic) continue;
    if (bd < W * 0.7) {
      f.vel.addScaledVector(_s1.copy(vic.pos).sub(f.pos).normalize(), cruiseSpeed(f) * dt * 6.0);
      if (f.vel.length() > cruiseSpeed(f) * 2.4) f.vel.setLength(cruiseSpeed(f) * 2.4);
      f.mood = 'chase';
    }
    if (bd < 0.3 + f.len / 30) G.contact(f, vic, T);
  }

  /* ── food particles ────────────────────────────────────────────────────── */
  for (const p of T.food) {
    if (p.settled) continue;
    p.pos.y -= (0.12 + FD[p.type].sink * 0.85) * dt;
    p.pos.x += Math.sin(performance.now() * 0.0004 + p.seed) * flow * 0.16 * dt;
    p.pos.z += Math.cos(performance.now() * 0.0003 + p.seed) * flow * 0.14 * dt;
    if (p.pos.y <= 0.07) { p.pos.y = 0.07; p.settled = true; }
  }
}

/* ── food, drawn as a drifting cloud of crumbs ───────────────────────────── */
Object.assign(World.prototype, {
  buildFood() {
    const N = 420;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
    g.setAttribute('aSize', new THREE.BufferAttribute(new Float32Array(N), 1));
    g.setAttribute('aCol', new THREE.BufferAttribute(new Float32Array(N * 3), 3));
    const m = new THREE.ShaderMaterial({
      transparent: true, depthWrite: false,
      uniforms: { uPix: { value: 1 } },
      vertexShader: `attribute float aSize; attribute vec3 aCol; varying vec3 vC; uniform float uPix;
        void main(){ vC = aCol; vec4 mv = modelViewMatrix * vec4(position,1.0);
          gl_PointSize = aSize * uPix * 42.0 / max(1.0, -mv.z);
          gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `varying vec3 vC;
        void main(){ float r = 1.0 - smoothstep(0.2,0.5,length(gl_PointCoord-0.5));
          if (r < 0.02) discard; gl_FragColor = vec4(vC, r); }`,
    });
    this.foodPts = new THREE.Points(g, m);
    this.foodPts.frustumCulled = false;
    this.tankGroup.add(this.foodPts);
    this.foodCap = N;
  },
  updateFood(T) {
    if (!this.foodPts) this.buildFood();
    const g = this.foodPts.geometry;
    const p = g.attributes.position.array, s = g.attributes.aSize.array, c = g.attributes.aCol.array;
    const tone = { flake: [0.85, 0.66, 0.34], pellet: [0.52, 0.35, 0.18], micro: [0.95, 0.72, 0.55],
                   meaty: [0.85, 0.42, 0.40], wafer: [0.35, 0.45, 0.20] };
    let n = 0;
    for (const q of T.food) {
      if (n >= this.foodCap) break;
      p[n * 3] = q.pos.x; p[n * 3 + 1] = q.pos.y; p[n * 3 + 2] = q.pos.z;
      s[n] = q.mass * 26 + 0.05;
      const t = tone[q.type] || tone.flake;
      c[n * 3] = t[0]; c[n * 3 + 1] = t[1]; c[n * 3 + 2] = t[2];
      n++;
    }
    g.setDrawRange(0, n);
    g.attributes.position.needsUpdate = true; g.attributes.aSize.needsUpdate = true; g.attributes.aCol.needsUpdate = true;
  },
});

/* ═══════════════════════════════════════════════════════════════════════════
   7. SOUND
   All synthesised. A filtered noise bed for the water, a hum for the filter,
   a bloop for a bubble, a real splash when a fish goes in.
   ═══════════════════════════════════════════════════════════════════════════ */

const Audio = {
  ctx: null, master: null, bed: null, on: true, started: false,
  init() {
    if (this.ctx) return;
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.on = false; return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = 0.0; this.master.connect(c.destination);

    /* water bed: brown-ish noise through a low shelf, with a slow wobble */
    const len = c.sampleRate * 4;
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + 0.02 * w) / 1.02; d[i] = last * 3.2; }
    const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420; lp.Q.value = 0.6;
    const bedGain = c.createGain(); bedGain.gain.value = 0.35;
    src.connect(lp); lp.connect(bedGain); bedGain.connect(this.master);
    src.start();
    const lfo = c.createOscillator(); lfo.frequency.value = 0.07;
    const lfoG = c.createGain(); lfoG.gain.value = 140;
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    this.bedFilter = lp; this.bedGain = bedGain;

    /* filter hum */
    const hum = c.createOscillator(); hum.type = 'sawtooth'; hum.frequency.value = 51;
    const humF = c.createBiquadFilter(); humF.type = 'lowpass'; humF.frequency.value = 160;
    const humG = c.createGain(); humG.gain.value = 0.022;
    hum.connect(humF); humF.connect(humG); humG.connect(this.master); hum.start();
    this.humGain = humG;

    this.started = true;
  },
  resume() { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  fadeIn() { if (!this.ctx) return; this.master.gain.cancelScheduledValues(this.ctx.currentTime);
             this.master.gain.linearRampToValueAtTime(this.on ? 0.6 : 0, this.ctx.currentTime + 2.5); },
  setVolume(v) { this.on = v > 0; if (this.ctx) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.3); },
  night(n) { if (this.bedFilter) this.bedFilter.frequency.setTargetAtTime(420 - n * 180, this.ctx.currentTime, 1.5); },
  flow(f) { if (this.humGain) this.humGain.gain.setTargetAtTime(0.012 + f * 0.03, this.ctx.currentTime, 1.0); },

  blip(freq = 620, dur = 0.09, type = 'sine', vol = 0.09) {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime);
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(vol, c.currentTime + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
    o.connect(g); g.connect(this.master); o.start(); o.stop(c.currentTime + dur + 0.02);
  },
  bubble() {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    const f0 = 280 + Math.random() * 500;
    o.type = 'sine';
    o.frequency.setValueAtTime(f0 * 0.5, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(f0 * 1.9, c.currentTime + 0.07);
    g.gain.setValueAtTime(0.0001, c.currentTime);
    g.gain.linearRampToValueAtTime(0.05, c.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + 0.09);
    o.connect(g); g.connect(this.master); o.start(); o.stop(c.currentTime + 0.12);
  },
  splash() {
    if (!this.ctx || !this.on) return;
    const c = this.ctx, len = Math.floor(c.sampleRate * 0.55);
    const b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const t = i / len;
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - t, 2.2) * (t < 0.05 ? t / 0.05 : 1);
    }
    const s = c.createBufferSource(); s.buffer = b;
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 900; f.Q.value = 0.8;
    f.frequency.setValueAtTime(1800, c.currentTime);
    f.frequency.exponentialRampToValueAtTime(380, c.currentTime + 0.45);
    const g = c.createGain(); g.gain.value = 0.5;
    s.connect(f); f.connect(g); g.connect(this.master); s.start();
    for (let i = 0; i < 5; i++) setTimeout(() => this.bubble(), 90 + i * 70 + Math.random() * 80);
  },
  chime(good = true) {
    if (!this.ctx || !this.on) return;
    const notes = good ? [523.25, 659.25, 783.99] : [392, 329.63, 261.63];
    notes.forEach((n, i) => setTimeout(() => this.blip(n, 0.5, 'triangle', 0.07), i * 95));
  },
  alarm() {
    if (!this.ctx || !this.on) return;
    [0, 1].forEach(i => setTimeout(() => this.blip(233, 0.3, 'square', 0.05), i * 240));
  },
  click() { this.blip(1200, 0.035, 'sine', 0.035); },
};

/* ═══════════════════════════════════════════════════════════════════════════
   8. CAMERA
   Orbit with mouse or one finger, pinch to zoom, and a cinematic follow that
   swings round behind whatever you clicked and stays with it.
   ═══════════════════════════════════════════════════════════════════════════ */

class Orbit {
  constructor(cam, dom) {
    this.cam = cam; this.dom = dom;
    this.tgt = new THREE.Vector3(0, 1.5, 0);
    this.tgtGoal = this.tgt.clone();
    this.yaw = 0.42; this.pitch = 0.16; this.dist = 9;
    this.yawG = this.yaw; this.pitchG = this.pitch; this.distG = this.dist;
    this.minD = 1.1; this.maxD = 22;
    this.follow = null; this.followT = 0; this.frameBias = 0;
    this.dragging = false; this.px = 0; this.py = 0; this.pinch = 0;
    this.enabled = true;
    this.bind();
  }
  bind() {
    const d = this.dom;
    const down = e => {
      if (!this.enabled) return;
      this.dragging = true; this.moved = 0;
      const t = e.touches ? e.touches[0] : e;
      this.px = t.clientX; this.py = t.clientY;
      if (e.touches && e.touches.length === 2) {
        this.pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      }
    };
    const move = e => {
      if (!this.dragging || !this.enabled) return;
      if (e.touches && e.touches.length === 2) {
        const p = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        if (this.pinch) this.distG = clamp(this.distG * (this.pinch / p), this.minD, this.maxD);
        this.pinch = p; this.moved += 9;
        return;
      }
      const t = e.touches ? e.touches[0] : e;
      const dx = t.clientX - this.px, dy = t.clientY - this.py;
      this.px = t.clientX; this.py = t.clientY;
      this.moved += Math.abs(dx) + Math.abs(dy);
      this.yawG -= dx * 0.006;
      this.pitchG = clamp(this.pitchG + dy * 0.005, -0.62, 1.25);
    };
    const up = () => { this.dragging = false; this.pinch = 0; };
    d.addEventListener('mousedown', down);
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
    d.addEventListener('touchstart', down, { passive: true });
    d.addEventListener('touchmove', move, { passive: true });
    d.addEventListener('touchend', up, { passive: true });
    d.addEventListener('wheel', e => {
      if (!this.enabled) return;
      e.preventDefault();
      this.distG = clamp(this.distG * (1 + Math.sign(e.deltaY) * 0.11), this.minD, this.maxD);
    }, { passive: false });
  }
  frameTank(dims) {
    const [W, H, D] = dims;
    this.dims = dims.slice();
    this.tgtGoal.set(0, H * 0.5, 0);
    this.distG = this.fitDistance();
    this.maxD = Math.max(W, D) * 3.8;
    this.minD = 0.7;
  }
  /** Distance at which the whole box is inside the frustum, both axes. */
  fitDistance() {
    const [W, H, D] = this.dims || [6, 3, 3];
    const t = Math.tan((this.cam.fov * Math.PI / 180) / 2);
    const byH = (H * 0.62) / t;
    const byW = (W * 0.56) / (t * Math.max(0.35, this.cam.aspect));
    return clamp(Math.max(byH, byW) + D * 0.35, 1.4, 90);
  }
  refit() {
    if (this.follow) return;
    const want = this.fitDistance();
    if (this.distG > want * 0.55) this.distG = Math.min(Math.max(this.distG, want), want * 1.2);
  }
  setFollow(f) { this.follow = f; this.followT = 0; }
  update(dt) {
    const k = clamp(dt * 5.5, 0, 1);
    if (this.follow && this.follow.alive) {
      this.followT += dt;
      const f = this.follow;
      const back = _s1.copy(f.vel).normalize().multiplyScalar(-1);
      if (back.lengthSq() < 1e-5) back.set(-1, 0, 0);
      const orbitY = 0.20 + Math.sin(this.followT * 0.25) * 0.13;
      const want = _s2.copy(f.pos).addScaledVector(back, 0.5 + f.len / 14).add(_s3.set(0, orbitY * (0.4 + f.len / 20), 0));
      this.tgtGoal.copy(f.pos);
      const dd = Math.max(0.45, f.len / 9 * 2.4);
      this.distG = lerp(this.distG, dd, clamp(dt * 1.4, 0, 1));
      const wy = Math.atan2(want.z - f.pos.z, want.x - f.pos.x);
      this.yawG = lerpAngle(this.yawG, -wy + Math.PI / 2, clamp(dt * 0.9, 0, 1));
      this.pitchG = lerp(this.pitchG, 0.08 + Math.sin(this.followT * 0.18) * 0.1, clamp(dt * 0.8, 0, 1));
    }
    this.tgt.lerp(this.tgtGoal, k);
    this.yaw = lerpAngle(this.yaw, this.yawG, k);
    this.pitch = lerp(this.pitch, this.pitchG, k);
    this.dist = lerp(this.dist, this.distG, k);
    const cp = Math.cos(this.pitch);
    this.cam.position.set(
      this.tgt.x + Math.sin(this.yaw) * cp * this.dist,
      this.tgt.y + Math.sin(this.pitch) * this.dist,
      this.tgt.z + Math.cos(this.yaw) * cp * this.dist);
    this.bias = lerp(this.bias || 0, this.frameBias, clamp(dt * 4, 0, 1));
    if (Math.abs(this.bias) > 0.001) {
      const visH = 2 * this.dist * Math.tan((this.cam.fov * Math.PI / 180) / 2);
      _s1.set(this.tgt.x, this.tgt.y - this.bias * visH, this.tgt.z);
      this.cam.lookAt(_s1);
    } else this.cam.lookAt(this.tgt);
  }
}
function lerpAngle(a, b, t) {
  let d = (b - a) % TAU;
  if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU;
  return a + d * t;
}

/* ═══════════════════════════════════════════════════════════════════════════
   9. POST
   Bloom for the bioluminescence, and a real depth-of-field for photo mode —
   the depth comes from a second render into a target that owns a DepthTexture,
   which is cheap because photo mode is a held frame.
   ═══════════════════════════════════════════════════════════════════════════ */

const GradeShader = {
  uniforms: {
    tDiffuse: { value: null }, tDepth: { value: null },
    uRes: { value: new THREE.Vector2(1, 1) },
    uFocus: { value: 0.42 }, uAperture: { value: 0.0 }, uExposure: { value: 1.0 },
    uNear: { value: 0.1 }, uFar: { value: 120 }, uFilter: { value: 0 }, uVig: { value: 0.34 },
  },
  vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }`,
  fragmentShader: `
    uniform sampler2D tDiffuse; uniform sampler2D tDepth;
    uniform vec2 uRes; uniform float uFocus, uAperture, uExposure, uNear, uFar, uFilter, uVig;
    varying vec2 vUv;
    float linDepth(float z){ float n = 2.0*z - 1.0; return (2.0*uNear*uFar)/(uFar+uNear-n*(uFar-uNear)); }
    void main(){
      vec4 base = texture2D(tDiffuse, vUv);
      vec3 col = base.rgb;
      if (uAperture > 0.001){
        float d  = linDepth(texture2D(tDepth, vUv).r);
        float fd = mix(uNear, uFar*0.28, uFocus*uFocus);
        float coc = clamp(abs(d - fd) / max(0.35, fd*0.85), 0.0, 1.0) * uAperture;
        float r = coc * 12.0;
        if (r > 0.4){
          vec3 sum = vec3(0.0); float wsum = 0.0;
          for (int i = 0; i < 16; i++){
            float a = float(i) * 2.39996323;
            float rad = sqrt(float(i)/16.0) * r;
            vec2 o = vec2(cos(a), sin(a)) * rad / uRes;
            vec3 s = texture2D(tDiffuse, vUv + o).rgb;
            float w = 1.0 + dot(s, vec3(0.3,0.6,0.1));
            sum += s * w; wsum += w;
          }
          col = mix(col, sum/wsum, clamp(coc*2.2, 0.0, 1.0));
        }
      }
      col *= uExposure;
      if (uFilter > 0.5 && uFilter < 1.5){          /* warm reef */
        col = vec3(col.r*1.10 + col.g*0.03, col.g*1.03, col.b*0.86);
      } else if (uFilter > 1.5 && uFilter < 2.5){   /* cold deep */
        col = vec3(col.r*0.82, col.g*0.97, col.b*1.16);
        col = mix(col, vec3(dot(col, vec3(0.299,0.587,0.114))), 0.12);
      } else if (uFilter > 2.5 && uFilter < 3.5){   /* silver */
        float l = dot(col, vec3(0.299,0.587,0.114));
        col = mix(vec3(l), col, 0.14) * vec3(0.96,0.99,1.06);
      } else if (uFilter > 3.5){                    /* vivid */
        float l = dot(col, vec3(0.299,0.587,0.114));
        col = mix(vec3(l), col, 1.45);
      }
      col = (col - 0.5) * 1.045 + 0.5;
      float v = distance(vUv, vec2(0.5));
      col *= 1.0 - smoothstep(0.35, 0.95, v) * uVig;
      gl_FragColor = vec4(col, base.a);
    }`,
};

/* ═══════════════════════════════════════════════════════════════════════════
   10. THE GAME
   ═══════════════════════════════════════════════════════════════════════════ */

const SAVE_KEY = 'tidekeeper.save.v1';
const Save = {
  data: { pedia: [], chapter: 0, stars: {}, best: {}, seen: {}, vol: 0.6, tutorial: false, totals: { fish: 0, days: 0, visitors: 0 } },
  load() {
    try { const r = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (r) Object.assign(this.data, r); } catch (e) {}
    return this.data;
  },
  write() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(this.data)); } catch (e) {} },
};

/* ── the random events that make Survival and Career unpredictable ──────── */
const EVENTS = [
  { id:'power', name:'Power Cut', min:3, w:1.0, fire(G, T) {
      T.powerOut = rr(0.12, 0.4);
      if (has(T, 'gen')) { T.powerOut = 0; G.alert('good', 'Power Cut', 'The mains went down. Your <b>generator</b> caught it before anything noticed.'); return; }
      G.alert('bad', 'Power Cut', 'The power is out. No filter, no heater, no light — and the oxygen is already falling.');
      Audio.alarm();

class Game {
  constructor(world, orbit, scene, camera) {
    this.world = world; this.orbit = orbit; this.scene = scene; this.camera = camera;
    this.tanks = []; this.active = 0;
    this.money = 0; this.day = 1; this.hour = 8; this.speed = 1; this.paused = true;
    this.appeal = 0; this.health = 100; this.visitorRate = 0; this.totalVisitors = 0; this.earned = 0;
    this.alerts = []; this.alertCd = new Map();
    this.runLosses = 0; this.runBirths = 0; this.released = 0;
    this.streak = { lowNitrate: 0, lion: 0, perfect: 0 };
    this.mode = null; this.run = null; this.over = false;
    this.multi = false; this.peacefulOnly = false;
    this.surge = null; this.criticPending = false; this.criticScore = 0;
    this.selected = null; this.placing = null; this.photo = false;
    this.tutorial = { on: false, step: 0, overfed: 0 };
    this.eventTimer = 30; this.warnTimer = 0; this.dayHandled = 0;
    this.draft = null; this.autoTimer = 0;
  }

  get T() { return this.tanks[this.active]; }

  /* ── alerts ──────────────────────────────────────────────────────────── */
  alert(kind, key, html, cd = 25) {
    const last = this.alertCd.get(key + kind) || -1e9;
    const now = this.day * 24 + this.hour;
    if (now - last < cd / 24 * 6) return;
    this.alertCd.set(key + kind, now);
    const el = document.createElement('div');
    el.className = 'alert ' + kind;
    el.innerHTML = `<span class="a-k">${key}</span>${html}`;
    $('alerts').appendChild(el);
    if (kind === 'bad') Audio.alarm(); else if (kind === 'good') Audio.blip(880, 0.12, 'sine', 0.05);
    setTimeout(() => { el.classList.add('fade'); setTimeout(() => el.remove(), 420); }, kind === 'bad' ? 9000 : 6500);
    while ($('alerts').children.length > 5) $('alerts').firstChild.remove();
  }

  discover(id) {
    if (Save.data.pedia.includes(id)) return;
    const rel = RELATIONS.find(r => r.id === id);
    const extra = PEDIA_EXTRA[id];
    if (!rel && !extra) return;
    Save.data.pedia.push(id); Save.write();
    const title = rel ? (rel.pedia ? rel.pedia[0] : rel.id) : extra[0];
    this.alert('disc', 'Aquapedia', `<b>${title}</b> — a new entry has been written up.`, 0);
    Audio.chime(true);
    $('pedia-pip').style.display = '';
  }

  /* ── the interaction callbacks the behaviour layer fires ──────────────── */
  stalkStart(pred, prey, T) {
    if (rnd() > 0.55) return;
    this.alert('warn', 'Watch', `The <b>${pred.sp.name.toLowerCase()}</b> is eyeing your ${prey.sp.name.toLowerCase()}.`, 40);
  }
  eat(pred, prey, T) {
    prey.alive = false; prey.corpse = 0.85;
    prey.killedBy = `The ${pred.sp.name.toLowerCase()} ate it.`;
    pred.hunger = clamp(pred.hunger - 0.55 - prey.len / 30, 0, 1.4);
    pred.flash = 1;
    this.runLosses++;
    this.alert('bad', 'Predation', `The <b>${pred.sp.name}</b> took your ${prey.sp.name.toLowerCase()}.`, 8);
    Audio.blip(140, 0.22, 'sawtooth', 0.08);
    if (pred.sp.id === 'lion') this.discover('lion-small');
    if (pred.sp.id === 'angel' && prey.sp.id === 'neon') this.discover('angel-neon');
    if (pred.sp.id === 'puffer') this.discover('puffer-snail');
    for (const o of T.fish) if (o.alive && o !== pred) { o.stress = Math.min(1.5, o.stress + 0.25); o.mood = 'flee'; }
  }
  contact(agg, vic, T) {
    /* fin nipping: only the species that actually do it, only on trailing fins */
    const veil = vic.sp.body.veil || 0;
    let does = false, rel = null;
    if (agg.sp.id === 'betta' && (veil >= 0.55 || vic.sp.id === 'betta')) { does = true; rel = vic.sp.id === 'betta' ? 'betta-betta' : 'betta-veil'; }
    if (agg.sp.id === 'barb' && veil >= 0.55 && T.fish.filter(f => f.alive && f.sp.id === 'barb').length < 6) { does = true; rel = 'barb-veil'; }
    if (agg.sp.id === 'puffer' && veil >= 0.5) { does = true; rel = 'puffer-veil'; }
    if (agg.sp.temper === 'aggressive' && vic.len < agg.len * 0.6) does = does || rnd() < 0.3;
    if (!does) return;
    if ((this.lastNip || 0) > performance.now() - 900) return;
    this.lastNip = performance.now();
    vic.finDamage = clamp(vic.finDamage + 0.12, 0, 1);
    vic.stress = Math.min(1.5, vic.stress + 0.3);
    vic.flash = 0.8; vic.mood = 'flee';
    vic.vel.addScaledVector(_s1.copy(vic.pos).sub(agg.pos).normalize(), 0.8);
    if (vic.finDamage > 0.2 && rel) {
      this.discover(rel);
      this.alert('warn', 'Aggression', `Your <b>${agg.sp.name}</b> is shredding the ${vic.sp.name.toLowerCase()}'s fins.`, 45);
    }
    if (vic.finDamage >= 0.97) { vic.health -= 0.35; }
  }
  onDeath(f, T) { this.runLosses++; if (this.orbit.follow === f) this.setFollow(null); }
  onBirth(sp, T) { this.runBirths++; if (sp.endangered) this.discover('breeding'); }

  /* ── stock control ────────────────────────────────────────────────────── */
  addFish(T, spId, n = 1, free = false) {
    const sp = SP[spId];
    let last = null;
    for (let i = 0; i < n; i++) {
      if (T.fish.length >= 96) break;
      if (!free) { if (this.money < sp.price) break; this.money -= sp.price; }
      const f = addFishRaw(T, spId);
      placeNewFish(T, f, T === this.T ? this.world.dims : T.dims);
      last = f;
      Save.data.totals.fish++;
    }
    if (T === this.T) this.world.syncContents(T);
    return last;
  }
  sellFish(f, T) {
    const idx = T.fish.indexOf(f);
    if (idx < 0) return;
    T.fish.splice(idx, 1);
    this.money += Math.round(f.sp.price * 0.45 * (0.4 + 0.6 * f.health));
    if (this.orbit.follow === f) this.setFollow(null);
    this.world.syncContents(T);
    this.alert('info', 'Rehomed', `Your <b>${f.sp.name}</b> has gone to another keeper.`, 3);
  }

  feed(foodId, portions = 1) {
    const T = this.T, f = FD[foodId];
    if (this.money < f.price * portions && !this.sandbox) { this.toast('Not enough money for food.'); return; }
    if (!this.sandbox) this.money -= f.price * portions;
    const [W, H, D] = this.world.dims;
    const n = Math.round(FOOD_PER_PORTION * portions);
    for (let i = 0; i < n; i++) {
      T.food.push({ pos: new THREE.Vector3(rr(-W * 0.38, W * 0.38), H - rr(0.05, 0.25), rr(-D * 0.32, D * 0.32)),
                    type: foodId, mass: FOOD_MASS * portions, age: 0, settled: false, seed: rnd() * 100 });
    }
    Audio.blip(1400, 0.05, 'sine', 0.03);
    for (let i = 0; i < 4; i++) setTimeout(() => Audio.bubble(), i * 60);
    this.fedToday = (this.fedToday || 0) + portions;
    if (this.tutorial.on) this.tutorial.overfed += portions;
  }

  waterChange(frac = 0.25) {
    const T = this.T;
    const cost = Math.round(T.litres * frac * 0.06) + 3;
    if (!this.sandbox) { if (this.money < cost) { this.toast('Not enough money.'); return; } this.money -= cost; }
    const src = SRC[T.water];
    T.nh3 *= (1 - frac); T.no2 *= (1 - frac); T.no3 *= (1 - frac);
    T.organics *= (1 - frac * 0.8);
    T.ph = lerp(T.ph, src.ph, frac * 0.9);
    T.o2 = clamp(T.o2 + frac * 0.35, 0, 1.05);
    T.temp = lerp(T.temp, 22, frac * 0.35);
    T.detritus *= (1 - frac * 0.6);
    T.lastWaterChange = this.day;
    for (const f of T.fish) if (f.alive) f.stress = Math.max(0, f.stress - 0.15);
    this.alert('good', 'Maintenance', `${Math.round(frac * 100)}% water change done. Nitrate down, oxygen up.`, 4);
    Audio.splash();
    this.discover('waterchange');
  }
  siphon() {
    const T = this.T, cost = 6;
    if (!this.sandbox) { if (this.money < cost) { this.toast('Not enough money.'); return; } this.money -= cost; }
    T.detritus *= 0.25;
    T.fish = T.fish.filter(f => f.alive || f.corpse < 0.02);
    for (let i = T.fish.length - 1; i >= 0; i--) if (!T.fish[i].alive) T.fish.splice(i, 1);
    T.algae = Math.max(0, T.algae - 0.28);
    this.world.syncContents(T);
    this.alert('good', 'Maintenance', 'Substrate siphoned and anything dead removed.', 4);
    Audio.blip(300, 0.3, 'sine', 0.05);
  }
  medicate() {
    const T = this.T, cost = 28;
    if (!this.sandbox) { if (this.money < cost) { this.toast('Not enough money.'); return; } this.money -= cost; }
    for (const f of T.fish) if (f.alive) { f.medicated = 2.5; }
    T.bactA *= 0.78; T.bactN *= 0.78;   // medication knocks the filter back, as it does
    this.alert('info', 'Treatment', 'Whole-tank treatment dosed. It will knock your bacteria back a little.', 4);
    this.discover('meds');
    Audio.blip(700, 0.2, 'triangle', 0.05);
  }
}

/* Entries that are not about two species meeting, but about the tank itself. */
const PEDIA_EXTRA = {
  cycling:     ['The Nitrogen Cycle','Fish make ammonia. One colony of bacteria turns ammonia into nitrite, which is just as poisonous, and a second turns nitrite into nitrate, which is not. Both colonies take weeks to grow, and a tank with no colonies is a tank that poisons whatever you put in it first. This is why the shop is not the first thing you should open.'],
  ich:         ['Ich','White spots, clamped fins, flashing against the sand. Ich is always present and only wins when a fish is stressed — bad water, wrong temperature, no company, a bully. Treating it works. Treating what caused it works better.'],
  waterchange: ['The Water Change','Nothing removes nitrate except plants, algae and a bucket. A quarter of the volume, weekly, is the single most useful habit in the hobby and the reason most tanks survive their keeper.'],
  meds:        ['Medication','Whole-tank treatment cures fish and damages your filter bacteria, which is a trade you often have to make. Expect a small ammonia bump two days later.'],
  breeding:    ['Breeding','Fish breed when conditions are genuinely good, not merely survivable: clean water, full bellies, company, and space. A tank that breeds is a tank you have got right.'],
  mystery:     ['Donations','People leave fish at aquariums. Some of them are lovely. Some of them are thirty centimetres long and were sold to somebody as "community safe".'],
  algae:       ['Algae','Algae is not dirt, it is a plant that got there first. It grows on light plus nitrate, so the cure is either less of one, more real plants to outcompete it, or something with a mouth built for scraping.'],
  crash:       ['The Crash','A crash is never one thing. A fish dies unnoticed, the ammonia it releases stalls the bacteria, the stall raises ammonia further, the next fish goes, and by the time the water looks wrong the tank is already most of the way down. Look for the first body.'],
  oxygen:      ['Oxygen','Warm water holds less oxygen than cold. That is why a heater failure that runs hot kills faster than one that runs cold, and why the first sign of trouble is fish at the surface.'],
  overstock:   ['Stocking','Filtration is a rate, not a volume. You can keep more fish than the tank looks like it holds if the filter is big enough and the feeding is light — and you can crash a big tank with six goldfish.'],
};

Object.assign(Game.prototype, {

  /* ── run setup ────────────────────────────────────────────────────────── */
  newTanks(specs) {
    this.tanks = specs.map((s, i) => makeTank(s.t, s.w, {
      cycled: s.cycled, name: s.name || `${TK[s.t].name}${specs.length > 1 ? ' · ' + (s.w === 'sw' ? 'Marine' : 'Fresh') : ''}`,
      upgrades: s.upgrades, temp: s.temp,
    }));
    this.active = 0;
    this.showTank(0);
  },
  showTank(i) {
    this.active = clamp(i, 0, this.tanks.length - 1);
    const T = this.T;
    this.world.buildTank(T.dims, T.water);
    this.world.syncContents(T);
    for (const f of T.fish) if (f.pos.lengthSq() === 0) placeNewFish(T, f, T.dims);
    this.orbit.frameTank(T.dims);
    this.setFollow(null);
    $('b-tanks').style.display = this.tanks.length > 1 ? '' : 'none';
    UI.renderChem();
  },

  start(modeId, opt = {}) {
    this.mode = modeId; this.over = false;
    this.money = 500; this.day = 1; this.hour = 8;
    this.runLosses = 0; this.runBirths = 0; this.released = 0; this.totalVisitors = 0; this.earned = 0;
    this.streak = { lowNitrate: 0, lion: 0, perfect: 0 };
    this.multi = false; this.peacefulOnly = false; this.sandbox = false; this.noFail = false;
    this.surge = null; this.criticPending = false; this.criticScore = 0; this.draft = null;
    this.eventTimer = 60; this.dayHandled = 0; this.run = { goals: [], days: 0 };
    this.alertCd.clear();
    $('alerts').innerHTML = '';
    RNG = rngFrom(opt.seed ?? ((Math.random() * 1e9) | 0));

    switch (modeId) {
      case 'career': {
        const ch = CHAPTERS[clamp(opt.chapter ?? Save.data.chapter, 0, CHAPTERS.length - 1)];
        this.chapter = CHAPTERS.indexOf(ch);
        this.newTanks([{ t: ch.tank, w: ch.water, cycled: this.chapter > 0 }]);
        this.money = ch.money;
        this.multi = !!ch.multi;
        this.run = { title: ch.name, kicker: ch.kicker, brief: ch.brief, days: ch.days,
                     goals: ch.objectives.map(o => ({ text: o.text, check: G => o.check(G.T, G), done: false })) };
        if (this.chapter === 0 && !Save.data.tutorial) this.startTutorial();
        break;
      }
      case 'scenario': {
        const sc = SCENARIOS.find(s => s.id === opt.scenario) || SCENARIOS[0];
        this.scenario = sc;
        sc.setup(this);
        this.run = { title: sc.name, kicker: 'Scenario', brief: sc.brief, days: sc.days,
                     goals: sc.goals.map(g => ({ text: g.text, check: g.check, fail: g.fail, done: false })) };
        break;
      }
      case 'showtime': {
        this.newTanks([{ t:'t125', w: rnd() < 0.5 ? 'fw' : 'sw', cycled:true, upgrades:['filter2','light2'] }]);
        this.money = 2200;
        this.run = { title:'Festival Weekend', kicker:'Showtime', days:3,
          brief:'Three days of a city festival. The crowd arrives in waves and they want a spectacle. Hold your appeal up through every surge without letting the ecosystem go under — the score is the lowest health you touch, not the highest appeal.',
          goals:[
            { text:'Take 12,000 visitors across the weekend', check:G => G.totalVisitors >= 12000, done:false },
            { text:'Never let Ecosystem Health fall below 45%', check:G => G.minHealth >= 45, fail:G => G.minHealth < 45, done:false },
          ] };
        this.minHealth = 100;
        this.surgeSchedule = [0.35, 0.9, 1.35, 1.9, 2.4, 2.8];
        break;
      }
      case 'survival': {
        this.newTanks([{ t:'t55', w:'fw', cycled:true }]);
        this.money = 900;
        this.run = { title:'Survival', kicker:'Endless', days:0,
          brief:'Everything that can go wrong will, and it will come faster the longer you last. There is no target. There is only the day you stop.',
          goals:[] };
        this.eventTimer = 40;
        break;
      }
      case 'draft': {
        this.newTanks([{ t:'t55', w: rnd() < 0.5 ? 'fw' : 'sw', cycled:true }]);
        this.money = 260;
        this.run = { title:'Draft Run', kicker:'Roguelike', days:0,
          brief:'Every other day you are offered three species and you must take one of them. You get a little money each round and no say in the pool. How long can a tank built out of coincidence last?',
          goals:[] };
        this.draft = { next: 0.3, round: 0 };
        break;
      }
      case 'conserve': {
        this.newTanks([{ t:'t125', w:'sw', cycled:true, upgrades:['filter3','light3','skimmer','uv','chiller'] }]);
        this.money = 1800;
        this.run = { title:'Conservation Programme', kicker:'Breeding', days:30,
          brief:'Two endangered species, thirty days, and conditions that have to be right rather than merely survivable. Fish only breed here when they are genuinely thriving. Every animal you raise and release is reputation you cannot buy.',
          goals:[
            { text:'Raise and release four endangered animals', check:G => G.released >= 4, done:false },
            { text:'Keep every endangered animal alive', check:G => G.runLosses === 0, fail:G => G.runLosses > 0, done:false },
          ] };
        this.conserve = true;
        break;
      }
      case 'daily': {
        const seed = dailySeed();
        RNG = rngFrom(seed);
        const water = RNG() < 0.5 ? 'fw' : 'sw';
        const pool = shuffled(SPECIES.filter(s => s.water === water)).slice(0, 6).map(s => s.id);
        this.newTanks([{ t:'t55', w: water, cycled:true }]);
        this.money = 1400;
        this.dailyPool = pool; this.dailySeed = seed;
        this.run = { title:'Daily Reef', kicker: new Date().toDateString(), days:7,
          brief:`Everyone gets this same tank today. ${water === 'sw' ? 'Marine' : 'Freshwater'}, fifty-five gallons, $1,400, and only six species in the shop. Seven days, then a score.`,
          goals:[{ text:'Survive seven days and score as high as you can', check:() => false, done:false }] };
        break;
      }
      case 'zen': {
        this.newTanks([{ t:'t300', w:'sw', cycled:true, upgrades:['filter3','light3','skimmer','uv','chiller','heater','test','quar'] }]);
        this.money = 999999; this.sandbox = true; this.noFail = true;
        this.run = { title:'Zen Sandbox', kicker:'Free build', days:0,
          brief:'No money, no failure, no clock you have to answer to. Photo mode is in the dock.', goals:[] };
        break;
      }
    }
    this.paused = false; this.setSpeed(1);
    UI.setMode();
    UI.showBrief();
  },

  setSpeed(s) {
    this.speed = s; this.paused = s === 0;
    document.querySelectorAll('.sp').forEach(b => b.classList.toggle('on', +b.dataset.sp === s));
  },
  setFollow(f) {
    this.orbit.setFollow(f);
    $('follow').classList.toggle('show', !!f);
    if (f) $('follow-name').textContent = 'Following ' + f.sp.name;
  },
  toast(msg, ms = 1900) {
    const t = $('toast'); t.textContent = msg; t.className = 'show';
    clearTimeout(this._tt); this._tt = setTimeout(() => t.className = '', ms);
  },
});

function dailySeed() {
  const d = new Date();
  return (d.getUTCFullYear() * 10000 + (d.getUTCMonth() + 1) * 100 + d.getUTCDate()) >>> 0;
}

Object.assign(Game.prototype, {

  /* ── the clock ────────────────────────────────────────────────────────── */
  tick(rdt) {
    const T = this.T;
    if (!T) return;
    const dt = this.paused ? 0 : Math.min(rdt, 0.05) * this.speed;
    const days = dt / DAY_SECONDS;

    if (dt > 0) {
      T.hour += days * 24;
      while (T.hour >= 24) { T.hour -= 24; T.day++; this.day = T.day; this.onNewDay(); }
      for (const t2 of this.tanks) if (t2 !== T) { t2.hour = T.hour; t2.day = T.day; }

      /* heatwave pushes the room temperature up for a while */
      if (T.heatwave > 0) { T.heatwave -= days; T.target += 0; T.temp += days * 6; }
      if (T.powerOut > 0) T.powerOut -= days;
      if (T.filterOff > 0) T.filterOff -= days;
      if (T.heaterBroken && rnd() < days * 0.35) { T.heaterBroken = false; T.target = clamp(T.target - 5, 18, 31);
        this.alert('good', 'Repaired', 'The heater has been replaced and the temperature is coming back.'); }

      for (const t2 of this.tanks) {
        stepChem(t2, days);
        stepBiology(t2, days, this);
        if (t2 !== T) this.offscreen(t2, days);
      }
      this.economy(dt, days);
      this.events(dt);
      if (this.draft) this.draftTick(days);
    }

    updateAI(T, Math.min(rdt, 0.05) * (this.paused ? 0 : this.speed), this.world.dims, this);

    this.scoreT = (this.scoreT || 0) - rdt;
    if (this.scoreT <= 0) {
      this.scoreT = 0.2;
      let ap = crowdAppeal(T, clamp(1 - daylight(T), 0, 1)) * (this.tanks.length > 1 ? 1 + 0.35 * (this.tanks.length - 1) : 1);
      let hp = 0;
      for (const t2 of this.tanks) {
        hp += ecosystemHealth(t2);
        if (t2 !== T) ap += crowdAppeal(t2, clamp(1 - daylight(t2), 0, 1)) * 0.55;
      }
      this.appeal = ap;
      this.health = hp / this.tanks.length;
    }
    if (this.mode === 'showtime') this.minHealth = Math.min(this.minHealth ?? 100, this.health);

    this.warnTimer -= rdt;
    if (this.warnTimer <= 0) { this.warnTimer = 3.5; this.warnings(T); }
    if (!this.over && dt > 0) this.checkGoals();

    /* world visuals */
    const night = clamp(1 - daylight(T), 0, 1);
    this.world.updateLighting(T, night, this.scene);
    this.world.updateFish(T, this.camera);
    this.world.updateBubbles(Math.min(rdt, 0.05), T);
    this.world.updateFood(T);
    this.world.updateVisitors(Math.min(rdt, 0.05), this.paused ? this.visitorRate * 0.3 : this.visitorRate, night > 0.5, this.orbit.dist, this.camera.position);
    this.world.updateRays(this.camera);
    Audio.night(night); Audio.flow(flowOf(T));
    if (rnd() < rdt * (T.decor.some(d => d.id === 'bubbler') ? 2.2 : 0.35)) Audio.bubble();
  },

  onNewDay() {
    const T = this.T;
    this.fedToday = 0;
    Save.data.totals.days++;
    if (T.no3 < 25) this.streak.lowNitrate++; else this.streak.lowNitrate = 0;
    if (T.fish.some(f => f.alive && f.sp.id === 'lion')) this.streak.lion++; else this.streak.lion = 0;
    if (has(T, 'auto')) this.feedAuto();
    /* the reviewer scores overnight */
    if (this.criticPending) {
      this.criticPending = false;
      const s = Math.round(clamp(this.appeal / 14 + this.health / 3 - this.runLosses * 4, 0, 100));
      this.criticScore = Math.max(this.criticScore, s);
      const pay = Math.round(s * 12);
      this.money += pay;
      this.alert(s > 60 ? 'good' : 'warn', 'Review',
        `The reviewer scored the tank <b>${s}/100</b>${s > 70 ? ' — a glowing write-up.' : s > 45 ? '.' : ' and was not kind.'} ${money$(pay)} in extra ticket sales.`);
    }
    if (this.mode === 'showtime' && this.surgeSchedule) {
      const idx = this.day - 1;
      if (idx >= 0 && this.surgeSchedule.length) { this.surge = { t: 0.6, mult: 2.0 + idx * 0.45 };
        this.alert('info', 'Showtime', `Day ${this.day} of the festival. The doors are open and the queue is round the block.`); }
    }
    if (this.run.days && this.day > this.run.days) this.finish();
    if (this.tutorial.on) this.tutorialTick();
  },

  feedAuto() {
    const T = this.T;
    const diets = new Set(T.fish.filter(f => f.alive).map(f => f.sp.diet));
    const best = FOODS.find(f => f.feeds.some(d => diets.has(d))) || FD.flake;
    this.feed(best.id, 0.8);
    this.alert('info', 'Auto-Feeder', `Fed a measured dose of ${best.name.toLowerCase()}.`, 40);
  },

  /* ── money ────────────────────────────────────────────────────────────── */
  economy(dt, days) {
    const T = this.T;
    const night = daylight(T) < 0.25;
    let open = !night;
    let rate = Math.pow(Math.max(0, this.appeal), 0.93) * 1.05;
    if (this.surge) { rate *= this.surge.mult; this.surge.t -= days; if (this.surge.t <= 0) this.surge = null; }
    if (!open) rate *= 0.10;                       // the late gallery is quieter but not empty
    if (this.health < 40) rate *= 0.55;
    rate *= this.mode === 'showtime' ? 1.6 : 1;
    this.visitorRate = rate;
    const v = rate * days * 24;
    this.totalVisitors += v;
    Save.data.totals.visitors += v;
    const ticket = 0.40 + clamp(this.appeal / 2200, 0, 0.5);
    if (!this.sandbox) { const inc = v * ticket; this.money += inc; this.earned += inc; }
    /* running costs */
    if (!this.sandbox) {
      let cost = (T.litres * 0.0018 + this.tanks.length * 1.4);
      if (has(T, 'chiller')) cost += 3.2;
      if (has(T, 'uv')) cost += 1.1;
      if (has(T, 'light3')) cost += 1.8;
      this.money -= cost * days * 24 * 0.12;
      if (this.money < -200 && !this.noFail) this.finish('bankrupt');
    }
  },

  /* ── background tanks ─────────────────────────────────────────────────── */
  offscreen(T, days) {
    const live = T.fish.filter(f => f.alive);
    for (const f of live) {
      if (f.sp.behaviour === 'predator' || f.sp.id === 'puffer') {
        const isP = f.sp.id === 'puffer';
        const prey = live.filter(o => o !== f && (isP ? (o.sp.id === 'snail' || o.sp.id === 'shrimp') : o.len < Math.min(12, f.len * 0.55)));
        if (prey.length && f.hunger > 0.4 && rnd() < days * 1.4) {
          const p = prey[Math.floor(rnd() * prey.length)];
          this.eat(f, p, T);
        }
      }
      const veilers = live.filter(o => o !== f && (o.sp.body.veil || 0) >= 0.55);
      if ((f.sp.id === 'betta' || f.sp.id === 'barb' || f.sp.id === 'puffer') && veilers.length && rnd() < days * 3) {
        const v = veilers[Math.floor(rnd() * veilers.length)];
        v.finDamage = clamp(v.finDamage + 0.1, 0, 1);
      }
      /* offscreen fish still eat whatever the auto-feeder or grazing provides */
      if (T.food.length) { f.hunger = clamp(f.hunger - days * 1.6, 0, 1.4); T.food.length = Math.max(0, T.food.length - 1); }
    }
  },

  /* ── the things the tank tells you ────────────────────────────────────── */
  warnings(T) {
    if (this.over) return;
    const live = T.fish.filter(f => f.alive);
    if (T.nh3 > 0.28) this.alert('bad', 'Water', `Ammonia is at <b>${T.nh3.toFixed(2)} mg/L</b>. Anything above 0.25 burns gills. Change water now and stop feeding.`, 45);
    else if (T.nh3 > 0.08) this.alert('warn', 'Water', `Ammonia has appeared — <b>${T.nh3.toFixed(2)} mg/L</b>. Your filter is behind the stocking.`, 60);
    if (T.no2 > 0.3) this.alert('bad', 'Water', `Nitrite at <b>${T.no2.toFixed(2)} mg/L</b>. It stops their blood carrying oxygen.`, 50);
    if (T.no3 > 55) this.alert('warn', 'Water', `Nitrate is up to <b>${Math.round(T.no3)} mg/L</b>. Plants and a water change, or algae will do it for you.`, 70);
    if (T.o2 < 0.62) this.alert('bad', 'Water', `Oxygen is down to <b>${Math.round(T.o2 * 100)}%</b> of saturation. Warm water and a heavy bioload — get some surface movement in there.`, 45);
    if (T.algae > 0.55) this.alert('warn', 'Algae', 'Algae is taking the glass and the plants. Less light, more planting, or something that eats it.', 70);
    const load = bioloadTotal(T) / bioCapacity(T);
    if (load > 1.08) this.alert('warn', 'Stocking', `This tank is carrying <b>${Math.round(load * 100)}%</b> of what its filtration can process.`, 80);
    const starving = live.filter(f => f.hunger > 0.82);
    if (starving.length) {
      const sh = starving.find(f => f.sp.slowFeeder);
      if (sh) { this.alert('warn', 'Feeding', `Your <b>${sh.sp.name}</b> is not getting to the food in time. It feeds slowly and something faster is clearing the tank.`, 60); this.discover('seahorse-comp'); }
      else this.alert('warn', 'Feeding', `${plural(starving.length, 'fish', 'fish')} ${starving.length === 1 ? 'is' : 'are'} hungry.`, 55);
    }
    const cold = live.filter(f => T.temp < f.sp.temp[0] - 0.8), hot = live.filter(f => T.temp > f.sp.temp[1] + 0.8);
    if (cold.length) this.alert('warn', 'Temperature', `${T.temp.toFixed(1)} °C is too cold for your <b>${cold[0].sp.name}</b>.`, 60);
    if (hot.length) this.alert('warn', 'Temperature', `${T.temp.toFixed(1)} °C is too warm for your <b>${hot[0].sp.name}</b>.`, 60);
    const lonely = {};
    for (const f of live) lonely[f.sp.id] = (lonely[f.sp.id] || 0) + 1;
    for (const id in lonely) if (SP[id].school > 1 && lonely[id] < SP[id].school && lonely[id] > 0)
      this.alert('warn', 'Company', `${plural(lonely[id], SP[id].name)} — they need a group of at least ${SP[id].school} before they will behave like themselves.`, 110);
    const sick = live.filter(f => f.sick > 0.05).length;
    if (sick > 0) this.alert('bad', 'Disease', `${plural(sick, 'fish', 'fish')} showing signs of ich. Treat it, and fix whatever stressed them.`, 55);
    const dead = T.fish.filter(f => !f.alive).length;
    if (dead) { this.alert('bad', 'Remove', `There ${dead === 1 ? 'is a body' : 'are ' + dead + ' bodies'} in the tank. A corpse produces ammonia faster than the fish did.`, 25); this.discover('crash'); }
    if (T.bactA < 0.35 && live.length > 2) this.alert('warn', 'Cycling', 'The filter has not caught up with this stocking yet. Feed lightly and change water often for a week.', 120);
    if (T.detritus > 2.5) this.alert('warn', 'Waste', 'Uneaten food is building up in the sand. Feed less, or get something that works down there.', 80);
  },

  /* ── random events ────────────────────────────────────────────────────── */
  events(dt) {
    if (this.mode === 'zen' || this.tutorial.on) return;
    this.eventTimer -= dt;
    if (this.eventTimer > 0) return;
    const hard = this.mode === 'survival' ? 1 + this.day * 0.09 : this.mode === 'career' ? 0.55 : 0.7;
    this.eventTimer = Math.max(22, rr(60, 130) / hard);
    const pool = EVENTS.filter(e => this.day >= e.min);
    if (!pool.length) return;
    let total = pool.reduce((s, e) => s + e.w, 0), r = rnd() * total;
    for (const e of pool) { r -= e.w; if (r <= 0) { e.fire(this, this.T); break; } }
  },

  /* ── draft ────────────────────────────────────────────────────────────── */
  draftTick(days) {
    this.draft.next -= days;
    if (this.draft.next > 0) return;
    this.draft.next = 2;
    this.draft.round++;
    this.money += 90 + this.draft.round * 22;
    const water = this.T.water;
    const pool = shuffled(SPECIES.filter(s => s.water === water)).slice(0, 3);
    this.paused = true;
    UI.showDraft(pool);
  },

  /* ── goals, ending, scoring ───────────────────────────────────────────── */
  checkGoals() {
    let all = true;
    for (const g of this.run.goals) {
      if (g.fail && g.fail(this)) { if (!this.noFail) { this.finish('failed', g.text); return; } }
      const ok = g.check(this);
      if (ok && !g.done) { g.done = true; Audio.chime(true); this.alert('good', 'Objective', `<b>${g.text}</b> — done.`, 0); }
      if (!ok) { g.done = false; all = false; }
    }
    UI.renderObjective();
    if (all && this.run.goals.length && this.run.days) {
      if (this.day >= Math.min(3, this.run.days)) this.finish('won');
    }
    const T = this.T;
    if (!this.noFail && this.tanks.every(t2 => t2.fish.filter(f => f.alive).length === 0) && this.day > 2 && Save.data.totals.fish > 0) {
      if (this.mode === 'survival' || this.mode === 'draft') this.finish('wipeout');
    }
  },

  finish(why = 'time') {
    if (this.over) return;
    this.over = true; this.paused = true;
    const won = why === 'won' || (why === 'time' && this.run.goals.length && this.run.goals.every(g => g.done));
    if (this.mode === 'career' && won) {
      Save.data.chapter = Math.max(Save.data.chapter, this.chapter + 1);
      const stars = this.starsFor();
      Save.data.stars[CHAPTERS[this.chapter].id] = Math.max(Save.data.stars[CHAPTERS[this.chapter].id] || 0, stars);
    }
    if (this.mode === 'scenario' && won) Save.data.stars[this.scenario.id] = Math.max(Save.data.stars[this.scenario.id] || 0, this.starsFor());
    const key = this.mode === 'daily' ? 'daily-' + this.dailySeed : this.mode;
    const score = this.score();
    Save.data.best[key] = Math.max(Save.data.best[key] || 0, score.total);
    Save.write();
    Audio.chime(won);
    UI.showResults(why, won, score);
  },

  starsFor() {
    let s = 1;
    if (this.runLosses === 0) s++;
    if (this.health > 82) s++;
    return clamp(s, 1, 3);
  },

  score() {
    const T = this.T;
    const live = this.tanks.reduce((n, t2) => n + t2.fish.filter(f => f.alive).length, 0);
    const species = new Set(this.tanks.flatMap(t2 => t2.fish.filter(f => f.alive).map(f => f.sp.id))).size;
    const rows = [
      ['Days kept', this.day - 1, (this.day - 1) * 60],
      ['Peak appeal', Math.round(this.peakAppeal || this.appeal), Math.round((this.peakAppeal || this.appeal) * 1.5)],
      ['Ecosystem health', Math.round(this.health) + '%', Math.round(this.health * 8)],
      ['Visitors', Math.round(this.totalVisitors).toLocaleString('en-US'), Math.round(this.totalVisitors * 0.12)],
      ['Species displayed', species, species * 90],
      ['Animals alive', live, live * 28],
      ['Losses', this.runLosses, -this.runLosses * 130],
      ['Bred in your care', this.runBirths, this.runBirths * 110],
    ];
    if (this.released) rows.push(['Released to the wild', this.released, this.released * 400]);
    if (this.criticScore) rows.push(['Best review', this.criticScore + '/100', this.criticScore * 6]);
    const total = Math.max(0, rows.reduce((s, r) => s + r[2], 0));
    return { rows, total };
  },
});

Object.assign(Game.prototype, {

  /* ── the tutorial teaches by letting you make one small mistake ────────── */
  startTutorial() {

  tutorialTick() {},
  tutorialCheck() {
    const tu = this.tutorial;
    if (!tu.on) return;
    const T = this.T;
    const live = T.fish.filter(f => f.alive);
    const steps = [
      { k:'Welcome', t:'This is seventy-five litres of water and nothing else. Drag to look around it — you will be looking at it a lot. When you are ready, open the <b>Shop</b>.',
        done:() => UI.panelOpen === 'shop' },
      { k:'Stocking', t:'Neon tetras are cheap, hardy and shoal beautifully. Buy <b>six</b> of them — anything fewer and they will hide instead of school.',
        done:() => live.filter(f => f.sp.id === 'neon').length >= 6 },
      { k:'Feeding', t:'Good. Now feed them — the <b>Feed</b> button in the dock, a pinch of flake. Watch where it goes.',
        done:() => (this.fedToday || 0) >= 1 },
      { k:'Feeding', t:'They cleared that fast, didn’t they. Go on — give them another pinch. And another, if you like. They will always act hungry.',
        done:() => (this.fedToday || 0) >= 3 || T.nh3 > 0.1 },
      { k:'The mistake', t:'There it is. Open the <b>Water</b> rail on the left: ammonia is climbing. Nothing in a new tank can process it yet — the bacteria that do that job take weeks to grow, and until they have, every flake you overfeed goes straight into the water as poison.',
        done:() => !!this.tutStep4Ack, act:['I see it', () => { this.tutStep4Ack = true; $('chem').classList.add('show'); T.upgrades.add('test'); UI.renderChem(); }] },
      { k:'The fix', t:'Two things fix this, and you need both. Feed less — a pinch a day, gone in two minutes. And change some water: <b>Care → Water change</b> removes the ammonia you already made.',
        done:() => T.lastWaterChange > 0 },
      { k:'Done', t:'That is the whole game, really. Everything else is a more expensive version of that mistake. The tank will finish cycling on its own over the next week or so — keep feeding light and watch the numbers fall.<br><br>Here is a free test kit. You are going to want it.',
        done:() => this.tutDone, act:['Thank you', () => { this.tutDone = true; T.upgrades.add('test'); UI.renderChem(); $('chem').classList.add('show'); this.discover('cycling'); }] },
    ];
    const s = steps[tu.step];
    if (!s) { tu.on = false; $('coach').classList.remove('show'); return; }
    if (tu.shown !== tu.step) {
      tu.shown = tu.step;
      $('co-k').textContent = s.k; $('co-t').innerHTML = s.t;
      $('co-a').innerHTML = '';
      if (s.act) { const b = document.createElement('button'); b.className = 'btn primary'; b.textContent = s.act[0];
                   b.onclick = () => { Audio.click(); s.act[1](); }; $('co-a').appendChild(b); }
      const skip = document.createElement('button'); skip.className = 'btn ghost'; skip.textContent = 'Skip tutorial';

      $('co-a').appendChild(skip);
      $('coach').classList.add('show');

    if (s.done()) { tu.step++; tu.shown = -1; if (tu.step >= steps.length) { tu.on = false; $('coach').classList.remove('show'); } }
  },

  release(f) {
    const T = this.T;

    this.world.syncContents(T);

    Audio.chime(true); Audio.splash();
  },
});

    $('b-tanks').onclick = () => { Audio.click(); this.togglePanel('tanks'); };

    $('ins-sell').onclick = () => { Audio.click(); if (G.selected) { G.sellFish(G.selected, G.T); G.selected = null; this.renderInspect(); } };

    if ($('modal').classList.contains('show')) return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); G.setSpeed(G.paused ? 1 : 0); }
    if (k === '1') G.setSpeed(1);
    if (k === '3') G.setSpeed(3);
    if (k === 'f') this.togglePanel('feed');
    if (k === 'b') this.togglePanel('shop');
    if (k === 'c') this.togglePanel('care');
    if (k === 'p') this.togglePanel('pedia');
    if (k === 't' && G.tanks.length > 1) this.togglePanel('tanks');
    if (k === 'w') $('chem').classList.toggle('show');

  /* ── headline meters ──────────────────────────────────────────────────── */
  renderMeters() {
    const G = this.G, now = performance.now();

    $('appeal-val').textContent = Math.round(a).toLocaleString('en-US');
    G.peakAppeal = Math.max(G.peakAppeal || 0, a);
    $('appeal-fill').style.width = clamp(a / 14, 0, 100) + '%';

    $('visline').innerHTML = `<b>${Math.round(G.visitorRate).toLocaleString('en-US')}</b> visitors/hr`;
    if (this.panelOpen === 'shop' && this.selSpecies) this.renderCompat();
    if (this.panelOpen && now - (this.lastPanel || 0) > 900) { this.lastPanel = now; this.renderPanelLive(); }

  renderObjective() {

    const pend = G.run.goals.filter(g => !g.done);
