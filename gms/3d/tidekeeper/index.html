  /* ── the water rail ───────────────────────────────────────────────────── */
  renderChem() {
    const G = this.G, T = G.T;
    if (!has(T, 'test')) { $('chem-list').innerHTML = '<div style="font-size:11.5px;color:var(--dimmer);line-height:1.4">No test kit. You are guessing.<br><br>Buy one in the shop under Upgrades.</div>'; return; }
    const rows = [
      ['nh3', 'Ammonia', 'mg/L'], ['no2', 'Nitrite', 'mg/L'], ['no3', 'Nitrate', 'mg/L'],
      ['o2', 'Oxygen', '%'], ['ph', 'pH', ''], ['temp', 'Temp', '°C'], ['bactA', 'Filter', '%'],
    ];
    $('chem-list').innerHTML = rows.map(([k, n, u]) =>
      `<div class="ch" data-k="${k}"><div class="ch-row"><span>${n}</span><b class="mono" id="ch-${k}"></b></div>
       <div class="ch-bar"><i id="chb-${k}"></i></div></div>`).join('');
  },
  renderChemLive() {
    const T = this.G.T;
    if (!T || !$('ch-nh3') || !has(T, 'test')) return;
    const set = (k, val, txt, frac, col) => {
      const a = $('ch-' + k), b = $('chb-' + k);
      if (!a) return;
      a.textContent = txt; a.style.color = col;
      b.style.width = clamp(frac * 100, 0, 100) + '%'; b.style.background = col;
    };
    const gc = v => v < 0.34 ? '#54e0a6' : v < 0.7 ? '#ffc65c' : '#ff6b6b';
    set('nh3', T.nh3, T.nh3.toFixed(2), T.nh3 / 1.0, gc(T.nh3 / 0.3));
    set('no2', T.no2, T.no2.toFixed(2), T.no2 / 1.0, gc(T.no2 / 0.3));
    set('no3', T.no3, Math.round(T.no3), T.no3 / 90, gc(T.no3 / 60));
    set('o2', T.o2, Math.round(T.o2 * 100), T.o2, gc((0.95 - T.o2) / 0.4));
    set('ph', T.ph, T.ph.toFixed(2), (T.ph - 5) / 4, gc(Math.abs(T.ph - SRC[T.water].ph) / 1.0));
    set('temp', T.temp, T.temp.toFixed(1), (T.temp - 14) / 20, gc(Math.abs(T.temp - T.target) / 3));
    set('bactA', T.bactA, Math.round(Math.min(T.bactA, T.bactN) * 100), Math.min(T.bactA, T.bactN), Math.min(T.bactA, T.bactN) > 0.7 ? '#54e0a6' : Math.min(T.bactA, T.bactN) > 0.3 ? '#ffc65c' : '#ff6b6b');
  },
};

/* A little 2D silhouette for the shop cards, traced from the same profile
   function that builds the 3D mesh — so the icon is never a lie. */
function drawSpeciesIcon(cv, sp) {
  const w = cv.width, h = cv.height, c = cv.getContext('2d');
  c.clearRect(0, 0, w, h);
  const B = sp.body;
  const cx = w * 0.52, cy = h * 0.54, L = w * 0.74;
  const hgt = sp.shape === 'jelly' ? L * 0.48 : L * B.h * 0.5;
  const grad = c.createLinearGradient(0, cy - hgt, 0, cy + hgt);
  const hex = n => '#' + n.toString(16).padStart(6, '0');
  grad.addColorStop(0, hex(sp.pal.body)); grad.addColorStop(1, hex(sp.pal.belly));
  c.fillStyle = grad;

  if (sp.shape === 'jelly') {
    c.beginPath(); c.arc(cx, cy - h * 0.06, L * 0.34, Math.PI, 0); c.closePath(); c.fill();
    c.strokeStyle = hex(sp.pal.accent); c.globalAlpha = 0.8; c.lineWidth = 1.3;
    for (let i = 0; i < 7; i++) { c.beginPath();
      const x = cx - L * 0.3 + i * L * 0.1;
      c.moveTo(x, cy - h * 0.06); c.quadraticCurveTo(x + Math.sin(i) * 5, cy + h * 0.16, x + Math.cos(i) * 6, cy + h * 0.34); c.stroke(); }
    c.globalAlpha = 1; return;
  }
  if (sp.shape === 'seahorse') {
    c.strokeStyle = grad; c.lineWidth = Math.max(3, h * 0.14); c.lineCap = 'round';
    c.beginPath(); c.moveTo(cx + L * 0.16, cy - h * 0.34);
    c.quadraticCurveTo(cx - L * 0.16, cy - h * 0.1, cx - L * 0.02, cy + h * 0.16);
    c.quadraticCurveTo(cx + L * 0.14, cy + h * 0.36, cx - L * 0.06, cy + h * 0.38); c.stroke();
    c.lineWidth = 2; c.beginPath(); c.moveTo(cx + L * 0.16, cy - h * 0.34); c.lineTo(cx + L * 0.40, cy - h * 0.30); c.stroke();
    return;
  }
  if (sp.shape === 'snail' || sp.shape === 'shrimp') {
    c.beginPath();
    if (sp.shape === 'snail') { c.arc(cx, cy, L * 0.26, 0, TAU); c.fill();
      c.strokeStyle = hex(sp.pal.accent); c.lineWidth = 2; c.beginPath();
      for (let a = 0; a < 8; a += 0.1) { const r = L * 0.26 * (a / 8); const x = cx + Math.cos(a * 2) * r, y = cy + Math.sin(a * 2) * r; a === 0 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); }
    else { c.strokeStyle = grad; c.lineWidth = Math.max(3, h * 0.15); c.lineCap = 'round';
      c.beginPath(); c.moveTo(cx + L * 0.32, cy - h * 0.02); c.quadraticCurveTo(cx - L * 0.1, cy + h * 0.02, cx - L * 0.3, cy + h * 0.22); c.stroke();
      c.lineWidth = 1.2; c.strokeStyle = '#fff'; c.globalAlpha = 0.7;
      c.beginPath(); c.moveTo(cx + L * 0.32, cy - h * 0.02); c.lineTo(cx + L * 0.5, cy - h * 0.2); c.stroke(); c.globalAlpha = 1; }
    return;
  }
  /* generic: trace the real silhouette */
  c.beginPath();
  for (let i = 0; i <= 28; i++) { const t = i / 28, [py] = profile(B.prof, t);
    const x = cx + (0.5 - t) * L, y = cy - py * hgt + bellyOffset(B.prof, t) * L * B.h * 0.5;
    i === 0 ? c.moveTo(x, y) : c.lineTo(x, y); }
  const tl = L * B.tailL, th = hgt * B.tailH / Math.max(0.05, B.h);
  c.lineTo(cx - L * 0.5 - tl, cy - th * 0.55);
  c.lineTo(cx - L * 0.5 - tl * 0.55, cy);
  c.lineTo(cx - L * 0.5 - tl, cy + th * 0.55);
  for (let i = 28; i >= 0; i--) { const t = i / 28, [py] = profile(B.prof, t);
    c.lineTo(cx + (0.5 - t) * L, cy + py * hgt + bellyOffset(B.prof, t) * L * B.h * 0.5); }
  c.closePath(); c.fill();
  /* dorsal */
  if (B.dorsalH > 0.05) { c.beginPath();
    const t0 = 0.26, t1 = Math.min(0.9, t0 + B.dorsalL);
    c.moveTo(cx + (0.5 - t0) * L, cy - profile(B.prof, t0)[0] * hgt);
    c.quadraticCurveTo(cx + (0.5 - (t0 + t1) / 2) * L, cy - hgt - B.dorsalH * L * 0.45, cx + (0.5 - t1) * L, cy - profile(B.prof, t1)[0] * hgt);
    c.closePath(); c.fillStyle = hex(sp.pal.fin); c.globalAlpha = 0.85; c.fill(); c.globalAlpha = 1; }
  /* a hint of the pattern */
  c.globalAlpha = 0.75; c.fillStyle = hex(sp.pal.accent);
  const pat = sp.pal.pattern;
  if (pat === 'bars' || pat === 'lionbars' || pat === 'clown') {
    const n = pat === 'lionbars' ? 7 : pat === 'clown' ? 3 : 4;
    for (let i = 0; i < n; i++) { const t = 0.15 + i * (0.62 / n);
      const py = profile(B.prof, t)[0] * hgt;
      c.fillRect(cx + (0.5 - t) * L - 1.4, cy - py, pat === 'clown' ? 3.2 : 2.2, py * 2); }
  } else if (pat === 'neonstripe') {
    c.fillRect(cx - L * 0.36, cy - hgt * 0.30, L * 0.78, Math.max(1.6, hgt * 0.24));
    c.fillStyle = hex(sp.pal.accent2); c.fillRect(cx - L * 0.44, cy + hgt * 0.08, L * 0.42, Math.max(1.4, hgt * 0.2));
  } else if (pat === 'lamp') {
    c.fillRect(cx + L * 0.27, cy - hgt * 0.2, 5, 3.4);
  }
  c.globalAlpha = 1;
}

Object.assign(UI, {

  togglePanel(name) {
    if (this.panelOpen === name) { this.closePanel(); return; }
    this.panelOpen = name;
    $('panel').classList.add('show');
    this.G.orbit.frameBias = innerWidth <= 760 ? 0.24 : 0;
    $('inspect').classList.toggle('hide', innerWidth <= 760);
    document.querySelectorAll('.dock-b').forEach(b => b.classList.remove('on'));
    const btn = { shop:'b-shop', care:'b-care', pedia:'b-pedia', tanks:'b-tanks', feed:'b-feed' }[name];
    if (btn) $(btn).classList.add('on');
    if (name === 'pedia') { $('pedia-pip').style.display = 'none'; }
    this.renderPanel();
  },
  closePanel() {
    this.panelOpen = null; this.selSpecies = null;
    this.G.orbit.frameBias = 0;
    $('inspect').classList.remove('hide');
    $('panel').classList.remove('show');
    $('compat').classList.remove('show');
    document.querySelectorAll('.dock-b').forEach(b => b.classList.remove('on'));
  },

  renderPanel() {
    const G = this.G;
    const tabsEl = $('p-tabs'), bodyEl = $('p-body'), footEl = $('p-foot');
    footEl.style.display = 'none'; footEl.innerHTML = '';
    const tabs = {
      shop:  [['fish','Fish'],['plants','Plants'],['decor','Decor'],['upgrade','Upgrades']],
      care:  [], feed: [], pedia: [['all','All'],['species','Species'],['found','Discovered']], tanks: [],
    }[this.panelOpen] || [];
    $('p-title').textContent = { shop:'Shop', care:'Care', feed:'Feeding', pedia:'Aquapedia', tanks:'Tanks' }[this.panelOpen] || '';
    tabsEl.style.display = tabs.length ? '' : 'none';
    tabsEl.innerHTML = tabs.map(([k, n]) =>
      `<button class="tab ${(this.panelOpen === 'shop' ? this.shopTab : this.pediaTab) === k ? 'on' : ''}" data-t="${k}">${n}</button>`).join('');
    tabsEl.querySelectorAll('.tab').forEach(b => b.onclick = () => {
      Audio.click();
      if (this.panelOpen === 'shop') this.shopTab = b.dataset.t; else this.pediaTab = b.dataset.t;
      this.selSpecies = null; $('compat').classList.remove('show');
      this.renderPanel();
    });
    bodyEl.scrollTop = 0;
    this.renderPanelLive();
  },

  renderPanelLive() {
    const G = this.G, T = G.T, body = $('p-body');
    switch (this.panelOpen) {
      case 'shop': this.renderShop(body, T); break;
      case 'care': this.renderCare(body, T); break;
      case 'feed': this.renderFeed(body, T); break;
      case 'pedia': this.renderPedia(body); break;
      case 'tanks': this.renderTanks(body); break;
    }
  },

  /* ── shop ─────────────────────────────────────────────────────────────── */
  renderShop(body, T) {
    const G = this.G;
    if (this.shopTab === 'fish') {
      let pool = SPECIES.filter(s => s.water === T.water);
      if (G.dailyPool) pool = pool.filter(s => G.dailyPool.includes(s.id));
      if (G.peacefulOnly) pool = pool.filter(s => s.temper === 'peaceful');
      body.innerHTML = pool.map(sp => {
        const ev = evaluatePlacement(T, sp.id, 1);
        const dot = ev.level === 'g' ? '#54e0a6' : ev.level === 'a' ? '#ffc65c' : '#ff6b6b';
        const own = T.fish.filter(f => f.alive && f.sp.id === sp.id).length;
        const afford = G.sandbox || G.money >= sp.price;
        return `<div class="card ${this.selSpecies === sp.id ? 'sel' : ''} ${afford ? '' : 'locked'}" data-sp="${sp.id}">
          <canvas class="ico" width="104" height="80" data-ico="${sp.id}"></canvas>
          <div class="c-main">
            <div class="c-name"><span style="width:7px;height:7px;border-radius:9px;background:${dot};box-shadow:0 0 8px ${dot}"></span>${sp.name}${own ? ` <span style="color:var(--dimmer);font-weight:600">×${own}</span>` : ''}</div>
            <div class="c-sci">${sp.sci}</div>
            <div class="c-meta">
              <span class="pill ${sp.water}">${sp.water === 'sw' ? 'Marine' : 'Fresh'}</span>
              <span class="pill">${sp.size} cm</span>
              <span class="pill">${cap(sp.zone)}</span>
              ${sp.school > 1 ? `<span class="pill">School ${sp.school}+</span>` : ''}
              <span class="pill">${sp.temp[0]}–${sp.temp[1]}°C</span>
              ${sp.rarity >= 4 ? '<span class="pill rare">Rare</span>' : ''}
              ${sp.glow > 0.3 ? '<span class="pill glow">Bioluminescent</span>' : ''}
              ${sp.behaviour === 'predator' ? '<span class="pill pred">Predator</span>' : ''}
            </div>
            <div class="c-desc">${sp.desc}</div>
          </div>
          <div class="c-price">${money$(sp.price)}<small>appeal ${sp.appeal}</small></div>
        </div>`;
      }).join('') || '<div style="color:var(--dim);font-size:12.5px;padding:10px">Nothing in this pool for this tank.</div>';
      body.querySelectorAll('canvas[data-ico]').forEach(cv => drawSpeciesIcon(cv, SP[cv.dataset.ico]));
      body.querySelectorAll('.card[data-sp]').forEach(el => el.onclick = () => {
        Audio.click(); this.selSpecies = el.dataset.sp;
        body.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c === el));
        this.renderCompat(); this.renderShopFoot();
      });
      if (this.selSpecies) this.renderShopFoot();
    }
    else if (this.shopTab === 'plants') {

          <div class="swatch" style="background:linear-gradient(160deg,#1d5a28,#0b2a16)"></div>

    else if (this.shopTab === 'decor') {

      body.innerHTML = pool.map(d => `<div class="card" data-dc="${d.id}">
          <div class="swatch" style="background:linear-gradient(160deg,#4a4438,#1d1a15)"></div>
          <div class="c-main"><div class="c-name">${d.name}</div>
            <div class="c-meta"><span class="pill">Appeal ${d.appeal}</span>${d.hides ? `<span class="pill">Shelter</span>` : ''}
            ${d.host ? '<span class="pill rare">Hosts clownfish</span>' : ''}${d.living ? '<span class="pill">Living</span>' : ''}
            ${d.o2 ? '<span class="pill">Oxygen</span>' : ''}</div>
            <div class="c-desc">${d.desc}</div></div>
          <div class="c-price">${money$(d.price)}</div></div>`).join('');
      body.querySelectorAll('.card[data-dc]').forEach(el => el.onclick = () => {
        const d = DEC[el.dataset.dc];
        if (!G.sandbox && G.money < d.price) return this.G.toast('Not enough money.');
        if (!G.sandbox) G.money -= d.price;
        T.decor.push({ id: d.id, health: 1 });
        G.world.syncContents(T); Audio.blip(380, 0.16, 'sine', 0.05);
        G.alert('good', 'Added', `<b>${d.name}</b> is in the tank.`, 8);
        if (d.host) G.discover('clown-anem');
        this.renderPanelLive();
      });
    }
    else {
      const locked = G.mode === 'career' ? new Set(CHAPTERS.slice(G.chapter + 1).flatMap(c => c.unlock || [])) : new Set();
      const pool = UPGRADES.filter(u => (!u.water || u.water === T.water) && !locked.has(u.id));
      body.innerHTML = pool.map(u => {
        const owned = has(T, u.id);
        const superseded = u.group === 'filter' || u.group === 'light'
          ? UPGRADES.some(o => o.group === u.group && o.tier > u.tier && has(T, o.id)) : false;
        return `<div class="card ${owned || superseded ? 'locked' : ''}" data-up="${u.id}">
          <div class="swatch" style="background:linear-gradient(160deg,#1d3a4a,#0a1a22)"></div>
          <div class="c-main"><div class="c-name">${u.name}${owned ? ' <span class="pill" style="background:rgba(84,224,166,.2);color:#8ef0c4">Installed</span>' : ''}</div>
            <div class="c-desc">${u.desc}</div></div>
          <div class="c-price">${u.price ? money$(u.price) : '—'}</div></div>`;
      }).join('');
      body.querySelectorAll('.card[data-up]').forEach(el => el.onclick = () => {
        const u = UP[el.dataset.up];
        if (has(T, u.id)) return;
        if (!G.sandbox && G.money < u.price) return this.G.toast('Not enough money.');
        if (!G.sandbox) G.money -= u.price;
        T.upgrades.add(u.id);
        if (u.group === 'filter' || u.group === 'light')
          UPGRADES.filter(o => o.group === u.group && o.tier < u.tier).forEach(o => T.upgrades.delete(o.id));
        Audio.blip(660, 0.2, 'triangle', 0.06);
        G.alert('good', 'Installed', `<b>${u.name}</b> is running.`, 6);
        if (u.id === 'test') { this.renderChem(); $('chem').classList.add('show'); }
        if (u.id === 'wave' && T.fish.some(f => f.alive && (f.sp.fragile || f.sp.slowFeeder)))
          G.alert('warn', 'Careful', 'A wavemaker in a tank with jellies or seahorses is a countdown.', 0), G.discover('jelly-flow');
        this.renderPanelLive();
      });
    }
  },

  renderShopFoot() {
    const G = this.G, T = G.T, sp = SP[this.selSpecies];
    if (!sp) return;
    const foot = $('p-foot'); foot.style.display = '';
    const counts = [1, 3, sp.school > 1 ? sp.school : 6];
    foot.innerHTML = counts.map(n => `<button class="btn ${n === counts[0] ? 'primary' : ''}" data-n="${n}">Add ×${n} &middot; ${money$(sp.price * n)}</button>`).join('');
    foot.querySelectorAll('button').forEach(b => b.onclick = () => {
      const n = +b.dataset.n;
      if (!G.sandbox && G.money < sp.price * n) return G.toast('Not enough money.');
      const before = T.fish.length;
      G.addFish(T, sp.id, n);
      const got = T.fish.length - before;
      if (!got) return G.toast('Not enough money.');
      Audio.splash();
      const ev = evaluatePlacement(T, sp.id, 0);
      G.alert(ev.level === 'r' ? 'warn' : 'good', 'Stocked',
        `${plural(got, sp.name)} added.${ev.rel && ev.level !== 'g' ? ' ' + ev.why : ''}`, 4);
      if (ev.rel && ev.level === 'r') G.discover(ev.rel);
      this.renderPanelLive(); this.renderCompat();
    });
  },

  renderCompat() {
    const G = this.G, sp = SP[this.selSpecies];
    const box = $('compat');
    if (!sp || this.panelOpen !== 'shop' || this.shopTab !== 'fish') { box.classList.remove('show'); return; }
    const ev = evaluatePlacement(G.T, sp.id, 1);
    const cls = 'show ' + ev.level;
    if (box.className !== cls) box.className = cls;
    const k = ev.level === 'g' ? 'Good fit' : ev.level === 'a' ? 'Think about it' : 'Do not do this';
    if ($('compat-k').textContent !== k) $('compat-k').textContent = k;
    if ($('compat-t').textContent !== ev.why) $('compat-t').textContent = ev.why;
  },
});

Object.assign(UI, {

  /* ── care ─────────────────────────────────────────────────────────────── */
  renderCare(body, T) {

    const wcCost = Math.round(T.litres * 0.25 * 0.06) + 3;
    body.innerHTML = `
      <div class="card" data-a="wc25"><div class="swatch" style="background:linear-gradient(160deg,#17607d,#07222e)"></div>
        <div class="c-main"><div class="c-name">Water change · 25%</div>
        <div class="c-desc">Removes a quarter of the nitrate, ammonia and nitrite in the tank and puts the pH back where it started. The single most useful thing you can do.</div></div>

      <div class="card" data-a="wc50"><div class="swatch" style="background:linear-gradient(160deg,#1a7a9d,#07222e)"></div>
        <div class="c-main"><div class="c-name">Water change · 50%</div>
        <div class="c-desc">Emergency dose. Fast relief, but a big swing in temperature and chemistry is its own stress.</div></div>
        <div class="c-price">${money$(wcCost * 2)}</div></div>

        <div class="c-price">$6</div></div>
      <div class="card" data-a="meds"><div class="swatch" style="background:linear-gradient(160deg,#5a2f6e,#1a0d22)"></div>
        <div class="c-main"><div class="c-name">Treat the tank</div>
        <div class="c-desc">Whole-tank medication. Clears ich over a couple of days and knocks your filter bacteria back about a fifth — a trade you sometimes have to make.</div></div>
        <div class="c-price">$28</div></div>
      <h4 style="margin:16px 0 8px;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer)">Settings</h4>
      <div style="padding:4px 2px 10px">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:5px"><span style="color:var(--dim)">Target temperature</span><b class="mono" id="cr-temp">${T.target.toFixed(1)} °C</b></div>
        <input type="range" id="cr-temp-r" min="16" max="31" step="0.5" value="${T.target}" style="width:100%;accent-color:#4fc8f0">
        <div style="display:flex;justify-content:space-between;font-size:12px;margin:12px 0 5px"><span style="color:var(--dim)">Flow</span><b class="mono" id="cr-flow">${Math.round(T.flowUser * 100)}%</b></div>
        <input type="range" id="cr-flow-r" min="0" max="100" value="${Math.round(T.flowUser * 100)}" style="width:100%;accent-color:#4fc8f0">
        <div style="font-size:11.5px;color:var(--dimmer);margin-top:8px;line-height:1.45">
          Flow drives oxygen exchange and most fish like it. Seahorses and moon jellies do not survive it.
        </div>
      </div>`;
    const act = { wc25: () => G.waterChange(0.25), wc50: () => G.waterChange(0.5), siphon: () => G.siphon(), meds: () => G.medicate() };
    body.querySelectorAll('.card[data-a]').forEach(el => el.onclick = () => { Audio.click(); act[el.dataset.a](); this.renderPanelLive(); });
    const tr = $('cr-temp-r'), fr = $('cr-flow-r');
    tr.oninput = () => { T.target = +tr.value; $('cr-temp').textContent = (+tr.value).toFixed(1) + ' °C'; };
    fr.oninput = () => { T.flowUser = +fr.value / 100; $('cr-flow').textContent = fr.value + '%'; };
  },

  /* ── feeding ──────────────────────────────────────────────────────────── */
  renderFeed(body, T) {
    const G = this.G;
    const diets = {};
    T.fish.filter(f => f.alive).forEach(f => diets[f.sp.diet] = (diets[f.sp.diet] || 0) + 1);
    const hungry = T.fish.filter(f => f.alive && f.hunger > 0.6).length;
    body.innerHTML = `
      <div style="font-size:12px;color:var(--dim);padding:2px 4px 12px;line-height:1.5">
        ${hungry ? `<b style="color:var(--warn)">${plural(hungry, 'fish', 'fish')}</b> ${hungry === 1 ? 'is' : 'are'} hungry.` : 'Nobody is hungry right now.'}
        Anything they do not eat sinks, rots, and comes back as ammonia — feed what clears in two minutes and no more.
      </div>` +
      FOODS.map(f => {
        const n = Object.keys(diets).filter(d => f.feeds.includes(d)).reduce((s, d) => s + diets[d], 0);
        return `<div class="card" data-fd="${f.id}"><div class="swatch" style="background:linear-gradient(160deg,#7a5a2a,#231a0c)"></div>
          <div class="c-main"><div class="c-name">${f.name}</div>
            <div class="c-meta"><span class="pill">${n ? plural(n, 'eater') : 'nobody eats this'}</span>
            <span class="pill">${f.sink > 0.7 ? 'Sinks fast' : f.sink > 0.3 ? 'Sinks slowly' : 'Floats'}</span>
            <span class="pill">${f.waste > 1 ? 'Messy' : 'Clean'}</span></div>
            <div class="c-desc">${f.desc}</div></div>
          <div class="c-price">${money$(f.price)}</div></div>`;
      }).join('');
    body.querySelectorAll('.card[data-fd]').forEach(el => el.onclick = () => { G.feed(el.dataset.fd, 1); this.renderPanelLive(); });
  },

  /* ── aquapedia ────────────────────────────────────────────────────────── */
  renderPedia(body) {
    const G = this.G;
    const found = Save.data.pedia;
    let html = '';
    if (this.pediaTab !== 'found') {
      html += '<h4>Species</h4>';
      html += SPECIES.map(sp => {
        const seen = Save.data.seen[sp.id];
        if (!seen && this.pediaTab === 'species') return '';
        return `<div class="pedia ${seen ? '' : 'hidden-e'}">
          <b>${seen ? sp.name : '???'}</b>
          <span>${seen ? `<i style="color:var(--dimmer)">${sp.sci}</i><br>${sp.desc}<br>
            <span style="color:var(--dimmer)">${sp.water === 'sw' ? 'Marine' : 'Freshwater'} · ${cap(sp.zone)} · ${sp.size} cm ·
            ${sp.temp[0]}–${sp.temp[1]} °C · pH ${sp.ph[0]}–${sp.ph[1]} · bioload ${sp.bioload} ·
            ${sp.school > 1 ? 'school of ' + sp.school + '+' : 'keep singly'} · ${cap(sp.diet)} · appeal ${sp.appeal}</span>`
            : 'Keep one to write this entry.'}</span></div>`;
      }).join('');
    }
    if (this.pediaTab !== 'species') {
      html += '<h4>Discoveries</h4>';
      const all = [...RELATIONS.filter(r => r.pedia).map(r => [r.id, r.pedia]), ...Object.entries(PEDIA_EXTRA)];
      html += all.map(([id, p]) => {
        const got = found.includes(id);
        if (!got && this.pediaTab === 'found') return '';
        return `<div class="pedia ${got ? '' : 'hidden-e'}"><b>${got ? p[0] : 'Undiscovered'}</b>
          <span>${got ? p[1] : 'Something in this tank has not happened to you yet.'}</span></div>`;
      }).join('');
    }
    const total = RELATIONS.filter(r => r.pedia).length + Object.keys(PEDIA_EXTRA).length;
    body.innerHTML = `<div style="font-size:11.5px;color:var(--dimmer);padding:0 3px 10px">
        ${found.length} of ${total} discoveries · ${Object.keys(Save.data.seen).length} of ${SPECIES.length} species kept</div>` + html;
  },

  /* ── tanks ────────────────────────────────────────────────────────────── */
  renderTanks(body) {
    const G = this.G;
    let html = G.tanks.map((T, i) => {
      const live = T.fish.filter(f => f.alive).length;
      const h = Math.round(ecosystemHealth(T));
      return `<div class="card ${i === G.active ? 'sel' : ''}" data-tk="${i}">
        <div class="swatch" style="background:linear-gradient(160deg,${T.water === 'sw' ? '#0f4a66' : '#12543f'},#04202c)"></div>
        <div class="c-main"><div class="c-name">${T.name}</div>
          <div class="c-meta"><span class="pill ${T.water}">${T.water === 'sw' ? 'Marine' : 'Fresh'}</span>
          <span class="pill">${T.gal} gal</span><span class="pill">${plural(live, 'fish', 'fish')}</span>
          <span class="pill" style="color:${h > 70 ? '#8ef0c4' : h > 40 ? '#ffd98a' : '#ffb0b0'}">Health ${h}%</span></div>
          <div class="c-desc">${T.nh3 > 0.1 ? 'Ammonia present.' : T.no3 > 50 ? 'Nitrate is high.' : 'Stable.'}</div></div>
        <div class="c-price" style="font-size:11px;color:var(--dim)">${i === G.active ? 'Viewing' : 'View'}</div></div>`;
    }).join('');
    const lockedT = G.mode === 'career' ? new Set(CHAPTERS.slice(G.chapter + 1).flatMap(c => c.unlock || [])) : new Set();
    if (G.multi && G.tanks.length < 3) {
      html += '<h4>Add a tank</h4>' + TANKS.filter(t => !lockedT.has(t.id)).map(t => `
        <div class="card" data-new="${t.id}"><div class="swatch" style="background:linear-gradient(160deg,#123a4a,#04202c)"></div>
          <div class="c-main"><div class="c-name">${t.name}</div><div class="c-desc">${t.litres} litres. A second display doubles what you can show without doubling the risk in any one tank.</div></div>
          <div class="c-price">${money$(t.price)}</div></div>`).join('');
    }
    body.innerHTML = html;
    body.querySelectorAll('.card[data-tk]').forEach(el => el.onclick = () => { Audio.click(); G.showTank(+el.dataset.tk); this.renderPanelLive(); });
    body.querySelectorAll('.card[data-new]').forEach(el => el.onclick = () => {
      const t = TK[el.dataset.new];
      if (!G.sandbox && G.money < t.price) return G.toast('Not enough money.');
      if (!G.sandbox) G.money -= t.price;
      this.modalChoice('New tank', 'Fresh or salt?', [
        ['Freshwater', () => { G.tanks.push(makeTank(t.id, 'fw', { name: t.name + ' · Fresh' })); G.showTank(G.tanks.length - 1); this.renderPanelLive(); }],
        ['Marine', () => { G.tanks.push(makeTank(t.id, 'sw', { name: t.name + ' · Marine' })); G.showTank(G.tanks.length - 1); this.renderPanelLive(); }],
      ]);
    });
  },

  /* ── the inspector ────────────────────────────────────────────────────── */
  renderInspect() {
    const G = this.G, f = G.selected;
    const box = $('inspect');
    if (!f || !G.T.fish.includes(f)) { box.classList.remove('show'); G.selected = null; return; }
    box.classList.add('show');
    $('ins-name').textContent = f.sp.name;
    $('ins-sci').textContent = f.sp.sci;
    const rel = G.mode === 'conserve' && f.sp.endangered && f.len > f.sp.size * 0.8 && f.health > 0.85;
    $('ins-sell').textContent = rel ? 'Release' : 'Rehome';
    $('ins-sell').onclick = () => { Audio.click(); if (rel) G.release(f); else G.sellFish(f, G.T); G.selected = null; this.renderInspect(); };
    this.renderInspectLive();
  },
  renderInspectLive() {
    const G = this.G, f = G.selected;
    if (!f || !$('inspect').classList.contains('show')) return;
    if (!G.T.fish.includes(f)) { this.renderInspect(); return; }
    const T = G.T;
    const pct = v => Math.round(v * 100) + '%';
    const bar = (label, v, good) => `<div class="i-stat"><span>${label}</span><b style="color:${
      (good ? v > 0.6 : v < 0.4) ? 'var(--good)' : (good ? v > 0.3 : v < 0.7) ? 'var(--warn)' : 'var(--bad)'}">${pct(v)}</b></div>`;
    const moodText = { cruise:'Cruising', stalk:'Stalking', strike:'Striking', flee:'Fleeing', feed:'Feeding',
      hide:'Hiding', shelter:'Sheltering', host:'In the anemone', graze:'Grazing the sand', patrol:'Patrolling',
      chase:'Chasing an intruder', clean:'Cleaning a client', forage:'Foraging', drift:'Drifting', cling:'Holding on' };
    let note = '';
    if (!f.alive) note = 'Dead. Get it out of the tank before the ammonia does the rest.';
    else if (f.sick > 0.05) note = 'Showing ich. Treat the tank and fix what stressed it.';
    else if (f.hunger > 0.8) note = f.sp.slowFeeder ? 'Starving — it feeds too slowly to compete at dinner.' : 'Starving.';
    else if (f.finDamage > 0.2) note = 'Fins shredded. Something in this tank is nipping.';
    else if (f.stress > 0.7) note = 'Badly stressed. Check the water and its company.';
    else if (f.sp.school > 1 && T.fish.filter(x => x.alive && x.sp.id === f.sp.id).length < f.sp.school) note = 'It needs more of its own kind before it will settle.';
    else if (f.hostDecor) note = 'Hosted. This is the happiest a clownfish gets.';
    $('ins-stats').innerHTML =
      `<div class="i-stat"><span>Doing</span><b>${moodText[f.mood] || 'Swimming'}</b></div>
       <div class="i-stat"><span>Length</span><b>${f.len.toFixed(1)} / ${f.sp.size} cm</b></div>
       ${bar('Condition', f.health, true)}${bar('Fullness', 1 - clamp(f.hunger, 0, 1), true)}${bar('Stress', clamp(f.stress, 0, 1), false)}
       ${f.finDamage > 0.02 ? bar('Fin damage', f.finDamage, false) : ''}${f.sick > 0.02 ? bar('Illness', clamp(f.sick, 0, 1), false) : ''}
       <div class="i-stat"><span>Age</span><b>${Math.round(f.ageDays)} days</b></div>
       <div class="i-stat"><span>Appeal</span><b>${Math.round(f.sp.appeal * (0.45 + 0.55 * f.len / f.sp.size) * f.health)}</b></div>`;
    $('ins-note').textContent = note;
    $('ins-note').style.display = note ? '' : 'none';
  },
});

Object.assign(UI, {

  modal(kicker, title, sub, bodyHTML, buttons, dismissable = true) {
    $('m-kicker').textContent = kicker || '';
    $('m-title').textContent = title || '';
    $('m-sub').innerHTML = sub || '';
    $('m-body').innerHTML = bodyHTML || '';
    $('m-body').style.display = bodyHTML ? '' : 'none';
    const foot = $('m-foot'); foot.innerHTML = '';
    (buttons || []).forEach(([label, fn, cls]) => {
      const b = document.createElement('button');
      b.className = 'btn ' + (cls || '');
      b.textContent = label;
      b.onclick = () => { Audio.click(); fn(); };
      foot.appendChild(b);
    });
    this.modalDismissable = dismissable;
    $('modal').classList.add('show');
    this.G.wasPaused = this.G.paused;
    this.G.paused = true;
    return $('m-body');
  },
  hideModal() {
    $('modal').classList.remove('show');
    if (this.G && !this.G.over && !this.G.wasPaused) { this.G.paused = false; this.G.setSpeed(this.G.speed || 1); }
  },
  modalChoice(title, sub, opts) {
    this.modal('', title, sub, '', opts.map(([l, fn]) => [l, () => { this.hideModal(); fn(); }, 'primary']).concat([['Cancel', () => this.hideModal(), 'ghost']]));
  },

  /* ── main menu ────────────────────────────────────────────────────────── */
  showMenu() {
    const G = this.G;

    }).join('') + `</div>
    <h4>This save</h4>
    <table class="score">
      <tr><td>Days kept</td><td>${Math.round(Save.data.totals.days).toLocaleString('en-US')}</td></tr>
      <tr><td>Animals kept</td><td>${Save.data.totals.fish.toLocaleString('en-US')}</td></tr>
      <tr><td>Visitors through the doors</td><td>${Math.round(Save.data.totals.visitors).toLocaleString('en-US')}</td></tr>
      <tr><td>Aquapedia discoveries</td><td>${Save.data.pedia.length}</td></tr>
    </table>
    <h4>Sound</h4>
    <input type="range" id="mn-vol" min="0" max="100" value="${Math.round((Save.data.vol ?? 0.6) * 100)}" style="width:100%;accent-color:#4fc8f0">`;
    this.modal('Tidekeeper', G.mode ? 'Menu' : 'Choose a way to play',
      G.mode ? 'Your current tank stays where it is unless you start something new.' : 'Every mode uses the same tank, the same water and the same animals. What changes is what you are being asked to survive.',
      html, G.mode ? [['Resume', () => this.hideModal(), 'primary'], ['Restart mode', () => { this.hideModal(); G.start(G.mode, { chapter: G.chapter, scenario: G.scenario?.id }); }, 'ghost']]
                  : [], !!G.mode);
    $('m-body').querySelectorAll('.mode').forEach(b => b.onclick = () => {
      Audio.click();
      const id = b.dataset.m;
      if (id === 'career') this.showChapters();
      else if (id === 'scenario') this.showScenarios();
      else { this.hideModal(); G.start(id); }
    });
    const v = $('mn-vol');
    if (v) v.oninput = () => { Save.data.vol = +v.value / 100; Audio.setVolume(Save.data.vol); Save.write(); };
  },

  showChapters() {
    const G = this.G, unlocked = Save.data.chapter;
    const html = `<div class="modes">` + CHAPTERS.map((c, i) => {
      const stars = Save.data.stars[c.id] || 0;
      const lock = i > unlocked;
      return `<button class="mode ${lock ? 'locked' : ''}" data-c="${i}"><i>${['🫙','🌿','📐','🧂','🦁','🏛️'][i] || '🐟'}</i>
        <b>${c.kicker}: ${c.name}</b><span>${c.brief.split('.')[0]}.</span>
        <em>${lock ? 'Locked' : stars ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : 'Not yet played'}</em></button>`;
    }).join('') + '</div>';
    this.modal('Career', 'Chapters', 'Each one hands you a tank and a short list of things it wants to see.', html,
      [['Back', () => this.showMenu(), 'ghost']]);
    $('m-body').querySelectorAll('.mode[data-c]').forEach(b => b.onclick = () => {
      Audio.click(); this.hideModal(); G.start('career', { chapter: +b.dataset.c });
    });
  },

  showScenarios() {
    const G = this.G;
    const html = `<div class="modes">` + SCENARIOS.map(s => {
      const stars = Save.data.stars[s.id] || 0;
      return `<button class="mode" data-s="${s.id}"><i>${s.icon}</i><b>${s.name}</b>
        <span>${s.brief.split('.').slice(0, 2).join('.')}.</span>
        <em>${stars ? '★'.repeat(stars) + '☆'.repeat(3 - stars) : s.days + ' days'}</em></button>`;
    }).join('') + '</div>';
    this.modal('Scenarios', 'Puzzles', 'Fixed setups with one hard question each.', html, [['Back', () => this.showMenu(), 'ghost']]);
    $('m-body').querySelectorAll('.mode[data-s]').forEach(b => b.onclick = () => {
      Audio.click(); this.hideModal(); G.start('scenario', { scenario: b.dataset.s });
    });
  },

  showBrief() {
    const G = this.G, r = G.run;
    const goals = r.goals.length ? '<h4>Objectives</h4>' + r.goals.map(g =>
      `<div class="obj"><span class="box"></span><span>${g.text}</span></div>`).join('') : '';
    const extra = r.days ? `<h4>Time</h4><p>${r.days} days.</p>` : '';
    let unlocks = '';
    if (G.mode === 'career') {
      const u = CHAPTERS[G.chapter].unlock || [];
      const names = u.map(id => TK[id] ? TK[id].name : UP[id] ? UP[id].name : id);
      if (names.length) unlocks = `<h4>Finishing this puts on the shelf</h4><p>${names.join(' · ')}</p>`;
    }
    this.modal(r.kicker || '', r.title, '', `<p>${r.brief}</p>${goals}${extra}${unlocks}`,
      [['Begin', () => { this.hideModal(); G.setSpeed(1); }, 'primary']], false);
  },

  showDraft(pool) {
    const G = this.G;
    const html = `<div class="picks">` + pool.map(sp => `
      <button class="pick" data-p="${sp.id}">
        <canvas width="220" height="132" data-ico="${sp.id}"></canvas>
        <b>${sp.name}</b>
        <span>${sp.size} cm · ${cap(sp.zone)} · ${sp.school > 1 ? 'school of ' + sp.school : 'solo'}<br>
        bioload ${sp.bioload} · appeal ${sp.appeal}<br>
        <i style="color:${sp.temper === 'peaceful' ? '#8ef0c4' : sp.temper === 'predator' ? '#ffb0b0' : '#ffd98a'}">${cap(sp.temper)}</i></span>
      </button>`).join('') + '</div>';
    this.modal(`Round ${G.draft.round}`, 'Take one', 'You must take one of the three. It goes straight into the tank.', html, [], false);
    $('m-body').querySelectorAll('canvas[data-ico]').forEach(cv => drawSpeciesIcon(cv, SP[cv.dataset.ico]));
    $('m-body').querySelectorAll('.pick').forEach(b => b.onclick = () => {
      Audio.click(); Audio.splash();
      const sp = SP[b.dataset.p];
      const ev = evaluatePlacement(G.T, sp.id, sp.school > 1 ? sp.school : 1);
      G.addFish(G.T, sp.id, sp.school > 1 ? Math.min(sp.school, 6) : 1, true);
      this.hideModal();
      G.alert(ev.level === 'r' ? 'warn' : 'info', 'Drafted', `<b>${sp.name}</b> joins the tank. ${ev.level !== 'g' ? ev.why : ''}`, 0);
      G.setSpeed(1);
    });
  },

  showResults(why, won, score) {
    const G = this.G;
    const stars = won ? G.starsFor() : 0;
    const rows = score.rows.map(r => `<tr><td>${r[0]}</td><td>${typeof r[1] === 'number' ? r[1].toLocaleString('en-US') : r[1]}${
      r[2] ? ` <span style="color:var(--dimmer);font-weight:600">${r[2] > 0 ? '+' : ''}${r[2]}</span>` : ''}</td></tr>`).join('');
    const head = { won:'Objectives met', failed:'Run over', bankrupt:'Out of money', wipeout:'Nothing left alive', time:'Time up' }[why] || 'Finished';
    const sub = {
      won:'Everything on the list, done.',
      failed:'One of the conditions was broken and the run ended there.',
      bankrupt:'The doors close when the bills do not get paid.',
      wipeout:'The last animal has gone. That is the end of the run.',
      time:'The clock ran out.',
    }[why] || '';
    const body = `${won ? `<div class="stars" style="text-align:center;margin:2px 0 14px">${'★'.repeat(stars)}<u>${'★'.repeat(3 - stars)}</u></div>` : ''}
      <table class="score">${rows}<tr class="tot"><td>Score</td><td>${score.total.toLocaleString('en-US')}</td></tr></table>
      ${G.mode === 'daily' ? `<p style="margin-top:12px;font-size:12px;color:var(--dimmer)">Seed ${G.dailySeed} — everybody gets this one today.</p>` : ''}`;
    const btns = [];
    if (G.mode === 'career' && won && G.chapter + 1 < CHAPTERS.length)
      btns.push(['Next chapter', () => { this.hideModal(); G.start('career', { chapter: G.chapter + 1 }); }, 'primary']);
    btns.push(['Play again', () => { this.hideModal(); G.start(G.mode, { chapter: G.chapter, scenario: G.scenario?.id }); }, won ? 'ghost' : 'primary']);
    btns.push(['Menu', () => { this.hideModal(); this.showMenu(); }, 'ghost']);
    this.modal(G.run.title || '', head, sub, body, btns, false);
  },

  /* ── photo mode ───────────────────────────────────────────────────────── */
  photoInit(post) {
    this.post = post;
    const filters = ['Natural', 'Warm reef', 'Cold deep', 'Silver', 'Vivid'];
    $('ph-filters').innerHTML = filters.map((f, i) => `<button class="fbt ${i === 0 ? 'on' : ''}" data-f="${i}">${f}</button>`).join('');
    $('ph-filters').querySelectorAll('.fbt').forEach(b => b.onclick = () => {
      Audio.click();
      $('ph-filters').querySelectorAll('.fbt').forEach(x => x.classList.remove('on'));
      b.classList.add('on');
      post.grade.uniforms.uFilter.value = +b.dataset.f;
    });
    const sync = () => {
      post.grade.uniforms.uFocus.value = +$('ph-focus').value / 100;
      post.grade.uniforms.uAperture.value = Math.pow(+$('ph-ap').value / 100, 1.4) * 1.2;
      post.grade.uniforms.uExposure.value = 0.55 + (+$('ph-ex').value / 100) * 1.0;
    };
    ['ph-focus', 'ph-ap', 'ph-ex'].forEach(id => $(id).oninput = sync);
    sync();
    $('ph-exit').onclick = () => { Audio.click(); this.setPhoto(false); };
    $('ph-save').onclick = () => { Audio.click(); this.savePhoto(); };
  },
  setPhoto(on) {
    const G = this.G;
    G.photo = on;
    $('photo').classList.toggle('show', on);
    ['dock', 'meters', 'wallet', 'chem', 'inspect', 'alerts', 'panel', 'compat', 'follow'].forEach(id => {
      const el = $(id); if (el) el.style.opacity = on ? '0' : '';
      if (el) el.style.pointerEvents = on ? 'none' : '';
    });
    if (on) { this.closePanel(); G.toast('Photo mode — drag to frame, sliders to focus'); }
    this.post.grade.uniforms.uAperture.value = on ? Math.pow(+$('ph-ap').value / 100, 1.4) * 1.2 : 0;
  },
  savePhoto() {
    const G = this.G;
    try {
      G.renderOnce();
      const url = G.renderer.domElement.toDataURL('image/png');
      const a = document.createElement('a');
      a.href = url; a.download = `tidekeeper-${Date.now()}.png`;
      document.body.appendChild(a); a.click(); a.remove();
      G.toast('Frame saved');
    } catch (e) { G.toast('Could not save the frame'); }
  },
});

/* Keeping the Aquapedia's "species kept" list honest without threading a
   save write through the simulation. */
const _addFishBase = Game.prototype.addFish;
Game.prototype.addFish = function (T, id, n, free) {
  if (!Save.data.seen[id]) { Save.data.seen[id] = 1; Save.write(); }
  return _addFishBase.call(this, T, id, n, free);
};

/* ═══════════════════════════════════════════════════════════════════════════
   12. BOOT
   ═══════════════════════════════════════════════════════════════════════════ */

function boot() {
  const renderer = new THREE.WebGLRenderer({
    antialias: !LITE, powerPreference: 'high-performance', preserveDrawingBuffer: true, alpha: false,
  });
  const DPR = Math.min(window.devicePixelRatio || 1, LITE ? 1.2 : 2);
  renderer.setPixelRatio(DPR);
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.09;
  renderer.domElement.id = 'gl';
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x12505f, 0.05);
  scene.background = new THREE.Color(0x061620);

  const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.08, 140);
  const world = new World(renderer, scene);
  const orbit = new Orbit(camera, renderer.domElement);
  const G = new Game(world, orbit, scene, camera);
  G.renderer = renderer;
  /* test hook, in the same spirit as ?auto / ?shot / ?lite: the headless
     soak tests drive the game through this rather than through the DOM. */
  window.__TK = G;
  G.api = { evaluatePlacement, stepChem, stepBiology, crowdAppeal, ecosystemHealth,
            bioCapacity, bioloadTotal, flowOf, daylight, SPECIES, SP, PL, DEC, UP, FD, TK,
            RELATIONS, CHAPTERS, SCENARIOS, makeTank, Save, UI };

  /* ── post ─────────────────────────────────────────────────────────────── */
  const composer = new EffectComposer(renderer);
  composer.setPixelRatio(DPR);
  composer.setSize(innerWidth, innerHeight);
  composer.addPass(new RenderPass(scene, camera));
  let bloom = null;
  if (!LITE) {
    bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.34, 0.70, 0.92);
    composer.addPass(bloom);
  }
  const grade = new ShaderPass(GradeShader);
  grade.uniforms.uRes.value.set(innerWidth * DPR, innerHeight * DPR);
  grade.uniforms.uNear.value = camera.near; grade.uniforms.uFar.value = camera.far;
  grade.renderToScreen = true;
  composer.addPass(grade);

  /* a depth pre-pass, only paid for when photo mode is actually open */
  let depthRT = null;
  function ensureDepth() {
    const w = Math.floor(innerWidth * DPR), h = Math.floor(innerHeight * DPR);
    if (depthRT && depthRT.width === w && depthRT.height === h) return depthRT;
    if (depthRT) depthRT.dispose();
    depthRT = new THREE.WebGLRenderTarget(w, h);
    depthRT.depthTexture = new THREE.DepthTexture(w, h);
    depthRT.depthTexture.type = THREE.UnsignedIntType;
    return depthRT;
  }

  renderer.info.autoReset = false;
  G.renderOnce = () => {
    renderer.info.reset();
    if (G.photo) {
      const rt = ensureDepth();
      renderer.setRenderTarget(rt); renderer.render(scene, camera); renderer.setRenderTarget(null);
      grade.uniforms.tDepth.value = rt.depthTexture;
    }
    composer.render();
  };
  UI.post = { grade, bloom };

  /* ── picking ──────────────────────────────────────────────────────────── */
  const ray = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  renderer.domElement.addEventListener('pointerup', e => {
    if (orbit.moved > 9) return;
    if (G.photo) return;
    ndc.x = (e.clientX / innerWidth) * 2 - 1;
    ndc.y = -(e.clientY / innerHeight) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    const meshes = [...world.batches.values()].map(b => b.mesh);
    const hits = ray.intersectObjects(meshes, false);
    if (hits.length) {
      const h = hits[0];
      const b = [...world.batches.values()].find(x => x.mesh === h.object);
      const f = b && b.fishAt[h.instanceId];
      if (f) {
        G.selected = f;
        UI.renderInspect();
        G.setFollow(f);
        Audio.blip(900, 0.07, 'sine', 0.04);
        if (!Save.data.seen[f.sp.id]) { Save.data.seen[f.sp.id] = 1; Save.write(); }
        return;
      }
    }
    G.selected = null; UI.renderInspect(); G.setFollow(null);
  });

  /* ── resize ───────────────────────────────────────────────────────────── */
  function resize() {
    const w = innerWidth, h = innerHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    orbit.refit();
    renderer.setSize(w, h);
    composer.setSize(w, h);
    grade.uniforms.uRes.value.set(w * DPR, h * DPR);
    if (bloom) bloom.setSize(w, h);
    world.snow.material.uniforms.uPix.value = DPR * (h / 900);
    if (world.foodPts) world.foodPts.material.uniforms.uPix.value = DPR * (h / 900);
  }
  addEventListener('resize', resize);
  addEventListener('orientationchange', () => setTimeout(resize, 260));

  /* ── go ───────────────────────────────────────────────────────────────── */
  UI.init(G);
  UI.photoInit({ grade, bloom });
  Save.load();
  $('b-menu').insertAdjacentHTML('afterend', '');

  /* a photo-mode entry point that only appears where it belongs */
  const photoBtn = document.createElement('button');
  photoBtn.className = 'dock-b'; photoBtn.id = 'b-photo'; photoBtn.title = 'Photo mode';
  photoBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 8.4A2 2 0 0 1 5 6.6h2.3l1.2-2h7l1.2 2H19a2 2 0 0 1 2 1.8v9a2 2 0 0 1-2 1.8H5a2 2 0 0 1-2-1.8v-9z"/><circle cx="12" cy="12.6" r="3.4"/></svg><span>Photo</span>';
  photoBtn.style.display = 'none';
  photoBtn.onclick = () => { Audio.click(); UI.setPhoto(!G.photo); };
  $('b-menu').parentNode.insertBefore(photoBtn, $('b-menu').previousSibling);

  world.buildTank([6, 3, 3], 'fw');
  orbit.frameTank([6, 3, 3]);
  resize();

  /* first interaction starts the audio context — browsers insist */
  const wake = () => { Audio.init(); Audio.resume(); Audio.setVolume(Save.data.vol ?? 0.6); Audio.fadeIn();
                       removeEventListener('pointerdown', wake); removeEventListener('keydown', wake); };
  addEventListener('pointerdown', wake); addEventListener('keydown', wake);

  let last = performance.now(), acc = 0, frames = 0, fpsT = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const rdt = Math.min((now - last) / 1000, 0.1);
    last = now;
    WORLD_UNIFORMS.uTime.value += rdt;
    FISH_UNIFORMS.uTime.value += rdt * (G.paused ? 0.25 : Math.min(G.speed, 3));
    G.tick(rdt);
    orbit.update(rdt);
    UI.renderMeters();
    const wantPhoto = G.mode === 'zen' ? '' : 'none';
    if ($('b-photo').style.display !== wantPhoto) $('b-photo').style.display = wantPhoto;
    if (AUTO) autoPlay(G, rdt);
    G.renderOnce();
    /* adaptive: if a phone cannot hold it, drop the bloom rather than the framerate */
    frames++; fpsT += rdt;
    if (fpsT > 4) {
      const fps = frames / fpsT; frames = 0; fpsT = 0;
      if (fps < 26 && bloom && bloom.enabled) { bloom.enabled = false; }
      else if (fps > 48 && bloom && !bloom.enabled && !LITE) { bloom.enabled = true; }
    }
  }
  requestAnimationFrame(frame);

  /* fade the loading screen only once a real frame has been drawn */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    window.__TIDEKEEPER_BOOTED__ = true;
    $('load').classList.add('gone');
    setTimeout(() => $('load').remove(), 900);
    if (SHOT) shotSetup(G);
    else if (AUTO) G.start('survival');
    else UI.showMenu();
  }));
}

/* ── a pre-dressed tank for the thumbnail ─────────────────────────────────── */
function shotSetup(G) {
  RNG = rngFrom(88);
  G.start('zen');
  UI.hideModal();
  const T = G.T;
  ['coral','anemone','rockpile','wreck','bubbler'].forEach(id => T.decor.push({ id, health: 1 }));
  for (let i = 0; i < 7; i++) T.plants.push({ id: i % 2 ? 'macro' : 'seagrass', health: 1 });
  G.world.syncContents(T);
  const stock = [['chromis', 14], ['clown', 4], ['lion', 1], ['flashlight', 6], ['jelly', 3], ['shrimp', 2], ['seahorse', 2]];
  stock.forEach(([id, n]) => G.addFish(T, id, n, true));
  T.fish.forEach(f => { f.len = f.sp.size * 0.9; f.health = 1; });
  T.hour = 13;
  G.orbit.yawG = G.orbit.yaw = 0.34; G.orbit.pitchG = G.orbit.pitch = 0.055;
  G.orbit.distG = G.orbit.dist = 12.4;
  G.orbit.tgt.set(0, 3.5, 0); G.orbit.tgtGoal.set(0, 3.5, 0);
  G.setSpeed(1);
  G.world.hideCrowd = true;
  ['dock', 'meters', 'wallet', 'chem', 'inspect', 'alerts', 'compat', 'coach', 'follow'].forEach(id => { const e = $(id); if (e) e.style.display = 'none'; });
}

/* ── headless soak test: plays badly on purpose so the sim gets exercised ── */
function autoPlay(G, dt) {
  if (!G.T) return;
  G.autoTimer -= dt;
  if (G.autoTimer > 0) return;
  G.autoTimer = 1.4;
  if (G.over) { G.start('survival'); return; }
  G.setSpeed(3);
  const T = G.T;
  const pool = SPECIES.filter(s => s.water === T.water && s.price <= G.money);
  if (pool.length && T.fish.length < 26 && rnd() < 0.5) G.addFish(T, pick(pool).id, ri(1, 3));
  if (rnd() < 0.6) G.feed(pick(FOODS).id, 1);
  if (T.nh3 > 0.4 || T.no3 > 50) G.waterChange(0.25);
  if (T.fish.some(f => !f.alive)) G.siphon();
  if (rnd() < 0.12 && G.money > 200) {
    const up = UPGRADES.filter(u => u.price > 0 && u.price < G.money && !has(T, u.id) && (!u.water || u.water === T.water));
    if (up.length) { const u = pick(up); G.money -= u.price; T.upgrades.add(u.id); }
  }
  if (rnd() < 0.2 && G.money > 40) { const pl = PLANTS.filter(p => p.water === T.water); T.plants.push({ id: pick(pl).id, health: 0.9 }); G.world.syncContents(T); }
}

boot();
</script>
