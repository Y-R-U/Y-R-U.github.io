<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#141a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>THRONG</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/ui.css">
<script type="importmap">
{ "imports": {
  "three": "../../lib/three/0.180.0/three.module.js",
  "three/addons/": "../../lib/three/0.180.0/addons/"
} }
</script>
<script>
// Classic script on purpose: a module that fails to load cannot report itself.
(function () {
  window.__bootReady = false;
  window.__bootErrors = [];
  function show(msg) {
    var el = document.getElementById('boot');
    if (!el) return;
    el.classList.add('failed');
    var m = document.getElementById('boot-msg');
    if (m && msg) m.textContent = msg;
  }
  window.addEventListener('error', function (e) {
    var t = e && e.target;
    var what = t && t !== window && (t.src || t.href) ? 'Failed to load ' + (t.src || t.href) : (e.message || 'Script error');
    window.__bootErrors.push(what);
    if (!window.__bootReady) show(what);
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    var r = e && e.reason;
    window.__bootErrors.push(String(r && r.message || r));
    if (!window.__bootReady) show(String(r && r.message || r));
  });
  setTimeout(function () { if (!window.__bootReady) show('The game did not finish loading.'); }, 15000);
  window.__bootReload = function () { location.href = location.pathname + '?v=' + Date.now() + (location.search ? '&' + location.search.slice(1) : ''); };
})();
</script>
</head>
<body>
<div id="stage"><canvas id="view"></canvas></div>
<div id="hud" class="hidden"></div>
<div id="screens"></div>
<div id="boot">
  <div class="boot-card">
    <div class="boot-title">THRONG</div>
    <div class="boot-spin"></div>
    <div id="boot-fail">
      <p id="boot-msg">Something went wrong while loading.</p>
      <button type="button" class="btn btn-primary" onclick="window.__bootReload()">Reload</button>
    </div>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
