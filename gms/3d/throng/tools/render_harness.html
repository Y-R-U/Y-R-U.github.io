<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>THRONG render harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1418; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #hud { position: fixed; left: 6px; top: 6px; font: 11px/1.35 ui-monospace, monospace; color: #fff; background: rgba(0,0,0,.45); padding: 4px 6px; border-radius: 4px; pointer-events: none; white-space: pre; }
  #err { position: fixed; left: 6px; bottom: 6px; right: 6px; font: 12px ui-monospace, monospace; color: #ff8080; white-space: pre-wrap; }
</style>
<script type="importmap">
{ "imports": { "three": "../../../lib/three/0.180.0/three.module.js", "three/addons/": "../../../lib/three/0.180.0/addons/" } }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<div id="err"></div>
<script>
  window.__harness = { ready: false, frames: 0, errors: [] };
  window.addEventListener('error', (e) => { window.__harness.errors.push(String(e.message)); document.getElementById('err').textContent += e.message + '\n'; });
  window.addEventListener('unhandledrejection', (e) => { window.__harness.errors.push(String(e.reason && e.reason.stack || e.reason)); document.getElementById('err').textContent += (e.reason && e.reason.stack || e.reason) + '\n'; });
</script>
<script type="module">
import { generateMap } from '../js/world/map.js';
import { createRenderer } from '../js/render/renderer.js';
import { createFakeSim, SIM_DT } from './render_fake.mjs';

const P = new URLSearchParams(location.search);
const num = (k, d) => (P.has(k) ? +P.get(k) : d);
const seed = num('seed', 1);
const map = generateMap(seed);
const scene = P.get('scene') || 'late';
const sim = createFakeSim({
  map, seed, scene,
  player: num('player', scene === 'late' ? 1200 : 20),
  rivals: (P.get('rivals') || '1100,900,780,640').split(',').filter(Boolean).map(Number),
  neutrals: num('neutrals', 600), move: num('move', 1), ai: num('ai', 1), duration: num('dur', 120),
});
const canvas = document.getElementById('c');
const r = await createRenderer({ canvas, map, quality: P.get('q') || 'high', adaptive: P.get('adaptive') !== '0' });
// cosmetics for the player: hat, hatShare, hatLeaderOnly, leader, flag (emblem id or text), flagColor, trail, ring, palette=hex,hex
// cos=all gives every crowd a different set, to preview them side by side
const COS = { hat: ['cap', 'tophat', 'beanie', 'crown', 'party', 'cowboy', 'hardhat', 'headband', 'chef', 'wizard', 'halo'],
  leader: ['caped', 'king', 'robot', 'mascot'], flag: ['star', 'heart', 'bolt', 'crown', 'moon', 'diamond', 'skull', 'paw', 'flame', 'sun'],
  trail: ['sparkle', 'petals', 'dust', 'lightning', 'confetti', 'hearts', 'smoke'], ring: ['solid', 'dashed', 'double', 'flame', 'pulse'] };
const meta = sim.state.crowds.map((c) => ({ index: c.index, name: c.name, color: c.color }));
const mine = {};
for (const k of ['hat', 'leader', 'trail', 'ring']) if (P.has(k)) mine[k] = P.get(k);
if (P.has('hatShare')) mine.hatShare = +P.get('hatShare');
if (P.get('hatLeaderOnly') === '1') mine.hatLeaderOnly = true;
if (P.has('flag')) mine.flag = P.has('flagColor') ? { emblem: P.get('flag'), color: parseInt(P.get('flagColor'), 16) } : P.get('flag');
if (P.has('palette')) mine.palette = P.get('palette').split(',').map((h) => parseInt(h, 16));
Object.assign(meta[0], mine);
if (P.get('cos') === 'all') meta.forEach((m, i) => Object.assign(m, {
  hat: COS.hat[i % COS.hat.length], leader: COS.leader[i % COS.leader.length], flag: COS.flag[i % COS.flag.length],
  trail: COS.trail[i % COS.trail.length], ring: COS.ring[i % COS.ring.length] }, i === 0 ? mine : {}));
window.__harness.meta = meta;
r.setCrowds(meta);
r.setFocus(num('focus', 0));
if (P.has('fixed')) {
  const [x, z, d] = P.get('fixed').split(',').map(Number);
  r.setFixedCamera({ x, z, d });
}
const ff = num('t', 0);
for (let k = 0; k < ff / SIM_DT; k++) sim.step();
sim.drainEvents();
// at=x,z puts the player there; corner=k puts it against the k-th block corner (camera side), for building-overlap checks
let at = P.has('at') ? P.get('at').split(',').map(Number) : null;
if (P.has('corner')) {
  const rects = map.obstacles.filter((o) => o.type === 'rect' && o.w < map.size * 0.5 && o.d < map.size * 0.5);
  const o = rects[num('corner', 0) % rects.length], c0 = sim.state.crowds[0], k = c0.radius * 0.35;
  at = [o.x + o.w / 2 + k, o.z + o.d / 2 + k];
}
if (at) {
  const c0 = sim.state.crowds[0];
  c0.x = c0.px = at[0]; c0.z = c0.pz = at[1]; c0.vx = c0.vz = 0;
  if (sim.pin) sim.pin(0, at[0], at[1]);
}
// probe=plaza|road: all 8 team crowds (120 each) in a row on the central plaza or along a street, for contrast checks
if (P.has('probe')) {
  const road = P.get('probe') === 'road';
  const pz = map.plazas[0], rx = map.roadsX[1];
  sim.state.crowds.forEach((c, i) => {
    const x = road ? rx.c : pz.x + 14 + (i % 2) * 14, z = road ? -42 + i * 12 : pz.z - 25 + Math.floor(i / 2) * 15;
    c.count = 120; c.radius = 0.55 * Math.sqrt(120); c.x = c.px = x; c.z = c.pz = z; c.vx = c.vz = 0; c.alive = true;
    if (sim.pin) sim.pin(i, x, z);
  });
  r.setFixedCamera(road ? { x: rx.c, z: -2, d: 95 } : { x: pz.x + 21, z: pz.z - 3, d: 90 });
}
// close=d frames the player crowd from a fixed camera at distance d (pitch=deg optional)
if (P.has('close')) {
  const c0 = sim.state.crowds[0];
  r.setFixedCamera({ x: c0.x, z: c0.z, d: num('close', 14), pitch: P.has('pitch') ? num('pitch', 50) * Math.PI / 180 : undefined });
}
// zones=crown,safe,capture,danger|all: demo zones (the safe circle shrinks); recolor=i: crowd i turns the player's colour after 2.5 s
const zoneKinds = P.has('zones') ? (P.get('zones') === 'all' ? ['crown', 'safe', 'capture', 'danger'] : P.get('zones').split(',')) : [];
const pl = map.plazas;
function demoZones(t) {
  const out = [];
  for (const k of zoneKinds) {
    if (k === 'crown') out.push({ id: 'crown', style: 'crown', x: pl[1 % pl.length].x, z: pl[1 % pl.length].z, r: 12 });
    if (k === 'capture') out.push({ id: 'cap', style: 'capture', x: pl[2 % pl.length].x, z: pl[2 % pl.length].z, r: 10, color: 0x2f7bff, progress: (t * 0.08) % 1 });
    if (k === 'safe') out.push({ id: 'safe', style: 'safe', x: pl[0].x + 10, z: pl[0].z - 6, r: Math.max(40, 95 - t * 1.2) });
    if (k === 'danger') out.push({ id: 'dng', style: 'danger', x: pl[0].x - 30, z: pl[0].z + 26, r: 9 });
  }
  return out;
}
if (P.has('recolor')) setTimeout(() => r.updateCrowdMeta(+P.get('recolor'), { color: meta[0].color }), 2500);
let zoneT = num('zt', 0);
const keys = new Set();
addEventListener('keydown', (e) => keys.add(e.key.toLowerCase()));
addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
window.__harness.renderer = r;
window.__harness.sim = sim;
const hud = document.getElementById('hud');
if (P.get('hud') === '0') hud.style.display = 'none';
let acc = 0, last = performance.now();
const paused = P.get('pause') === '1';
function loop(now) {
  const dt = Math.min(0.1, (now - last) / 1000);
  last = now;
  let ax = 0, az = 0;
  if (keys.has('w') || keys.has('arrowup')) az -= 1;
  if (keys.has('s') || keys.has('arrowdown')) az += 1;
  if (keys.has('a') || keys.has('arrowleft')) ax -= 1;
  if (keys.has('d') || keys.has('arrowright')) ax += 1;
  if (ax || az) {
    const y = r.cameraYaw();
    sim.setInput(ax * Math.cos(y) + az * Math.sin(y), -ax * Math.sin(y) + az * Math.cos(y));
  } else if (P.get('drive') === '1') { const a = now / 1000 * 0.35; sim.setInput(Math.cos(a), Math.sin(a)); }
  else sim.setInput(0, 0);
  if (!paused) {
    acc += dt;
    while (acc >= SIM_DT) { sim.step(); acc -= SIM_DT; }
  }
  if (P.has('close')) { const c0 = sim.state.crowds[0]; r.setFixedCamera({ x: c0.x, z: c0.z, d: num('close', 14), pitch: P.has('pitch') ? num('pitch', 50) * Math.PI / 180 : undefined }); }
  if (zoneKinds.length) { zoneT += paused ? 0 : dt; r.setZones(demoZones(zoneT)); }
  // horde=i,j marks Infection horde crowds; boost=i,j keeps the Teams merge boost on
  for (const k of ['horde', 'boost']) if (P.has(k)) for (const i of P.get(k).split(',').map(Number)) { const c = sim.state.crowds[i]; if (c) c[k] = k === 'horde' ? true : 1; }
  const t0 = performance.now();
  r.frame(sim.state, sim.drainEvents(), dt, paused ? 1 : acc / SIM_DT);
  const ms = performance.now() - t0;
  window.__harness.cpuMs = (window.__harness.cpuMs || ms) * 0.95 + ms * 0.05;
  window.__harness.frames++;
  if (window.__harness.frames % 15 === 0 && hud.style.display !== 'none') {
    const s = r.stats();
    hud.textContent = `${s.fps} fps  ${s.quality}  dpr ${s.dpr}\ndraws ${s.drawCalls}  tris ${(s.triangles / 1000).toFixed(0)}k\nfigures ${s.instances} (crowd ${s.crowdFigures} / ped ${s.neutralFigures})\nplayer ${sim.state.crowds[0].count}`;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__harness.ready = true;
</script>
</body>
</html>
