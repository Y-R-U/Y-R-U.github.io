<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>HEIRFRAME UI Kit</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #02060e; }
  #bg { position: fixed; inset: 0; background: url(../refs/ref_boulevard_blue.png) center 40% / cover no-repeat; }
  #bg.gold { background-image: url(../refs/ref_plaza_gold.png); }
  #kit { position: fixed; left: 50%; bottom: 0; translate: -50% 0; z-index: 200; font: 600 12px system-ui, sans-serif; color: #dff; }
  #kit > button { display: block; margin: 0 auto; padding: 4px 14px; border: 1px solid #5fd4ff88; border-bottom: 0; border-radius: 8px 8px 0 0; background: #04142ae0; color: #bff; font: inherit; letter-spacing: .15em; cursor: pointer; }
  #kit .dock { display: none; flex-wrap: wrap; gap: 4px; width: min(880px, 96vw); max-height: 46vh; overflow: auto; padding: 8px; background: #04142af0; border: 1px solid #5fd4ff66; border-radius: 10px 10px 0 0; }
  #kit.open .dock { display: flex; }
  #kit .dock b { flex-basis: 100%; font-size: 10px; letter-spacing: .2em; color: #5fd4ff; margin-top: 4px; }
  #kit .dock button { padding: 7px 10px; border-radius: 6px; border: 1px solid #5fd4ff55; background: #0b2a4a; color: #e8f8ff; font: inherit; cursor: pointer; }
  #kit .dock button:active { background: #1d5a8a; }
  body.nodock #kit { display: none; }
</style>
</head>
<body>
<div id="bg"></div>
<div id="app"></div>
<div id="kit"><button id="kitToggle">UI KIT</button><div class="dock"></div></div>
<script type="module">
import { ui } from '../js/ui/ui.js';
import { ICONS } from '../js/ui/icons.js';

const q = new URLSearchParams(location.search);
if (q.get('dock') === '0') document.body.classList.add('nodock');

if (q.get('theme') === 'undercity') ui.theme('undercity');

let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

];
ui.skills.set(skills);
let dodgeCd = 0;

// minimap placeholder
const mm = ui.hud.minimap;
function drawMap(t) {
  const d = devicePixelRatio || 1, w = mm.clientWidth * d, h = mm.clientHeight * d;
  if (!w) return;
  if (mm.width !== w) { mm.width = w; mm.height = h; }
  const c = mm.getContext('2d');
  c.clearRect(0, 0, w, h);
  c.save(); c.translate(w / 2, h / 2); c.rotate(-t * .05);
  c.strokeStyle = 'rgba(140,210,255,.35)'; c.lineWidth = 3 * d;
  for (let i = -3; i <= 3; i++) { c.beginPath(); c.moveTo(i * 22 * d, -h); c.lineTo(i * 22 * d, h); c.stroke(); c.beginPath(); c.moveTo(-w, i * 26 * d); c.lineTo(w, i * 26 * d); c.stroke(); }
  c.fillStyle = 'rgba(80,160,230,.25)';
  for (let i = 0; i < 9; i++) c.fillRect(((i * 37) % 120 - 60) * d, ((i * 53) % 120 - 60) * d, 14 * d, 18 * d);
  c.fillStyle = 'rgba(60,180,255,.35)'; c.beginPath(); c.ellipse(24 * d, -30 * d, 16 * d, 9 * d, .4, 0, 7); c.fill();
  const blip = (x, y, col, r = 3) => { c.fillStyle = col; c.shadowColor = col; c.shadowBlur = 6 * d; c.beginPath(); c.arc(x * d, y * d, r * d, 0, 7); c.fill(); c.shadowBlur = 0; };
  blip(-20, 14, '#ff5a6e'); blip(-26, 20, '#ff5a6e'); blip(18, 22, '#e8f4ff', 2); blip(-8, -24, '#e8f4ff', 2);
  c.restore();
  c.fillStyle = '#ffd27a'; c.save(); c.translate(w * .78, h * .3); c.rotate(Math.PI / 4); c.fillRect(-4 * d, -4 * d, 8 * d, 8 * d); c.restore();
}

let last = performance.now(), T = 0, ang = 0;
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; T += dt;
  for (const s of skills) s.cd = Math.max(0, s.cd - dt);
  ui.skills.set(skills);
  dodgeCd = Math.max(0, dodgeCd - dt); ui.skills.dodge(dodgeCd, 1.2);
  hudState.buffs.forEach(b => { b.t -= dt; if (b.t <= 0) b.t = b.tMax; });
  if (hudState.mission) hudState.mission.timer = Math.max(0, hudState.mission.timer - dt);
  hudState.energy = Math.min(hudState.energyMax, hudState.energy + dt * 4);
  ui.hud.set({ buffs: hudState.buffs, mission: { ...hudState.mission }, energy: hudState.energy });
  ui.hud.heading(T * .05);
  drawMap(T);
  const m = ui.controls.move;
  if (m.x || m.y) ang += dt * 1.5 * m.x;
  if (!q.get('nomarker')) {
    const a = T * .35 + ang, W = innerWidth, H = innerHeight;
    const sx = W / 2 + Math.cos(a) * W * .75, sy = H / 2 + Math.sin(a) * H * .6;
    const on = sx > 40 && sx < W - 40 && sy > 40 && sy < H - 40;
    ui.marker.set(sx, sy, on, 'Pier 9', 140 + Math.sin(T) * 20);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

ui.on('attack', () => burst(1));
ui.on('dodge', () => { dodgeCd = 1.2; });
ui.on('tap', p => ui.damage(p.x, p.y - 30, 'MOVE', 'miss'));

// Early Act 2 codex state: unknown nodes carry no names so nothing is spoiled.
const codex = {

  people: [
    { id: 'n_founder', gen: 0, state: 'unknown' },
    { id: 'n_gap', gen: 1, collapsed: true, label: 'Generations', parents: ['n_founder'], state: 'unknown' },
    { id: 'n_gp1', gen: 2, state: 'unknown', parents: ['n_gap'], partner: 'n_gp2', need: 3, hint: 'A name scratched off every plaque in the Terraces.' },

  ],

    { id: 'C02', title: 'Tinsel’s Scan', source: 'A1 · Scrap market', text: 'Fragment: …AEL — HEIR PROTOCOL — ACCESS DENIED.', personId: 'n_mother', icon: 'scan' },

const lines = [

function burst(n = 6) {
  const W = innerWidth, H = innerHeight;
  const kinds = ['normal', 'normal', 'normal', 'crit', 'shield', 'heal', 'player', 'miss', 'energy'];
  for (let i = 0; i < n; i++) setTimeout(() => {
    const k = n === 1 ? pick(['normal', 'normal', 'crit']) : kinds[i % kinds.length];
    const amt = k === 'crit' ? 180 + Math.floor(rnd() * 200) : k === 'heal' ? 24 : 20 + Math.floor(rnd() * 70);
    ui.damage(W * (.35 + rnd() * .3), H * (.35 + rnd() * .25), amt, k);
  }, i * 90);
}

let toastI = 0;
const TOASTS = [
  ['Contract accepted', 'good', { sub: 'Signed, Sealed, Delivered' }], ['Heat rising', 'warn', { sub: 'Warden Eyes are converging' }],
  ['+2,400 credits', 'gold'], ['Frame integrity critical', 'bad'], ['Codex updated: The Heir-Key', 'story', { sub: 'Clue C01 recovered' }], ['Checkpoint reached', 'info'],
];
const complete = { title: 'Signed, Sealed, Delivered', grade: 'S', credits: 3250, bonus: 400, xp: 420, xpFrom: 610, xpMax: 900, level: 4, levelUp: true, items: [ITEMS[7], ITEMS[6], ITEMS[4], ITEMS[1]], stats: [{ label: 'Time', value: '3:12' }, { label: 'Hostiles disabled', value: 11 }, { label: 'Civilians harmed', value: 0 }, { label: 'Max heat', value: '2 / 5' }] };

  hud: () => { ui.panel.close(); ui.screen(null); ui.dialogue.close(); },

  heir: () => { skills[3] = skills[3] ? undefined : { id: 'heir', icon: 'heir', label: 'Heir Protocol', cd: 0, cdMax: 60 }; if (!skills[3]) skills.length = 3; },
  settings: () => ui.panel.open('settings'),
  pause: () => ui.panel.open('pause', { mission: hudState.mission, playtime: '2h 14m' }),
  title: () => ui.screen('title', { hasSave: true, version: 'v0.1 · kit' }),
  loading: () => { ui.screen('loading', { progress: .15 }); let p = .15; const t = setInterval(() => { p += .07; ui.loading(p); if (p >= 1) { clearInterval(t); ui.screen(null); } }, 300); },
  loadingStatic: () => ui.screen('loading', { progress: .62, label: 'Streaming district · Aurelia' }),
  rotate: () => ui.screen('rotate'),
  complete: () => ui.screen('complete', complete),
  death: () => ui.screen('death', { cause: 'Hull breach · Civic Enforcer "Warden-9"', cost: 850, tip: 'Enforcers telegraph their charge. Dodge sideways, not back.' }),
  card: () => ui.itemCard(ITEMS[7], ITEMS[0]),
  interact: () => { if (A._i = !A._i) ui.interact.show('Talk to Mara', { icon: 'talk' }); else ui.interact.hide(); },
  hit: () => { hudState.hp = Math.max(0, hudState.hp - 22); hudState.shield = Math.max(0, hudState.shield - 15); ui.hud.set({ hp: hudState.hp, shield: hudState.shield }); ui.hud.flash('hit'); ui.damage(innerWidth / 2, innerHeight / 2, 22, 'player'); },
  heal: () => { hudState.hp = hudState.hpMax; hudState.shield = hudState.shieldMax; ui.hud.set({ hp: hudState.hp, shield: hudState.shield }); ui.hud.flash('heal'); },
  levelup: () => { hudState.level++; ui.hud.set({ level: hudState.level, xp: 40 }); ui.sting(`Level ${hudState.level}`, 'Fully repaired · new contracts on the board', 'level'); },
  credits: () => { hudState.credits += 2400; ui.hud.set({ credits: hudState.credits }); },
  heatUp: () => { hudState.heat = Math.min(5, hudState.heat + 1); ui.hud.set({ heat: hudState.heat }); },
  heatDown: () => { hudState.heat = Math.max(0, hudState.heat - 1); ui.hud.set({ heat: hudState.heat }); },
  noMission: () => ui.hud.set({ mission: (hudState.mission = hudState.mission ? null : { title: 'Eyes on the Spire', objective: 'Photograph the courier', progress: .1, count: '0/3', timer: 25 }) }),
  frame: () => {
    const F = [
      [{ name: 'Bulwark G-7', kind: 'brawler' }, 'fist', [['b_slam', 'slam', 30], ['b_charge', 'charge', 25], ['b_bulwark', 'wall', 35]], { hp: 260, hpMax: 260, shield: 60, shieldMax: 60, energyMax: 80, surcharge: 0 }],
      [{ name: 'Longarm V-3', kind: 'gunner' }, 'carbine', [['g_scatter', 'scatter', 20], ['g_rail', 'rail', 35], ['g_turret', 'turret', 40]], { hp: 180, hpMax: 180, shield: 100, shieldMax: 100, energyMax: 100, surcharge: 0 }],
      [{ name: 'Wisp S-9', kind: 'ghost' }, 'blade', [['h_veil', 'veil', 30], ['h_blink', 'blink', 20], ['h_pulse', 'hack', 45]], { hp: 150, hpMax: 150, shield: 50, shieldMax: 50, energyMax: 120, surcharge: 0 }],
      [{ name: 'HireFrame R-1', kind: 'rental' }, 'baton', [['r_zap', 'pistol', 10], ['r_overclock', 'overclock', 0], ['r_sponsored', 'advert', 25]], { hp: 86, hpMax: 120, shield: 0, shieldMax: 0, energyMax: 60, surcharge: 240 }],
    ];
    A._f = ((A._f ?? 3) + 1) % 4;
    const [frame, atk, sk, st] = F[A._f];
    ui.hud.set({ frame, ...st }); ui.controls.setAttack({ icon: atk });
    sk.forEach(([id, ic, cost], i) => Object.assign(skills[i], { id, icon: ic, cost, cd: 0, ready: true }));
  },
  theme: () => { A._u = !A._u; ui.theme(A._u ? 'undercity' : 'surface'); },
  bg: () => document.getElementById('bg').classList.toggle('gold'),
};

ui.on('contracts', A.contracts);
ui.on('warehouse', A.warehouse);
ui.on('codex', A.codex);
ui.on('pause', A.pause);
ui.on('interact', () => A.dialogue());
ui.on('contract:accept', c => { ui.toast('Contract accepted', 'good', { sub: c.title }); ui.hud.set({ mission: (hudState.mission = { title: c.title, objective: `Travel to ${c.location}`, progress: 0, count: '0/1', timer: c.timeLimit }) }); });
ui.on('warehouse:equip', ({ frameId, itemId }) => {
  const f = warehouse.frames.find(x => x.id === frameId), it = byId(itemId);
  const old = f.slots[it.slot];
  f.slots[it.slot] = it;
  warehouse.inventory = warehouse.inventory.filter(x => x.id !== itemId).concat(old ? [old] : []);
  ui.panel.update(warehouse); ui.toast(`Equipped ${it.name}`, 'good');
});
ui.on('warehouse:salvage', ({ itemId }) => { const it = byId(itemId); warehouse.inventory = warehouse.inventory.filter(x => x.id !== itemId); warehouse.materials.scrap += 6; ui.panel.update(warehouse); ui.toast(`Salvaged ${it.name}`, 'gold', { sub: '+6 Scrap Alloy' }); });
ui.on('warehouse:activate', ({ frameId }) => { warehouse.active = frameId; const f = warehouse.frames.find(x => x.id === frameId); ui.hud.set({ frame: f }); ui.panel.update(warehouse); ui.toast(`${f.name} deployed`, 'good'); });
ui.on('warehouse:buy', () => ui.toast('Not enough credits', 'bad', { sub: '25,000 cr required' }));
ui.on('warehouse:autoEquip', () => ui.toast('Best FR equipped', 'good'));
ui.on('loot:inspect', it => ui.itemCard(it, warehouse.frames[0].slots[it.slot]));
if (q.get('static')) setTimeout(() => (q.get('static').split(',')).forEach(k => A[k] && A[k]()), 80);
ui.on('pause:quit', A.title);
ui.on('lens:capture', () => { ui.lens.flash(); });
ui.on('lens:close', () => { clearInterval(A._lt); ui.lens.hide(); });
ui.on('loot:equip', it => ui.toast(`Equipped ${it.name}`, 'good', { sub: 'Frame Rating ▲' }));
ui.on('contract:threat', t => { board.threat = t; ui.panel.update(board); });
ui.on('warehouse:tune', ({ itemId }) => { const it = byId(itemId); it.tune = (it.tune || 0) + 1; ui.panel.update(warehouse); ui.toast(`Tuned to +${it.tune}`, 'good', { sub: it.name }); });
ui.on('warehouse:mk', () => ui.toast('Not enough credits', 'bad', { sub: '4,000 cr required' }));
ui.on('death:warehouse', A.warehouse);

const dock = document.querySelector('#kit .dock');
const groups = {
  Screens: ['hud', 'title', 'loading', 'rotate', 'complete', 'death'],
  Panels: ['contracts', 'warehouse', 'codex', 'clues', 'settings', 'pause'],
  Panels2: ['frames', 'fabricator', 'people'],
  Feedback: ['toast', 'loot', 'relic', 'heirloom', 'damage', 'card', 'interact', 'dialogue', 'dialogue2', 'twist', 'levelSting'],
  Combat: ['boss', 'detect', 'lens', 'band', 'heir'],
  HUD: ['hit', 'heal', 'levelup', 'credits', 'heatUp', 'heatDown', 'noMission', 'frame', 'theme', 'bg'],
};
for (const [g, list] of Object.entries(groups)) {
  dock.insertAdjacentHTML('beforeend', `<b>${g}</b>`);
  for (const k of list) { const b = document.createElement('button'); b.textContent = k; b.onclick = () => A[k](); dock.append(b); }
}
document.getElementById('kitToggle').onclick = () => document.getElementById('kit').classList.toggle('open');

window.__kit = { A, ui, ITEMS, ICONS, hudState };
window.__game = { ui: () => ui.debug() };
const st = q.get('state');
if (st && A[st]) setTimeout(() => A[st](), 50);
</script>
</body>
</html>
