<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HEIRFRAME Robot Gallery</title>
<style>
  :root { --bg: #0d0f14; --panel: rgba(12,14,20,.72); --ink: #e9edf3; --dim: #97a0ad; --acc: #ffb44a; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 13px/1.3 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #bar { position: fixed; left: 8px; right: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; pointer-events: none; }
  #bar > * { pointer-events: auto; }
  button, select { background: var(--panel); color: var(--ink); border: 1px solid rgba(255,255,255,.14); border-radius: 6px; padding: 5px 8px; font: inherit; cursor: pointer; backdrop-filter: blur(6px); }
  button.on { border-color: var(--acc); color: var(--acc); }
  #info { position: fixed; left: 8px; bottom: 8px; background: var(--panel); padding: 6px 8px; border-radius: 6px; color: var(--dim); white-space: pre; font: 11px/1.35 ui-monospace, Menlo, monospace; max-width: 96vw; overflow: hidden; }
  body.clean #bar, body.clean #info { display: none; }
</style>
</head>
<body>
<div id="bar"></div>
<div id="info">loading…</div>
<script type="importmap">{"imports":{"three":"../../../lib/three/0.180.0/three.module.js","three/addons/":"../../../lib/three/0.180.0/addons/"}}</script>
<script type="module">
import * as THREE from '../../../lib/three/0.180.0/three.module.js';
import { createRobot, ROBOT_KINDS, ANIMS } from '../js/actors/robots.js';

const Q = new URLSearchParams(location.search);
const view = Q.get('view') || 'lineup';
const fixedT = Q.has('t') ? parseFloat(Q.get('t')) : null;
if (Q.has('clean')) document.body.classList.add('clean');

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, parseFloat(Q.get('dpr') || '2')));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = parseFloat(Q.get('exp') || '1.0');
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 400);

// ---- sky + env (warm sun, pale blue sky, a ring of bright towers for chrome to reflect) ----
const skyMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { sun: { value: new THREE.Vector3(0.55, 0.32, 0.77).normalize() } },
  vertexShader: 'varying vec3 vd; void main(){ vd = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: `varying vec3 vd; uniform vec3 sun;
    void main(){ float h = vd.y;
      vec3 zen = vec3(.23,.45,.85), hor = vec3(1.,.86,.66), gnd = vec3(.42,.36,.3);
      vec3 c = h > 0. ? mix(hor, zen, pow(clamp(h,0.,1.), .55)) : mix(hor*.8, gnd, clamp(-h*4.,0.,1.));
      float s = max(dot(vd, sun), 0.);
      c += vec3(1.,.8,.5) * (pow(s, 8.) * .6 + pow(s, 900.) * 40.);
      gl_FragColor = vec4(c, 1.); }`,
});
function envScene() {
  const s = new THREE.Scene();
  s.add(new THREE.Mesh(new THREE.SphereGeometry(50, 48, 24), skyMat));
  const r = (a) => { let x = Math.sin(a * 91.7) * 43758.5; return x - Math.floor(x); };
  for (let i = 0; i < 44; i++) {
    const a = i / 44 * Math.PI * 2 + r(i) * 0.1, d = 26 + r(i + 3) * 14, h = 6 + r(i + 7) * 22, w = 2 + r(i + 11) * 4;
    const lum = 0.5 + r(i + 5) * 1.3;
    const m = new THREE.MeshBasicMaterial({ color: new THREE.Color(0.75 * lum, 0.8 * lum, 0.9 * lum) });
    const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), m);
    b.position.set(Math.cos(a) * d, h / 2 - 3, Math.sin(a) * d);
    s.add(b);
  }
  const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 32), new THREE.MeshBasicMaterial({ color: 0x8c8074 }));
  floor.rotation.x = -Math.PI / 2; floor.position.y = -0.5; s.add(floor);
  return s;
}
let SUN_DIR = new THREE.Vector3(0.55, 0.32, 0.77).normalize(), SUN_COLOR = new THREE.Color(1, 0.94, 0.86);
let post = null;
const useGame = Q.get('env') !== 'mine';
if (useGame) {
  try {
    const atm = await import('../js/engine/atmosphere.js');
    const rp = Q.get('post') === 'game' ? await import('../js/engine/renderer.js') : null;
    SUN_DIR = atm.SUN_DIR; SUN_COLOR = atm.SUN_COLOR;
    scene.environment = atm.buildEnvironment(renderer, 256);
    scene.add(atm.createSky());
    if (rp && Q.get('bloom') !== '0') post = rp.createPost(renderer, scene, camera, { bloom: true, msaa: 4 });
  } catch (e) { console.warn('game env unavailable, using gallery env', e); }
}
if (!scene.environment) {
  const pmrem = new THREE.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(envScene(), 0.02).texture;
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(200, 48, 24), skyMat));
}
if (!post && Q.get('bloom') !== '0') {
  const { EffectComposer } = await import('../../../lib/three/0.180.0/addons/postprocessing/EffectComposer.js');
  const { RenderPass } = await import('../../../lib/three/0.180.0/addons/postprocessing/RenderPass.js');
  const { UnrealBloomPass } = await import('../../../lib/three/0.180.0/addons/postprocessing/UnrealBloomPass.js');
  const { OutputPass } = await import('../../../lib/three/0.180.0/addons/postprocessing/OutputPass.js');
  const c = new EffectComposer(renderer);
  c.addPass(new RenderPass(scene, camera));
  c.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.32, 0.55, 1.35));
  c.addPass(new OutputPass());
  post = { render: () => c.render(), setSize: (w, h) => c.setSize(w, h) };
}
if (Q.get('env') === '0') scene.environment = null;
const sunYaw = Math.atan2(SUN_DIR.x, SUN_DIR.z);

const sun = new THREE.DirectionalLight(SUN_COLOR, 3.1);
sun.position.copy(SUN_DIR).multiplyScalar(20);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -12, right: 12, top: 12, bottom: -12, near: 0.5, far: 60 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.03;
scene.add(sun, sun.target);
scene.add(new THREE.HemisphereLight(0xbcd4ff, 0x8a7a66, 0.35));

const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), new THREE.MeshStandardMaterial({ color: 0xcfc6b8, roughness: 0.3, metalness: 0 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(60, 40, 0xa89c8c, 0xb8ad9f); grid.position.y = 0.002; grid.material.opacity = 0.3; grid.material.transparent = true; scene.add(grid);

// ---- robots ----
const robots = [];
let anim = Q.get('anim') || 'idle';
let spin = Q.get('rot') === null ? 0.3 : 0;
let fixedRot = Q.get('rot') !== null ? parseFloat(Q.get('rot')) : 0;
const quality = Q.get('q') || 'high';
const lod = Q.get('lod') || 'near';

function clear() { for (const r of robots) r.dispose(); robots.length = 0; }
function add(opts, x, z = 0) {
  const r = createRobot({ quality, lod, ...opts });
  const R = camRight(), F = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  r.root.position.copy(R.multiplyScalar(x)).addScaledVector(F, z);
  scene.add(r.root);
  robots.push(r);
  return r;
}

const lineupKinds = (Q.get('kinds') || ROBOT_KINDS.join(',')).split(',');
let target = new THREE.Vector3(0, 1, 0), dist = 8, yaw = sunYaw + 0.55, pitch = 0.08;

function build() {
  clear();
  if (Q.has('yaw')) yaw = sunYaw + +Q.get('yaw');
  if (view === 'lineup' || view === 'iso') {
    const n = lineupKinds.length, sp = parseFloat(Q.get('sp') || '1.05');
    lineupKinds.forEach((k, i) => add({ kind: k, tier: +(Q.get('tier') || 0), seed: +(Q.get('seed') || 1) + i }, (i - (n - 1) / 2) * sp));
    dist = Math.max(4.5, n * sp * 1.9 + 1.5); target.set(0, 1.0, 0);
  } else if (view === 'tiers') {
    const k = Q.get('kind') || 'brawler';
    for (let i = 0; i < 5; i++) add({ kind: k, tier: i, seed: 1 }, (i - 2) * 1.25);
    dist = 12; target.set(0, 1.0, 0);
  } else if (view === 'hero') {
    add({ kind: Q.get('kind') || 'civ_gold', tier: +(Q.get('tier') || 0), seed: +(Q.get('seed') || 1) }, 0);
    dist = 4.2; target.set(0, 1.0, 0);
  } else if (view === 'seeds') {
    const k = Q.get('kind') || 'civ_gold';
    for (let i = 0; i < 8; i++) add({ kind: k, seed: i + 1 }, (i - 3.5) * 0.9);
    dist = 12; target.set(0, 1.0, 0);
  } else if (view === 'crowd') {
    const ks = ['civ_gold', 'civ_chrome', 'civ_black', 'civ_worker'];
    for (let i = 0; i < 24; i++) {
      const r = add({ kind: ks[i % 4], seed: i + 3 }, 0);
      r.orbit = { R: 1.5 + (i % 6) * 0.7, a: i * 2.4, w: (i % 3 === 0 ? 1.4 : 0.9 + (i % 5) * 0.12) };
    }
    dist = 16; target.set(0, 0.8, 0); pitch = 0.5;
  }
  if (view === 'iso') { pitch = 0.92; dist *= 0.9; }
  if (Q.has('dist')) dist = +Q.get('dist');
  if (Q.has('pitch')) pitch = +Q.get('pitch');
  if (Q.has('ty')) target.y = +Q.get('ty');
  setAnim(anim);
}

function setAnim(a) {
  anim = a;
  for (const r of robots) {
    if (r.orbit) { r.setMove(0, r.orbit.w * 1.0); continue; }
    if (a === 'walk') r.setMove(0, Math.min(1.5, r.runSpeed * 0.34));
    else if (a === 'run') r.setMove(1);
    else r.setMove(0);
    r.play(a, { loop: ['attack_melee', 'attack_heavy', 'shoot', 'cast', 'dodge', 'hit'].includes(a) });
  }
  document.querySelectorAll('[data-anim]').forEach((b) => b.classList.toggle('on', b.dataset.anim === a));
}

// ---- UI ----
const bar = document.getElementById('bar');
for (const a of ANIMS) {
  const b = document.createElement('button'); b.textContent = a; b.dataset.anim = a;
  b.onclick = () => setAnim(a); bar.appendChild(b);
}
const sb = document.createElement('button'); sb.textContent = 'spin';
sb.onclick = () => { spin = spin ? 0 : 0.3; sb.classList.toggle('on', !!spin); }; sb.classList.toggle('on', !!spin);
bar.appendChild(sb);
const fb = document.createElement('button'); fb.textContent = 'flash'; fb.onclick = () => robots.forEach((r) => r.hitFlash()); bar.appendChild(fb);
const vs = document.createElement('select');
for (const v of ['lineup', 'iso', 'hero', 'tiers', 'seeds', 'crowd']) { const o = document.createElement('option'); o.value = o.textContent = v; if (v === view) o.selected = true; vs.appendChild(o); }
vs.onchange = () => { Q.set('view', vs.value); location.search = Q.toString(); };
bar.appendChild(vs);

// orbit
let drag = null;
renderer.domElement.addEventListener('pointerdown', (e) => { drag = [e.clientX, e.clientY, yaw, pitch]; });
addEventListener('pointerup', () => { drag = null; });
addEventListener('pointermove', (e) => { if (!drag) return; yaw = drag[2] - (e.clientX - drag[0]) * 0.006; pitch = Math.max(-0.2, Math.min(1.45, drag[3] + (e.clientY - drag[1]) * 0.005)); });
renderer.domElement.addEventListener('wheel', (e) => { dist *= Math.exp(e.deltaY * 0.001); }, { passive: true });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); post && post.setSize(innerWidth, innerHeight, renderer.getPixelRatio());
});

function placeCam() {
  camera.position.set(target.x + Math.sin(yaw) * Math.cos(pitch) * dist, target.y + Math.sin(pitch) * dist, target.z + Math.cos(yaw) * Math.cos(pitch) * dist);
  camera.lookAt(target);
}

let rot = fixedRot, clockT = 0;
const camRight = () => new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
function step(dt) {
  clockT += dt;
  rot += spin * dt;
  for (const r of robots) {
    if (r.orbit) {
      const o = r.orbit; o.a += (o.w / o.R) * dt;
      r.root.position.set(Math.cos(o.a) * o.R, 0, Math.sin(o.a) * o.R);
      r.root.rotation.y = Math.atan2(-Math.sin(o.a), Math.cos(o.a));
    } else r.root.rotation.y = yaw + rot;
    r.update(dt);
  }
}

const info = document.getElementById('info');
let frames = 0, acc = 0, fps = 0, last = performance.now();
function statsText() {
  const lines = robots.slice(0, 14).map((r) => `${(r.kind + ' t' + r.tier).padEnd(16)} dc ${r.drawCalls}  tris ${String(r.tris | 0).padStart(6)}  h ${r.height.toFixed(2)}`);
  return `${view} · ${anim} · ${fps.toFixed(0)} fps · calls ${renderer.info.render.calls} · tris ${renderer.info.render.triangles}\n` + lines.join('\n');
}

window.__gallery = {
  ready: false, robots, THREE, scene, camera, renderer,
  setAnim, step, render: () => { placeCam(); post ? post.render(1 / 60) : renderer.render(scene, camera); },
  stats: () => robots.map((r) => ({ kind: r.kind, tier: r.tier, drawCalls: r.drawCalls, tris: r.tris | 0, height: +r.height.toFixed(3) })),
};

build();
if (fixedT !== null) { const n = Math.round(fixedT / (1 / 60)); for (let i = 0; i < n; i++) step(1 / 60); }

function loop(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (fixedT === null) step(dt);
  placeCam();
  post ? post.render(1 / 60) : renderer.render(scene, camera);
  acc += dt; frames++;
  if (acc > 0.5) { fps = frames / acc; frames = 0; acc = 0; info.textContent = statsText(); }
  window.__gallery.ready = true;
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
