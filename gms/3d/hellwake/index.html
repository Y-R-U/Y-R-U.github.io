<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#080e15" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Hellwake" />
    <meta
      name="description"
      content="The dead are not alone. A portrait-first survival odyssey through a city possessed by demons."
    />
    <title>HELLWAKE — The dead are not alone</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <canvas id="world" aria-label="Hellwake survival battlefield"></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <div id="app">
      <main id="screen"></main>
      <section id="hud" hidden aria-label="Battle status">
        <header class="battle-top">
          <div class="vital">
            <div class="vital-label">
              <span id="survivor-name">MARA</span
              ><span id="hp-label">100 / 100</span>
            </div>
            <div class="health-track"><i id="hp-bar"></i></div>
          </div>
          <button
            class="icon-button"
            id="pause"
            aria-label="Pause game"
          ></button>
        </header>
        <div class="battle-stats">
          <span><i class="status-dot"></i> <b id="time">00:00</b></span
          ><span id="chapter-label">DEAD AIR</span
          ><span><b id="kills">0</b> BANISHED</span>
        </div>
        <div class="mission">
          <span id="mission-symbol">◇</span>
          <div>
            <small id="mission-caption">BREAK THE POSSESSION</small
            ><strong id="mission-text">Find the first seal</strong>
          </div>
          <span id="mission-count">0/2</span>
        </div>
        <div id="boss-hud" hidden>
          <div><span id="boss-name"></span><span>ARCHDEMON</span></div>
          <div class="boss-track"><i id="boss-bar"></i></div>
        </div>
        <div id="tutorial" class="tutorial">
          <span class="tutorial-icon">↟</span
          ><strong>Drag anywhere to move</strong
          ><small>Your weapon fires automatically.</small>
        </div>
        <div id="world-cue" aria-hidden="true"></div>
        <div class="battle-bottom">
          <div id="weapon-slots" class="weapon-slots"></div>
          <div class="xp-label">
            <span id="level">LEVEL 1</span
            ><span id="xp-label">COLLECT THE LIGHT</span>
          </div>
          <div class="xp-track"><i id="xp-bar"></i></div>
        </div>
        <button
          id="pulse"
          class="pulse-button"
          aria-label="Cast cleansing pulse"
        >
          <span id="pulse-icon"></span><small id="pulse-label">PULSE</small>
        </button>
      </section>
      <div id="joystick" hidden aria-hidden="true"><i></i></div>
      <div id="overlay" hidden></div>
      <div id="toast" role="status" aria-live="polite"></div>
      <div id="loading">
        <div class="loading-sigil">✧</div>
        <span>TUNING THE LAST FREQUENCY</span>
      </div>
    </div>
    <script type="module" src="main.mjs"></script>
  </body>
</html>
