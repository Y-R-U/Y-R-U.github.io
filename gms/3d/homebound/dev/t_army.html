<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HOMEBOUND — unit bench</title>
<style>html,body{margin:0;height:100%;background:#8fb4cc;overflow:hidden}canvas{display:block}
#lbl{position:fixed;left:0;right:0;bottom:8px;text-align:center;font:700 13px system-ui;color:#14202c}</style>
</head>
<body>
<div id="lbl"></div>
<script type="importmap">
{ "imports": { "three": "../../../lib/three/0.160.0/three.module.js",
               "three/addons/": "../../../lib/three/0.160.0/addons/" } }
</script>
<script type="module">
// Private bench for units.js. Not part of the game — it exists so a soldier can
// be looked at from two metres away without the HUD, the story bubbles and four
// other agents' systems sitting on top of him.
import * as THREE from 'three';
import { TIERS, PAL } from '../js/config.js';
import { flatMat } from '../js/toon.js';
import { makeTierCrowd, tierHover } from '../js/units.js';

const Q = new URLSearchParams(location.search);
const ONLY = Q.get('tier');                 // one tier, filling the frame
const TOP = Q.has('top');                   // the game's camera angle

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(PAL.sky);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
scene.add(camera);

scene.add(new THREE.HemisphereLight(0xdfeaf2, 0x5b6350, 1.05));
const sun = new THREE.DirectionalLight(0xfff4e0, 1.25);
sun.position.set(-34, 52, -18);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 130 });
scene.add(sun, sun.target);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120), flatMat(PAL.road));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

const list = ONLY ? TIERS.filter((t) => t.id === ONLY) : TIERS;
const crowds = list.map((t, k) => {
  const i = TIERS.indexOf(t);
  const c = makeTierCrowd(i, { max: 8 });
  scene.add(c.group);
  c.count = ONLY ? 3 : 1;
  c.i = i; c.k = k;
  return c;
});

for (const c of crowds) {
  c.geometry.computeBoundingBox();
  const b = c.geometry.boundingBox, t2 = TIERS[c.i];
  console.log(`${t2.id.padEnd(9)} w=${(b.max.x-b.min.x).toFixed(2)} h=${(b.max.y-b.min.y).toFixed(2)} d=${(b.max.z-b.min.z).toFixed(2)}  x${t2.scale} -> h=${((b.max.y-b.min.y)*t2.scale).toFixed(2)}`);
}

const COLS = ONLY ? 3 : 8;
const GAPX = ONLY ? 2.2 : 3.6, GAPZ = 4.2;
function place(t) {
  for (const c of crowds) {
    const t2 = TIERS[c.i];
    const y = tierHover(c.i);
    if (ONLY) {
      for (let j = 0; j < 3; j++) {
        c.set(j, (j - 1) * GAPX, y, 0, t2.scale, j === 1 ? 0 : (j - 1) * 0.7, 1, j * 2.1);
      }
    } else {
      const col = c.k % COLS, row = (c.k / COLS) | 0;
      c.set(0, (col - (COLS - 1) / 2) * GAPX, y, -row * GAPZ, t2.scale, 0, 1, c.k * 1.3);
    }
    c.commit();
    c.update(1 / 60);
  }
}

document.getElementById('lbl').textContent =
  (ONLY ? ONLY.toUpperCase() : list.map((t) => t.name).join('  ·  ')) + (TOP ? '  [top]' : '');

if (ONLY) camera.position.set(0, 2.0, -6.4), camera.lookAt(0, 0.95, 0);
else if (TOP) camera.position.set(0, 13, -13), camera.lookAt(0, 0.6, -2.1);
else camera.position.set(0, 5.0, -26), camera.lookAt(0, 1.0, 0);

let t = 0;
function step(dt) { t += dt; place(t); renderer.render(scene, camera); }
window.__hb = { ready: true, step, drawCalls: () => renderer.info.render.calls };
(function loop() { requestAnimationFrame(loop); step(1 / 60); })();
</script>
</body>
</html>
