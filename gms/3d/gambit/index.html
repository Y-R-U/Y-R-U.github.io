<body>
  <div id="app">
    <header id="topbar">
      <div class="tb-left"></div>
      <div class="tb-right">
        <button id="fs-btn" class="tb-btn" aria-label="Fullscreen"></button>
        <button id="settings-btn" class="tb-btn" aria-label="Settings">
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        </button>
      </div>
    </header>
    <main id="view"></main>
  </div>

  <div id="boot">
    <div class="boot-card">
      <div class="boot-word">GAMBIT</div>
      <div class="boot-spin"></div>
      <div id="boot-status">Setting up the pieces…</div>
      <button id="boot-reload" hidden>Reload</button>
    </div>
  </div>
  <script>
    // Boot watchdog: a stale cached module can hang the module graph silently.
    (function () {
      var shown = false;
      function stuck(msg) {
        if (window.__booted || shown) return;
        shown = true;
        var s = document.getElementById('boot-status'), b = document.getElementById('boot-reload');
        if (s) s.textContent = msg || 'Still loading… something may be stuck.';
        if (b) { b.hidden = false; b.onclick = function () { location.replace(location.pathname + '?v=' + Date.now() + location.hash); }; }
      }
      setTimeout(function () { stuck(); }, 10000);
      addEventListener('error', function (e) {
        if (!window.__booted && e.target && e.target.tagName === 'SCRIPT') stuck('Loading failed. Tap reload.');
      }, true);
    })();
  </script>
  <script type="module" src="js/app/main.js"></script>
</body>
</html>
