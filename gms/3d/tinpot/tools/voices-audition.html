<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tinpot · Radio auditions</title><style>body{margin:0;background:#142b28;color:#f4edce;font:16px system-ui}main{max-width:850px;margin:auto;padding:28px}a{color:#e9bf63}h1{font-size:32px}p{line-height:1.6}header{position:sticky;top:0;background:#142b28;padding:12px 0}select,audio{width:100%;min-height:44px;margin:6px 0}select,button{font:inherit;background:#26483c;color:#f4edce;border:1px solid #688160;border-radius:8px;padding:10px}button{min-height:44px;cursor:pointer;text-align:left}article{display:grid;grid-template-columns:75px 1fr;gap:12px;padding:16px 0;border-bottom:1px solid #395343}small{color:#c5cfae}article p{margin:6px 0}#status{color:#e9bf63;font-size:13px}</style><main><a href="../">← Back to the very small war</a><h1>The wireless department.</h1><p>Six questionable personalities. 115 unsolicited opinions. These are the exact compressed MP3s used by the game.</p><header><label for="cast">Voice</label><select id="cast"><option value="">Everyone</option></select><audio id="player" controls></audio><p id="status" role="status">Choose a line to audition.</p></header><section id="lines"></section></main><script type="module">
const response=await fetch('../audio/voices/manifest.json');const data=await response.json(),select=document.querySelector('#cast'),player=document.querySelector('#player');for(const [id,voice]of Object.entries(data.cast))select.add(new Option(voice.name,id));function render(){const root=document.querySelector('#lines');root.replaceChildren();for(const line of data.clips.filter(c=>!select.value||c.voice===select.value)){const row=document.createElement('article'),play=document.createElement('button'),content=document.createElement('div'),tag=document.createElement('small'),text=document.createElement('p');play.textContent='Play ▷';play.onclick=()=>{player.src='../audio/voices/'+line.file;player.play().catch(()=>{});document.querySelector('#status').textContent=data.cast[line.voice].name+' · '+line.event+' · '+line.duration+'s';};tag.textContent=data.cast[line.voice].name+' / '+line.event;text.textContent=line.text;content.append(tag,text);row.append(play,content);root.append(row);}}select.onchange=render;render();
</script></html>
