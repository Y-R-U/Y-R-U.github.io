<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Synthwild UI harness</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b2430; overflow: hidden; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui-root"></div>
<script type="module">
// Lane-5 test bed: real settings/HUD/shell/audio/inventory with stubbed engine pieces.
// ?state=title|play|inv|wheel|pause|settings|intro  ?mode=build  ?night=1  ?hurt=1
import { createBus } from '../js/core/bus.js';
import { BLOCKS } from '../js/data/blocks.js';
import { createItems } from '../js/data/items.js';
import { Inventory } from '../js/game/inventory.js';
import { settings } from '../js/ui/settings.js';
import { audio } from '../js/audio/audio.js';
import { ui } from '../js/ui/ui.js';

const q = new URLSearchParams(location.search);
const canvas = document.getElementById('game');
const bg = new Image(); bg.src = '../assets/intro/forest.webp';
function paint() {
  canvas.width = innerWidth; canvas.height = innerHeight;
  const g = canvas.getContext('2d');
  if (bg.complete && bg.naturalWidth) g.drawImage(bg, 0, 0, canvas.width, canvas.height);
  else { const gr = g.createLinearGradient(0, 0, 0, canvas.height); gr.addColorStop(0, '#7fd3f0'); gr.addColorStop(1, '#3f8a4a'); g.fillStyle = gr; g.fillRect(0, 0, canvas.width, canvas.height); }
  if (q.get('night')) { g.fillStyle = 'rgba(10,20,70,.6)'; g.fillRect(0, 0, canvas.width, canvas.height); }
}
bg.onload = paint; addEventListener('resize', paint); paint();

const bus = createBus();
const items = createItems(BLOCKS);
const inv = new Inventory(items, bus);
const mk = () => ({ on: {}, emit(t, d) { (this.on[t] || []).forEach((f) => f(d)); } });
const input = {
  _l: {}, enabled: true, device: 'touch',
  on(t, f) { (this._l[t] ||= []).push(f); }, emit(t, d) { (this._l[t] || []).forEach((f) => f(d)); },
  releasePointer() {}, requestPointer() {}, releaseAll() {},
};
addEventListener('keydown', (e) => {
  if (!input.enabled && !['Escape'].includes(e.key)) return;
  if (e.key === 'e') input.emit('inventory'); else if (e.key === 'q') input.emit('wheel'); else if (e.key === 'Escape') input.emit('pause');
  else if (/^[1-9]$/.test(e.key)) inv.select(+e.key - 1);
});
const brush = { scale: 1, mode: 'fill', dims: [1, 1, 1], maxScale: 8,
  setScale(s) { this.scale = s; }, setMode(m) { this.mode = m; }, setDims(w, h, d) { this.dims = [w, h, d]; } };
const survival = { integrity: q.get('hurt') ? 7 : 17, charge: 13.5, air: q.get('water') ? 6 : 10, maxAir: 10 };
const ctx = { canvas, uiRoot: document.getElementById('ui-root'), bus, input, brush, settings, audio, ui,
  game: { inv, items, survival }, sky: { isNight: !!q.get('night') }, player: { underwater: !!q.get('water') },
  session: { mode: q.get('mode') || 'survival', paused: true, meta: null } };
window.__ui = ctx;

const fakeGame = {
  async start(meta, data) {
    ctx.session.mode = meta.mode; inv.creative = meta.mode === 'build';
    if (data?.inv) inv.load(data.inv);
    else if (meta.mode === 'build') inv.fillCreativeHotbar(items.palette());
    else {
      const K = items.KEY;
      [[K.photomoss, 32], [K.loam_mesh, 18.25], [K.basalt_matrix, 64], [K.lattice_cutter ?? null, 1], [K.sun_fruit, 5], [K.carbon_nodule, 3]]
        .forEach(([id, n], i) => { if (id != null) inv.setSlot(i, id, n); });
      items.palette().slice(3, 15).forEach((id, i) => inv.setSlot(9 + i, id, 1 + i * 5));
    }
    await new Promise((r) => setTimeout(r, 700));
  },
  async save() { return { inv: inv.serialize(), t: Date.now() }; },
  stop() {},
};
audio.init(ctx);
ui.init(ctx, fakeGame);

const st = q.get('state');
const meta = { id: null, temp: true, name: 'Glowmoss Valley', seed: 'abc', mode: ctx.session.mode, source: 'local', mine: true };
if (st && st !== 'title' && st !== 'intro') {
  settings.set('introSeen', true);
  ui.shell.play(meta, { fresh: true }).then(() => {
    if (st === 'inv') ui.toggle('inventory');
    if (st === 'wheel') ui.toggle('wheel');
    if (st === 'pause') ui.shell.pause();
    if (st === 'settings') { ui.shell.pause(); ui.openSettings(); }
    if (q.get('hurt')) bus.emit('player:damage', { amount: 2 });
  });
}
let last = performance.now();
(function loop(t) { ui.update((t - last) / 1000); last = t; requestAnimationFrame(loop); })(last);
</script>
</body>
</html>
