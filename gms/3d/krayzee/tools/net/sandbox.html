<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Krayzee net sandbox</title>
<style>
  html, body { margin: 0; height: 100%; background: #0a1230; color: #fbf6ea; font: 13px system-ui, sans-serif; overflow: hidden; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 10px; top: 10px; z-index: 5; background: rgba(0,0,0,.45); padding: 8px 10px; border-radius: 10px; white-space: pre; font: 12px ui-monospace, Menlo, monospace; }
  #toLobby { position: fixed; right: 10px; top: 10px; z-index: 5; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #e2b04a; background: #16244f; color: #f7dc8f; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="hud"></div>
<button id="toLobby">Lobby</button>
<script type="module" src="sandbox.js"></script>
</body>
</html>
