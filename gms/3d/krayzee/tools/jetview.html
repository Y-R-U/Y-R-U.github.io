<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krayzee — big plane viewer</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d1116; color: #e7ecf2; font: 13px/1.3 system-ui, -apple-system, Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #bar { position: fixed; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 16px); }
  #bar.hide { display: none; }
  button, select { background: #22303f; color: #e7ecf2; border: 1px solid #3a4a5e; border-radius: 6px; padding: 5px 8px; font: inherit; }
  button.on { background: #2f6fb2; border-color: #4b8fd8; }
  #stats { position: fixed; right: 8px; bottom: 8px; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; font: 12px ui-monospace, monospace; white-space: pre; }
</style>
<script type="importmap">
{ "imports": { "three": "../../../lib/three/0.180.0/three.module.js", "three/addons/": "../../../lib/three/0.180.0/addons/" } }
</script>
</head>
<body>
<div id="bar">
  <select id="type"><option value="jumbo">Royal Jumbo</option><option value="herc">Royal Hercules</option><option value="cub">Butter Cub</option><option value="pitts">Show-Off (Pitts)</option><option value="throne">Divine Right (throne)</option></select>
  <button id="vChase" class="on">Chase</button><button id="vCenter">Center</button><button id="vCockpit">Cockpit</button>
  <button id="gear" class="on">Gear</button><button id="extra">Stairs/Ramp</button><button id="anim">Animate</button><button id="spin">Turntable</button>
</div>
<div id="stats"></div>
<script type="module">
// JETMODELS-A viewer: tools/jetview.html?type=jumbo|herc&view=chase|cockpit|center&az=&el=&dist=&fov=&q=low
// &gear=0..1 &stairs=1 &ramp=0..1 &throttle= &flaps= &lod=0|1|2 (force a level) &shot (hide UI) &spin (turntable)
// ROSTER: type=cub|pitts|throne too; &level (taildraggers datum-level instead of tail-down), &nozzle=0..1 (throne jet pack)
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createPlane } from '../js/plane/index.js';

const Q = new URLSearchParams(location.search);
const quality = Q.get('q') === 'low' ? 'low' : 'high';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: Q.has('shot') });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5c8fc9'); gr.addColorStop(0.55, '#a9c6e2'); gr.addColorStop(1, '#dfe6ea');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; scene.background = t;
}
scene.add(new THREE.HemisphereLight(0xcfe3ff, 0x6b6656, 0.9));
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096); sun.shadow.bias = -0.0003; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);
const ground = new THREE.Mesh(new THREE.CircleGeometry(400, 64), new THREE.MeshStandardMaterial({ color: 0x5d6064, roughness: 0.92 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const lines = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 300), new THREE.MeshStandardMaterial({ color: 0xd9b62c, roughness: 0.8 }));
lines.rotation.x = -Math.PI / 2; lines.position.y = 0.01; scene.add(lines);

const TYPE = Q.get('type') || 'jumbo';
const sel = document.getElementById('type'); sel.value = TYPE;
sel.onchange = () => { const u = new URL(location.href); u.searchParams.set('type', sel.value); location.href = u; };
const LIV = { company: Q.get('name') ?? 'Dirk Air', registration: Q.get('reg') ?? 'K-DIRK', primary: Q.get('p') ? '#' + Q.get('p') : '#f4f1ea', secondary: Q.get('s') ? '#' + Q.get('s') : '#1f4fa8', accent: Q.get('a') ? '#' + Q.get('a') : '#e8b21c' };
const t0 = performance.now();
const plane = await createPlane({ type: TYPE, quality, cockpit: Q.get('cockpit') !== '0', livery: LIV, gear: Q.has('gear') ? +Q.get('gear') : 1, stairs: Q.has('stairs') });
const buildMs = performance.now() - t0;
const D = plane.dims;
plane.root.position.y = D.restHeight ?? D.gearHeight;
if (D.groundPitch && !Q.has('level')) plane.root.rotation.x = D.groundPitch;   // taildraggers sit tail-down (ROSTER)
if (Q.has('nozzle')) { plane.setNozzle?.(+Q.get('nozzle'), true); plane.setLiftFan?.(+Q.get('nozzle'), true); }
scene.add(plane.root);
window.__plane = plane;
if (Q.has('ramp')) plane.setRamp?.(+Q.get('ramp'));
const R = Math.max(D.length, D.span) * 0.62;
Object.assign(sun.shadow.camera, { left: -R, right: R, top: R, bottom: -R, near: 1, far: R * 6 });
sun.position.set(-0.45 * R * 2, R * 2, -0.3 * R * 2);

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 4000);
const orbit = { az: +(Q.get('az') ?? 225), el: +(Q.get('el') ?? 14), dist: +(Q.get('dist') ?? D.span * 1.6), target: new THREE.Vector3(+(Q.get('tx') ?? 0), +(Q.get('ty') ?? D.gearHeight * 0.9), +(Q.get('tz') ?? 0)) };
const look = { yaw: +(Q.get('yaw') ?? 0), pitch: +(Q.get('pitch') ?? (plane.eyePitch * 180 / Math.PI)) };
let view = ['cockpit', 'center'].includes(Q.get('view')) ? Q.get('view') : 'chase';
const controls = { aileron: +(Q.get('aileron') ?? 0), elevator: +(Q.get('elevator') ?? 0), rudder: +(Q.get('rudder') ?? 0), throttle: +(Q.get('throttle') ?? 0.3), flaps: +(Q.get('flaps') ?? 0), brake: 0 };
const inst = { airspeed: +(Q.get('ias') ?? 0), altitude: +(Q.get('alt') ?? 0), vsi: 0, heading: 90, pitch: 0, roll: 0, slip: 0 };
if (Q.has('rpm')) inst.rpm = +Q.get('rpm');

function placeCamera() {
  if (view !== 'chase') {
    const ve = Q.get('portrait') === '1' || camera.aspect < 1 ? plane.viewEye(view, camera.aspect) : null;
    camera.fov = +(Q.get('fov') ?? (ve?.fov || 66)); camera.near = 0.03;
    const e = (ve ? ve.eye : (view === 'center' ? plane.eyeCenter : plane.eye)).clone(); plane.root.localToWorld(e);
    camera.position.copy(e);
    const pitch = ve && !Q.has('pitch') ? ve.pitch : look.pitch * Math.PI / 180;
    camera.quaternion.copy(plane.root.quaternion).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(pitch, look.yaw * Math.PI / 180, 0, 'YXZ')));
  } else {
    camera.fov = +(Q.get('fov') ?? 36); camera.near = 0.3;
    const a = orbit.az * Math.PI / 180, e = orbit.el * Math.PI / 180;
    camera.position.set(orbit.target.x + Math.sin(a) * Math.cos(e) * orbit.dist, orbit.target.y + Math.sin(e) * orbit.dist, orbit.target.z + Math.cos(a) * Math.cos(e) * orbit.dist);
    camera.lookAt(orbit.target);
  }
  camera.updateProjectionMatrix();
}
function setView(v) { view = v; plane.setView(v); for (const [id, k] of [['vChase', 'chase'], ['vCenter', 'center'], ['vCockpit', 'cockpit']]) document.getElementById(id).classList.toggle('on', v === k); }
setView(view);
window.__setView = setView; window.__orbit = orbit; window.__look = look; window.__controls = controls; window.__inst = inst;
document.getElementById('vChase').onclick = () => setView('chase');
document.getElementById('vCenter').onclick = () => setView('center');
document.getElementById('vCockpit').onclick = () => setView('cockpit');
let gearDown = !Q.has('gear') || +Q.get('gear') > 0.5;
document.getElementById('gear').onclick = (e) => { gearDown = !gearDown; plane.setGear(gearDown ? 1 : 0); e.target.classList.toggle('on', gearDown); };
let extra = false;
document.getElementById('extra').onclick = (e) => { extra = !extra; plane.setStairs?.(extra); plane.setRamp?.(extra ? 1 : 0); e.target.classList.toggle('on', extra); };
let animate = Q.has('anim'), spin = Q.has('spin');
document.getElementById('anim').onclick = (e) => { animate = !animate; e.target.classList.toggle('on', animate); };
document.getElementById('spin').onclick = (e) => { spin = !spin; e.target.classList.toggle('on', spin); };
if (Q.has('shot')) for (const id of ['bar', 'stats']) document.getElementById(id).style.display = 'none';

// pointer orbit / look
const ptrs = new Map();
renderer.domElement.addEventListener('pointerdown', (e) => { renderer.domElement.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); });
renderer.domElement.addEventListener('pointerup', (e) => ptrs.delete(e.pointerId));
renderer.domElement.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1]; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (view !== 'chase') { look.yaw -= dx * 0.25; look.pitch = Math.max(-80, Math.min(80, look.pitch - dy * 0.25)); }
  else { orbit.az -= dx * 0.4; orbit.el = Math.max(-30, Math.min(85, orbit.el + dy * 0.3)); }
});
renderer.domElement.addEventListener('wheel', (e) => { orbit.dist = Math.min(1500, Math.max(5, orbit.dist * Math.exp(e.deltaY * 0.001))); }, { passive: true });
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// rig-only budget: { view, calls, triangles } for the current camera, optionally forcing an LOD level
window.__measure = (v = view, level = null) => {
  const prev = view; setView(v);
  const bg = scene.background; scene.background = null; ground.visible = lines.visible = false;
  renderer.shadowMap.enabled = false; renderer.info.reset(); renderer.info.autoReset = false;
  placeCamera(); plane.root.updateMatrixWorld(true);
  if (level != null) { plane.lod.autoUpdate = false; plane.lod.levels.forEach((l, i) => (l.object.visible = i === level)); }
  renderer.render(scene, camera);
  const r = { view: v, quality, level, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  if (level != null) plane.lod.autoUpdate = true;
  renderer.info.autoReset = true; renderer.shadowMap.enabled = true; scene.background = bg; ground.visible = lines.visible = true; setView(prev);
  return r;
};
window.__lodTris = () => plane.lod.levels.map((l, i) => { let t = 0, m = 0; l.object.traverse((o) => { if (o.isMesh && o.geometry.index) { t += o.geometry.index.count / 3; m++; } }); return { level: i, distance: l.distance, meshes: m, tris: t }; });

const clock = new THREE.Clock();
let frames = 0, fpsT = 0;
function tick() {
  const dt = Math.min(0.05, clock.getDelta()), t = clock.elapsedTime;
  if (animate) Object.assign(controls, { aileron: Math.sin(t * 0.9), elevator: Math.sin(t * 0.7 + 1), rudder: Math.sin(t * 0.5 + 2), throttle: 0.5 + 0.5 * Math.sin(t * 0.3), flaps: 0.5 + 0.5 * Math.sin(t * 0.2) });
  if (spin) orbit.az += dt * 12;
  plane.setControls(controls);
  plane.updateInstruments(inst);
  plane.update(dt);
  placeCamera();
  renderer.render(scene, camera);
  frames++; fpsT += dt;
  if (fpsT > 0.5) { document.getElementById('stats').textContent = `${TYPE} ${quality} ${view} ${(frames / fpsT).toFixed(0)} fps  build ${buildMs.toFixed(0)} ms\ncalls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles / 1000).toFixed(1)}k (incl. shadows)`; frames = 0; fpsT = 0; }
  requestAnimationFrame(tick);
}
addEventListener('error', (e) => { window.__err = (window.__err || []).concat(String(e.message)); });
window.__ready = true;
tick();
</script>
</body>
</html>
