<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Krayzee — plane test</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0d1116; color: #e7ecf2; font: 13px/1.3 system-ui, -apple-system, Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; touch-action: none; }
  #ui { position: fixed; top: 8px; left: 8px; width: 260px; max-height: calc(100% - 16px); overflow: auto; background: rgba(12,16,22,.82); border: 1px solid #2a3442; border-radius: 10px; padding: 10px; box-sizing: border-box; backdrop-filter: blur(6px); }
  #ui.hide { display: none; }
  #ui h1 { font-size: 14px; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .row label { flex: 0 0 74px; color: #9fb0c3; }
  .row input[type=range] { flex: 1; min-width: 0; }
  .row input[type=text] { flex: 1; min-width: 0; background: #0b0f14; color: #fff; border: 1px solid #334; border-radius: 6px; padding: 4px 6px; }
  .row output { flex: 0 0 38px; text-align: right; font-variant-numeric: tabular-nums; color: #cfe; }
  button { background: #22303f; color: #e7ecf2; border: 1px solid #3a4a5e; border-radius: 6px; padding: 5px 8px; font: inherit; }
  button.on { background: #2f6fb2; border-color: #4b8fd8; }
  #stats { position: fixed; right: 8px; bottom: 8px; background: rgba(0,0,0,.55); padding: 6px 8px; border-radius: 6px; font: 12px ui-monospace, monospace; white-space: pre; }
  #tog { position: fixed; right: 8px; top: 8px; }
  details summary { cursor: pointer; color: #9fb0c3; margin: 6px 0; }
  @media (max-width: 600px) { #ui { width: calc(100% - 16px); max-height: 46%; top: auto; bottom: 8px; } #stats { bottom: auto; top: 46px; } }
</style>
<script type="importmap">
{ "imports": { "three": "../../../lib/three/0.180.0/three.module.js", "three/addons/": "../../../lib/three/0.180.0/addons/" } }
</script>
</head>
<body>
<div id="ui">
  <h1>C172 — PLANE lane test</h1>
  <div class="row"><label>Name</label><input id="name" type="text" maxlength="14" value="Dirk Air"></div>
  <div class="row"><label>Reg</label><input id="reg" type="text" maxlength="8" value="K-DIRK"></div>
  <div class="row"><label>Primary</label><input id="primary" type="color" value="#f4f1ea"></div>
  <div class="row"><label>Secondary</label><input id="secondary" type="color" value="#1f4fa8"></div>
  <div class="row"><label>Accent</label><input id="accent" type="color" value="#e8b21c"></div>
  <div class="row"><button id="vChase" class="on">Chase</button><button id="vCenter">Center</button><button id="vCockpit">Cockpit</button></div>
  <div class="row"><button id="qBtn"></button><button id="anim">Animate</button><button id="gBtn">Pilot: m</button><button id="sBtn">Skin</button></div>
  <div class="row"><label>Night</label><input id="night" type="range" min="0" max="1" step="0.01" value="0.35"><output id="nightO">0.35</output></div>
  <details open><summary>Controls</summary><div id="ctl"></div></details>
  <details><summary>Instruments</summary><div id="ins"></div></details>
</div>
<button id="tog">UI</button>
<div id="stats"></div>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createPlane } from '../js/plane/index.js';

const Q = new URLSearchParams(location.search);
const quality = Q.get('q') === 'low' || Q.has('lite') ? 'low' : 'high';
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: Q.has('shot') });
renderer.setPixelRatio(Math.min(devicePixelRatio, quality === 'low' ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.55;
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#5c8fc9'); gr.addColorStop(0.55, '#a9c6e2'); gr.addColorStop(1, '#dfe6ea');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
  window.__sky = t;
}
const hemi = new THREE.HemisphereLight(0xcfe3ff, 0x6b6656, 0.9);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff1dc, 2.6);
sun.position.set(-6, 10, -4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8, near: 1, far: 40 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: 0x5d6064, roughness: 0.92 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const lines = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 40), new THREE.MeshStandardMaterial({ color: 0xd9b62c, roughness: 0.8 }));
lines.rotation.x = -Math.PI / 2; lines.position.set(0, 0.003, 0);
scene.add(lines);

const plane = await createPlane({ type: 'c172', quality, cockpit: true, livery: { company: 'Dirk Air', registration: 'K-DIRK', primary: '#f4f1ea', secondary: '#1f4fa8', accent: '#e8b21c' } });
plane.root.position.y = plane.dims.gearHeight;
scene.add(plane.root);
window.__plane = plane;

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.05, 400);
const orbit = { az: +(Q.get('az') ?? 225), el: +(Q.get('el') ?? 14), dist: +(Q.get('dist') ?? 15.5), target: new THREE.Vector3(+(Q.get('tx') ?? 0), +(Q.get('ty') ?? 1.25), +(Q.get('tz') ?? -0.2)) };
const look = { yaw: +(Q.get('yaw') ?? 0), pitch: +(Q.get('pitch') ?? (plane.eyePitch * 180 / Math.PI)) };
let view = ['cockpit', 'center'].includes(Q.get('view')) ? Q.get('view') : 'chase';

function placeCamera() {
  if (view !== 'chase') {
    camera.near = 0.03;
    // ?portrait=1 previews rig.viewEye(): the eye/fov/pitch the game camera should use on tall screens
    const ve = Q.get('portrait') === '1' ? plane.viewEye(view, camera.aspect) : null;
    camera.fov = +(Q.get('fov') ?? (ve?.fov || 66));
    const e = (ve ? ve.eye : (view === 'center' ? plane.eyeCenter : plane.eye)).clone(); plane.root.localToWorld(e);
    camera.position.copy(e);
    const pitch = ve && !Q.has('pitch') ? ve.pitch : look.pitch * Math.PI / 180;
    camera.quaternion.setFromEuler(new THREE.Euler(pitch, look.yaw * Math.PI / 180, 0, 'YXZ'));
  } else {
    camera.fov = +(Q.get('fov') ?? 36);
    camera.near = 0.1;
    const a = orbit.az * Math.PI / 180, e = orbit.el * Math.PI / 180;
    camera.position.set(orbit.target.x + Math.sin(a) * Math.cos(e) * orbit.dist, orbit.target.y + Math.sin(e) * orbit.dist, orbit.target.z + Math.cos(a) * Math.cos(e) * orbit.dist);
    camera.lookAt(orbit.target);
  }
  camera.updateProjectionMatrix();
}
function setView(v) {
  view = v; plane.setView(v);
  document.getElementById('vChase').classList.toggle('on', v === 'chase');
  document.getElementById('vCockpit').classList.toggle('on', v === 'cockpit');
  document.getElementById('vCenter').classList.toggle('on', v === 'center');
}
window.__setView = setView; window.__orbit = orbit; window.__look = look;
setView(view);

// pointer orbit / look
const ptrs = new Map(); let pinch0 = 0;
renderer.domElement.addEventListener('pointerdown', (e) => { renderer.domElement.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]); });
renderer.domElement.addEventListener('pointerup', (e) => { ptrs.delete(e.pointerId); pinch0 = 0; });
renderer.domElement.addEventListener('pointermove', (e) => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p[0], dy = e.clientY - p[1];
  ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()]; const d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (pinch0) orbit.dist = Math.min(60, Math.max(3, orbit.dist * pinch0 / d)); pinch0 = d; return;
  }
  if (view !== 'chase') { look.yaw -= dx * 0.25; look.pitch = Math.max(-80, Math.min(80, look.pitch - dy * 0.25)); }
  else { orbit.az -= dx * 0.4; orbit.el = Math.max(-30, Math.min(85, orbit.el + dy * 0.3)); }
});
renderer.domElement.addEventListener('wheel', (e) => { orbit.dist = Math.min(60, Math.max(3, orbit.dist * Math.exp(e.deltaY * 0.001))); }, { passive: true });

// UI
const ui = document.getElementById('ui');
if (Q.get('ui') === '0') ui.classList.add('hide');
document.getElementById('tog').onclick = () => ui.classList.toggle('hide');
document.getElementById('vChase').onclick = () => setView('chase');
document.getElementById('vCockpit').onclick = () => setView('cockpit');
document.getElementById('vCenter').onclick = () => setView('center');
const gb = document.getElementById('gBtn');
gb.onclick = () => { const g = plane.pilot()?.gender === 'm' ? 'f' : 'm'; plane.setPilot({ gender: g }); gb.textContent = 'Pilot: ' + g; };
const SKINS = ['light', 'fair', 'tan', 'brown', 'dark'];
document.getElementById('sBtn').onclick = () => { const i = SKINS.indexOf(plane.pilot()?.skin); plane.setPilot({ skin: SKINS[(i + 1) % SKINS.length] }); };
const nightI = document.getElementById('night');
const setNight = (v) => {
  plane.setLightLevel(v); nightI.value = v; document.getElementById('nightO').textContent = (+v).toFixed(2);
  scene.background = v > 0.6 ? new THREE.Color(0x070a12) : window.__sky;
  hemi.intensity = 0.9 * (1 - v * 0.93); sun.intensity = 2.6 * (1 - v * 0.97); scene.environmentIntensity = 0.55 * (1 - v * 0.92);
};
nightI.addEventListener('input', () => setNight(+nightI.value));
if (Q.has('night')) setNight(+Q.get('night'));
if (Q.has('gender')) plane.setPilot({ gender: Q.get('gender') });
const qb = document.getElementById('qBtn'); qb.textContent = 'Quality: ' + quality;
qb.onclick = () => { const u = new URL(location.href); u.searchParams.set('q', quality === 'low' ? 'high' : 'low'); location.href = u; };
let animate = Q.get('anim') === '1';
const ab = document.getElementById('anim'); ab.classList.toggle('on', animate);
ab.onclick = () => { animate = !animate; ab.classList.toggle('on', animate); };
const liv = () => ({ company: document.getElementById('name').value, registration: document.getElementById('reg').value, primary: document.getElementById('primary').value, secondary: document.getElementById('secondary').value, accent: document.getElementById('accent').value });
for (const id of ['name', 'reg', 'primary', 'secondary', 'accent']) document.getElementById(id).addEventListener('input', () => { const t0 = performance.now(); plane.setLivery(liv()); lastLiveryMs = performance.now() - t0; });
let lastLiveryMs = 0;
const controls = { aileron: 0, elevator: 0, rudder: 0, throttle: 0.0, flaps: 0, brake: 0 };
const inst = { airspeed: 0, altitude: 0, vsi: 0, heading: 90, pitch: 0, roll: 0, rpm: 0, slip: 0, flaps: 0 };
function slider(host, obj, k, min, max, step, cb) {
  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = `<label>${k}</label><input type="range" min="${min}" max="${max}" step="${step}" value="${obj[k]}"><output>${obj[k]}</output>`;
  const i = row.querySelector('input'), o = row.querySelector('output');
  i.addEventListener('input', () => { obj[k] = +i.value; o.textContent = (+i.value).toFixed(step < 1 ? 2 : 0); cb && cb(); });
  host.appendChild(row);
}
const ctlHost = document.getElementById('ctl'), insHost = document.getElementById('ins');
for (const k of ['aileron', 'elevator', 'rudder']) slider(ctlHost, controls, k, -1, 1, 0.01);
for (const k of ['throttle', 'flaps', 'brake']) slider(ctlHost, controls, k, 0, 1, 0.01);
const IR = { airspeed: [0, 180, 1], altitude: [0, 12000, 10], vsi: [-2000, 2000, 10], heading: [0, 360, 1], pitch: [-0.6, 0.6, 0.01], roll: [-1.2, 1.2, 0.01], rpm: [0, 2700, 10], slip: [-1, 1, 0.01], flaps: [0, 1, 0.01] };
for (const [k, [a, b, s]] of Object.entries(IR)) slider(insHost, inst, k, a, b, s);
for (const [k, v] of Q) { if (k in controls) controls[k] = +v; if (k.startsWith('i_') && k.slice(2) in inst) inst[k.slice(2)] = +v; }
window.__controls = controls; window.__inst = inst;

addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

// plane-only budget: render the rig alone (no ground/sky/shadows) and read renderer.info
window.__measure = (v = view) => {
  const prevV = view; setView(v);
  const bg = scene.background; scene.background = null; ground.visible = lines.visible = false;
  renderer.shadowMap.enabled = false; renderer.info.reset(); renderer.info.autoReset = false;
  placeCamera(); renderer.render(scene, camera);
  const r = { view: v, quality, calls: renderer.info.render.calls, triangles: renderer.info.render.triangles };
  renderer.info.autoReset = true; renderer.shadowMap.enabled = true;
  scene.background = bg; ground.visible = lines.visible = true; setView(prevV);
  return r;
};

const clock = new THREE.Clock();
let frames = 0, fpsT = 0, fps = 0;
function tick() {
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;
  if (animate) {
    controls.aileron = Math.sin(t * 0.9); controls.elevator = Math.sin(t * 0.7 + 1); controls.rudder = Math.sin(t * 0.5 + 2);
    controls.throttle = 0.5 + 0.5 * Math.sin(t * 0.3); controls.flaps = 0.5 + 0.5 * Math.sin(t * 0.2);
    Object.assign(inst, { airspeed: 90 + 30 * Math.sin(t * 0.4), altitude: 3000 + 1500 * Math.sin(t * 0.1), vsi: 900 * Math.cos(t * 0.1), heading: (t * 12) % 360, pitch: 0.15 * Math.sin(t * 0.7), roll: 0.5 * Math.sin(t * 0.5), rpm: 1600 + 900 * controls.throttle, slip: 0.4 * Math.sin(t * 0.8) });
  }
  plane.setControls(controls);
  plane.updateInstruments(inst);
  plane.update(dt);
  placeCamera();
  renderer.render(scene, camera);
  frames++; fpsT += dt;
  if (fpsT > 0.5) { fps = frames / fpsT; frames = 0; fpsT = 0;
    document.getElementById('stats').textContent = `${quality} ${view}  ${fps.toFixed(0)} fps\ncalls ${renderer.info.render.calls}  tris ${(renderer.info.render.triangles / 1000).toFixed(1)}k (scene incl. shadows)\nlivery redraw ${lastLiveryMs.toFixed(1)} ms`; }
  requestAnimationFrame(tick);
}
window.__ready = true;
tick();
</script>
</body>
</html>
