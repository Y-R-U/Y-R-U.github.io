<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://*.googleapis.com; frame-src https://br8t-games.firebaseapp.com https://apis.google.com https://accounts.google.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>br8t feedback</title>
<style>
  :root { --bg:#0b0d12; --card:#141821; --ink:#eef2f8; --dim:#8b95a6; --amber:#ffb45c; --line:rgba(255,255,255,.10); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 16px 16px 60px; }
  h1 { font-size: 22px; margin: 4px 60px 4px 0; }
  .muted { color: var(--dim); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 12px 0; }
  select, button, textarea { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  select, button { padding: 8px 12px; }
  button { cursor: pointer; font-weight: 600; }
  button:hover { border-color: rgba(255,255,255,.25); }
  button.on { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 16%, var(--card)); }
  .counts { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; }
  .counts span { padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 14px; align-items: start; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .grid > div { min-width: 0; }
  .item { text-align: left; width: 100%; max-width: 100%; overflow: hidden; padding: 10px 12px; display: block; font-weight: 400; }
  .item.sel { border-color: var(--amber); }
  .item b { display: block; contain: paint; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .item small { color: var(--dim); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 1px 7px; border-radius: 6px; margin-right: 6px; background: rgba(255,255,255,.08); }
  .tag.bug { background: rgba(255,110,110,.18); color: #ffb0b0; }
  .tag.idea { background: rgba(255,210,90,.16); color: #ffdc8a; }
  .tag.new { background: rgba(110,200,255,.18); color: #a9dcff; }
  .tag.upd { background: rgba(255,180,92,.22); color: #ffd3a0; }
  .chk { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
  .detail { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; position: sticky; top: 12px; }
  .detail h2 { margin: 0 0 6px; font-size: 18px; overflow-wrap: anywhere; overflow: hidden; contain: paint; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; overflow: hidden; contain: paint; background: rgba(0,0,0,.3); border-radius: 10px; padding: 12px; margin: 10px 0; }
  dl { display: grid; grid-template-columns: max-content minmax(0,1fr); gap: 3px 12px; font-size: 13px; margin: 8px 0; }
  dt { color: var(--dim); } dd { margin: 0; overflow-wrap: anywhere; }
  textarea { width: 100%; min-height: 80px; padding: 10px; font-size: 16px; }
  .msg { min-height: 1.2em; font-size: 13px; }
  .lbl { display: block; font-size: 12px; font-weight: 700; color: var(--dim); text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 4px; }
  .msg.err { color: #ff9b9b; }
  .gate { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; }
</style>
</head>
<body>
<main>
  <h1>br8t feedback</h1>
  <p class="muted">Bug reports and ideas sent from the games' Settings. Player text is shown as plain text.</p>
  <div id="gate" class="gate"><p class="muted">Checking your sign-in…</p></div>
  <div id="app" hidden>
    <div class="bar">
      <select id="fGame" aria-label="Game"><option value="">All games</option></select>
      <select id="fStatus" aria-label="Status"><option value="">Any status</option><option value="open">Open (new + seen)</option></select>
      <select id="fSort" aria-label="Sort"><option value="new">Newest reports</option><option value="updated">Recently added to</option></select>
      <label class="chk"><input type="checkbox" id="fUpd"> Added to since seen</label>
      <select id="fKind" aria-label="Kind"><option value="">Bugs and ideas</option><option value="bug">Bugs</option><option value="idea">Ideas</option><option value="other">Other</option></select>
      <button id="reload" type="button">Refresh</button>
      <button id="copy" type="button" title="Copy the listed items as JSON, e.g. to paste to Claude">Copy as JSON</button>
    </div>
    <div class="counts" id="counts"></div>
    <div class="grid" style="margin-top:12px">
      <div><div class="list" id="list"></div><button id="more" type="button" hidden style="margin-top:8px;width:100%">Load more</button></div>
      <div class="detail" id="detail"><p class="muted">Pick a report to read it.</p></div>
    </div>
  </div>
</main>
<script type="module" src="admin.js"></script>
</body>
</html>
