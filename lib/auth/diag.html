<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>br8t auth diagnostics</title>
<style>
  body { margin: 0; padding: 24px; background: #0b0d12; color: #e9edf3;
         font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .sub { color: #8b95a6; margin: 0 0 20px; font-size: 12.5px; }
  table { border-collapse: collapse; width: 100%; max-width: 720px; margin-bottom: 20px; }
  td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.08); vertical-align: top; }
  td:first-child { color: #8b95a6; width: 190px; white-space: nowrap; }
  .ok { color: #7fd6a0; } .bad { color: #ff8f8f; } .warn { color: #ffc46b; }
  button { font: inherit; padding: 9px 14px; margin: 0 8px 8px 0; cursor: pointer;
           border-radius: 8px; border: 1px solid rgba(255,255,255,.2);
           background: rgba(255,255,255,.07); color: #e9edf3; }
  button:hover { background: rgba(255,255,255,.13); }
  pre { background: #11141b; border: 1px solid rgba(255,255,255,.08); border-radius: 8px;
        padding: 12px; overflow-x: auto; font-size: 12px; max-width: 720px; }
</style>
</head>
<body>
<h1>br8t auth diagnostics</h1>
<p class="sub">Sign in, then hit reload. If the session is durable, the uid stays the same and stays non-anonymous.</p>

<table id="t"></table>

<div>
  <button id="google">Sign in with Google</button>
  <button id="out">Sign out</button>
  <button id="reload">Reload page</button>
  <button id="wipe">Wipe local state</button>
</div>

<pre id="log">…</pre>

<script type="module">
import { auth } from "./auth.js";
import { firebaseConfig, SDK } from "./config.js";

const t = document.getElementById("t");
const logEl = document.getElementById("log");
const lines = [];
const log = m => { lines.push(new Date().toISOString().slice(11, 19) + "  " + m); logEl.textContent = lines.join("\n"); };

const row = (k, v, cls = "") => { t.insertAdjacentHTML("beforeend", `<tr><td>${k}</td><td class="${cls}">${v}</td></tr>`); };

// Which storage did Firebase actually settle on? This is the crux: an in-memory
// fallback looks perfectly fine until the moment you reload.
async function storageReport() {
  let idb = "unavailable";
  try {
    idb = await new Promise(res => {
      const q = indexedDB.open("firebaseLocalStorageDb");
      q.onerror = () => res("blocked/error");
      q.onsuccess = () => {
        try {
          const store = q.result.transaction("firebaseLocalStorage", "readonly").objectStore("firebaseLocalStorage");
          const all = store.getAllKeys();
          all.onsuccess = () => res(all.result.length ? `${all.result.length} key(s)` : "empty");
          all.onerror = () => res("read error");
        } catch (e) { res("no store yet"); }
      };
    });
  } catch (e) { idb = "threw: " + e.name; }
  const ls = Object.keys(localStorage).filter(k => k.startsWith("firebase:"));
  return { idb, ls: ls.length ? ls.join(", ") : "none" };
}

async function render() {
  t.innerHTML = "";
  const u = await auth.ready();
  const s = await storageReport();

  row("project", firebaseConfig.projectId);
  row("SDK", SDK.split("/").pop() ? SDK.match(/firebasejs\/([\d.]+)/)[1] : "?");
  row("origin", location.origin);
  row("uid", u ? u.uid : "— none —", u ? "" : "bad");
  row("anonymous", u ? String(u.anon) : "n/a", u && !u.anon ? "ok" : "warn");
  row("email", (u && u.email) || "—");
  row("providers", u && u.providers.length ? u.providers.join(", ") : "— none —");
  row("IndexedDB session", s.idb, s.idb.includes("key") ? "ok" : "bad");
  row("localStorage keys", s.ls, s.ls === "none" ? "" : "ok");
  row("cookies enabled", String(navigator.cookieEnabled), navigator.cookieEnabled ? "ok" : "bad");
  row("storage persisted", navigator.storage?.persisted ? String(await navigator.storage.persisted()) : "n/a");

  if (s.idb === "empty" || s.idb === "unavailable" || s.idb === "blocked/error")
    row("VERDICT", "No session on disk — a reload WILL sign you out.", "bad");
  else if (u && !u.anon)
    row("VERDICT", "Signed in and stored. A reload should keep you signed in.", "ok");

  log(`rendered — uid=${u ? u.uid : "none"} anon=${u ? u.anon : "n/a"} idb=${s.idb}`);
}

document.getElementById("google").onclick = async () => {
  try { log("signInGoogle()…"); const u = await auth.signInGoogle(); log("signed in " + u.uid); }
  catch (e) { log("ERROR " + (e.code || e.name) + " — " + e.message); }
  render();
};
document.getElementById("out").onclick = async () => { await auth.signOut(); log("signed out"); render(); };
document.getElementById("reload").onclick = () => location.reload();
document.getElementById("wipe").onclick = async () => {
  localStorage.clear();
  await new Promise(r => { const d = indexedDB.deleteDatabase("firebaseLocalStorageDb"); d.onsuccess = d.onerror = d.onblocked = r; });
  log("local state wiped — reload to start clean");
};

auth.onChange(u => log("onChange → " + (u ? `${u.uid} anon=${u.anon}` : "null")));
render();
</script>
</body>
</html>
