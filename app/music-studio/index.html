<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f13">
<title>Music Studio</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="side">
    <div class="brand"><img src="icon.svg" alt=""> Music Studio
      <button id="sideClose" class="icon only-mobile" aria-label="Close menu">✕</button></div>
    <div class="side-sec">
      <div class="side-h">Projects <button class="icon" id="newProject" title="New project">＋</button></div>
      <nav id="projectList"></nav>
    </div>
    <div class="side-sec">
      <div class="side-h">Playlists <button class="icon" id="newPlaylist" title="New playlist">＋</button></div>
      <nav id="playlistList"></nav>
    </div>
    <div class="side-sec side-foot">
      <a href="#/queue" id="queueLink">Queue <span id="queueCount" class="pill"></span></a>
      <a href="#/offline" id="offlineLink">Offline &amp; settings <span id="netState" class="dot"></span></a>
    </div>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header id="topbar">
      <button id="menuBtn" class="icon only-mobile" aria-label="Menu">☰</button>
      <h1 id="viewTitle"></h1>
      <button id="conn" class="conn on" type="button">Connected</button>
      <div id="viewActions"></div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="player" hidden>
  <div class="pl-info"><div id="plTitle"></div><div id="plSub"></div></div>
  <div class="pl-ctrl">
    <button class="icon" id="plPrev" aria-label="Previous">⏮</button>
    <button class="icon big" id="plPlay" aria-label="Play">▶</button>
    <button class="icon" id="plNext" aria-label="Next">⏭</button>
  </div>
  <div class="pl-seek"><span id="plCur">0:00</span><input type="range" id="plSeek" min="0" max="1000" value="0"><span id="plDur">0:00</span></div>
  <audio id="audio" preload="metadata"></audio>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast"></div>

<script src="app.js"></script>
<!-- the Load/Unload admin panel is loaded by app.js (loadAdmin) so a hosted copy can fetch it from the server -->
</body>
</html>
